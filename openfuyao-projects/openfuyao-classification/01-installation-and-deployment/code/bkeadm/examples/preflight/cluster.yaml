apiVersion: bke.bocloud.com/v1beta1
kind: BKECluster
metadata:
  name: demo-cluster
  namespace: default
spec:
  controlPlaneEndpoint:
    host: 192.168.10.10
    port: 6443
  clusterConfig:
    cluster:
      kubernetesVersion: v1.25.6
      openFuyaoVersion: latest
      certificatesDir: /etc/kubernetes/pki
      ntpServer: 192.168.10.1
      networking:
        podSubnet: 10.244.0.0/16
        serviceSubnet: 10.96.0.0/12
        dnsDomain: cluster.local
      containerRuntime:
        cri: containerd
        runtime: runc
        param:
          data-root: /var/lib/containerd
      httpRepo:
        domain: repo.example.com
        port: "40080"
        prefix: openfuyao
      imageRepo:
        domain: registry.example.com
        port: "443"
        prefix: openfuyao
      chartRepo:
        domain: chart.example.com
        port: "443"
        prefix: chart
