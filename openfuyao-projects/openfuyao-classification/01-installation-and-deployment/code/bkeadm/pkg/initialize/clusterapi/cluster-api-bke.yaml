apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    cluster.x-k8s.io/provider: infrastructure-bke
    control-plane: controller-manager
  name: bke-controller-manager
  namespace: cluster-system
spec:
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/provider: infrastructure-bke
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:
        cluster.x-k8s.io/provider: infrastructure-bke
        control-plane: controller-manager
    spec:
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
      containers:
        - command:
            - /manager
            - --metrics-bind-address=:8080
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --health-probe-scheme=http
            - --helm-component-support=false
          env:
            - name: container
              value: "true"
            - name: DEBUG
              value: "true"
            - name: ALLOWED_FAILED_COUNT
              value: "3"
          image: {{ if .repo }}{{ .repo }}{{ else }}cr.openfuyao.cn/openfuyao/{{ end }}cluster-api-provider-bke:{{.providerVersion}}
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: true
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
            - mountPath: /var/log/openFuyao/bke-controller-manager
              name: log
            - mountPath: /etc/localtime
              name: localtime
            - mountPath: /manifests
              name: manifests
            - mountPath: /var/lib/bke/release-cache
              name: release-cache
            - mountPath: /etc/openFuyao/addons
              name: openfuyao-addons
              readOnly: true
            - mountPath: /etc/openFuyao/bkeagent
              name: openfuyao-bkeagent
              readOnly: true
            - mountPath: /etc/openFuyao/certs
              name: openfuyao-certs
              readOnly: true
            - mountPath: /etc/openFuyao/ologger/ologger.yaml
              name: ologger-config
              subPath: ologger.yaml
              readOnly: true
      initContainers:
        - command:
            - /bin/sh
            - -c
            - cp -rf . /manifests
          image: {{ if .repo }}{{ .repo }}{{ else }}cr.openfuyao.cn/openfuyao/{{ end }}bke-manifests:{{.manifestsVersion}}
          imagePullPolicy: Always
          name: manifests
          volumeMounts:
            - mountPath: /manifests
              name: manifests
      securityContext:
        runAsNonRoot: false
      serviceAccountName: bke-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: bke-webhook-secret
        - hostPath:
            path: /var/log/openFuyao/bke-controller-manager
            type: DirectoryOrCreate
          name: log
        - hostPath:
            path: /etc/localtime
          name: localtime
        - hostPath:
            path: /etc/openFuyao/addons/manifests
            type: DirectoryOrCreate
          name: manifests
        - hostPath:
            path: /var/lib/bke/release-cache
            type: DirectoryOrCreate
          name: release-cache
        - hostPath:
            path: /etc/openFuyao/addons
            type: DirectoryOrCreate
          name: openfuyao-addons
        - hostPath:
            path: /etc/openFuyao/bkeagent
            type: DirectoryOrCreate
          name: openfuyao-bkeagent
        - hostPath:
            path: /etc/openFuyao/certs
            type: DirectoryOrCreate
          name: openfuyao-certs
        - name: ologger-config
          configMap:
            name: bke-controller-manager-ologger-config
