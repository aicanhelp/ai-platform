apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-webhook-config
  namespace: openfuyao-system
data:
  config.json: |
    {
      "HttpServerConfig": {
        "HttpsPort": {{ .Values.config.port }},
        "TlsCertFile": "/ssl/server.crt",
        "TlsPrivateKeyFile": "/ssl/server.key",
        "MasterCAFile": "/ssl/ca.pem"
      }
    }
