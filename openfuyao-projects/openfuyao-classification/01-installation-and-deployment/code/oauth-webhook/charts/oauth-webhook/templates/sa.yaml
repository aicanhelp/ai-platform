kind: ServiceAccount
apiVersion: v1
metadata:
  name: oauth-webhook
  namespace: openfuyao-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jwt-read-role
  namespace: openfuyao-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["oauth-jwt-secret", "oauth-webhook-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jwt-read-rolebinding
  namespace: openfuyao-system
subjects:
  - kind: ServiceAccount
    name: oauth-webhook
    namespace: openfuyao-system
roleRef:
  kind: Role
  name: jwt-read-role
  apiGroup: rbac.authorization.k8s.io
