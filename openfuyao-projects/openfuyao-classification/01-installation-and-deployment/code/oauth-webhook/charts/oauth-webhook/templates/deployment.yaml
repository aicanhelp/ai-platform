apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-webhook
  namespace: openfuyao-system
  labels:
    application: "oauth-webhook"
spec:
  replicas: 1
  selector:
    matchLabels:
      application: "oauth-webhook"
  template:
    metadata:
      labels:
        application: "oauth-webhook"
    spec:
      serviceAccountName: oauth-webhook
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
          operator: "Exists"
      initContainers:
        - name: init-permission
          image: {{ .Values.thirdPartyImages.busyBox.repository }}:{{ .Values.thirdPartyImages.busyBox.tag }}
          command: [ "sh", "-c", "chmod -R 700 /var/log/oauth-webhook && chown -R 65532:65532 /var/log/oauth-webhook" ]
          volumeMounts:
            - mountPath: /var/log/oauth-webhook
              name: log-path
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: oauth-webhook
          image: '{{ list . "core" | include "helpers.image.name" }}'
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: {{ .Values.config.port }}
          args:
            - --configFile=config.json
          volumeMounts:
            - name: oauth-webhook-tls
              mountPath: /ssl/ca.pem
              subPath: ca.crt
            - name: oauth-webhook-tls
              readOnly: true
              mountPath: /ssl/server.key
              subPath: tls.key
            - name: oauth-webhook-tls
              readOnly: true
              mountPath: /ssl/server.crt
              subPath: tls.crt
            - name: config-volume
              readOnly: true
              subPath: config.json
              mountPath: /config.json
            - mountPath: /var/log/oauth-webhook
              name: log-path
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: oauth-webhook-tls
          secret:
            defaultMode: 0600
            secretName: oauth-webhook-tls
        - name: config-volume
          configMap:
            defaultMode: 0600
            name: oauth-webhook-config
        - name: log-path
          hostPath:
            path: /var/log/oauth-webhook
            type: DirectoryOrCreate
