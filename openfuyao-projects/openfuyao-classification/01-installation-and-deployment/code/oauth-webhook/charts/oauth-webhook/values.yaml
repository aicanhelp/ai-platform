config:
  port: 9095
  # JWTPrivateKey会在在openFuyao安装的时候由installer生成并覆盖，输入项应已经base64编码
  JWTPrivateKey: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX

images:
  core:
    repository: "cr.openfuyao.cn/openfuyao/oauth-webhook"
    tag: "latest"

thirdPartyImages:
  busyBox:
    repository: hub.oepkgs.net/openfuyao/busybox
    tag: "1.36.1"

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 100m
    memory: 200Mi
