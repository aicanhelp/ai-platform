apiVersion: openfuyao.io/v1beta1
kind: params
metadata:
  name: kubernetes-params
spec:
  params:
    - name: registry
      value: harbor.openfuyao.com/openfuyao
      type: string
      describe: "kubeadm拉取镜像时镜像地址"
    - name: apiserverAdvertiseAddress
      value: 127.0.0.1
      type: string
      describe: "The IP address the API Server will advertise it's listening on. If not set the default network interface will be used."
    - name: apiserverBindPort
      value: 6443
      type: string
      describe: "Port for the API Server to bind to."
    - name: certDir
      value: /etc/kubernetes/pki
      type: string
      describe: "The path where to save and store the certificates."
    - name: criSocket
      value: unix:///var/run/containerd/containerd.sock
      type: string
      describe: "Path to the CRI socket to connect. If empty kubeadm will try to auto-detect this value; use this option only if you have more than one CRI installed or if you have non-standard CRI socket."
    - name: serviceCidr
      value: 10.96.0.0/12
      type: string
      describe: "Use alternative range of IP address for service VIPs."
    - name: serviceDnsDomain
      value: "cluster.local"
      type: string
      describe: "Use alternative domain for services"
    - name: token
      value: abcdef.0123456789abcdef
      type: string
      describe: "The token to use for establishing bidirectional trust between nodes and control-plane nodes."
    - name: tokenTtl
      value: 24h0m0s
      type: string
      describe: "The duration before the token is automatically deleted"
    - name: metricsBindAddress
      value: 0.0.0.0:10249
      type: string
      describe: "Indicator monitoring banding address"
