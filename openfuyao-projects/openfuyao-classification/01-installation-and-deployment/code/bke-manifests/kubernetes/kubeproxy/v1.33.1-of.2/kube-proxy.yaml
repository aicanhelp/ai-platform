apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    component: kube-proxy
    k8s-app: kube-proxy
    kubernetes.io/cluster-service: "true"
    name: kube-proxy
    tier: node
  name: kube-proxy
  namespace: kube-system
spec:
  selector:
    matchLabels:
      component: kube-proxy
      k8s-app: kube-proxy
      kubernetes.io/cluster-service: "true"
      name: kube-proxy
      tier: node
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        component: kube-proxy
        k8s-app: kube-proxy
        kubernetes.io/cluster-service: "true"
        name: kube-proxy
        tier: node
    spec:
      priorityClassName: system-node-critical
      containers:
        - name: kube-proxy
          image: {{ .repo }}kube-proxy:1.33.1-of.2
          imagePullPolicy: IfNotPresent
          command:
            - kube-proxy
            - --v=0
            - --kubeconfig=/run/kubeconfig
            {{- if and (ne .proxyMode nil ) ( ne .proxyMode "" ) }}
            - --proxy-mode={{ .proxyMode }}
            {{- end }}
            - --hostname-override=$(MY_NODE_NAME)
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /run/xtables.lock
              name: xtables-lock
              readOnly: false
            - mountPath: /lib/modules
              name: lib-modules
              readOnly: true
            - mountPath: /run/kubeconfig
              name: kubeconfig
      hostNetwork: true
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - hostPath:
            path: {{ .kubeConfigDir }}/kube-proxy.conf
            type: File
          name: kubeconfig
      tolerations:
        - operator: Exists
      nodeSelector:
        kubernetes.io/os: linux