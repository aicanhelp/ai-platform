{{ if eq .manage "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .clusterName }}-k8s-token
  namespace: {{ .namespace }}
data:
  token: {{ b64encode .clusterToken }}

---
apiVersion: bke.bocloud.com/v1beta1
kind: BKECluster
metadata:
  name: {{ .clusterName }}
  namespace: {{ .namespace }}
  annotations:
    bke.bocloud.com/cluster-from: "bocloud"
    bke.bocloud.com/appointment-deleted-nodes: ""
    bke.bocloud.com/deep-restore-node: 'false'
    bke.bocloud.com/ignore-namespace-delete: 'false'
    bke.bocloud.com/ignore-target-cluster-delete: 'true'
    bke.bocloud.com/cluster-api-manager-applied: 'true'
spec:
  controlPlaneEndpoint:
    host: {{ .apiServerSrcHost }}
    port: {{ .apiServerSrcPort }}
{{- if .kubeletConfigRefName }}
  KubeletConfigRef:
    name: {{ .kubeletConfigRefName }}
{{- if .kubeletConfigRefNamespace }}
    namespace: {{ .kubeletConfigRefNamespace }}
{{- end }}
{{- end }}
  clusterConfig:
    cluster:
      agentHealthPort: "{{ .agentHealthPort }}"
      imageRepo:
        domain: {{ .imageRepoDomain}}
        ip: {{ .imageRepoIp }}
        port: "{{ .imageRepoPort }}"
        prefix: {{ .imageRepoPrefix }}
      chartRepo:
        domain: {{ .chartRepoDomain }}
        ip: {{ .chartRepoIp }}
        port: "{{ .chartRepoPort }}"
        prefix: {{ .chartRepoPrefix }}
{{- if .chartRepoInsecureSkipTLSVerify }}
        insecureSkipTLSVerify: {{ .chartRepoInsecureSkipTLSVerify }}
{{- end }}
{{- if or .chartRepoAuthSecretName .chartRepoAuthSecretNamespace .chartRepoAuthSecretUsernameKey .chartRepoAuthSecretPasswordKey }}
        authSecretRef:
{{- if .chartRepoAuthSecretName }}
          name: {{ .chartRepoAuthSecretName }}
{{- end }}
{{- if .chartRepoAuthSecretNamespace }}
          namespace: {{ .chartRepoAuthSecretNamespace }}
{{- end }}
{{- if .chartRepoAuthSecretUsernameKey }}
          usernameKey: {{ .chartRepoAuthSecretUsernameKey }}
{{- end }}
{{- if .chartRepoAuthSecretPasswordKey }}
          passwordKey: {{ .chartRepoAuthSecretPasswordKey }}
{{- end }}
{{- end }}
{{- if or .chartRepoTlsSecretName .chartRepoTlsSecretNamespace .chartRepoTlsSecretCertKey .chartRepoTlsSecretCAKey .chartRepoTlsSecretKeyKey }}
        tlsSecretRef:
{{- if .chartRepoTlsSecretName }}
          name: {{ .chartRepoTlsSecretName }}
{{- end }}
{{- if .chartRepoTlsSecretNamespace }}
          namespace: {{ .chartRepoTlsSecretNamespace }}
{{- end }}
{{- if .chartRepoTlsSecretCertKey }}
          certKey: {{ .chartRepoTlsSecretCertKey }}
{{- end }}
{{- if .chartRepoTlsSecretCAKey }}
          caKey: {{ .chartRepoTlsSecretCAKey }}
{{- end }}
{{- if .chartRepoTlsSecretKeyKey }}
          keyKey: {{ .chartRepoTlsSecretKeyKey }}
{{- end }}
{{- end }}
      httpRepo:
        domain: {{ .httpRepoDomain }}
        ip: {{ .httpRepoIp }}
        port: "{{ .httpRepoPort }}"
        prefix: {{ .httpRepoPrefix }}
      ntpServer: {{ .ntpServer }}
      loadBalanceType: {{ .loadBalanceType }}
      etcdVersion: {{ .etcdVersion }}
      openFuyaoVersion: {{ .openFuyaoVersion }}
      containerdVersion: {{ .containerdVersion }}
{{- if .containerdConfigRefName }}
      containerdConfigRef:
        name: {{ .containerdConfigRefName }}
{{- if .containerdConfigRefNamespace }}
        namespace: {{ .containerdConfigRefNamespace }}
{{- end }}
{{- end }}
    customExtra:
      bkeagent-launcher-image: {{ if .repo }}{{ .repo }}{{ else }}cr.openfuyao.cn/openfuyao/{{ end }}bkeagent-launcher:latest
      agentLogLevel: "{{ .agentLogLevel }}"
status:
  openFuyaoVersion: {{ .openFuyaoVersion }}
  containerdVersion: {{ .containerdVersion }}
  etcdVersion: {{ .etcdVersion }}
{{- end }}
