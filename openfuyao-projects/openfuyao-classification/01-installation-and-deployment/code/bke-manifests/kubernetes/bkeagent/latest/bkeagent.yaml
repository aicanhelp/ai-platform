apiVersion: v1
kind: ConfigMap
metadata:
  name: bkeagent-launcher-kubeconfig
  namespace: kube-system
data:
  config: |
    {{ indent .kubeconfig "    " }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bkeagent-launcher-ologger-config
  namespace: kube-system
data:
  ologger.yaml: |
    level: INFO
    format: json
    timezone: local
    include_ip: true
    max_size_mb: 100
    max_backups: 30
    max_age_days: 14
    compress: true
    custom_levels: {}
    sensitive_words: []
    enable_console: true
    enable_file: true
    watch_level: true
    enable_sanitize: true

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bkeagent-launcher
  namespace: kube-system
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bkeagent
  template:
    metadata:
      labels:
        app: bkeagent
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

      restartPolicy: Always
      hostNetwork: true
      hostIPC: true
      hostPID: true
      containers:
        - command:
            - launcher
            - --kubeconfig=/etc/openFuyao/bkeagent/config
            - --ntp-server={{ .ntpServer }}
            - --health-port={{ .agentHealthPort }}
{{- if .agentLogLevel }}
            - --log-level={{ .agentLogLevel }}
{{- end }}
            - --debug={{ .debug }}
          env:
            - name: container
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OLOGGER_CONFIG
              value: /etc/openFuyao/ologger/ologger.yaml
            - name: OLOGGER_PATH
              value: /var/log/openFuyao/bkeagent-launcher/$(POD_NAME).log
          image: {{ .launcherImage }}
          imagePullPolicy: Always
          name: bkeagent
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /etc/openFuyao/bkeagent/launcher
              name: bkeagent-launcher
            - mountPath: /etc/openFuyao/bkeagent/
              name: bkeagent-launcher-kubeconfig
            - mountPath: /var/log/openFuyao/bkeagent-launcher
              name: log
            - mountPath: /etc/openFuyao/ologger
              name: ologger-config
              readOnly: true
          readinessProbe:
            httpGet:
              port: 3377
              path: /readyz
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 2
      volumes:
        - name: bkeagent-launcher
          hostPath:
            path: /etc/openFuyao/bkeagent/launcher
            type: DirectoryOrCreate
        - name: bkeagent-launcher-kubeconfig
          configMap:
            name: bkeagent-launcher-kubeconfig
        - hostPath:
            path: /var/log/openFuyao/bkeagent-launcher
            type: DirectoryOrCreate
          name: log
        - name: ologger-config
          configMap:
            name: bkeagent-launcher-ologger-config


