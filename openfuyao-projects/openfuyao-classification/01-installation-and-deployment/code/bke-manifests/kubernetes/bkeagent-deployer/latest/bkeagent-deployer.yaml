apiVersion: v1
kind: Namespace
metadata:
  name: cluster-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bkeagent-deployer-ologger-config
  namespace: cluster-system
data:
  ologger.yaml: |
    level: INFO
    format: json
    timezone: local
    include_ip: true
    max_size_mb: 100
    max_backups: 30
    max_age_days: 14
    compress: true
    custom_levels: {}
    sensitive_words: []
    enable_console: true
    enable_file: true
    watch_level: true
    enable_sanitize: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bkeagent-deployer
  namespace: cluster-system
  labels:
    app: bkeagent-deployer
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: bkeagent-deployer
  template:
    metadata:
      labels:
        app: bkeagent-deployer
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: deployer
          image: {{ if .repo }}{{ .repo }}{{ else }}cr.openfuyao.cn/openfuyao/{{ end }}bkeagent-deployer:{{ .tagVersion }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          env:
            - name: HOST_BIN_DIR
              value: /etc/openFuyao/bkeagent/bin
            - name: HEALTH_PORT
              value: "8443"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OLOGGER_CONFIG
              value: /etc/openFuyao/ologger/ologger.yaml
            - name: OLOGGER_PATH
              value: /var/log/openFuyao/bkeagent-deployer/$(POD_NAME).log
          volumeMounts:
            - name: host-bin
              mountPath: /etc/openFuyao/bkeagent/bin
            - name: k8s-dir
              mountPath: /etc/kubernetes
              readOnly: true
            - name: ologger-config
              mountPath: /etc/openFuyao/ologger
              readOnly: true
            - name: log
              mountPath: /var/log/openFuyao/bkeagent-deployer
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: host-bin
          hostPath:
            path: /etc/openFuyao/bkeagent/bin
            type: DirectoryOrCreate
        - name: k8s-dir
          hostPath:
            path: /etc/kubernetes
            type: Directory
        - name: ologger-config
          configMap:
            name: bkeagent-deployer-ologger-config
        - name: log
          hostPath:
            path: /var/log/openFuyao/bkeagent-deployer
            type: DirectoryOrCreate