apiVersion: console.fuyao.com/v1beta1
kind: ConsolePlugin
metadata:
  name: logging
spec:
  pluginName: {{ .Values.extensionName }}
  displayName: "日志"
  subPages:
    - pageName: logSearch
      displayName: "日志查询"
    - pageName: logSet
      displayName: "日志设置"
  entrypoint: /container_platform
  backend:
    type: Service
    service:
      name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.service.port }}
  enabled: true
