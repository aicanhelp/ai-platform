
images:
  core:
    repository: cr.openfuyao.cn/openfuyao/installer-website
    tag: latest
    pullPolicy: Always

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace: openfuyao-system

service:
  type: ClusterIP
  port: 8080
  containerPort: 8080

enableOAuth: true

oauthProxy:
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/cluster"	# 如果是核心组件后端，直接填"/"即可，如果是扩展组件前端，填写扩展组件consolePlugin CR 的 .spec.pluginName

# specify backend only when the backend is available
backend:
  scheduler: "http://scheduler-config-service.volcano-system.svc:9202"
  query: "http://prometheus-k8s.monitoring.svc:9090"

# set the field to mount the plugin to openFuyao web portal
openFuyao: true







