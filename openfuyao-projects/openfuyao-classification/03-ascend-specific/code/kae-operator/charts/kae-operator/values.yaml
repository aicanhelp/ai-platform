# Default values for kae-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
images:
  core:
    repository: cr.openfuyao.cn/openfuyao/kae-operator
    pullPolicy: IfNotPresent
    tag: latest
  driver:
    repository: cr.openfuyao.cn/openfuyao/kae-driver-installer
    PullPolicy: IfNotPresent
    tag: latest
  devicePlugin:
    repository: cr.openfuyao.cn/openfuyao/kae-device-plugin
    PullPolicy: IfNotPresent
    tag: latest

nfd:
  # Deploying NFD components through KAE Operator
  enabled: true
  # Install KAE device node feature rules
  nodefeaturerules: false

node-feature-discovery:
  images:
    core:
      repository: hub.oepkgs.net/openfuyao/nfd/node-feature-discovery
      # This should be set to 'IfNotPresent' for released version
      pullPolicy: IfNotPresent
      # tag, if defined will use the given image tag, else Chart.AppVersion will be used
      tag: v0.16.4
    replicaCount: 1
  enableNodeFeatureApi: true
  gc:
    enable: true
    replicaCount: 1
    serviceAccount:
      name: node-feature-discovery
      create: false
  worker:
    serviceAccount:
      name: node-feature-discovery
      # disable creation to avoid duplicate serviceaccount creation by master spec below
      create: false
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
    config:
      sources:
        pci:
          deviceClassWhitelist:
            - "1000"
            - "1200"
            - "0200"
            - "0300"
          deviceLabelFields:
            - class
            - vendor
            - device
  master:
    serviceAccount:
      name: node-feature-discovery
      create: true

daemonSets:
  # common labels for all DaemonSets managed by KAE Operator
  labels: {}
  # common annotations for all DaemonSets managed by KAE Operator
  annotations: {}
  priorityClassName: system-node-critical
  # common tolerations for all DaemonSets managed by KAE Operator
  tolerations: []
  # configuration for controlling update strategy("OnDelete" or "RollingUpdate") of KAE Operands
  # note that driver DaemonSet is always set with OnDelete to avoid unintended disruptions
  updateStrategy: "RollingUpdate"
  # configuration for controlling rolling update of KAE Operands
  rollingUpdate:
    # maximum number of nodes to simultaneously apply pod updates on.
    # can be specified either as number or percentage of nodes. Default 1.
    maxUnavailable: "1"

operator:
  # Enable KAE HPRE device management capability
  enabledHPRE: true
  # Enable KAE SEC device management capability
  # Currently, only the HPRE device plugin has been implemented. Please temporarily set SEC and ZIP to false
  enabledSEC: false
  # Enable KAE ZIP device management capability
  enabledZIP: false
  cleanupCRD: false
  upgradeCRD: false
  imagePullSecrets: []
  priorityClassName: system-node-critical
  nodeSelector: {}
  tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Equal"
    value: ""
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Equal"
    value: ""
    effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/master"
                operator: In
                values: [""]
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: In
                values: [""]
  resources:
    limits:
      cpu: 500m
      memory: 350Mi
    requests:
      cpu: 200m
      memory: 100Mi

driver:
  enabled: true
  enabledCleanup: false
  imagePullSecrets: []
  args: []
  env:
    - name: INSTALL_POLICY
      value: "IfNotPresent"  # IfNotPresent or "Always"
  resources: {}

devicePlugin:
  enabledHPRE: true
  # Currently, only the HPRE device plugin has been implemented. Please temporarily set SEC and ZIP to false
  enabledSEC: false
  enabledZIP: false
  imagePullSecrets: []
  args: []
  env: []
  resources: {}

psa:
  enabled: false
