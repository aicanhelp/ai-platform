{{- if .Values.nfd.nodefeaturerules }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: kae-nfd-nodefeaturerules
spec:
  rules:
    - name: "KAE HPRE PF"
      labels:
        "feature.node.kubernetes.io/pci-1000_19e5_a258.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a258"]}
    - name: "KAE HPRE VF"
      labels:
        "feature.node.kubernetes.io/pci-1000_19e5_a259.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a259"]}
    - name: "KAE SEC PF"
      labels:
        "feature.node.kubernetes.io/pci-1000_19e5_a255.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a255"]}
    - name: "KAE SEC VF"
      labels:
        "feature.node.kubernetes.io/pci-1000_19e5_a256.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a256"]}
    - name: "KAE ZIP PF"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_a250.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a250"]} 
    - name: "KAE ZIP VF"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_a251.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["a251"]}
{{- end }}
