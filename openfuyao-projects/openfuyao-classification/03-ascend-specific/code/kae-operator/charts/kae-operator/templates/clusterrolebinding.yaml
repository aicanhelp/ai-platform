kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kae-operator
  labels:
    {{- include "kae-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: "kae-operator"
subjects:
- kind: ServiceAccount
  name: kae-operator
  namespace: {{ $.Release.Namespace }}
- kind: ServiceAccount
  name: node-feature-discovery
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: kae-operator
  apiGroup: rbac.authorization.k8s.io
