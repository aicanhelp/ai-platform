# permissions for end users to view kaepolicies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kae-operator
    app.kubernetes.io/managed-by: kustomize
  name: kaepolicy-viewer-role
rules:
- apiGroups:
  - device.openfuyao.com
  resources:
  - kaepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - device.openfuyao.com
  resources:
  - kaepolicies/status
  verbs:
  - get
