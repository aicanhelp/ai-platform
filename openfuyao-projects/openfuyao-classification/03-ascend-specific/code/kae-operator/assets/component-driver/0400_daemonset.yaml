apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: kae-driver-daemonset
    app.kubernetes.io/component: kae-driver
  name: kae-driver-daemonset
  namespace: "FILLED BY THE OPERATOR"
spec:
  selector:
    matchLabels:
      app: kae-driver-daemonset
  template:
    metadata:
      labels:
        app: kae-driver-daemonset
        app.kubernetes.io/component: kae-driver
    spec:
      nodeSelector:
        openfuyao.com/kae.deploy.driver: "true"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - kae-driver
              topologyKey: kubernetes.io/hostname
      serviceAccountName: kae-driver
      hostPID: true
      hostNetwork: true
      initContainers:
        - name: kae-driver-installer
          image: "FILLED BY THE OPERATOR"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - sh /home/kae-driver/kae-driver-entrypoint.sh
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
            - name: root-mount
              mountPath: /mnt
      containers:
      - image: "FILLED BY THE OPERATOR"
        imagePullPolicy: IfNotPresent
        name: kae-driver
        command:
          - /bin/sh
          - -c
          - while true; do sleep 3600; done
        securityContext:
          privileged: true
          seLinuxOptions:
            level: "s0"
        volumeMounts:
          - name: dev
            mountPath: /dev
          - name: host-time
            mountPath: /etc/localtime
            readOnly: true
          - name: root-mount
            mountPath: /mnt
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
        - name: root-mount
          hostPath:
            path: /
