apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: kae-hpre-device-plugin-daemonset
  name: kae-hpre-device-plugin-daemonset
  namespace: "FILLED BY THE OPERATOR"
spec:
  selector:
    matchLabels:
      app: kae-hpre-device-plugin-daemonset
  template:
    metadata:
      labels:
        app: kae-hpre-device-plugin-daemonset
    spec:
      nodeSelector:
        openfuyao.com/kae.hpre.deploy.device-plugin: "true"
      serviceAccountName: kae-hpre-device-plugin
      containers:
        - name: kae-hpre-device-plugin
          image: "FILLED BY THE OPERATOR"
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: LD_LIBRARY_PATH
              value: /lib/modules
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: locallib
              mountPath: /usr/local/lib
              readOnly: true
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
            - name: config-volume
              mountPath: /etc/kae-device-plugin
            - name: varlog
              mountPath: /var/log/kae-device-plugin
            - name: kaelog
              mountPath: /var/log/kae.log
      dnsPolicy: ClusterFirst
      hostNetwork: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: modules
          hostPath:
            path: /lib/modules
        - name: locallib
          hostPath:
            path: /usr/local/lib
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
        - name: varlog
          hostPath:
            path: /var/log/kae-device-plugin
        - name: config-volume
          configMap:
            name: kae-hpre-device-plugin-logcfg
        - name: kaelog
          hostPath:
            path: /var/log/kae.log