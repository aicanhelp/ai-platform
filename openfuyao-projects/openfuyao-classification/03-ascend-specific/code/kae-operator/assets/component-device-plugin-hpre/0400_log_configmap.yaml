apiVersion: v1
kind: ConfigMap
metadata:
  name: kae-hpre-device-plugin-logcfg
  namespace: "FILLED BY THE OPERATOR"
data:
  kae-device-plugin.yaml: |
    Level: info
    EncoderType: console
    Path: /var/log/kae-hpre-device-plugin
    FileName: root.log
    MaxSize: 20
    MaxBackups: 0
    MaxAge: 7
    LocalTime: false
    Compress: true
    OutMod: console
