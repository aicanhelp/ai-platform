[package]
name = "npu-container-toolkit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
clap = { version = "4.5.17", features = ["derive"] }
fluent-uri = "0.2.0"
nix = { version = "0.30.0", features = ["mount", "signal"] }
procfs = "0.16.0"
signal-hook = "0.3.17"
toml_edit = "0.22.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
