apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mindio-acp
  namespace: default
spec:
  selector:
    matchLabels:
      app: mindio-acp
  template:
    metadata:
      labels:
        app: mindio-acp
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: install-container
          image: derrickroseli/npu:acp1009v6
          securityContext:
            privileged: true
          command: ["/bin/ash", "-c", "tag=$(sh /tmp/mindio/obtain-version.sh);sh /tmp/mindio/download.sh $tag;sh /tmp/mindio/entrypoint.sh acp; while true; do sleep 3600; done"] 
          volumeMounts:
            - name: root
              mountPath: /mnt
          lifecycle:
            preStop:
              exec:
                command: ["/bin/ash", "-c", "nsenter -t 1 -i -m -n sh -c 'component=\"acp\"; package=$(python3 -m pip list | grep -i $component | awk \"{print $1}\" | head -n 1); if [ -n \"$package\" ]; then python3 -m pip uninstall -y $package; fi; sleep 2; rm -rf /opt/openFuyao-npu-mindioacp;'"]
      volumes:
        - name: root
          hostPath:
            path: /