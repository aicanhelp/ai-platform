# permissions for end users to view npuclusterpolicies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: npu-operator
    app.kubernetes.io/managed-by: kustomize
  name: npuclusterpolicy-viewer-role
rules:
- apiGroups:
  - npu.openfuyao.com
  resources:
  - npuclusterpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - npu.openfuyao.com
  resources:
  - npuclusterpolicies/status
  verbs:
  - get
