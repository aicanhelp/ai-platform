# Default values for npu-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
images:
  busybox:
    repository: hub.oepkgs.net/openfuyao/busybox
    pullPolicy: Always
    tag: 1.36.1
  initRuntime:
    repository: cr.openfuyao.cn/openfuyao/ascend-docker-runtime
    tag: v26.1.1
    pullPolicy: Always
  operator:
    repository: cr.openfuyao.cn/openfuyao/npu-operator
    pullPolicy: Always
  driver:
    repository: cr.openfuyao.cn/openfuyao/npu-driver-installer
    pullPolicy: Always
  ociRuntime:
    repository: cr.openfuyao.cn/openfuyao/npu-container-toolkit
    pullPolicy: Always
  trainer:
    repository: hub.oepkgs.net/openfuyao/ascendhub/ascend-operator
    tag: v26.1.1-openeuler24.03
    pullPolicy: Always
  devicePlugin:
    repository: hub.oepkgs.net/openfuyao/ascendhub/ascend-k8sdeviceplugin
    tag: v26.1.1-openeuler24.03
    pullPolicy: Always
  inferOperator:
    # Upstream local image name; set your private mirror before enabling.
    repository: hub.oepkgs.net/openfuyao/ascendhub/infer-operator
    tag: v26.1.1-openeuler24.03
    pullPolicy: IfNotPresent
  rdmaDevicePlugin:
    # Upstream local image name; set your private mirror before enabling.
    repository: hub.oepkgs.net/openfuyao/ascendhub/k8s-rdma-shared-dp
    tag: v26.1.1-openeuler24.03-arm64
    pullPolicy: IfNotPresent
  nodeD:
    repository: hub.oepkgs.net/openfuyao/ascendhub/noded
    tag: v26.1.1-openeuler24.03
    pullPolicy: Always
  vccontroller:
    repository: hub.oepkgs.net/openfuyao/ascendhub/vc-controller-manager
    tag: v1.12.0-v26.1.1-openeuler24.03
    pullPolicy: IfNotPresent
  vcscheduler:
    repository: hub.oepkgs.net/openfuyao/ascendhub/vc-scheduler
    tag: v1.12.0-v26.1.1-openeuler24.03
    pullPolicy: IfNotPresent
  vnpuVccontroller:
    repository: cr.openfuyao.cn/openfuyao/vnpu/vc-controller-manager
    pullPolicy: IfNotPresent
  vnpuVcscheduler:
    repository: cr.openfuyao.cn/openfuyao/vnpu/vc-scheduler
    pullPolicy: IfNotPresent
  volcanoAdmission:
    repository: cr.openfuyao.cn/openfuyao/vnpu/vc-webhook-manager
    pullPolicy: IfNotPresent
  clusterd:
    repository: hub.oepkgs.net/openfuyao/ascendhub/clusterd
    tag: v26.1.1-openeuler24.03
    pullPolicy: Always
  rscontroller:
    repository: hub.oepkgs.net/openfuyao/ascendhub/resilience-controller
    tag: v7.1.RC1
    pullPolicy: Always
  exporter:
    repository: hub.oepkgs.net/openfuyao/ascendhub/npu-exporter
    tag: v26.1.1-openeuler24.03
    pullPolicy: Always
  mindiotft:
    repository: cr.openfuyao.cn/openfuyao/npu-node-provision
    pullPolicy: Always
  mindioacp:
    repository: cr.openfuyao.cn/openfuyao/npu-node-provision
    pullPolicy: Always
  vnpuClientUpdate:
    repository: cr.openfuyao.cn/openfuyao/vnpu/acl-client-update-910b
    pullPolicy: IfNotPresent
  vnpuDevicePlugin:
    repository: cr.openfuyao.cn/openfuyao/vnpu/npu-device-plugin
    pullPolicy: IfNotPresent
  vnpuExporter:
    repository: cr.openfuyao.cn/openfuyao/vnpu/xpu-exporter
    pullPolicy: IfNotPresent
  draKubeletPlugin:
    repository: cr.openfuyao.cn/openfuyao/npu-dra-plugin
    pullPolicy: IfNotPresent
  draVCANNRTInstaller:
    # DRA keeps this installer image under docker.io/library, but it is not publicly pullable on 192.168.200.26.
    repository: cr.openfuyao.cn/openfuyao/vnpu/acl-client-update-910b
    pullPolicy: IfNotPresent

mindxNamespace: true

nfd:
  enabled: true
  nodefeaturerules: false

node-feature-discovery:
  image:
    repository: hub.oepkgs.net/openfuyao/nfd/node-feature-discovery
    # This should be set to 'Always' for released version
    pullPolicy: Always
    # tag, if defined will use the given image tag, else Chart.AppVersion will be used
    tag: v0.16.4
  enableNodeFeatureApi: true
  gc:
    enable: true
    replicaCount: 1
    serviceAccount:
      name: node-feature-discovery
      create: false
  worker:
    serviceAccount:
      name: node-feature-discovery
      # disable creation to avoid duplicate serviceaccount creation by master spec below
      create: false
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
    config:
      sources:
        pci:
          deviceClassWhitelist:
            - "1000"
            - "1200"
            - "0200"
            - "0300"
          deviceLabelFields:
            - class
            - vendor
            - device
  master:
    serviceAccount:
      name: node-feature-discovery
      create: true

npu-feature-discovery:
  enabled: true
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/npu-feature-discovery
      tag: latest
      pullPolicy: Always

operator:
  imagePullSecrets: []
  priorityClassName: system-node-critical
  nodeSelector: {}
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Equal"
      value: ""
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Equal"
      value: ""
      effect: "NoSchedule"
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/master"
                operator: In
                values: [""]
        - weight: 1
          preference:
            matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: In
                values: [""]
  resources:
    limits:
      cpu: 500m
      memory: 350Mi
    requests:
      cpu: 200m
      memory: 100Mi
daemonsets:
  labels: {}
  annotations: {}
  nodeSelector: {}
  priorityClassName: system-node-critical
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Equal"
      value: ""
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Equal"
      value: ""
      effect: "NoSchedule"
driver:
  # Enable Ascend Driver&Firmware capability
  enabled: true
  nodeSelector: {}
  tolerations: []
  env:
    - name: HOST_DRIVER_SOURCE_PATH
      value: "/tmp/driver_pkg"
  imagePullSecrets: []
trainer:
  # Enable Ascend Operator management capability
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  resources:
    requests:
      memory: 3Gi
      cpu: 2000m
    limits:
      memory: 3Gi
      cpu: 2000m
  commandSpec:
    command: []
    args: [ "ascend-operator
            --kubeApiQps=800
            --kubeApiBurst=800
            --enableGangScheduling=false
            --logFile=/var/log/mindx-dl/ascend-operator/ascend-operator.log
            --logLevel=0
            --enable-healthz=true --healthz-address=11252" ]
devicePlugin:
  # Enable Ascend Device Plugin management capability
  nodeSelector: {}
  tolerations: []
  env:
    - name: ASCEND_DOCKER_RUNTIME
      value: "False"
  enabled: true
  imagePullSecrets: []
  commandSpec:
    command: [ "/bin/bash", "-c", "--"]
    args: [ "device-plugin -volcanoType=false -presetVirtualDevice=true
                 -logFile=/var/log/mindx-dl/devicePlugin/devicePlugin.log -logLevel=0 --enable-healthz=true --healthz-address=11251" ]
  resources: []
ociRuntime:
  # Enable Ascend Docker Runtime capability
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullPolicy: Always
  imagePullSecrets: []
nodeD:
  enabled: true
  # Requires a compatible snapshot-enabled image and host runtime/CRIU.
  containerSnapshot:
    enabled: false
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  commandSpec:
    args: [ "/usr/local/bin/noded -logFile=/var/log/mindx-dl/noded/noded.log -logLevel=0 --enable-healthz=true --healthz-address=11255" ]
  resources: []
inferOperator:
  enabled: false
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  env: []
  commandSpec: {}
  volumeSpec: {}
  resources: {}
  logRotate: {}
  # ConfigMap.data overrides; values must be strings.
  config: {}
rdmaDevicePlugin:
  enabled: false
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  env: []
  commandSpec: {}
  volumeSpec: {}
  resources: {}
  logRotate: {}
  # ConfigMap.data overrides; values must be strings.
  config: {}
volcano:
  flavor: mindcluster
  admission:
    enabled:
    # Main admission image comes from images.volcanoAdmission only when this is true.
    # Keep false so CR stores only user overrides; assets provide flavor defaults.
    imageOverrideEnabled: false
    # The vNPU admission init-permission image is rendered from images.busybox when volcano.flavor=vnpu.
    imagePullSecrets: []
    log:
      dir:
      file:
      level:
vccontroller:
  nodeSelector: {}
  tolerations: []
  imageOverrideEnabled: false
  initImageOverrideEnabled: false
  controllerResources:
    requests:
      memory: 3Gi
      cpu: 2000m
    limits:
      memory: 3Gi
      cpu: 2000m
  enabled: true
  imagePullSecrets: []
  vnpuCommandSpec: {}
vcscheduler:
  nodeSelector: {}
  tolerations: []
  imageOverrideEnabled: false
  initImageOverrideEnabled: false
  vnpuCommandSpec: {}
  schedulerResources:
    requests:
      memory: 4Gi
      cpu: 5500m
    limits:
      memory: 8Gi
      cpu: 5500m
  enabled: true
  imagePullSecrets: []
  schedulerConfigMap:
    conf: ""
  vnpuSchedulerConfigMap:
    conf: ""
clusterd:
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  commandSpec:
    args: [ "useradd hwMindX; groupadd hwMindX; usermod -aG hwMindX hwMindX; chown hwMindX:hwMindX /var/log/mindx-dl/clusterd; 
              chmod 750 /var/log/mindx-dl/clusterd; /usr/local/bin/clusterd -logFile=/var/log/mindx-dl/clusterd/clusterd.log -logLevel=0 --enable-healthz=true --healthz-address=11253" ]
  resources: []
rscontroller:
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  resources: []
  commandSpec: []
exporter:
  # Requires the ServiceMonitor CRD and monitoring namespace when enabled.
  serviceMonitor:
    enabled: false
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  resources: []
  commandSpec:
    args: [ "umask 027;npu-exporter -port=8082 -ip=0.0.0.0  -updateTime=5
                     -logFile=/var/log/mindx-dl/npu-exporter/npu-exporter.log -logLevel=0 -containerMode=containerd --enable-healthz=true --healthz-address=11256" ]
mindiotft:
  enabled: true
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
mindioacp:
  enabled: true
  version: 7.3.0
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []

vnpu:
  # Enable vNPU management capability
  enabled: false
  nodeSelector:
    huawei.com/vnpu: ready
  tolerations: []
  updateStrategy: RollingUpdate
  priorityClassName: system-node-critical
  nodeModeConfig: ""
  virtualTemplateConfig: ""
  clientUpdate:
    enabled: true
    imagePullSecrets: []
    nodeSelector: {}
    tolerations: []
    env: []
    commandSpec: {}
    volumeSpec: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 512Mi
  devicePlugin:
    enabled: true
    imagePullSecrets: []
    nodeSelector: {}
    tolerations: []
    env: []
    commandSpec: {}
    # Override volumes named ascend or npu-smi here when Ascend driver or npu-smi uses custom host paths.
    volumeSpec: {}
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 2Gi
    deviceSplitCount: 20
    loggingConsole: true
  exporter:
    enabled: false
    imagePullSecrets: []
    nodeSelector: {}
    tolerations: []
    env: []
    commandSpec: {}
    # Override the tls-secret volume here when using a custom exporter TLS secret.
    volumeSpec: {}
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 500m
        memory: 1Gi
    port: 8082
    https: false
    serviceMonitor:
      enabled: false

dra:
  # Enable Dynamic Resource Allocation management capability
  enabled: false
  nodeSelector: {}
  tolerations: []
  driverName: npu.huawei.com
  deviceProfile: npu
  cdiRoot: /var/run/cdi
  healthcheckPort: -1
  numDevices: 0
  kubeconfig: ""
  kubeAPIQPS: ""
  kubeAPIBurst: 0
  featureGates: ""
  kubeletRegistrarDirectoryPath: /var/lib/kubelet/plugins_registry
  kubeletPluginsDirectoryPath: /var/lib/kubelet/plugins
  kubeletPlugin:
    enabled: true
    imagePullSecrets: []
    nodeSelector: {}
    tolerations: []
    env: []
    commandSpec: {}
    volumeSpec: {}
    resources: {}
  deviceClasses:
    enabled: false
    templates: []
  softVNPU:
    enabled: false
    nodeSelector: {}
    tolerations: []
    shareCount: 16
    softShareShmDir: /shared
    softShareDevConfigDir: /etc/enpu
    npuProfileConfigPath: /etc/dra/dra.config
    chipCapabilitiesConfigMap: vnpu-template-config
    chipCapabilitiesNamespace: ""
    chipCapabilities: |
      chips:
        - chipName: 310P3
          totalAiCore: 8
          totalAiCpu: 7
          totalMemoryMi: 21525
          templates:
            - { name: vir01, aiCore: 1, aiCpu: 1, memoryMi: 3072 }
            - { name: vir02, aiCore: 2, aiCpu: 2, memoryMi: 6144 }
            - { name: vir02_1c, aiCore: 2, aiCpu: 1, memoryMi: 6144 }
            - { name: vir04, aiCore: 4, aiCpu: 4, memoryMi: 12288 }
            - { name: vir04_3c, aiCore: 4, aiCpu: 3, memoryMi: 12288 }
        - chipName: 910B4
          totalAiCore: 20
          totalAiCpu: 6
          totalMemoryMi: 32768
          templates:
            - { name: vir05_1c_8g, aiCore: 5, aiCpu: 1, memoryMi: 8192 }
            - { name: vir10_3c_16g, aiCore: 10, aiCpu: 3, memoryMi: 16384 }
            - { name: vir10_4c_16g_m, aiCore: 10, aiCpu: 4, memoryMi: 16384 }
            - { name: vir10_3c_16g_nm, aiCore: 10, aiCpu: 3, memoryMi: 16384 }
    profileConfig: ""
    vcannrtInstaller:
      enabled: true
      imagePullSecrets: []
      nodeSelector: {}
      tolerations: []
      env: []
      commandSpec: {}
      volumeSpec: {}
      resources: {}
  webhook:
    enabled: false
    # The current upstream DRA webhook only registers the gpu profile.
    # Override commandSpec explicitly when using a webhook image that supports a different profile.
    imagePullSecrets: []
    nodeSelector: {}
    tolerations: []
    env: []
    commandSpec: {}
    # Override the tls-secret volume here when using a custom webhook TLS secret.
    volumeSpec: {}
    resources: {}
    port: 443
    tlsCertFile: /tls/tls.crt
    tlsPrivateKeyFile: /tls/tls.key
    caBundle: ""
    failurePolicy: Fail
