apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: npu-operator
  labels:
    {{- include "npu-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: "npu-operator"
    app.kubernetes.io/managed-by: kustomize
subjects:
- kind: ServiceAccount
  name: npu-operator
  namespace: {{ $.Release.Namespace }}

roleRef:
  kind: ClusterRole
  name: npu-operator
  apiGroup: rbac.authorization.k8s.io


