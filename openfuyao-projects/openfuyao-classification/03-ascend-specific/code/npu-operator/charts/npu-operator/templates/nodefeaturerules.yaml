{{- if .Values.nfd.nodefeaturerules }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: npu-nfd-nodefeaturerules
spec:
  rules:
    - name: "huawei-Ascend310"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_d100.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["d100"]}
    - name: "huawei-Ascend310P"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_d500.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["d500"]}
    - name: "huawei-Ascend910-d801"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_d801.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["d801"]}
    - name: "huawei-Ascend910-d802"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_d802.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["d802"]}
    - name: "huawei-AscendA5-d806"
      labels:
        "feature.node.kubernetes.io/pci-1200_19e5_d806.present": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor: {op: In, value: ["19e5"]}
            device: {op: In, value: ["d806"]}
{{- end }}
