apiVersion: v2
name: npu-operator
description: NPU Operator uses the Operator Framework to automatically manage all software componentes required for configuring Ascend devices.
type: application
version: 0.0.0-latest
appVersion: latest
dependencies:
  - name: node-feature-discovery
    version: 0.16.4
    repository: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    condition: nfd.enabled
  - name: npu-feature-discovery
    version: 0.0.0-latest
    condition: npu-feature-discovery.enabled
keywords: ["computing"]