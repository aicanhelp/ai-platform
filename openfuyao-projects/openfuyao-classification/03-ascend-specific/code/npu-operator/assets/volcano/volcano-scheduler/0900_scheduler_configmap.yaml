# Source: volcano/templates/scheduler.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "enqueue, allocate, backfill"
    tiers:
    - plugins:
      - name: gang
        enableNodeOrder: false
      - name: volcano-npu_v26.1.1
        enablePreemptable: true
        enableReclaimable: true
      - name: priority
        enableNodeOrder: false
      - name: conformance
        enableNodeOrder: false
    - plugins:
      - name: drf
        enableNodeOrder: false
      - name: predicates
        enableNodeOrder: false
        arguments:
          predicate.GPUSharingEnable: false
          predicate.GPUNumberEnable: false
      - name: proportion
        enableNodeOrder: false
      - name: nodeorder
      - name: binpack
        enableNodeOrder: false
    configurations:
      - name: init-params
        arguments: {"grace-over-time":"900","presetVirtualDevice":"true","nslb-version":"1.0","shared-tor-num":"2",
    "useClusterInfoManager":"true","self-maintain-available-card":"true","super-pod-size": "128", "reserve-nodes": "2",
    "forceEnqueue": "true", "prefer-previous-node": "true"}
