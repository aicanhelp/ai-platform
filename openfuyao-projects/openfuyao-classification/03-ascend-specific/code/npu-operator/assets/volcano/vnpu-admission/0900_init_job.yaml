# Source: volcano/templates/admission.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: volcano-admission-init
  namespace: volcano-system
  labels:
    app: volcano-admission-init
spec:
  backoffLimit: 3
  manualSelector: true
  selector:
    matchLabels:
      app: volcano-admission-init
  template:
    metadata:
      labels:
        app: volcano-admission-init
    spec:
      securityContext:
        seLinuxOptions:
          level: s0:c123,c456
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: volcano-admission-init
      priorityClassName: system-cluster-critical
      restartPolicy: Never
      containers:
        - name: main
          image: cr.openfuyao.cn/openfuyao/vnpu/vc-webhook-manager:__NPU_OPERATOR_RELEASE_TAG__
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/bash", "./gen-admission-secret.sh", "--service", "volcano-admission-service", "--namespace",
                    "volcano-system", "--secret", "volcano-admission-secret"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - DAC_OVERRIDE
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 1000
