apiVersion: apps/v1
kind: Deployment
metadata:
  name: volcano-scheduler
  namespace: volcano-system
  labels:
    app: volcano-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volcano-scheduler
  template:
    metadata:
      labels:
        app: volcano-scheduler
    spec:
      serviceAccount: volcano-scheduler
      priorityClassName: system-cluster-critical
      securityContext:
        seLinuxOptions:
          level: s0:c123,c456
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-permission
          image: hub.oepkgs.net/openfuyao/busybox:1.36.1
          command:
            - sh
            - -c
            - |
              mkdir -p /var/log/volcano-scheduler
              chown 1000:1000 /var/log/volcano-scheduler
              chmod 750 /var/log/volcano-scheduler
          volumeMounts:
            - name: scheduler-config-log
              mountPath: /var/log/volcano-scheduler
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: volcano-scheduler
          image: cr.openfuyao.cn/openfuyao/vnpu/vc-scheduler:__NPU_OPERATOR_RELEASE_TAG__
          args:
            - --logtostderr=false
            - --scheduler-conf=/volcano.scheduler/volcano-scheduler.conf
            - --plugins-dir=plugins
            - --enable-healthz=true
            - --enable-metrics=true
            - --leader-elect=false
            - --log_dir=/var/log/volcano-scheduler
            - --log_file=/var/log/volcano-scheduler/volcano-scheduler.log
            - --kube-api-qps=2000
            - --kube-api-burst=2000
            - --schedule-period=1s
            - --node-worker-threads=20
            - -v=3
            - 2>&1
          env:
            - name: DEBUG_SOCKET_DIR
              value: /tmp/klog-socks
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - DAC_OVERRIDE
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: scheduler-config
              mountPath: /volcano.scheduler
            - name: klog-sock
              mountPath: /tmp/klog-socks
            - name: scheduler-config-log
              mountPath: /var/log/volcano-scheduler
      volumes:
        - name: scheduler-config
          configMap:
            name: volcano-scheduler-configmap
        - name: klog-sock
          emptyDir: {}
        - name: scheduler-config-log
          hostPath:
            path: /var/log/volcano-scheduler
            type: DirectoryOrCreate
