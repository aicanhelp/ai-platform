kind: Deployment
apiVersion: apps/v1
metadata:
  name: volcano-controllers
  namespace: volcano-system
  labels:
    app: volcano-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volcano-controller
  template:
    metadata:
      labels:
        app: volcano-controller
      ##### For Kubernetes versions lower than 1.19, seccomp is used with annotations.
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - "npu-operator"
            topologyKey: "kubernetes.io/hostname"
            namespaceSelector: {}
      nodeSelector:
        masterselector: dls-master-node
      serviceAccount: volcano-controllers
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 9000
        seLinuxOptions:
          level: s0:c123,c456        
        ##### For Kubernetes version 1.19 and above, seccomp is used with securityContext:seccompProfile
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-permission
          image: "hub.oepkgs.net/openfuyao/busybox:1.36.1"
          command:
            - sh
            - -c
            - |
              chown 9000:9000 /var/log/mindx-dl /var/log/mindx-dl/volcano-controller
              chmod 750 /var/log/mindx-dl/volcano-controller
          volumeMounts:
            - mountPath: /var/log/mindx-dl/volcano-controller
              name: device-volcanocontroller
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: volcano-controllers
          image: "hub.oepkgs.net/openfuyao/ascendhub/vc-controller-manager:v1.12.0-v26.1.1-openeuler24.03"
          imagePullPolicy: "Always"
          command: [ "/bin/sh" ]
          args: [ "-c", "umask 027;/vc-controller-manager
                     --kube-api-qps=800
                     --kube-api-burst=800
                     --enable-healthz=true
                     --enable-metrics=true
                     --worker-threads=6
                     --worker-threads=3
                     --logtostderr=true
                     --worker-threads-for-gc=5
                     --worker-threads-for-podgroup=5
                     --log_dir=/var/log/mindx-dl/volcano-controller
                     --log_file=/var/log/mindx-dl/volcano-controller/volcano-controller.log
                     -v=4 2>&1" ]
          resources:
            requests:
              memory: 3Gi
              cpu: 2000m
            limits:
              memory: 3Gi
              cpu: 2000m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 9000
            runAsGroup: 9000
            capabilities:
              drop: [ "ALL" ]
          env:
          - name: KUBE_POD_NAMESPACE
            value: volcano-system
          - name: HELM_RELEASE_NAME
            value: volcano
          volumeMounts:
            - name: device-volcanocontroller
              mountPath: /var/log/mindx-dl/volcano-controller
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: device-volcanocontroller
          hostPath:
            path: /var/log/mindx-dl/volcano-controller
        - name: localtime
          hostPath:
            path: /etc/localtime
