apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mindio-tft
  namespace: default
spec:
  selector:
    matchLabels:
      app: mindio-tft
  template:
    metadata:
      labels:
        app: mindio-tft
    spec:
      hostPID: true
      hostNetwork: true
      containers:
        - name: tft-container
          image: "FILLED_BY_OPERATOR"
          securityContext:
            privileged: true
          command:
            - /bin/ash
            - -c
            - |
              if [ ! -f /mnt/opt/openFuyao/mindio/*.zip ]; then
                echo "/mnt/opt/openFuyao/mindio has no zip file"
                tag=$(sh /tmp/mindio/obtain-version.sh)
                sh /tmp/mindio/download.sh $tag
              else
                echo "mindio.zip found, skipping install..."
                unzip "/mnt/opt/openFuyao/mindio/*.zip" -d /tmp/mindio/
              fi
              sh /tmp/mindio/entrypoint.sh ttp;
              while true; do
                sleep 3600
              done
          volumeMounts:
            - name: root
              mountPath: /mnt
          lifecycle:
            preStop:
              exec:
                command: ["/bin/ash", "-c", "nsenter -t 1 -i -m -n sh -c 'component=\"ttp\"; package=$(python3 -m pip list | grep -i $component | awk \"{print $1}\" | head -n 1); if [ -n \"$package\" ]; then python3 -m pip uninstall -y $package; fi; sleep 2; rm -rf /opt/openFuyao-npu-mindiottp;'"]
      volumes:
        - name: root
          hostPath:
            path: /