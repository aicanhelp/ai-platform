apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dra-webhook-resource-claim-parameters
webhooks:
  - name: validate-resource-claim-parameters.dra.openfuyao.com
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: dra-webhook-service
        namespace: FILLED_BY_OPERATOR
        path: /validate-resource-claim-parameters
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - apiGroups:
          - resource.k8s.io
        apiVersions:
          - v1
          - v1beta1
          - v1beta2
        operations:
          - CREATE
          - UPDATE
        resources:
          - resourceclaims
          - resourceclaimtemplates
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: 10
