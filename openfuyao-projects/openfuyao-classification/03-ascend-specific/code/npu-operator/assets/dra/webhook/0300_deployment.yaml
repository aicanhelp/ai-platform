apiVersion: apps/v1
kind: Deployment
metadata:
  name: dra-webhook
  namespace: FILLED_BY_OPERATOR
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dra-webhook
  template:
    metadata:
      labels:
        app: dra-webhook
    spec:
      serviceAccountName: dra-webhook
      containers:
        - name: webhook
          image: FILLED_BY_OPERATOR
          imagePullPolicy: IfNotPresent
          command: ["FILLED_BY_OPERATOR"]
          args: ["FILLED_BY_OPERATOR"]
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: tls-secret
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls-secret
          secret:
            secretName: dra-webhook-tls
