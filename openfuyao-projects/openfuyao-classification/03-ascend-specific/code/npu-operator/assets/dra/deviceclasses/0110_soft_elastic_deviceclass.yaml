apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: elastic.npu.huawei.com
spec:
  selectors:
    - cel:
        expression: |-
          device.driver == "npu.huawei.com" &&
          device.attributes["npu.huawei.com"].vnpuMode == "soft" &&
          device.attributes["npu.huawei.com"].schedulingPolicy == "elastic"
