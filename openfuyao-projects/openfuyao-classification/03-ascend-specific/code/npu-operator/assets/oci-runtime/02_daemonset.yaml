apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ascend-runtime-containerd
  namespace: FILLED_BY_OPERATOR
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ascend-runtime-containerd
      app.kubernetes.io/part-or: npu-container-toolkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ascend-runtime-containerd
        app.kubernetes.io/part-or: npu-container-toolkit
    spec:
      nodeSelector:
        openfuyao.com/npu.present: ''
      hostNetwork: true
      hostPID: true
      initContainers:
        - name: prepare-runtime
          image: "FILLED_BY_OPERATOR"
          imagePullPolicy: Always
          command: ["/bin/sh","-c"]
          args:
            - |
              cp -a /var/lib/ascend-docker-runtime /mnt/tmp/runtime
              mkdir -p /mnt/host/etc/ascend-docker-runtime.d
              cp /mnt/tmp/runtime/base.list /mnt/host/etc/ascend-docker-runtime.d
          volumeMounts:
            - mountPath: /mnt/tmp
              name: tmp
            - mountPath: /run
              name: run
            - mountPath: /mnt/host
              name: host
          resources:
            requests:
              memory: 16Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
        - name: prepare-config
          image: "FILLED_BY_OPERATOR"
          imagePullPolicy: Always
          args:
            - -R
            - /mnt/host
            - prepare
            - containerd
            - $(CRI_ENDPOINT)
            - ascend
            - /var/lib/npu-container-toolkit/runtime/ascend-docker-runtime
            - -o
            - /mnt/tmp/config.toml
          env:
            - name: CRI_ENDPOINT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['openfuyao.com/container.runtime.endpoint']
            - name: RUST_BACKTRACE
              value: "full"
          volumeMounts:
            - mountPath: /mnt/host
              name: host
              readOnly: true
            - mountPath: /mnt/tmp
              name: tmp
            - mountPath: /run
              name: run
          resources:
            requests:
              memory: 16Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
          securityContext:
            privileged: true
      containers:
        - name: inject
          image: FILLED_BY_OPERATOR
          imagePullPolicy: Always
          args:
            - -R
            - /mnt/host
            - inject
            - containerd
            - $(CRI_ENDPOINT)
            - /mnt/tmp/config.toml
          stdin: true
          env:
            - name: CRI_ENDPOINT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['openfuyao.com/container.runtime.endpoint']
          volumeMounts:
            - mountPath: /mnt/host
              name: host
              mountPropagation: Bidirectional
            - mountPath: /mnt/tmp
              name: tmp
              readOnly: true
            - mountPath: /run
              name: run
            - mountPath: /mnt/host/var/lib/npu-container-toolkit/runtime
              name: tmp
              subPath: runtime
              readOnly: true
          resources:
            requests:
              memory: 16Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
          securityContext:
            privileged: true
      volumes:
        - name: host
          hostPath:
            path: /
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          hostPath:
            path: /run
