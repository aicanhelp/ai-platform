apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rdma-shared-dp-ds
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: rdma-shared-dp-ds
  template:
    metadata:
      labels:
        name: rdma-shared-dp-ds
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      serviceAccountName: rdma-shared-dp-sa
      nodeSelector:
        workerselector: dls-worker-node
      initContainers:
      - name: init-log-setup
        image: FILLED_BY_OPERATOR
        command:
        - sh
        - -c
        - mkdir -p /var/log/mindx-dl && chmod 755 /var/log/mindx-dl && chown root:root /var/log/mindx-dl && mkdir -p /var/log/mindx-dl/k8s-rdma-shared-dp
          && chmod 750 /var/log/mindx-dl/k8s-rdma-shared-dp && chown root:root /var/log/mindx-dl/k8s-rdma-shared-dp
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: log-k8s-rdma-shared-dp
          mountPath: /var/log
      containers:
      - image: FILLED_BY_OPERATOR
        name: k8s-rdma-shared-dp-ds
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: 500Mi
            cpu: 500m
          limits:
            memory: 500Mi
            cpu: 500m
        command:
        - FILLED_BY_OPERATOR
        args:
        - FILLED_BY_OPERATOR
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: config
          mountPath: /k8s-rdma-shared-dev-plugin
        - name: sys
          mountPath: /sys
        - name: infiniband
          mountPath: /dev/infiniband
        - name: log-k8s-rdma-shared-dp
          mountPath: /var/log/mindx-dl/k8s-rdma-shared-dp
          subPath: mindx-dl/k8s-rdma-shared-dp
        - name: hinicadm5
          mountPath: /usr/sbin/hinicadm5
          readOnly: true
        - name: hinic-log
          mountPath: /var/log/hinic5
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: config
        configMap:
          name: rdma-devices
          items:
          - key: config.json
            path: config.json
      - name: sys
        hostPath:
          path: /sys/
      - name: infiniband
        hostPath:
          path: /dev/infiniband/
      - name: log-k8s-rdma-shared-dp
        hostPath:
          path: /var/log
          type: Directory
      - name: hinicadm5
        hostPath:
          path: /usr/sbin/hinicadm5
          type: File
      - name: hinic-log
        hostPath:
          path: /var/log/hinic5
          type: DirectoryOrCreate
