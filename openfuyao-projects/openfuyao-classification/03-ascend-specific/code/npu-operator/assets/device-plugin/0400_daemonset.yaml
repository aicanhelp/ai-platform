apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ascend-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: ascend-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        scheduler.alpha.kubernetes.io/critical-pod: ""
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      labels:
        name: ascend-device-plugin-ds
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: huawei.com/Ascend910
          operator: Exists
          effect: NoSchedule
        - key: huawei.com/Ascend310
          operator: Exists
          effect: NoSchedule
        - key: huawei.com/Ascend310P
          operator: Exists
          effect: NoSchedule
        - key: huawei.com/npu
          operator: Exists
          effect: NoSchedule
        - key: "device-plugin"
          operator: "Equal"
          value: "v2"
          effect: NoSchedule
      priorityClassName: "system-node-critical"
      nodeSelector:
        openfuyao.com/npu.present: ''
      serviceAccountName: ascend-device-plugin-sa
      hostPID: true
      initContainers:
        - name: init-permission
          image: FILLED_BY_OPERATOR
          command:
            - sh
            - -c
            - |
              chown 9000:9000 /var/log/mindx-dl /var/log/mindx-dl/devicePlugin
              chmod 750 /var/log/mindx-dl/devicePlugin
          volumeMounts:
            - mountPath: /var/log/mindx-dl/devicePlugin
              name: log-path
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - image: FILLED_BY_OPERATOR
          name: device-plugin-01
          resources:
            requests:
              memory: 500Mi
              cpu: 500m
            limits:
              memory: 500Mi
              cpu: 500m
          command: ["FILLED_BY_OPERATOR"]
          args: ["FILLED_BY_OPERATOR"]
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          imagePullPolicy: Always 
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: vnpucfg
              mountPath: /etc/vnpu.cfg
            - name: vnpu-cut
              mountPath: /run/vnpu_cfg_lock
            - name: pod-resource
              mountPath: /var/lib/kubelet/pod-resources
            - name: hiai-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: log-path
              mountPath: /var/log/mindx-dl/devicePlugin
            - name: tmp
              mountPath: /tmp
            - name: reset-config-dir
              mountPath: /user/restore/reset
            - name: lingqu-log
              mountPath: /var/log/lingqu
            - name: data-trace-file-dir
              mountPath: /user/cluster-info/datatrace-config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: containerd
              mountPath: /run/containerd
              readOnly: true
          env:
            - name: MOUNT_BY_RUNTIME_FOR_DP
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP      
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: pod-resource
          hostPath:
            path: /var/lib/kubelet/pod-resources
        - name: hiai-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: log-path
          hostPath:
            path: /var/log/mindx-dl/devicePlugin
            type: DirectoryOrCreate
        - name: reset-config-dir
          hostPath:
            path: /user/restore/reset
            type: DirectoryOrCreate
        - name: data-trace-file-dir
          hostPath:
            path: /user/cluster-info/datatrace-config
            type: DirectoryOrCreate
        - name: vnpu-cut
          hostPath:
            path: /run/vnpu_cfg_lock
            type: DirectoryOrCreate
        - name: tmp
          hostPath:
            path: /tmp
        - name: vnpucfg
          hostPath:
            path: /etc/vnpu.cfg
            type: File
        - name: lingqu-log
          hostPath:
            path: /var/log/lingqu
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: containerd
          hostPath:
            path: /run/containerd