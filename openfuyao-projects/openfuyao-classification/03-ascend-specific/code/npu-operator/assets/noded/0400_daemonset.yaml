apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: noded
  namespace: mindx-dl
spec:
  selector:
    matchLabels:
      app: noded
  template:
    metadata:
      labels:
        app: noded
      ##### For Kubernetes versions lower than 1.19, seccomp is used with annotations.
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      ##### For Kubernetes version 1.19 and above, seccomp is used with securityContext:seccompProfile
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        workerselector: dls-worker-node
        openfuyao.com/npu.present: ''
      serviceAccountName: noded
      hostNetwork: true
      containers:
        - name: noded
          image: "FILLED_BY_OPERATOR"
          resources:
            requests:
              memory: 300Mi
              cpu: 500m
            limits:
              memory: 300Mi
              cpu: 500m
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: XDL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          imagePullPolicy: Always
          command: [ "/bin/bash", "-c", "--"]
          args: [ "FILLED_BY_OPERATOR" ]
          securityContext:
            privileged: true
          volumeMounts:
            - name: log-noded
              mountPath: /var/log/mindx-dl/noded
            - name: hiai-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: pingmesh-result
              mountPath: /user/mind-cluster/pingmesh
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: dev-dir
              mountPath: /dev
            - name: slownode
              mountPath: /user/cluster-info/profiling
      volumes:
        - name: log-noded
          hostPath:
            path: /var/log/mindx-dl/noded
        - name: hiai-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: pingmesh-result
          hostPath:
            path: /user/mind-cluster/pingmesh
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: dev-dir
          hostPath:
            path: /dev
        - name: slownode
          hostPath:
            path: /user/cluster-info/profiling
            type: DirectoryOrCreate