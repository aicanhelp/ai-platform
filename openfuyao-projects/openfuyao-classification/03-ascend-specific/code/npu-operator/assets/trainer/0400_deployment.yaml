apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: controller-manager
  name: ascend-operator-manager
  namespace: mindx-dl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller-manager
  template:
    metadata:
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      labels:
        app: controller-manager
    spec:
      nodeSelector:
        masterselector: dls-master-node
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ascend-operator-manager
      initContainers:
        - name: init-permission
          image: "FILLED_BY_OPERATOR"
          command:
            - sh
            - -c
            - |
              sudo 
              chown 9000:9000 /var/log/mindx-dl /var/log/mindx-dl/ascend-operator
              chmod 750 /var/log/mindx-dl/ascend-operator
          volumeMounts:
            - mountPath: /var/log/mindx-dl/ascend-operator
              name: ascend-operator-log
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - command: [ "/bin/bash", "-c", "--"]
          args: ["FILLED_BY_OPERATOR"]
          image: "FILLED_BY_OPERATOR"
          name: manager
          resources:
            limits:
              cpu: 2000m
              memory: 3Gi
            requests:
              cpu: 2000m
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 9000
            runAsGroup: 9000
            capabilities:
              drop: ["All"]
          volumeMounts:
            - name: ascend-operator-log
              mountPath: /var/log/mindx-dl/ascend-operator
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: ranktable-dir
              mountPath: /user/mindx-dl/ranktable
      volumes:
        - name: ascend-operator-log
          hostPath:
            path: /var/log/mindx-dl/ascend-operator
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: ranktable-dir
          hostPath:
            path: /user/mindx-dl/ranktable
            type: DirectoryOrCreate
      terminationGracePeriodSeconds: 10