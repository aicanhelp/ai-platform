apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: npu-client-update-daemonset
  namespace: xpu
  labels:
    name: npu-client-update
spec:
  selector:
    matchLabels:
      name: npu-client-update
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: npu-client-update
    spec:
      containers:
        - name: npu-client-update
          image: FILLED_BY_OPERATOR
          imagePullPolicy: IfNotPresent
          command: ["FILLED_BY_OPERATOR"]
          args: ["FILLED_BY_OPERATOR"]
          volumeMounts:
            - name: opt-xpu
              mountPath: /opt/xpu
      volumes:
        - name: opt-xpu
          hostPath:
            path: /opt/xpu
