apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: npu-device-plugin-daemonset
  namespace: xpu
spec:
  selector:
    matchLabels:
      name: npu-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: npu-device-plugin
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: device-plugin-service-account
      containers:
        - name: npu-device-plugin
          image: FILLED_BY_OPERATOR
          imagePullPolicy: IfNotPresent
          command: ["FILLED_BY_OPERATOR"]
          args: ["FILLED_BY_OPERATOR"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: etc-xpu
              mountPath: /etc/xpu
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: hostproc
              mountPath: /hostproc
              readOnly: true
            - name: xpu-log
              mountPath: /var/log/xpu
            - name: xpu-lib
              mountPath: /opt/xpu/lib
            - name: xpu-sock
              mountPath: /var/lib/xpu
            - name: ascend
              mountPath: /usr/local/Ascend
            - name: npu-smi
              mountPath: /usr/local/bin/npu-smi
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: etc-xpu
          hostPath:
            path: /etc/xpu
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: hostproc
          hostPath:
            path: /proc
            type: Directory
        - name: xpu-log
          hostPath:
            path: /var/log/xpu
            type: DirectoryOrCreate
        - name: xpu-sock
          hostPath:
            path: /var/lib/xpu
        - name: xpu-lib
          hostPath:
            path: /opt/xpu/lib
        - name: ascend
          hostPath:
            path: /usr/local/Ascend
        - name: npu-smi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
