apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: xpu-exporter-servicemonitor
  namespace: xpu
  labels:
    app: simbaos-servicemonitor
spec:
  endpoints:
    - honorLabels: true
      interval: 1m
      path: /metrics
      port: xpu-exporter-port
  jobLabel: xpu-exporter
  namespaceSelector:
    matchNames:
      - xpu
  selector:
    matchLabels:
      app: xpu-exporter-svc
