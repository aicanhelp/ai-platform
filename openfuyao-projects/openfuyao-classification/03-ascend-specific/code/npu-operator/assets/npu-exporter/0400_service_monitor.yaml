apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: npu-exporter-servicemonitor
  namespace: monitoring
  labels:
    serviceMonitorSelector: prometheus
spec:
  selector:
    matchLabels:
      app: npu-exporter-svc
  endpoints:
    - port: http
      interval: 10s
      path: /metrics
      targetPort: 8082
  namespaceSelector:
    matchNames:
      - npu-exporter