apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: npu-exporter
  namespace: npu-exporter
spec:
  selector:
    matchLabels:
      app: npu-exporter
  template:
    metadata:
      ##### For Kubernetes versions lower than 1.19, seccomp is used with annotations.
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
      labels:
        app: npu-exporter
    spec:
      ##### For Kubernetes version 1.19 and above, seccomp is used with securityContext:seccompProfile
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        workerselector: dls-worker-node
        openfuyao.com/npu.present: ''
      containers:
        - name: npu-exporter
          image: "FILLED_BY_OPERATOR"
          resources:
            requests:
              memory: 1000Mi
              cpu: 1000m
            limits:
              memory: 1000Mi
              cpu: 1000m
          imagePullPolicy: IfNotPresent
          command: [ "/bin/bash", "-c", "--"]
          # pair firstly
          args: [ "FILLED_BY_OPERATOR" ]
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          volumeMounts:
            - name: log-npu-exporter
              mountPath: /var/log/mindx-dl/npu-exporter
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: ascend-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: ascend-dcmi
              mountPath: /usr/local/dcmi
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: containerd  # delete when only use isula
              mountPath: /run/containerd
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: log-npu-exporter
          hostPath:
            path: /var/log/mindx-dl/npu-exporter
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: ascend-dcmi
          hostPath:
            path: /usr/local/dcmi
        - name: sys
          hostPath:
            path: /sys
        - name: containerd  # delete when only use isula
          hostPath:
            path: /run/containerd
        - name: tmp
          hostPath:
            path: /tmp