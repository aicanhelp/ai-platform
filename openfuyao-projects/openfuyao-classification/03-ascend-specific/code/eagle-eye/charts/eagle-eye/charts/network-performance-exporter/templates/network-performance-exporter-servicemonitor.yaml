apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: network-performance-exporter
  namespace: eagle-eye
  labels:
    app: network-performance-exporter
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app: network-performance-exporter
  endpoints:
    - port: metrics
      interval: {{ .Values.networkPerformanceExporter.collectInterval }}s
      path: /metrics