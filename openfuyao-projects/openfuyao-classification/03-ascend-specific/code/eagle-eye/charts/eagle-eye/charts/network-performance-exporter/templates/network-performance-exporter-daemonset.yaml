apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-performance-exporter
  namespace: eagle-eye
spec:
  selector:
    matchLabels:
      app: network-performance-exporter
  template:
    metadata:
      labels:
        app: network-performance-exporter
    spec:
      serviceAccountName: network-performance-exporter
      initContainers:
        - name: wait-for-nats
          image: hub.oepkgs.net/openfuyao/busybox:1.36.1
          imagePullPolicy: {{ if .Values.global }}{{ .Values.global.image.pullPolicy | default .Values.images.core.pullPolicy }}{{ else }}{{ .Values.images.core.pullPolicy }}{{ end }}
          command:
            - /bin/sh
            - -c
            - |
              until nc -z nats.nats 4222; do
                echo "Wait NATS service...";
                sleep 3;
              done;
              echo "NATS service is ready!";
      containers:
        - name: network-performance-exporter
          image: {{ .Values.images.core.repository }}:{{ .Values.images.core.tag }}
          imagePullPolicy: {{ if .Values.global }}{{ .Values.global.image.pullPolicy | default .Values.images.core.pullPolicy }}{{ else }}{{ .Values.images.core.pullPolicy }}{{ end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MODULE_NAME
              value: "network-performance-exporter"
          args:
            - "--web-listen-port"
            - "{{ .Values.networkPerformanceExporter.metricsPort }}"
            - "--collector-interval"
            - "{{ .Values.networkPerformanceExporter.collectInterval }}"
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort:  {{ .Values.networkPerformanceExporter.metricsPort }}
          volumeMounts:
            - name: log-network-performance-exporter
              mountPath: /var/log/network-performance-exporter
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: ascend-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: ascend-dcmi
              mountPath: /usr/local/dcmi
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: proc
              mountPath: /proc
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: log-network-performance-exporter
          hostPath:
            path: /var/log/network-performance-exporter
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: ascend-dcmi
          hostPath:
            path: /usr/local/dcmi
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: tmp
          hostPath:
            path: /tmp
