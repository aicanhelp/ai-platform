apiVersion: v1
kind: Service
metadata:
  name: network-performance-exporter
  namespace: eagle-eye
  labels:
    app: network-performance-exporter
spec:
  type: ClusterIP
  selector:
    app: network-performance-exporter
  ports:
    - name: metrics
      port:  {{ .Values.networkPerformanceExporter.metricsPort }}
      targetPort: metrics
      protocol: TCP
