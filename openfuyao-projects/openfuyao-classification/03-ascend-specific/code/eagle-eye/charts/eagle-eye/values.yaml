enabled: true

global:
  image:
    pullPolicy: IfNotPresent

hardware-monitor:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/eagle-eye-hardware-monitor
      tag: "latest"

hardware-diagnosis:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/eagle-eye-hardware-diagnosis
      tag: "latest"

network-performance-exporter:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/eagle-eye-network-performance-exporter
      tag: "latest"

  networkPerformanceExporter:
    metricsPort: 8222
    collectInterval: 15

tracing:
  enabled: true

  # Jaeger subchart values override
  jaeger:
    query:
      service:
        type: NodePort
        nodePort: 30686