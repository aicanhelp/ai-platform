apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-eagle-eye-subscriber
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-eagle-eye-subscriber
  template:
    metadata:
      labels:
        app: vllm-eagle-eye-subscriber
    spec:
      initContainers:
        - name: wait-for-nats
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              until nc -z nats.nats 4222; do
                echo "Wait NATS service...";
                sleep 3;
              done;
              echo "NATS service is ready!";
      containers:
        - name: vllm-eagle-eye-subscriber
          image: zxyyy0119/eagleeyesubscriber:v7
          imagePullPolicy: Always
          env:
            - name: MODULE_NAME
              value: "vllm-eagle-eye-subscriber"
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: log-vllm-eagle-eye-subscriber
              mountPath: /var/log/vllm-eagle-eye-subscriber
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: ascend-driver
              mountPath: /usr/local/Ascend/driver
              readOnly: true
            - name: ascend-dcmi
              mountPath: /usr/local/dcmi
              readOnly: true
            - name: containerd
              mountPath: /run/containerd
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: log-vllm-eagle-eye-subscriber
          hostPath:
            path: /var/log/vllm-eagle-eye-subscriber
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: ascend-driver
          hostPath:
            path: /usr/local/Ascend/driver
        - name: ascend-dcmi
          hostPath:
            path: /usr/local/dcmi
        - name: containerd
          hostPath:
            path: /run/containerd
        - name: tmp
          hostPath:
            path: /tmp
