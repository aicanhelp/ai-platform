apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kae-deviceplugin
  namespace: kube-system
  labels:
    app: kae-deviceplugin
spec:
  selector:
    matchLabels:
      app: kae-deviceplugin
  template:
    metadata:
      labels:
        app: kae-deviceplugin
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: accelerator/kae.sec
                    operator: Exists
      containers:
        - name: kae-deviceplugin
          securityContext:
            privileged: true
          image: cr.openfuyao.cn/openfuyao/kae-device-plugin:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: LD_LIBRARY_PATH
              value: /lib/modules
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: locallib
              mountPath: /usr/local/lib
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: modules
          hostPath:
            path: /lib/modules
        - name: locallib
          hostPath:
            path: /usr/local/lib
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
