apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kae-hpre-device-plugin
  labels:
    app: kae-hpre-device-plugin
spec:
  selector:
    matchLabels:
      app: kae-hpre-device-plugin
  template:
    metadata:
      labels:
        app: kae-hpre-device-plugin
    spec:
      containers:
        - name: kae-hpre-device-plugin
          securityContext:
            privileged: true
          image: {{ list . "core" | include "helpers.image.name" }}
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: LD_LIBRARY_PATH
              value: /lib/modules
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: locallib
              mountPath: /usr/local/lib
              readOnly: true
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
            - name: config-volume
              mountPath: /etc/kae-device-plugin
            - name: varlog
              mountPath: /var/log/kae-device-plugin
            - name: kaelog
              mountPath: /var/log/kae.log
      dnsPolicy: ClusterFirst
      hostNetwork: true
      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: modules
          hostPath:
            path: /lib/modules
        - name: locallib
          hostPath:
            path: /usr/local/lib
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
        - name: varlog
          hostPath:
            path: /var/log/kae-device-plugin
        - name: config-volume
          configMap:
            name: kae-device-plugin-logcfg
        - name: kaelog
          hostPath:
            path: /var/log/kae.log
    {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate


