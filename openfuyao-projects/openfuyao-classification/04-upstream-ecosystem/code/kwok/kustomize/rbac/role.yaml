---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwok-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - services
  - namespaces
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - "discorvery.k8s.io"
  resources:
  - endpointslices
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - "batch"
  resources:
  - jobs
  - cronjobs
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - "certificates.k8s.io"
  resources:
  - "*"
  verbs:
  - "*"
- apiGroups:
  - "storage.k8s.io/v1"
  resources:
  - csidrivers
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - "node.k8s.io/v1"
