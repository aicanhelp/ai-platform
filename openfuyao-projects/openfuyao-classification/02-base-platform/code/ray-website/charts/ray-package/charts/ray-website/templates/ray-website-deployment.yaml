apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-website
  namespace: {{ .Release.Namespace }}
  labels:
    app: ray-website
spec:
  selector:
    matchLabels:
      app: ray-website
  template:
    metadata:
      labels:
        app: ray-website
    spec:
      {{- if .Values.enableOAuth }}
      serviceAccountName: ray-website
      {{- end }}
      tolerations:
        - key: "node.openfuyao.com/ray"
          operator: "Exists"
          effect: "NoExecute"
      containers:
        {{- if .Values.enableOAuth }}
        - name: oauth-proxy
          image: '{{ list . "oauthProxy" | include "helpers.image.name" }}'
          imagePullPolicy: {{ .Values.images.oauthProxy.pullPolicy }}
          ports:
            - containerPort: {{ .Values.oauthProxy.containerPort }}
              name: proxy
          args:
            - --https-address=
            - '--http-address=:{{ .Values.oauthProxy.containerPort }}'
            - --email-domain=*
            - --provider=openfuyao
            - --client-id={{ .Values.oauthProxy.client.id }}
            - --client-secret={{ .Values.oauthProxy.client.secret }}
            - '--upstream=http://localhost:{{ .Values.service.containerPort }}'
            - '--openfuyao-delegate-urls={"/":{"resource": "services/proxy", "group": ""}}'
            - --redirect-url={{ .Values.oauthProxy.urls.host }}
            - --login-url={{ .Values.oauthProxy.urls.loginURI }}
            - --redeem-url={{ .Values.oauthProxy.urls.redeemURI }}
            - --root-prefix={{ .Values.oauthProxy.urls.rootPrefix }}
            - --cookie-httponly
        {{- end }}
        - name: ray-website
          image: '{{ list . "core" | include "helpers.image.name" }}'
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: false
            - name: ca
              mountPath: /etc/nginx/cert/ca.crt
              subPath: ca.crt
      volumes:
        - name: nginx-config
          configMap:
            name: ray-nginx
            defaultMode: 0600
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: ca
          configMap:
            name: ca
            defaultMode: 0600
            items:
              - key: ca.crt
                path: ca.crt
