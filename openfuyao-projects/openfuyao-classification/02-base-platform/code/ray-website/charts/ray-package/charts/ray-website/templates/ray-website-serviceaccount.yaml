kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ray-webhook-auth
subjects:
  - kind: ServiceAccount
    name: ray-website
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: webhook-auth
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-website
  namespace: {{ .Release.Namespace }}
