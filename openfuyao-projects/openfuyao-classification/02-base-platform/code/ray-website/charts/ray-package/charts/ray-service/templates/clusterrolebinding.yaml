# ClusterRoleBinding
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rayservice-admission-role
subjects:
  - kind: ServiceAccount
    name: rayservice-admission
    namespace: {{ .Values.namespace.backend }}
roleRef:
  kind: ClusterRole
  name: rayservice-admission
  apiGroup: rbac.authorization.k8s.io