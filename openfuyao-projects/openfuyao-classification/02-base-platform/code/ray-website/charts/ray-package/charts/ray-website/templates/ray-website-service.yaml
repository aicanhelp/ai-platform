apiVersion: v1
kind: Service
metadata:
  name: ray-website
  namespace: {{ .Release.Namespace }}
  labels:
    app: ray-website
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      {{- if .Values.enableOAuth }}
      targetPort: proxy
      {{- else }}
      targetPort: http
      {{- end }}
      {{- if eq .Values.service.type  "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: ray-website
  sessionAffinity: None