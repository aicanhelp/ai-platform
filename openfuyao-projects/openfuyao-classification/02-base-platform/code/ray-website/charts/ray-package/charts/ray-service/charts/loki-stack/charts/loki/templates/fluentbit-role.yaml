# 1. 创建ClusterRole（限定访问特定ConfigMap）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: global-monitoring-config-reader
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["fluentbit-config"]     # 精确控制仅允许此ConfigMap
  verbs: ["get", "list"]
  namespace: monitoring                   # 指定目标命名空间
---
# 2. 创建ClusterRoleBinding（授权所有SA）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: allow-all-sa-access-monitoring-config
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: global-monitoring-config-reader
subjects:
- kind: Group
  name: system:serviceaccounts            # 授权集群内所有ServiceAccount
  apiGroup: rbac.authorization.k8s.io
