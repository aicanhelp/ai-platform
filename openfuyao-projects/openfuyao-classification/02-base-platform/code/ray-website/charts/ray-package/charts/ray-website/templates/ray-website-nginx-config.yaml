apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-nginx
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;


    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
    
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        server {
            listen 8080 default_server;
            root /usr/share/nginx/html/;
            index index.html index.htm;

            location / {
                try_files $uri /index.html;
            }

            location ~* ^/ray/.*\.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/ray.mjs break; 
            }

            location ~* \.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/ray.mjs break; 
            }
    
            location /rest/ray/rest/v1 {
                rewrite ^/rest/ray(.*)$ $1 break;
                proxy_pass {{ .Values.backend.ray }};
            }
    
            location ^~ /rest/ray/grafana {
                proxy_pass http://{{ .Release.Name }}-grafana.{{ .Release.Namespace }}.svc:80/rest/ray/grafana;
    
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
    
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
    
                if ($request_method = OPTIONS) {
                    return 204;
                }
            }
            location ^~ /rest/ray/prometheus {
                rewrite ^/rest/ray/prometheus(.*)$ $1 break;
                proxy_pass {{ .Values.backend.monitoring }};
            }
            location ^~ /rest/ray/loki {
                rewrite ^/rest/ray(.*)$ $1 break;
                proxy_pass {{ .Values.backend.loki }};
            }
        }
    }