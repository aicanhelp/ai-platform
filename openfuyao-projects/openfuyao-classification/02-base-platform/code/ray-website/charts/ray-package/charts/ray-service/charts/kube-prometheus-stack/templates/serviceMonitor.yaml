apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ray-head-monitor
  namespace: "{{ .Release.Namespace }}"
  labels:
    release: prometheus
spec:
  #jobLabel: ray-head
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      ray.io/node-type: head
  endpoints:
    - port: metrics
    - port: as-metrics
    - port: dash-metrics
  targetLabels:
    - ray.io/cluster
