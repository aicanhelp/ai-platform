# ClusterRole
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rayservice-admission
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs:  ["watch", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters/finalizers", "rayjobs/finalizers", "rayservices/finalizers"]
    verbs: ["update"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters/status", "rayjobs/status", "rayservices/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters", "rayservices"]
    verbs: ["get", "list", "create", "delete", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create", "delete", "patch", "update"] 