images:
  core:
    repository: cr.openfuyao.cn/openfuyao/ray-website
    pullPolicy: Always
  oauthProxy:
    repository: cr.openfuyao.cn/openfuyao/oauth-proxy
    pullPolicy: Always

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  nodePort: 30002
  containerPort: 8080

enableOAuth: true

oauthProxy:
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/ray"

backend:
  ray: "http://openfuyao-rayservice-svc.vcjob.svc:12345"
  monitoring: "http://prometheus-k8s.monitoring.svc:9090"
  loki: "http://ray-loki.ray.svc:3100"

openFuyao: true
