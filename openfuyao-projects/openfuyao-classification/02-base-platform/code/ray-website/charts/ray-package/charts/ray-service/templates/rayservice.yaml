# App
apiVersion: v1
kind: Pod
metadata:
  name: openfuyao-rayservice
  namespace: {{ .Values.namespace.backend }}
  labels:
    app.kubernetes.io/name: openfuyao-rayservice
spec:
  securityContext:
    runAsUser: 0 #65532
    runAsGroup: 0 #65532
    fsGroup: 0 #65532
  serviceAccountName: rayservice-admission
  containers:
  - name: openfuyao-rayservice
    image: '{{ list . "core" | include "helpers.image.name" }}'
    imagePullPolicy: {{ .Values.images.core.pullPolicy }}
    args: []
    ports:
      - containerPort: 12345
        name: http-web-svc
    volumeMounts:
      - name: varlog
        mountPath: /var/log/openfuyao-rayservice
  volumes:
    - name: varlog
      hostPath:
        path: /var/log/openfuyao-rayservice
        type: DirectoryOrCreate
        
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: openfuyao-rayservice-svc
  namespace: {{ .Values.namespace.backend }}
spec:
  selector:
    app.kubernetes.io/name: openfuyao-rayservice
  ports:
    - name: http
      protocol: TCP
      port: 12345
      targetPort: http-web-svc