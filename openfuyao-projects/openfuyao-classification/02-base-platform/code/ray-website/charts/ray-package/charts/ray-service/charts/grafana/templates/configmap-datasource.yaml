# templates/configmap-prometheus-datasource.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-prometheus-datasource
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  prometheus.yaml: |-  # 文件名必须为 .yaml 或 .yml
    apiVersion: 1
    datasources:
{{- if eq (include "prometheus.installed" .) "true" }}
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-k8s.monitoring.svc:9090
      isDefault: true
      jsonData:
        timeInterval: 30s
        httpMethod: POST
{{- else }}
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://{{ .Release.Name }}-prometheus-prometheus.monitoring.svc:9090
      isDefault: true
      jsonData:
        timeInterval: 30s
        httpMethod: POST
{{- end }}
    - name: Loki
      type: loki
      access: proxy
      url: http://ray-loki.monitoring.svc:3100
