ray-service:
  grafana:
    grafana.ini:
      server:
        domain: 192.168.100.198

    service:
      type: ClusterIP
      nodePort: 30005

    openFuyao: true

    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/ray-service
        pullPolicy: Always

ray-website:
  openFuyao: true
  enableOAuth: true

  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/ray-website
      pullPolicy: Always
    oauthProxy:
      repository: cr.openfuyao.cn/openfuyao/oauth-proxy
      pullPolicy: Always

  service:
    type: ClusterIP
    port: 8080
    nodePort: 30002

  backend:
    monitoring: "http://prometheus-k8s.monitoring.svc:9090"
    loki: "http://ray-loki.monitoring.svc:3100"