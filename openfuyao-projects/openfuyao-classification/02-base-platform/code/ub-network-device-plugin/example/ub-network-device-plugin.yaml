apiVersion: v1
kind: Namespace
metadata:
  name: ub-network-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ub-network-device-plugin
  namespace: ub-network-system
spec:
  selector:
    matchLabels:
      name: ub-network-device-plugin
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: ub-network-device-plugin
    spec:
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: "system-node-critical"
      containers:
        - image: cr.openfuyao.cn/openfuyao/ub-network-device-plugin:latest    # 替换镜像仓地址和版本为实际值
          imagePullPolicy: IfNotPresent
          name: ub-network-device-plugin
          env:
            - name: LD_LIBRARY_PATH
              value: "/lib:/lib64:/usr/lib64"
          command:
            - ub-network-device-plugin
          args:
            - --sync-interval=30s
            - --health-port=8088                             # 可选配置，默认8088；可根据实际环境端口规划替换，并同步替换探针配置中的 port 值
          securityContext:
            privileged: true
          volumeMounts:
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
            - name: runtime-sock                             # 以 containerd 为例，需根据实际情况替换为对应 CRI 地址；访问 CRI 获取 Sandbox 状态信息，组成网络命名空间，在设置网络命名空间时需要
              mountPath: /run/containerd/containerd.sock
            - name: so                                       # 访问 UBS Engine 所需要的 lib 库路径
              mountPath: /usr/lib64
            - name: ubse-sock-dir                            # 访问 UBS Engine 的 sock 文件所在目录
              mountPath: /run/ubse
            - name: urma-admin                               # 设置网络命名空间的二进制命令，可在制作镜像时安装，可以去除此目录挂载
              mountPath: /usr/bin/urma_admin
            - name: proc                                     # urma_admin 设置网络命名空间时需要访问此目录
              mountPath: /proc
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088                                  # 与启动参数中的 --health-port 值一致
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088                                  # 与启动参数中的 --health-port 值一致
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 50Mi
      volumes:
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: so
          hostPath:
            path: /usr/lib64
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: runtime-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: ubse-sock-dir
          hostPath:
            path: /run/ubse
            type: Directory
        - name: urma-admin
          hostPath:
            path: /usr/bin/urma_admin
            type: File
