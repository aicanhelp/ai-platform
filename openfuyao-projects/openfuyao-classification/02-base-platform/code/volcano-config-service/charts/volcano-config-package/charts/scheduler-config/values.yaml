images:
  core:
    repository: cr.openfuyao.cn/openfuyao/volcano-config-service
    pullPolicy: Always
  webhook:
    repository: cr.openfuyao.cn/openfuyao/numa-affinity-webhook
    pullPolicy: Always
  kubectl:
    repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
    pullPolicy: IfNotPresent
thirdPartyImages:
  alpine:
    repository: "hub.oepkgs.net/openfuyao/alpine/openssl"
    tag: "3.5.0"
    pullPolicy: IfNotPresent
web:
  listenAddress: 9202
  webhookAddress: 443

apiDisabled: false

namespace:
  backend: volcano-system
  adj: tcs

daemonset:
  metricsPort: 9180
  healthProbePort: 9181
