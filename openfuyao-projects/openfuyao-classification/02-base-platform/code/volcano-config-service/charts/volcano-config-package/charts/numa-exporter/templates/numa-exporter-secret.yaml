{{- if .Values.config.httpServerConfig.enableHttps }}
apiVersion: v1
kind: Secret
metadata:
  name: numa-exporter-secret
  namespace: {{ .Values.namespace.backend }}
type: kubernetes.io/tls
data:
  tls.crt: |
    {{ .Values.config.httpServerConfig.tlsCert | b64enc }}
  tls.key: |
    {{ .Values.config.httpServerConfig.tlsKey | b64enc }}
{{- end }}