apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeconfigs.volcano.sh
spec:
  group: volcano.sh
  names:
    kind: NodeConfig
    listKind: NodeConfigList
    plural: nodeconfigs
    singular: nodeconfig
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - nodes
              properties:
                nodes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - nodeName
                      - enableStaticCPUManager
                      - enableNUMADistance
                    properties:
                      nodeName:
                        type: string
                        minLength: 1
                      enableStaticCPUManager:
                        type: boolean
                      enableNUMADistance:
                        type: boolean
                      kubeletConfigPath:
                        type: string
                        pattern: '^/'
            status:
              type: object
              properties:
                nodeStatuses:
                  type: array
                  items:
                    type: object
                    required:
                      - nodeName
                      - staticCPUManagerEnabled
                      - numaDistanceEnabled
                      - state
                      - lastUpdateTime
                    properties:
                      nodeName:
                        type: string
                      staticCPUManagerEnabled:
                        type: boolean
                      numaDistanceEnabled:
                        type: boolean
                      state:
                        type: string
                        enum:
                          - Pending
                          - Configuring
                          - Configured
                          - Failed
                      error:
                        type: string
                      lastUpdateTime:
                        type: string
                        format: date-time
                lastUpdateTime:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.nodeStatuses[0].state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}