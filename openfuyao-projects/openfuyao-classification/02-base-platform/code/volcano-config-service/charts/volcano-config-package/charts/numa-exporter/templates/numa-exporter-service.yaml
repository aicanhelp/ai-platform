apiVersion: v1
kind: Service
metadata:
  name: numa-exporter
  namespace: {{ .Values.namespace.backend }}
  labels:
    app: numa-exporter
spec:
  ports:
    - name: https
      {{- if .Values.config.httpServerConfig.enableHttps }}
      port: 443
      {{- else }}
      port: 80
      {{- end }}
      targetPort: {{ include "extractPort" . }}
  selector:
    app: numa-exporter