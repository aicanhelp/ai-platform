    pullPolicy: Always
  vcWebhookManager:
    repository: hub.oepkgs.net/openfuyao/volcanosh/vc-webhook-manager
    tag: v1.9.0
    pullPolicy: Always
  vcControllerManager:
    repository: hub.oepkgs.net/openfuyao/volcanosh/vc-controller-manager
    tag: v1.9.0
    pullPolicy: Always
  vcScheduler:
    repository: cr.openfuyao.cn/openfuyao/vc-scheduler
    tag: latest
    pullPolicy: Always
namespace:
  backend: volcano-system
