components:
  enabled: true
  volcano:
    enabled: true
    admission:
      enabled: true
    controllers:
      enabled: true
    scheduler:
      enabled: true
    crds:
      enabled: true
    webhooks:
      enabled: true
  resourceExporter:
    enabled: true
images:
  resourceExporter:
