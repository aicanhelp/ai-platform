apiVersion: v1
kind: ServiceAccount
metadata:
  name: numa-affinity-webhook-sa
  namespace: {{ .Values.namespace.backend }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: numa-affinity-webhook-cr
  namespace: {{ .Values.namespace.backend }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [ "" ]
    resources: [ "endpoints" ]
    verbs: [ "list", "get" ]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: numa-affinity-webhook-crb
  namespace: {{ .Values.namespace.backend }}
subjects:
  - kind: ServiceAccount
    name: numa-affinity-webhook-sa
    namespace: {{ .Values.namespace.backend }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: numa-affinity-webhook-cr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: numa-affinity-webhook
  namespace: {{ .Values.namespace.backend }}
  labels:
    app: numa-affinity-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: numa-affinity-webhook
  template:
    metadata:
      labels:
        app: numa-affinity-webhook
    spec:
      serviceAccountName: numa-affinity-webhook-sa
      containers:
        - name: numa-affinity-webhook
          image: '{{ list . "webhook" | include "helpers.image.name" }}'
          imagePullPolicy: {{ .Values.images.webhook.pullPolicy }}
          args:
            - -tlsCertFile=/etc/webhook/certs/server.pem
            - -tlsKeyFile=/etc/webhook/certs/key.pem
            - -port=443
            - -alsologtostderr
            - -v=4
            - 2>&1
          ports:
            - containerPort: {{ .Values.web.webhookAddress }}
              name: webhook
              protocol: TCP
          volumeMounts:
            - name: numa-affinity-webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: numa-affinity-webhook-certs
          secret:
            secretName: numa-affinity-webhook-secret