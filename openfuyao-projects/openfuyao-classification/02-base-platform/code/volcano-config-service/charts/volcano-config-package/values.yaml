numa-exporter:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/volcano-config-service
      pullPolicy: Always
  serviceMonitor:
    enabled: true
volcano:
  components:
    enabled: true
    volcano:
      enabled: true
      admission:
        enabled: true
      controllers:
        enabled: true
      scheduler:
        enabled: true
      crds:
        enabled: true
      webhooks:
        enabled: true
    resourceExporter:
      enabled: true
  images:
    resourceExporter:
      repository: cr.openfuyao.cn/openfuyao/volcano/resource-exporter
      tag: 0.1.0
      pullPolicy: Always
    vcWebhookManager:
      repository: hub.oepkgs.net/openfuyao/volcanosh/vc-webhook-manager
      tag: v1.9.0
      pullPolicy: Always
    vcControllerManager:
      repository: hub.oepkgs.net/openfuyao/volcanosh/vc-controller-manager
      tag: v1.9.0
      pullPolicy: Always
    vcScheduler:
      repository: hub.oepkgs.net/openfuyao/volcanosh/vc-scheduler
      tag: v1.9.0
      pullPolicy: Always
scheduler-config:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/volcano-config-service
      pullPolicy: Always
    webhook:
      repository: cr.openfuyao.cn/openfuyao/numa-affinity-webhook
      pullPolicy: Always
    kubectl:
      repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
      pullPolicy: IfNotPresent
  thirdPartyImages:
    alpine:
      repository: "hub.oepkgs.net/openfuyao/alpine/openssl"
      tag: "3.5.0"
      pullPolicy: IfNotPresent
  apiDisabled: false
