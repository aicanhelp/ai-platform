apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-service-log-config
  namespace: openfuyao-system
data:
  log-config.yaml: |
    Level: info
    EncoderType: console
    Path: /var/log/monitoring-service
    FileName: monitoring-service.log
    MaxSize: 20
    MaxBackups: 5
    MaxAge: 30
    LocalTime: false
    Compress: true
    OutMod: both
