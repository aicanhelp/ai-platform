{{- if or .Values.config.httpServerConfig.enableHttps .Values.oauthProxy.enableTLS }}
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-service-tls
  namespace: openfuyao-system
type: kubernetes.io/tls
data:
  tls.crt: |
    {{ .Values.config.httpServerConfig.tlsCert | b64enc }}
  tls.key: |
    {{ .Values.config.httpServerConfig.tlsKey | b64enc }}
  ca.crt: |
    {{ .Values.config.httpServerConfig.rootCA | b64enc }}
{{- end }}