{{- if .Values.worker.enable }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name:  {{ include "node-feature-discovery.fullname" . }}-worker
  namespace: {{ include "node-feature-discovery.namespace" . }}
  labels:
    {{- include "node-feature-discovery.labels" . | nindent 4 }}
    role: worker
  {{- with .Values.worker.daemonsetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "node-feature-discovery.selectorLabels" . | nindent 6 }}
      role: worker
  template:
    metadata:
      labels:
        {{- include "node-feature-discovery.selectorLabels" . | nindent 8 }}
        role: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nfd-worker-conf.yaml") . | sha256sum }}
        {{- with .Values.worker.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      dnsPolicy: ClusterFirstWithHostNet
    {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
    {{- end }}
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "node-feature-discovery.worker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      hostNetwork: {{ .Values.worker.hostNetwork }}
      terminationGracePeriodSeconds: 5
      containers:
      - name: worker
        securityContext:
          {{- toYaml .Values.worker.securityContext | nindent 12 }}
        image: "{{ .Values.images.nfd.repository }}:{{ .Values.images.nfd.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.images.nfd.pullPolicy }}
        livenessProbe:
          grpc:
            port: {{ .Values.worker.healthPort | default "8082" }}
        {{- with .Values.worker.livenessProbe.initialDelaySeconds }}
          initialDelaySeconds: {{ . }}
        {{- end }}
        {{- with .Values.worker.livenessProbe.failureThreshold }}
          failureThreshold: {{ . }}
        {{- end }}
        {{- with .Values.worker.livenessProbe.periodSeconds }}
          periodSeconds: {{ . }}
        {{- end }}
        {{- with .Values.worker.livenessProbe.timeoutSeconds }}
          timeoutSeconds: {{ . }}
        {{- end }}
        readinessProbe:
          grpc:
            port: {{ .Values.worker.healthPort | default "8082" }}
        {{- with .Values.worker.readinessProbe.initialDelaySeconds }}
          initialDelaySeconds: {{ . }}
        {{- end }}
        {{- with .Values.worker.readinessProbe.failureThreshold }}
          failureThreshold: {{ . }}
        {{- end }}
        {{- with .Values.worker.readinessProbe.periodSeconds }}
          periodSeconds: {{ . }}
        {{- end }}
        {{- with .Values.worker.readinessProbe.timeoutSeconds }}
          timeoutSeconds: {{ . }}
        {{- end }}
        {{- with .Values.worker.readinessProbe.successThreshold }}
          successThreshold: {{ . }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      {{- with .Values.worker.extraEnvs }}
        {{- toYaml . | nindent 8 }}
      {{- end}}
        resources:
        {{- toYaml .Values.worker.resources | nindent 12 }}
        command:
        - "nfd-worker"
        args:
        # Go over featureGate and add the feature-gate flag
        {{- range $key, $value := .Values.featureGates }}
        - "-feature-gates={{ $key }}={{ $value }}"
        {{- end }}
        - "-metrics={{ .Values.worker.metricsPort | default "8081"}}"
        - "-grpc-health={{ .Values.worker.healthPort | default "8082" }}"
        {{- with .Values.worker.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
          - containerPort: {{ .Values.worker.metricsPort | default "8081"}}
            name: metrics
          - containerPort: {{ .Values.worker.healthPort | default "8082" }}
            name: health
        volumeMounts:
        - name: host-boot
          mountPath: "/host-boot"
          readOnly: true
        - name: host-os-release
          mountPath: "/host-etc/os-release"
          readOnly: true
        - name: host-sys
          mountPath: "/host-sys"
          readOnly: true
        - name: host-usr-lib
          mountPath: "/host-usr/lib"
          readOnly: true
        - name: host-lib
          mountPath: "/host-lib"
          readOnly: true
        - name: host-proc-swaps
          mountPath: "/host-proc/swaps"
          readOnly: true
        {{- if .Values.worker.mountUsrSrc }}
        - name: host-usr-src
          mountPath: "/host-usr/src"
          readOnly: true
        {{- end }}
        - name: features-d
          mountPath: "/etc/kubernetes/node-feature-discovery/features.d/"
          readOnly: true
        - name: nfd-worker-conf
          mountPath: "/etc/kubernetes/node-feature-discovery"
          readOnly: true
      {{- if .Values.worker.rubikDetector.enable }}
      # Rubik 特性检测容器
      - name: rubik-detector
        image: "{{ .Values.images.busyBox.repository }}:{{ .Values.images.busyBox.tag }}"
        imagePullPolicy: {{ .Values.images.busyBox.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "[INFO] Starting Rubik detector container..."
            
            # 定义检测函数
            detect_rubik_features() {
              FEATURE_FILE="/etc/kubernetes/node-feature-discovery/features.d/rubik-features"
              TEMP_FILE="${FEATURE_FILE}.tmp"
              LOCK_FILE="${FEATURE_FILE}.lock"
              
              # 获取文件锁
              exec 200>"$LOCK_FILE"
              if ! flock -n 200; then
                echo "[WARNING] Another detection process is running, skipping this run."
                return 0
              fi

              echo "[INFO] Starting rubik feature detection at $(date)"
              
              # 创建目录（如果不存在）
              mkdir -p "$(dirname "$FEATURE_FILE")"

              # 清理可能残留的临时文件
              rm -f "$TEMP_FILE" "$LOCK_FILE" 2>/dev/null
              
              # 清空临时文件
              > "$TEMP_FILE"
              
              echo "# Rubik feature detection results" >> "$TEMP_FILE"
              echo "# Generated at $(date)" >> "$TEMP_FILE"
              
              # 调试信息：显示 cgroup 版本和结构
              echo "[DEBUG] Checking cgroup version and structure..."
              if [ -d "/sys/fs/cgroup/unified" ]; then
                echo "[DEBUG] Detected cgroup v2"
                CGROUP_VERSION="v2"
              elif [ -d "/sys/fs/cgroup/cpu,cpuacct" ]; then
                echo "[DEBUG] Detected cgroup v1"
                CGROUP_VERSION="v1" 
              else
                echo "[DEBUG] Unknown cgroup version"
                CGROUP_VERSION="unknown"
              fi
              
              # 显示实际的目录结构用于调试
              echo "[DEBUG] /sys/fs/cgroup/ contents:"
              ls -la /sys/fs/cgroup/ 2>/dev/null || echo "Cannot list /sys/fs/cgroup/"
              
              # 检测 CPU 抢占功能
              echo "[INFO] Checking CPU preemption..."
              cpu_qos_found=false
              for path in "/sys/fs/cgroup/cpu/cpu.qos_level" \
                         "/sys/fs/cgroup/cpu.qos_level" \
                         "/sys/fs/cgroup/cpu/kubepods.slice/cpu.qos_level"; do
                if [ -f "$path" ]; then
                  echo "openfuyao.com/colocation.feature.cpupreemption=true" >> "$TEMP_FILE"
                  echo "[INFO] CPU preemption feature detected at: $path"
                  cpu_qos_found=true
                  break
                fi
              done
              
              if [ "$cpu_qos_found" = false ]; then
                echo "[INFO] CPU preemption feature not detected (cpu.qos_level not found)"
              fi
              
              # 检测内存抢占功能
              echo "[INFO] Checking memory preemption..."
              memory_qos_found=false
              for path in "/sys/fs/cgroup/memory/memory.qos_level" \
                         "/sys/fs/cgroup/memory.qos_level" \
                         "/sys/fs/cgroup/memory/kubepods.slice/memory.qos_level"; do
                if [ -f "$path" ]; then
                  echo "openfuyao.com/colocation.feature.memorypreemption=true" >> "$TEMP_FILE"
                  echo "[INFO] Memory preemption feature detected at: $path"
                  memory_qos_found=true
                  break
                fi
              done
              
              if [ "$memory_qos_found" = false ]; then
                echo "[INFO] Memory preemption feature not detected (memory.qos_level not found)"
              fi
              
              # 检测 CPU 弹性限流功能
              echo "[INFO] Checking quota turbo..."
              quota_base_paths="/sys/fs/cgroup/cpu,cpuacct/kubepods.slice /sys/fs/cgroup/cpu/kubepods.slice /sys/fs/cgroup/kubepods.slice"
              
              quota_found=false
              for base_path in $quota_base_paths; do
                if [ -d "$base_path" ]; then
                  echo "[DEBUG] Found quota turbo base path: $base_path"
                  files_exist=true
                  for file in "cpu.cfs_period_us" "cpu.cfs_quota_us" "cpu.stat"; do
                    if [ ! -f "$base_path/$file" ]; then
                      files_exist=false
                      echo "[INFO] Missing file for quota turbo: $base_path/$file"
                      break
                    fi
                  done
                  
                  if [ "$files_exist" = true ]; then
                    echo "openfuyao.com/colocation.feature.quotaturbo=true" >> "$TEMP_FILE"
                    echo "[INFO] Quota turbo feature detected at: $base_path"
                    quota_found=true
                    break
                  fi
                fi
              done
              
              if [ "$quota_found" = false ]; then
                echo "[INFO] Quota turbo feature not detected"
              fi
              
              # 检测动态内存功能
              echo "[INFO] Checking dynamic memory..."
              memory_base_paths="/sys/fs/cgroup/memory/kubepods.slice /sys/fs/cgroup/kubepods.slice"
              
              dynmem_found=false
              for base_path in $memory_base_paths; do
                if [ -d "$base_path" ]; then
                  echo "[DEBUG] Found dynamic memory base path: $base_path"
                  files_exist=true
                  for file in "memory.high_async_ratio" "memory.high"; do
                    if [ ! -f "$base_path/$file" ]; then
                      files_exist=false
                      echo "[INFO] Missing file for dyn memory: $base_path/$file"
                      break
                    fi
                  done
                  
                  if [ "$files_exist" = true ]; then
                    echo "openfuyao.com/colocation.feature.dynmemory=true" >> "$TEMP_FILE"
                    echo "[INFO] Dynamic memory feature detected at: $base_path"
                    dynmem_found=true
                    break
                  fi
                fi
              done
              
              if [ "$dynmem_found" = false ]; then
                echo "[INFO] Dynamic memory feature not detected"
              fi
              
              # 检测 PSI 功能
              echo "[INFO] Checking PSI..."
              psi_found=false
              
              # 方式1：检查内核参数
              if grep -q "psi=1" /proc/cmdline 2>/dev/null; then
                echo "openfuyao.com/colocation.feature.psi=true" >> "$TEMP_FILE"
                echo "[INFO] PSI feature detected (kernel params)"
                psi_found=true
              fi
              
              # 方式2：检查 /proc/pressure （系统级PSI）
              if [ "$psi_found" = false ]; then
                if [ -f "/proc/pressure/cpu" ] && [ -f "/proc/pressure/memory" ]; then
                  echo "openfuyao.com/colocation.feature.psi=true" >> "$TEMP_FILE"
                  echo "[INFO] PSI feature detected (system-level /proc/pressure)"
                  psi_found=true
                fi
              fi
              
              if [ "$psi_found" = false ]; then
                echo "[INFO] PSI feature not detected"
              fi
              
              # 检测动态缓存功能
              echo "[INFO] Checking dynamic cache..."
              arch=$(uname -m)
              is_physical=false
              
              # 检测是否为物理机
              if [ -d "/sys/class/dmi/id" ] || [ -f "/proc/device-tree/model" ]; then
                is_physical=true
                echo "[DEBUG] Detected physical machine"
              else
                echo "[DEBUG] Not a physical machine (VM detected)"
              fi
              
              if [ "$is_physical" = true ]; then
                case "$arch" in
                  x86_64|i386|i686)
                    if grep -q "rdt=l3cat,mba" /proc/cmdline 2>/dev/null; then
                      echo "openfuyao.com/colocation.feature.dyncache=true" >> "$TEMP_FILE"
                      echo "[INFO] Dynamic cache feature detected (x86 with RDT)"
                    else
                      echo "[INFO] Dynamic cache feature not detected (x86 missing rdt=l3cat,mba kernel param)"
                    fi
                    ;;
                  aarch64|arm*)
                    if grep -q "mpam=acpi" /proc/cmdline 2>/dev/null; then
                      echo "openfuyao.com/colocation.feature.dyncache=true" >> "$TEMP_FILE"
                      echo "[INFO] Dynamic cache feature detected (ARM with MPAM)"
                    else
                      echo "[INFO] Dynamic cache feature not detected (ARM missing mpam=acpi kernel param)"
                    fi
                    ;;
                  *)
                    echo "[INFO] Dynamic cache feature not supported on architecture: $arch"
                    ;;
                esac
              else
                echo "[INFO] Dynamic cache feature not supported (not physical machine)"
              fi
              
              # 原子性地更新 feature 文件
              if [ -s "$TEMP_FILE" ]; then
                mv "$TEMP_FILE" "$FEATURE_FILE"
                echo "[INFO] Feature file updated: $FEATURE_FILE"
                echo "[INFO] Features detected:"
                grep -v "^#" "$FEATURE_FILE" | grep -v "^$" || echo "[INFO] No active features found"
              else
                echo "[INFO] No features detected, removing feature file if exists"
                rm -f "$FEATURE_FILE" "$TEMP_FILE"
              fi
              
              echo "[INFO] Rubik feature detection completed at $(date)"
            }
            
            # 执行检测循环
            echo "[INFO] Starting detection loop..."
            trap 'exit 0' TERM
            while true; do
              detect_rubik_features || echo "[WARNING] Detection failed, continuing..."
              echo "[INFO] Sleeping for {{ .Values.worker.rubikDetector.checkInterval | default "60" }} seconds..."
              sleep {{ .Values.worker.rubikDetector.checkInterval | default "60" }}
            done
        volumeMounts:
        - name: features-d
          mountPath: "/etc/kubernetes/node-feature-discovery/features.d/"
        - name: host-sys
          mountPath: "/sys"
          readOnly: true
        - name: host-proc
          mountPath: "/proc"
        resources:
          {{- toYaml .Values.worker.rubikDetector.resources | nindent 12 }}
      {{- end }}
      volumes:
        - name: host-boot
          hostPath:
            path: "/boot"
        - name: host-os-release
          hostPath:
            path: "/etc/os-release"
        - name: host-sys
          hostPath:
            path: "/sys"
        - name: host-usr-lib
          hostPath:
            path: "/usr/lib"
        - name: host-lib
          hostPath:
            path: "/lib"
        - name: host-proc-swaps
          hostPath:
            path: "/proc/swaps"
        - name: host-proc
          hostPath:
            path: "/proc"
        {{- if .Values.worker.mountUsrSrc }}
        - name: host-usr-src
          hostPath:
            path: "/usr/src"
        {{- end }}
        - name: features-d
          hostPath:
            path: "/etc/kubernetes/node-feature-discovery/features.d/"
            type: DirectoryOrCreate
        - name: nfd-worker-conf
          configMap:
            name: {{ include "node-feature-discovery.fullname" . }}-worker-conf
            items:
              - key: nfd-worker.conf
                path: nfd-worker.conf
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . | quote }}
    {{- end }}
{{- end }}
