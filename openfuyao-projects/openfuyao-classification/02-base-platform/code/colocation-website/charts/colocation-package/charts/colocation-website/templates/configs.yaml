apiVersion: v1
kind: ConfigMap
metadata:
  name: colocation-nginx
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    error_log  /dev/stderr notice;
    pid        /tmp/nginx.pid;


    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
      
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;
        access_log  /dev/stdout main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;
        upstream colocation-service {
            server colocation-service:8080;
        }

        server {
            listen 8080 default_server;
            root /usr/share/nginx/html/;
            index index.html index.htm;

            location / {
                try_files $uri /index.html;
            }

            location ~* ^/colocation/.*\.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/colocation.mjs break; 
            }

            location ~* \.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/colocation.mjs break; 
            }

            location /rest/colocation/ {
                proxy_ssl_verify off;
                proxy_ssl_trusted_certificate /etc/nginx/cert/ca.crt;
                proxy_pass https://colocation-service;
            }
        }
    }
