replicaCount: 1

images:
  core:
    repository: cr.openfuyao.cn/openfuyao/colocation-website
    pullPolicy: Always
    tag: "latest"
  oauthProxy:
    repository: cr.openfuyao.cn/openfuyao/oauth-proxy
    pullPolicy: Always
    tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace: openfuyao-colocation

service:
  type: ClusterIP 
  port: 8080
  nodePort: 30880
  containerPort: 8080

# specify backend only when the backend is available
backend: "https://colocation-service:8080"

# set the field to mount the plugin to openFuyao web portal
openFuyao: true 

enableOAuth: true

oauthProxy:
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/colocation"