---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: colocation-management-role
rules:
- apiGroups:
  - colocation.openfuyao.com
  resources:
  - containercheckpoints
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - colocation.openfuyao.com
  resources:
  - containercheckpoints/finalizers
  verbs:
  - update
- apiGroups:
  - colocation.openfuyao.com
  resources:
  - containercheckpoints/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - watch
  - list
  - delete
  - create
  - update
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/stats
  - nodes/metrics
  - nodes/proxy
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list

---
# colocation-manager-cert-cleanup role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: colocation-manager-cert-cleanup-role
rules:
- apiGroups:
    - "admissionregistration.k8s.io"
  resources:
    - mutatingwebhookconfigurations
  verbs:
    - get
    - list
    - delete
- apiGroups:
    - ""
  resources:
    - secrets
  verbs:
    - list
    - get
    - delete
- apiGroups:
    - ""
  resources:
    - namespaces
  verbs:
    - get
    - list
- apiGroups:
    - "rbac.authorization.k8s.io"
  resources:
    - roles
    - rolebindings
    - clusterroles
    - clusterrolebindings
  verbs:
    - list
    - get
    - delete