apiVersion: v1
kind: Service
metadata:
  annotations:
    service.openfuyao.com/serving-cert-secret-name: colocation-service-tls
  labels:
    app.kubernetes.io/name:  colocation-service
  name: colocation-service
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
spec:
  ports:
  - name: https
    port: 8080
    targetPort: https
  selector:
    app.kubernetes.io/name: colocation-service