apiVersion: v1
kind: Service
metadata:
  name: colocation-overquota-agent-service
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: colocation-overquota-agent
spec:
  ports:
    - port: {{ .Values.service.agent.port }}
      protocol: TCP
      targetPort: {{ .Values.service.agent.port }}
      name: {{ .Values.service.agent.name }}
  selector:
    app.kubernetes.io/name: colocation-overquota-agent
  type: ClusterIP