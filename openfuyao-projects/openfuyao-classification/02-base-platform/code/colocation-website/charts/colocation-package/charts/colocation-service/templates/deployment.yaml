apiVersion: apps/v1
kind: Deployment
metadata:
  name: colocation-service
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name:  colocation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name:  colocation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name:  colocation-service
    spec:
      serviceAccountName: colocation-service
      volumes:
      - name: colocation-service-tls
        secret:
          secretName: colocation-service-tls
      containers:
      - command: ["./colocation-service"]
        args: ["-v=4","--tls-cert-file=/etc/tls/colocation/tls.crt","--tls-private-key-file=/etc/tls/colocation/tls.key"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROMETHEUS_SERVICE
          value: {{ .Values.serverHost.prometheus }}
        - name: ENABLE_RUBIK_HOT_RELOAD
          value: {{ .Values.colocationRubik.enableRubikHotReload | quote }}
        image: '{{ list . "core" | include "helpers.image.name" }}'
        imagePullPolicy: {{ .Values.images.core.pullPolicy }}
        name: colocation-service
        ports:
        - containerPort: 8080
          name: https
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/tls/colocation
          name: colocation-service-tls
          readOnly: true