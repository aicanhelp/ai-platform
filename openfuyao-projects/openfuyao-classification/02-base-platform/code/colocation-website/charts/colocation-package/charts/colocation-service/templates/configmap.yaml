apiVersion: v1
kind: ConfigMap
metadata:
  name: colocation-config
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
data:
  # colocation-options: 混部节点开关
  # nodeConfigs: 会指定打开该开关的哪些节点
  colocation-options: |
    {
      "enable": false,
      "nodesConfig": []
    }
  # rubik-options: rubik混部引擎相关的参数配置
  # - cpuEvict: cpu 驱逐水位线控制
  # - - threshold：窗口期间平均CPU利用率的阈值，超过阈值将驱逐离线pod
  # - memoryEvict: memory 驱逐水位线控制
  # - - threshold：窗口期间内存利用率的阈值，超过阈值将驱逐离线pod
  rubik-options: |
    {
      "eviction": {
        "enable": false
      },
      "quotaTurbo": {
        "enable": false
      },
      "dynMemory": {
        "enable": false
      },
      "dynCache": {
        "enable": false
      },
      "psi": {
        "enable": false
      }
    }
  volcano-scheduler-options: |
    {
      "usagePlugin": {
        "enable": false
      }
    }
  numa-affinity-options: |
    {
      "enable": false
    }
