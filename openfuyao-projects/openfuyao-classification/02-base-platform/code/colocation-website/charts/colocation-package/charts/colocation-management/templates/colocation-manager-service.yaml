apiVersion: v1
kind: Service
metadata:
  name: colocation-manager
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
spec:
  ports:
    - port: {{ .Values.service.manager.port }}
      name: manager
      protocol: TCP
      targetPort: {{ .Values.service.manager.port }}
    - port: 443
      protocol: TCP
      name: webhook
      targetPort: 443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: colocation-manager
  publishNotReadyAddresses: true
  type: ClusterIP
