apiVersion: apps/v1
kind: Deployment
metadata:
  name: colocation-manager
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/name: colocation-management
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: colocation-manager
  replicas: {{ .Values.management.manager.replicaCount }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: colocation-manager
    spec:
      serviceAccountName: {{ include "colocation-management.serviceAccountName" . }}
      containers:
      - command:
        - /colocation-management/colocation-manager
        args:
          - --namespace={{ .Values.namespace | default .Release.Namespace }}
          - '--health-probe-addr=:{{ .Values.management.manager.livenessProbe.httpGet.port }}'
          - '--pprof-addr=:{{ .Values.management.manager.config.pprof.port }}'
          - '--usage-report-addr=:{{ .Values.service.manager.port }}'
          - --v={{ .Values.management.manager.config.logLevel }}
          - --refresh-nodes-interval=15s
          - --refresh-pods-interval=15s
          - --save-checkpoint-period=10s
          - --checkpoint-gc-interval=60s
          - --aggregate-state-gc-interval=60s
          - --webhookTlsCertFile=/etc/webhook/certs/server.pem
          - --webhookTlsKeyFile=/etc/webhook/certs/key.pem
          - --webhookSvcNamespace=$(SVC_NAMESPACE)
        image: "{{ .Values.images.manager.repository }}:{{ .Values.images.manager.tag }}"
        imagePullPolicy: {{ .Values.images.manager.pullPolicy }}
        name: colocation-manager
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
            add:
            - NET_BIND_SERVICE
        volumeMounts:
          - name: colocation-manager-cert-secret
            mountPath: /etc/webhook/certs
            readOnly: true
        env:
          - name: SVC_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        livenessProbe:
          {{- toYaml .Values.management.manager.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.management.manager.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.management.manager.resources | nindent 10 }}
        ports:
        - containerPort: {{ .Values.management.manager.livenessProbe.httpGet.port }}
          name: health-check
          protocol: TCP
        - containerPort: {{ .Values.management.manager.config.pprof.port }}
          name: pprof
          protocol: TCP
        - containerPort: {{ .Values.service.manager.port }}
          name: usage-report
          protocol: TCP
        - containerPort: 443
          name: webhook
          protocol: TCP
      terminationGracePeriodSeconds: 10
      volumes:
        - name: colocation-manager-cert-secret
          secret:
            secretName: colocation-manager-cert-secret
---
