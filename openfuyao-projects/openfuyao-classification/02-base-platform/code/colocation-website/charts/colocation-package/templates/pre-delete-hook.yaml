apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-pre-uninstall
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
spec:
  template:
    metadata:
      name: pre-delete-job
    spec:
      serviceAccountName: pre-delete-sa
      containers:
        - name: pre-delete
          image: {{ .Values.images.kubectl.repository }}:{{ .Values.images.kubectl.tag }}
          imagePullPolicy: {{ .Values.images.kubectl.pullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              kubectl delete cm -n {{ .Values.namespace }} colocation-config

              echo "Cleanup completed successfully!"

              echo "Sleeping for 5s before exiting..."
              sleep 5
              echo "Job exiting now."

      restartPolicy: Never
  backoffLimit: 0
