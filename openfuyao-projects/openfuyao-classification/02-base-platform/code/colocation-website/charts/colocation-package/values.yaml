# Default values for colocation-package.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: openfuyao-colocation
images:
  kubectl:
    repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
    tag: latest
    pullPolicy: IfNotPresent

colocation-agent:
  namespace: openfuyao-colocation
  images:
    rubik:
      repository: cr.openfuyao.cn/openfuyao/rubik
      tag: 2.0.1-r1
      pullPolicy: IfNotPresent
  thirdPartyImages:
    busyBox:
      repository: "hub.oepkgs.net/openfuyao/busybox"
      tag: "1.36.1"
      pullPolicy: IfNotPresent

colocation-service:
  namespace: openfuyao-colocation
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/colocation-service
      tag: latest
      pullPolicy: Always
    kubectl:
      repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
      tag: latest
      pullPolicy: IfNotPresent
  thirdPartyImages:
    alpine:
      repository: "hub.oepkgs.net/openfuyao/alpine/openssl"
      tag: "3.5.0"
      pullPolicy: IfNotPresent

  serverHost:
    prometheus: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  colocationRubik:
    enableRubikHotReload: true

colocation-website:
  namespace: openfuyao-colocation
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/colocation-website
      pullPolicy: Always
      tag: "latest"
    oauthProxy:
      repository: "cr.openfuyao.cn/openfuyao/oauth-proxy"
      pullPolicy: Always
      tag: "latest"
  
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  service:
    type: ClusterIP
    port: 8080
    nodePort: 30880
  
  # specify backend only when the backend is available
  backend: "https://colocation-service:8080"

  # set the field to mount the plugin to openFuyao web portal
  openFuyao: true
  enableOAuth: true

colocation-management:
  serviceAccount:
    name: "colocation-management-account"
  service:
    manager:
     type: ClusterIP
     port: 8091
    agent:
      name: metrics
      type: ClusterIP
      port: 8900
  images:
    manager:
      repository: cr.openfuyao.cn/openfuyao/colocation-manager
      tag: latest
      pullPolicy: Always
    agent:
      repository: cr.openfuyao.cn/openfuyao/colocation-overquota-agent
      tag: latest
      pullPolicy: Always
    kubectl:
      repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
      tag: latest
      pullPolicy: IfNotPresent
  thirdPartyImages:
    alpine:
      repository: "hub.oepkgs.net/openfuyao/alpine/openssl"
      tag: "3.5.0"
      pullPolicy: IfNotPresent
  management:
    manager:
      config:
        pprof:
          port: 8090
        logLevel: 3
      replicaCount: 1
      imagePullSecrets: [ ]
      nameOverride: "colocation-manager"
      fullnameOverride: ""
      serviceAccount:
        create:
          name: ""
      podAnnotations: { }
      podLabels: { }
      podSecurityContext: { }
      securityContext: { }
      resources: { }
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 15
        periodSeconds: 20
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8081
        initialDelaySeconds: 5
        periodSeconds: 10
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 100
        targetCPUUtilizationPercentage: 80
      volumes: [ ]
      volumeMounts: [ ]
      nodeSelector: { }
      tolerations: [ ]
      affinity: { }
    agent:
      config:
        pprof:
          port: 8090
        logLevel: 4
        cgroupRoot: "/sys/fs/cgroup"
        cgroupDriver: "systemd"
        numaAffinityEnabled: "false"
      nameOverride: "colocation-overquota-agent"
    namespace: openfuyao-colocation
     

node-feature-discovery:
  namespaceOverride: "openfuyao-colocation"
  images:
    nfd:
      repository: hub.oepkgs.net/openfuyao/nfd/node-feature-discovery
      tag: v0.17.3
      pullPolicy: IfNotPresent
    busyBox:
      repository: hub.oepkgs.net/openfuyao/busybox
      tag: "1.35"
      pullPolicy: IfNotPresent

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
