apiVersion: v1
kind: ConfigMap
metadata:
  name: plugin-management-service-logcfg
  namespace: openfuyao-system
data:
  plugin-management-service.yaml: |
    Level: info
    EncoderType: console
    Path: /var/log/plugin-management-service
    FileName: root.log
    MaxSize: 20
    MaxBackups: 5
    MaxAge: 30
    LocalTime: false
    Compress: true
    OutMod: both
    seclog:
      sec_log_path: /var/log/seclog/plugin-management-service/operation.log
      sec_log_max_size_mb: 50
      sec_log_max_backups: 15
      sec_log_max_age_days: 14
