{{- $provider := (index .Values "provider") | default (dict) -}}
{{- $provIstio := (index $provider "istio") | default (dict) -}}
{{- if (eq ((index $provider "name") | default "none") "istio") }}
{{- /* Prefer provider.istio while keeping compatibility with legacy .Values.istio. */ -}}
{{- $legacyIstio := .Values.istio | default (dict) -}}
{{- $istio := coalesce $provIstio $legacyIstio (dict) -}}
{{- $dr := (index $istio "destinationRule") | default (dict) -}}
{{- $serviceName := include "gateway-api-inference-extension.name" . -}}
{{- $defaultHost := printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace -}}
{{- $host := (index $istio "host") | default $defaultHost -}}
{{- /* DestinationRule apiVersion: defaults to v1 (Istio 1.22+ GA). Override to "networking.istio.io/v1beta1" for older clusters. */ -}}
{{- $drApiVersion := (index $istio "apiVersion") | default "networking.istio.io/v1" -}}

apiVersion: {{ $drApiVersion }}
kind: DestinationRule
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-api-inference-extension.labels" . | nindent 4 }}
spec:
  host: {{ $host }}
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
    {{- with (index (index $dr "trafficPolicy") "connectionPool") }}
    connectionPool:
      {{- . | toYaml | nindent 6 }}
    {{- end }}

{{- $retryIstio := (index $istio "retryConfig") | default dict }}
{{- $retryEnabled := (index $retryIstio "enabled") | default false }}
{{- $retryOn := (index $retryIstio "retryOn") | default "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,5xx,reset" }}
{{- $numRetries := (index $retryIstio "numRetries") | default 3 }}
{{- if $retryEnabled }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: inference-gateway-retry-policy
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.httpRoute.inferenceGatewayName }}

  configPatches:
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          name: http.80
          portNumber: 80
          vhost:
            name: "*:80"
            route:
              action: ROUTE
              {{- /* Istio route names follow <namespace>.<httproute.metadata.name>.<ruleIndex>. */}}
              name: {{ printf "%s.%s-httproute.0" .Release.Namespace (include "gateway-api-inference-extension.inferencepool.name" .) | quote }}
      patch:
        operation: MERGE
        value:
          route:
            retry_policy:
              retry_on: {{ $retryOn | quote }}
              num_retries: {{ $numRetries }}
{{- end }}
{{- end }}
