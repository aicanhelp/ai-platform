[project]
name = "hermes-router-prediction-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "grpcio-health-checking>=1.80.0",
    "protobuf>=6.33.6",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.0",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
prediction-sidecar = "app:main"
prediction-train = "training.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "schema"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["domain*", "proto*", "runtime*", "training*", "transport*"]
