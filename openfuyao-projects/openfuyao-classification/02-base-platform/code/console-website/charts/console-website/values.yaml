# Default values for console-website.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  core:
    repository: cr.openfuyao.cn/openfuyao/console-website
    pullPolicy: Always
    tag: latest
# resources: {}
resources:
  requests: 
    cpu: 50m
    memory: 50Mi
  limits:
    cpu: 500m
    memory: 100Mi

config:
  enableTLS: false
  # listen on [::]:8080 in addition to 8080 so the website is reachable over
  # IPv6 (dual-stack or IPv6-only clusters). Requires IPv6 enabled in the
  # container network namespace; keep false on IPv6-disabled nodes.
  enableIPv6Listen: false
  tlsCert: |
    -----BEGIN CERTIFICATE-----
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    -----END CERTIFICATE-----
  tlsKey: |
    -----BEGIN PRIVATE KEY-----
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    -----END PRIVATE KEY-----
  rootCA: |
    -----BEGIN CERTIFICATE-----
    XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
    -----END CERTIFICATE-----
