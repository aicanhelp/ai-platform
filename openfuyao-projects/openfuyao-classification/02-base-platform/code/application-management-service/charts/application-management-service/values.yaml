# Default values for application-management-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  core:
    repository: cr.openfuyao.cn/openfuyao/application-management-service
    tag: latest
    pullPolicy: IfNotPresent
  busyBox:
    repository: "hub.oepkgs.net/openfuyao/busybox"
    tag: "1.36.1"
  oauthProxy:
    repository: "cr.openfuyao.cn/openfuyao/oauth-proxy"
    pullPolicy: Always
    tag: "latest"

config:
  httpServerConfig:
    port: 9039
    enableHttps: false
    tlsCert: |
      -----BEGIN CERTIFICATE-----
      XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      -----END CERTIFICATE-----
    tlsKey: |
      -----BEGIN PRIVATE KEY-----
      XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      -----END PRIVATE KEY-----
    rootCA: |
      -----BEGIN CERTIFICATE-----
      XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      -----END CERTIFICATE-----

localHarbor:
  chartLimit: 200

serverHost:
  marketplaceService: "http://marketplace-service.openfuyao-system.svc.cluster.local:80"

helm:
  timeout: "10m"

enableOAuth: false

oauthProxy:
  enableTLS: false
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/"