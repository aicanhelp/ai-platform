apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-cluster-nginx
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;


    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        server {
            listen 8080 default_server;
            root /usr/share/nginx/html/;
            index index.html index.htm;

            location / {
                try_files $uri /index.html;
            }

            location ~* ^/multicluster/.*\.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/multicluster.mjs break;
            }

            location ~* \.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/multicluster.mjs break;
            }

            {{ if .Values.backend }}
            location /rest/multicluster {
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/nginx/cert/ca.crt;
                proxy_pass {{ .Values.backend }}:{{ .Values.service.backendPort }};
            }
            {{ end }}
        }
    }
{{- /* Auto-generate CA: reuse existing Secret on upgrade, generate on first install */ -}}
{{- $ns := .Values.namespace }}
{{- $secretName := "ca-tls" }}
{{- $existingSecret := lookup "v1" "Secret" $ns $secretName }}
{{- $caCert := "" }}
{{- if $existingSecret }}
  {{- $caCert = index $existingSecret.data "ca.crt" | b64dec }}
{{- else }}
  {{- $ca := genCA "multi-cluster-ca" 3650 }}
  {{- $caCert = $ca.Cert }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.crt: {{ $caCert | b64enc }}
