apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cleanup-hostpath
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  selector:
    matchLabels:
      app: cleanup-hostpath
  template:
    metadata:
      labels:
        app: cleanup-hostpath
    spec:
      initContainers:
        - name: cleanup-hostpath
          image: alpine:3.18.3
          securityContext:
            runAsUser: 0 #65532
            runAsGroup: 0 #65532
          command:
            - /bin/sh
            - -c
            - |
              TARGET_FILE="/var/log/openfuyao-rayservice/openfuyao-ray.db"
              TARGET_DIR="/var/log/openfuyao-rayservice"

              echo "==== Checking if the directory is mounted successfully ===="
              if [ -d "${TARGET_DIR}" ]; then
                echo "Directory exists: ${TARGET_DIR}"
                echo "Listing current files:"
                ls -l "${TARGET_DIR}"

                if [ -f "${TARGET_FILE}" ]; then
                  echo "Target file found: ${TARGET_FILE}"
                  echo "Attempting to delete the file..."
                  rm -f "${TARGET_FILE}" && echo "File deleted successfully." || echo "Failed to delete the file."
                else
                  echo "Target file does not exist: ${TARGET_FILE}"
                fi
              else
                echo "Directory does not exist: ${TARGET_DIR}"
              fi

              echo "Task completed. Exiting successfully."
              exit 0
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      containers:
        - image: alpine:3.18.3
          name: sleep
          command:
            - /bin/sh
            - -c
            - while true; do sleep 3600; done
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory