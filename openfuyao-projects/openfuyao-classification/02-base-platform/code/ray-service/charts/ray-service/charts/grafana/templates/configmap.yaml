{{- if .Values.createConfigmap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}
  namespace: {{ include "grafana.namespace" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- if or .Values.configMapAnnotations .Values.annotations }}
  annotations:
    {{- with .Values.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.configMapAnnotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
data:
  grafana.ini: |
    {{- include "grafana.configData" . | nindent 2 }}
    [server]
      domain = {{ index .Values "grafana.ini" "server" "domain" }}
      {{- if .Values.openFuyao }}
      root_url = "https://{{ index .Values "grafana.ini" "server" "domain" }}/rest/ray/grafana/"
      {{- else }}
      root_url = "https://{{ index .Values "grafana.ini" "server" "domain" }}:{{ .Values.service.nodePort }}/rest/ray/grafana/"      
      {{- end }}      
      serve_from_sub_path = true
    [security]
      allow_embedding = true
    [http]
      allow_cors = true
{{- end }}
