images:
  core:
    repository: cr.openfuyao.cn/openfuyao/monitoring-dashboard-service
    tag: latest
    pullPolicy: Always

thirdPartyImages:
  busyBox:
    repository: hub.oepkgs.net/openfuyao/busybox
    tag: 1.36.1


resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 200m
    memory: 300Mi

serverHost:
  oauthServer: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
