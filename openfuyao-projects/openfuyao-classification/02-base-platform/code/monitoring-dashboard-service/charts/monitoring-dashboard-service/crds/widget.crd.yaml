apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.monitoring-dashboard.openfuyao.com
spec:
  group: monitoring-dashboard.openfuyao.com
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                widgetID:
                  type: string
                dashboardID:
                  type: string
                displayName:
                  type: string
                dataSource:
                  type: string
                widgetType:
                  type: integer
                instances:
                  type: array
                  items: 
                    type: string
                boardMin:
                  type: integer
                boardMax:
                  type: integer
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames:
      - wg