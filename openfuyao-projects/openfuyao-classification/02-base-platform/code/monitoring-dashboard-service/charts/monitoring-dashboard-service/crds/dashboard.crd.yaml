apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboards.monitoring-dashboard.openfuyao.com
spec:
  group: monitoring-dashboard.openfuyao.com
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                dashboardID:
                  type: string
                displayName:
                  type: string
                creator:
                  type: string
                totalWidgets:
                  type: integer
                lastUpdateTime:
                  type: string
  scope: Namespaced
  names:
    plural: dashboards
    singular: monitor
    kind: Dashboard
    shortNames:
      - db