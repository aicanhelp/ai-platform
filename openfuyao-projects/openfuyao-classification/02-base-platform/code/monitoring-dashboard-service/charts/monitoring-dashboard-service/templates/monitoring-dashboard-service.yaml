apiVersion: v1
kind: Service
metadata:
  name: monitoring-dashboard-service-service
  namespace: monitoring-dashboard
  labels:
    app: monitoring-dashboard-service
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
spec:
  type: ClusterIP
  ports:
    - name: transport
      port: 80
      protocol: TCP
      targetPort: 9297
  publishNotReadyAddresses: true
  selector:
    app: monitoring-dashboard-service
  sessionAffinity: None

