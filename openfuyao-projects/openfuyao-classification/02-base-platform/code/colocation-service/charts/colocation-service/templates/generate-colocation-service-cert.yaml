apiVersion: batch/v1
kind: Job
metadata:
  name: generate-colocation-service-cert
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: colocation-service-cert-generator
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: generator
          image: {{ .Values.thirdPartyImages.alpine.repository }}:{{ .Values.thirdPartyImages.alpine.tag }}
          imagePullPolicy: {{ .Values.thirdPartyImages.alpine.pullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              echo "Creating Secret and ConfigMap..."
              mkdir -p /work

              # 1. 生成 CA
              openssl genrsa -out /work/ca.key 4096
              openssl req -x509 -new -nodes -key /work/ca.key -sha256 -days 3650 -out /work/ca.crt \
                -subj "/C=cn/ST=beijing/L=beijing/O=huawei/OU=spark/CN=colocation"

              # 2. 生成服务端私钥和CSR
              openssl req -new -nodes \
                -subj "/C=cn/ST=beijing/L=beijing/O=huawei/OU=spark/CN=colocation-service" \
                -keyout /work/tls.key -out /work/server.csr

              # 3. 使用 CA 签署服务端证书
              openssl x509 -req -in /work/server.csr -CA /work/ca.crt -CAkey /work/ca.key -CAcreateserial \
                -out /work/tls.crt -days 1095 -sha256

              # 4. 生成 Secret YAML
              cat <<EOF > /work/secret.yaml
              apiVersion: v1
              kind: Secret
              metadata:
                name: colocation-service-tls
                namespace: $NAMESPACE
                labels:
                  app.kubernetes.io/managed-by: Helm
                annotations:
                  meta.helm.sh/release-name: {{ .Release.Name }}
                  meta.helm.sh/release-namespace: {{ .Release.Namespace }}
              type: kubernetes.io/tls
              data:
                tls.crt: $(base64 -w 0 /work/tls.crt)
                tls.key: $(base64 -w 0 /work/tls.key)
              EOF

              # 5. 生成 ConfigMap YAML
              cat <<EOF > /work/configmap.yaml
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ca
                namespace: $NAMESPACE
                labels:
                  app.kubernetes.io/managed-by: Helm
                annotations:
                  meta.helm.sh/release-name: {{ .Release.Name }}
                  meta.helm.sh/release-namespace: {{ .Release.Namespace }}
              data:
                ca.crt: |
              $(sed 's/^/    /' /work/ca.crt)
              EOF

          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: kubectl-apply
          image: {{ .Values.images.kubectl.repository }}:{{ .Values.images.kubectl.tag }}
          imagePullPolicy: {{ .Values.images.kubectl.pullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Applying Secret and ConfigMap..."
              kubectl apply -f /work/secret.yaml
              kubectl apply -f /work/configmap.yaml
          volumeMounts:
            - name: work
              mountPath: /work
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: colocation-service-cert-role
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "update", "get", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: colocation-service-cert-rolebinding
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation
subjects:
  - kind: ServiceAccount
    name: colocation-service-cert-generator
    {{- if .Values.namespace }}
    namespace: {{ .Values.namespace }}
    {{- else }}
    namespace: {{ .Release.Namespace }}
    {{- end }}
roleRef:
  kind: Role
  name: colocation-service-cert-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: colocation-service-cert-generator
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed,before-hook-creation