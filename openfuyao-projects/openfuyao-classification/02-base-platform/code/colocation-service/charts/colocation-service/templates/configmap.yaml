apiVersion: v1
kind: ConfigMap
metadata:
  name: colocation-config
  namespace: openfuyao-colocation
data:
  # colocation-options: 混部节点开关
  # nodeConfigs: 会指定打开该开关的哪些节点
  colocation-options: |
    {
      "enable": false,
      "nodesConfig": []
    }
  # oversubscription-options: 超卖节点开关
  # nodeConfigs: 会指定打开该开关的哪些节点
  oversubscription-options: |
    {
      "enable": false,
      "nodesConfig": []
    }
  # rubik-options: rubik混部引擎相关的参数配置
  # - cpuevict: cpu 驱逐水位线控制
  # - - threshold：窗口期间平均CPU利用率的阈值，超过阈值将驱逐离线pod
  # - - interval: 节点CPU利用率采集间隔(s)
  # - - windows: 节点CPU利用率采集窗口(s)
  # - - cooldown: 冷却时间，两次驱逐之间需要间隔冷却时间
  # - memoryevict: memory 驱逐水位线控制
  # - - threshold：窗口期间内存利用率的阈值，超过阈值将驱逐离线pod
  # - - interval: 节点内存利用率采集间隔(s)
  # - - cooldown: 冷却时间，两次驱逐之间需要间隔冷却时间
  rubik-options: |
    {
      "eviction": {
        "enable": true,
        "cpuevict": {
          "threshold": 60
        },
        "memoryevict": {
          "threshold": 80
        }
      },
      "quotaTurbo": {
        "enable": false,
        "highWaterMark": 60,
        "alarmWaterMark": 80
      },
      "dynMemory": {
        "enable": false
      },
      "dynCache": {
        "enable": false,
        "l3Percent": {
          "low": 20,
          "mid": 30,
          "high": 50
        },
        "memBandPercent": {
          "low": 10,
          "mid": 30,
          "high": 50
        }
      },
      "psi": {
        "enable": false,
        "resource": ["cpu", "memory"],
        "avg10Threshold": 5.0
      }
    }
  # volcano-scheduler-options: Volcano调度器配置
  volcano-scheduler-options: |
    {
      "usagePlugin": {
        "enable": false,
        "usageThreshold": {
          "enable": false,
          "cpu": 80,
          "memory": 80
        }
      }
    }