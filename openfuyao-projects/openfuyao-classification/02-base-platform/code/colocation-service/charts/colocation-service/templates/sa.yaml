kind: ServiceAccount
apiVersion: v1
metadata:
  name: colocation-service
  namespace: openfuyao-colocation
  labels:
    app.kubernetes.io/name: colocation-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  namespace: openfuyao-colocation
  name: colocation-service
rules:
- apiGroups: [""]
  resources: ["pods","nodes"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments","statefulsets","daemonsets"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs","cronjobs"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "watch"]
- apiGroups: ["colocation.openfuyao.com"]
  resources: ["colocationworkloadmatchrules"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: colocation-service
  namespace: openfuyao-colocation
subjects:
- kind: ServiceAccount
  name: colocation-service
  namespace: openfuyao-colocation
roleRef:
  kind: ClusterRole
  name: colocation-service
  apiGroup: rbac.authorization.k8s.io
---