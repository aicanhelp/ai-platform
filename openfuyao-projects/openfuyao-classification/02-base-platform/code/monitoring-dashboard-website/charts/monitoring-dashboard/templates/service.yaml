apiVersion: v1
kind: Service
metadata:
  name: monitoring-dashboard-website-service
  namespace: monitoring-dashboard
  labels:
    app: monitoring-dashboard-website
spec:
  {{- if .Values.openFuyao}}
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      name: transport
      protocol: TCP
      {{- if .Values.enableOAuth }}
      targetPort: proxy
      {{- else }}
      targetPort: {{ .Values.service.containerPort }}
      {{- end }}
  {{- else}}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      name: transport
      protocol: TCP
      {{- if .Values.enableOAuth }}
      targetPort: proxy
      {{- else }}
      targetPort: {{ .Values.service.containerPort }}
      {{- end }}
      {{- if eq .Values.service.type  "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  {{- end}}
  publishNotReadyAddresses: true
  selector:
    app: monitoring-dashboard-website
  sessionAffinity: None