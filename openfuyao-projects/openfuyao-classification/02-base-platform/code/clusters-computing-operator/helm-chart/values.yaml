image:
  repository: controller
  tag: latest

replicaCount: 1

service:
  type: ClusterIP

# 可根据需要添加其他配置参数
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

global:
  labels:
    app.kubernetes.io/managed-by: helm

clusterSize: 1
minClusterSize: 1
numManagementNodes: 1
