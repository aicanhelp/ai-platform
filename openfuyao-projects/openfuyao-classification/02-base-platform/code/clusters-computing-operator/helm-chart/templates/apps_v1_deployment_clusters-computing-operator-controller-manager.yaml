apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- toYaml .Values.global.labels | nindent 4}}
    app.kubernetes.io/name: clusters-computing-operator
    control-plane: controller-manager
  name: clusters-computing-operator-controller-manager
  namespace: clusters-computing-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
        - args:
            - --metrics-bind-address=:8443
            - --leader-elect
            - --health-probe-bind-address=:8081
          command:
            - /manager
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CLUSTER_SIZE
              value: {{ .Values.clusterSize | toString | quote}}
            - name: MIN_CLUSTER_SIZE
              value: {{ .Values.minClusterSize | toString | quote}}
            - name: NUM_MANAGEMENT_NODES
              value: {{ .Values.numManagementNodes | toString | quote}}
      securityContext:
        runAsNonRoot: true
      serviceAccountName: clusters-computing-operator-controller-manager
      terminationGracePeriodSeconds: 10
