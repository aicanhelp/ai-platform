apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- toYaml .Values.global.labels | nindent 4}}
    app.kubernetes.io/name: clusters-computing-operator
  name: clusters-computing-operator-leader-election-role
  namespace: clusters-computing-operator-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
