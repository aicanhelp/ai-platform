apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- toYaml .Values.global.labels | nindent 4}}
    app.kubernetes.io/name: clusters-computing-operator
  name: clusters-computing-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusters-computing-operator-manager-role
subjects:
- kind: ServiceAccount
  name: clusters-computing-operator-controller-manager
  namespace: clusters-computing-operator-system
