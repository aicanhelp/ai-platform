apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusters-computing-operator-manager-role
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - clusters-computing-operator.openfuyao.com
    resources:
      - tenantclusters
      - tenantmanagedclusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - clusters-computing-operator.openfuyao.com
    resources:
      - tenantclusters/finalizers
      - tenantmanagedclusters/finalizers
    verbs:
      - update
  - apiGroups:
      - clusters-computing-operator.openfuyao.com
    resources:
      - tenantclusters/status
      - tenantmanagedclusters/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - operator.karmada.io
    resources:
      - karmadas
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
