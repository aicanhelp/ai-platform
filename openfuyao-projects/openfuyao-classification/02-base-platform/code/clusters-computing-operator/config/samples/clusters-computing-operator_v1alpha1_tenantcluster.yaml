apiVersion: clusters-computing-operator.openfuyao.com/v1alpha1
kind: TenantCluster
metadata:
  labels:
    app.kubernetes.io/name: clusters-computing-operator
    app.kubernetes.io/managed-by: kustomize
  name: tenantcluster-sample
spec:
  mode: "managed"
  nodeList: ["node[1-10000]"]
  controlPlane:
    karmada:
      name: "tenantcluster-karmada"
      etcdVersion: "3.5.16-0"
      karmadaVersion: "v1.11.1"
      kubeVersion: "v1.31.3"
      crdUrl : "http://example.com/crds.tar.gz"
    superClusterd:
      image: "ubuntu"
      command: ["sleep", "1000"]
      replicas: 1
    clusterd:
      image: "ubuntu"
      command: ["sleep", "1000"]
      replicas: 1
  managedClusters:
    replicas: 1
    installer:
      image: "yourIp:yourPort/yourImage/example:"
      fuyaoInstaller:
        command: ["/bin/sh", "-c", "/opt/fuyao/fuyao-latest-openEuler-22.03-amd64/fuyao create cluster -f /root/cluster/config/%s.yaml --offline --artifact-path /opt/fuyao/fuyao-offline-artifact-multi.tar.gz --debug && echo install success && scp root@%s:/etc/kubernetes/admin.conf managed.cluster.admin.conf && kubectl --kubeconfig=config/tenant.cluster.admin.config create secret generic %s-managed-kubeconfig --from-file=kubeconfig=managed.cluster.admin.conf --dry-run=client -o yaml | kubectl --kubeconfig=config/tenant.cluster.admin.config apply -f -"]
      ascendInstaller:
        command: ["/bin/sh", "-c", "bash process_ascend.sh"]

