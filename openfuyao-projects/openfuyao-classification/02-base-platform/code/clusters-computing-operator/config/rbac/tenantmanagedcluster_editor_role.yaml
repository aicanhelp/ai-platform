# permissions for end users to edit tenantmanagedclusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusters-computing-operator
    app.kubernetes.io/managed-by: kustomize
  name: tenantmanagedcluster-editor-role
rules:
- apiGroups:
  - clusters-computing-operator.openfuyao.com
  resources:
  - tenantmanagedclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - clusters-computing-operator.openfuyao.com
  resources:
  - tenantmanagedclusters/status
  verbs:
  - get
