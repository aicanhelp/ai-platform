# permissions for end users to view tenantclusters.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusters-computing-operator
    app.kubernetes.io/managed-by: kustomize
  name: tenantcluster-viewer-role
rules:
- apiGroups:
  - clusters-computing-operator.openfuyao.com
  resources:
  - tenantclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - clusters-computing-operator.openfuyao.com
  resources:
  - tenantclusters/status
  verbs:
  - get
