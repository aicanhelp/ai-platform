kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: logging-operator
  namespace: {{ .Values.namespace.backend }}
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
      #- 'configmaps'
      #- 'secrets'
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: logging-operator
  namespace: {{ .Values.namespace.backend }}
subjects:
  - kind: ServiceAccount
    name: logging-operator
    namespace: {{ .Values.namespace.backend }}
roleRef:
  kind: ClusterRole
  name: logging-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-operator
  namespace: {{ .Values.namespace.backend }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: logging-operator
  template:
    metadata:
      labels:
        app: logging-operator
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: logging-operator
          image: '{{ list . "core" | include "helpers.image.name" }}'
          imagePullPolicy: {{ .Values.images.core.pullPolicy }}
          env:
            - name: LOKI_HOSTS
              value: {{ .Values.loki.hosts }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/localtime
              name: host-time
              readOnly: true
      volumes: {{ toYaml .Values.volumes | nindent 8 }}
