apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: victoriametric-controller
    app.kubernetes.io/name: victoriametric-controller
  name: victoriametric-controller

---
apiVersion: v1
kind: Deployment
metadata:
  name: victoriametric-controller
  namespace: victoriametric-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametric-controller
  template:
    metadata:
      labels:
        app: victoriametric-controller
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In 
                values:
                - linux
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 10
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/node
                operator: Exists
      tolerations:
      - key: node-role.kubernetes.io/node
        effect: NoSchedule
      hostNetwork: true
      hostPID: true
      initContainers:
      - name: installer
        image: cr.openfuyao.cn/openfuyao/victoriametric-controller:latest
        imagePullPolicy: Always
        securityContext:
          privileged: true
        env:
          - name: OPENFUYAO_REGISTRY
            value: "cr.openfuyao.cn/openfuyao"
          - name: VERSION
            value: "0.58.2"
          - name: useVMSingle
            value: "false"
          - name: vmSingleStorageSize
            value: "50Gi"
          - name: vmAgentAllowStatefulSet
            value: "true"
          - name: vmAgentCpuCount
            value: "0.5"
          - name: vmAgentMemorySize
            value: "2Gi"
          - name: vmAgentStorageSize
            value: "10Gi"
          - name: vmAgentReplicaCount
            value: "1"
          - name: vmAgentShareCount
            value: "2"
          - name: vmAgentScrapeInterval
            value: "20s"
          - name: vmSelectCpuCount
            value: "0.5"
          - name: vmSelectMemorySize
            value: "2Gi"
          - name: vmSelectStorageSize
            value: "10Gi"
          - name: vmSelectReplicaCount
            value: "2"
          - name: vmStorageCPUCount
            value: "0.5"
          - name: vmStorageMemorySize
            value: "2Gi"
          - name: vmStorageStorageSize
            value: "20Gi"
          - name: vmStorageReplicaCount
            value: "2"
          - name: vmInsertReplicaCount
            value: "2"
          - name: vmInsertCpuCount
            value: "0.5"
          - name: vmInsertMemorySize
            value: "2Gi"
          - name: vmAlertReplicaCount
            value: "2"
          - name: vmAlertCpuCount
            value: "0.5"
          - name: vmAlertMemorySize
            value: "1Gi"
          - name: vmAlertManagerReplicaCount
            value: "2"
          - name: vmAlertManagerCpuCount
            value: "0.5"
          - name: vmAlertManagerMemorySize
            value: "1Gi"
          - name: vmClusterRetentionPeriod
            value: "15d"
          - name: vmClusterReplicationFactor
            value: "2"
          - name: grafanaNodePort
            value: "30010"
          - name: kubeStateMetricsAutoSharding
            value: "true"
          - name: kubeStateMetricsReplicaCount
            value: "2"
          - name: kubeStateMetricsCpuCount
            value: "0.5"
          - name: kubeStateMetricsMemorySize
            value: "2Gi"
        command:
          - /bin/sh
          - -c
          - sh /home/victoriametric/entrypoint.sh -o install
        volumeMounts:
          - name: dev
            mountPath: /dev
          - name: host-time
            mountPath: /etc/localtime
            readOnly: true
          - name: root-mount
            mountPath: /mnt
    containers:
      - name: victoriametric-controller
        env:
          - name: OPENFUYAO_REGISTRY
            value: "cr.openfuyao.cn/openfuyao"
        securityContext:
          privileged: true
        image: cr.openfuyao.cn/openfuyao/victoriametric-controller:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - while true; do sleep 3600; done
        volumeMounts:
          - name: dev
            mountPath: /dev
          - name: host-time
            mountPath: /etc/localtime
            readOnly: true
          - name: root-mount
            mountPath: /mnt
    volumes:
      - name: dev
        hostPath: 
          path: /dev
      - name: host-time
        hostPath:
          path: /etc/localtime
          type:""
      - name: root-mount
        hostPath:
          psth: /
    
           