apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-vmstorage-0  # 修改名字
spec:
  capacity:
    storage: 60Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: vmstorage-db-vmstorage-vm-victoria-metrics-k8s-stack-0  # 替换为你期望的PVC名字
    namespace: vmks # 替换为PVC所在的命名空间
  local:
    path: /mnt/data/vmstorage # 替换为真实路径
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node-n8fgk  # 替换为实际节点名
