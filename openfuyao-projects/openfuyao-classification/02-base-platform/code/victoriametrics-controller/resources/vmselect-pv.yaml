apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-vmselect-5  # 修改名字
spec:
  capacity:
    storage: 35Gi  # 修改存储大小
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: vmselect-cachedir-vmselect-vm-victoria-metrics-k8s-stack-5    # 替换为你期望的PVC名字
    namespace: vmks # 替换为PVC所在的命名空间
  local:
    path: /mnt/data/vmselect  # 替换为真实路径
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vmselect-5  # 替换为实际节点名
