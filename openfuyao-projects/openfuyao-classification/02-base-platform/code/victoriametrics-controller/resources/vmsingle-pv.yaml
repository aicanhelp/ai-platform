apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-vmsingle  # 修改名字
spec:
  capacity:
    storage: 35Gi  # 修改存储大小
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/data/vmsingle  # 替换为真实路径
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vmsingle  # 替换为实际节点名