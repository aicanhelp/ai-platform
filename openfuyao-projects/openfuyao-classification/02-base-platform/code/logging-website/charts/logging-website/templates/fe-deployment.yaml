apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      {{- if .Values.enableOAuth }}
      serviceAccountName: oauth-proxy
      {{- end }}
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
          operator: "Exists"
      containers:
        - name: {{ .Release.Name }}
          image: '{{ list . "core" | include "helpers.image.name" }}'
          imagePullPolicy: {{.Values.images.core.pullPolicy}}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: host-time
              mountPath: /etc/localtime
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        {{- if .Values.enableOAuth }}
        - name: oauth-proxy
          image: '{{ list . "oauth" | include "helpers.image.name" }}'
          imagePullPolicy: {{.Values.images.oauth.pullPolicy}}
          ports:
            - containerPort: {{ .Values.oauthProxy.containerPort }}
              name: proxy
          args:
            - --https-address=
            - '--http-address=:{{ .Values.oauthProxy.containerPort }}'
            - --email-domain=*
            - --provider=openfuyao
            - --client-id={{ .Values.oauthProxy.client.id }}
            - --client-secret={{ .Values.oauthProxy.client.secret }}
            - '--upstream=http://localhost:{{ .Values.service.containerPort }}'
            - '--openfuyao-delegate-urls={"/":{"resource": "services/proxy", "group": ""}}'
            - --redirect-url={{ .Values.oauthProxy.urls.host }}
            - --login-url={{ .Values.oauthProxy.urls.loginURI }}
            - --redeem-url={{ .Values.oauthProxy.urls.redeemURI }}
            - --root-prefix={{ .Values.oauthProxy.urls.rootPrefix }}
            - --cookie-httponly
        {{- end }}
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ""
        - name: nginx-config
          configMap:
            defaultMode: 0600
            name: {{ .Release.Name }}-nginx
            items:
            - key: nginx.conf
              path: nginx.conf

