apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.enableOAuth }}
    - targetPort: proxy
    {{- else }}
    - targetPort: {{ .Values.service.containerPort }}
    {{- end }}
      port: {{ .Values.service.httpPort }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: {{ .Chart.Name }}
