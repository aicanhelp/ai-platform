# Default values for logging.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

images:
  core:
    repository: "cr.openfuyao.cn/openfuyao/logging-website" # ""
    pullPolicy: Always
  oauth:
    repository: "cr.openfuyao.cn/openfuyao/oauth-proxy"
    pullPolicy: Always

service:
  type: NodePort # ClusterIP
  httpPort: 80
  httpsPort: 443
  containerPort: 8080
  nodePort: 31116

backend: "http://logging-operator.openfuyao-system.svc"

enableOAuth: true

oauthProxy:
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/logging"
