{{- $ctx := dict "hasPdService" false }}
{{- range .Values.services }}
  {{- if and .enabled (eq .mode "pd") (hasKey . "pd") }}
  {{- $proxyCfg := include "vllm.pdProxyServerConfig" (dict "proxyServer" .pd.proxyServer) | fromJson }}
  {{- if $proxyCfg.enabled }}
    {{- $_ := set $ctx "hasPdService" true }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if $ctx.hasPdService }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-proxy-sa
  namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-proxy-role
  namespace: {{ $.Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-proxy-rolebinding
  namespace: {{ $.Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: vllm-proxy-sa
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: vllm-proxy-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}