global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: [] # 私有镜像仓库的 Secret，例如: [{"name": "registry-secret"}]

  env:
    - name: HF_HUB_OFFLINE # HuggingFace Hub 离线开关（1=离线；0=在线）
      value: "0"

  modelName: "Qwen/Qwen3-8B" # 推理模型名称
  modelPath: "" # 推理模型本地路径（可选）。若配置，则 vLLM 使用该路径启动模型，否则使用 modelName。
  autoDownloadModel: true # 是否自动通过 huggingface (hf download) 下载模型
  cachePath: "/home/llm_cache" # 推理侧缓存目录（如 HuggingFace / vLLM 的下载与编译缓存）

images:
  inferenceEngine:
    repository: quay.io/ascend/vllm-ascend
    tag: v0.23.0
  proxyServer:
    repository: cr.openfuyao.cn/openfuyao/proxy-server
    tag: latest
  redis: # mooncake store 依赖的 metadata server 镜像
    repository: hub.oepkgs.net/openfuyao/redis
    tag: "8.6.1"
  modelDownloader: # HuggingFace 模型下载 initContainer 使用的镜像
    repository: cr.openfuyao.cn/openfuyao/huggingface-download
    tag: latest
  yamlTool:
    repository: hub.oepkgs.net/openfuyao/mikefarah/yq
    tag: "4.50.1"

inferenceDevice: "huawei.com/Ascend910" # NPU operator 所使用的推理设备资源名称

# 推理后端角色标识 Label（用于 Pod / Service 等 labels）
inferenceRoleLabels:
  proxy: "leader" # 推理后端 Proxy Server 标识 Label
  prefill: "prefill" # 推理后端 prefill 标识 Label
  decode: "decode" # 推理后端 decode 标识 Label
  aggregate: "aggregate" # 推理后端 aggregate 标识 Label

# 默认 volumeMounts（所有 vLLM deployment 共享）
volumeMounts:
  ascend: # Ascend 设备相关的 volumeMounts
    enable: true # 是否启用 Ascend 相关的 volumeMounts
    mounts:
      - name: shm
        mountPath: /dev/shm
      - name: dcmi
        mountPath: /usr/local/dcmi
      - name: npusmi
        mountPath: /usr/local/bin/npu-smi
      - name: lib64
        mountPath: /usr/local/Ascend/driver/lib64
      - name: version
        mountPath: /usr/local/Ascend/driver/version.info
      - name: installinfo
        mountPath: /etc/ascend_install.info
      - name: hccnconf
        mountPath: /etc/hccn.conf

# 默认 volumes（所有 vLLM deployment 共享）
volumes:
  ascend: # Ascend 设备相关的 volumes
    enable: true # 是否启用 Ascend 相关的 volumes
    mounts:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "24Gi"
      - name: dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: npusmi
        hostPath:
          path: /usr/local/bin/npu-smi
          type: File
      - name: lib64
        hostPath:
          path: /usr/local/Ascend/driver/lib64
      - name: version
        hostPath:
          path: /usr/local/Ascend/driver/version.info
          type: File
      - name: installinfo
        hostPath:
          path: /etc/ascend_install.info
          type: File
      - name: hccnconf
        hostPath:
          path: /etc/hccn.conf
          type: File

env: # 推理后端服务的推理后端pod环境变量注入
  - name: VLLM_USE_V1
    value: "1"
  # Ascend 卡通信接口名称
  - name: GLOO_SOCKET_IFNAME # Gloo 通信接口名称
    value: "eth0"
  - name: TP_SOCKET_IFNAME # Tensor Parallel 通信接口名称
    value: "eth0"
  - name: HCCL_SOCKET_IFNAME # HCCL 通信接口名称
    value: "eth0"

services:
  - name: qwen3-8b-1p1d-01
    enabled: true
    mode: pd
    service:
      port: 8000
    pdGroupID: "qwen3-8b-pd-01"

    kvTransferConfig:
      # kv_role、kv_rank、engine_id、tp_size、dp_size 等节点特定字段会自动填充，无需手动配置
      connectorConfig:
        kv_connector: "MultiConnector"
        kv_connector_extra_config:
          connectors:
            - kv_connector: "MooncakeConnectorV1"
              kv_buffer_device: "npu" # KV缓存缓冲区设备类型
              kv_parallel_size: 1 # KV并行大小
              kv_connector_extra_config:
                use_ascend_direct: true
            - kv_connector: "AscendStoreConnector"
              kv_buffer_device: "npu" # KV缓存缓冲区设备类型
              kv_parallel_size: 1 # KV并行大小
              kv_connector_extra_config:
                lookup_rpc_port: "0"
                backend: "mooncake"
                consumer_is_to_put: true
      mooncake: # mooncake store提供的内存挂载配置
        configPath: "/app/mooncake.json"
        use_store: true
        metadataServer: # 共享 Redis metadata server Pod 资源（多 service 启用时取首个已配置项）
          # Set false to use an existing Redis metadata server. Update config.metadata_server below to its address.
          create: true
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
        master: # 共享 mooncake master Pod 资源（多 service 启用时取首个已配置项）
          # Set false to use an existing Mooncake Master. Update config.master_server_address below to its address.
          create: true
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003 # cache-indexer L3 依赖该 admin HTTP 端口（/get_all_keys、/query_key、/get_all_segments）
          extraArgs: # mooncake_master 启动参数
            - "--eviction_high_watermark_ratio 0.9"
            - "--eviction_ratio 0.1"
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true
    
    pd:      
      prefill:
        replicas: 1
        # 以下为部署拓扑结构化字段：参与 NPU 资源、LWS Worker 数量、DP Rank 与
        # KV Transfer 等拓扑计算，由 chart 统一管理，禁止在 extraArgs 中重复配置。
        tensorParallelSize: 1
        pipelineParallelSize: 1
        # 多DP部署时，data-parallel-size、data-parallel-size-local、data-parallel-start-rank、
        # data-parallel-address、data-parallel-rpc-port、data-parallel-hybrid-lb 等由 chart 
        # 自动填充，无需在 extraArgs 中手动配置。
        dataParallelSizeLocal: 1
        dataParallelSize: 1
        dataParallelRpcPort: 12890
        env:
          - name: LOCAL_HOT_CACHE_SIZE
            value: "4294967296"
          - name: UB_SHARE_MEMORY
            value: "true"
        volumeMounts: [] # prefill 节点特定的 volumeMounts
        volumes: [] # prefill 节点特定的 volumes
        # extraArgs 是推理引擎 vLLM 自身的启动参数（仅由 vLLM 消费的模型配置与
        # 推理引擎调优参数），由 chart 直接透传给 `vllm serve`，不参与部署拓扑
        # 计算。未配置的参数使用对应版本 vLLM / vLLM-Ascend 的上游默认值。
        # 禁止重复配置 Chart 管理的参数（如 --tensor-parallel-size、--data-parallel-*、
        # --served-model-name、--port、--kv-transfer-config）；prefill 还禁止
        # --kv-events-config，冲突时渲染直接报错。
        extraArgs:
          - --max-model-len 10000
          - --max-num-batched-tokens 40960
          - --gpu-memory-utilization 0.8
          - --block-size 128
          - --enable-prefix-caching # 默认开启 prefill 节点前缀缓存；如需关闭，请将本参数替换为 --no-enable-prefix-caching
          - --trust-remote-code # 默认开启，允许加载远端仓库中的自定义模型代码
          - --disable-access-log-for-endpoints=/health,/metrics
        # 默认过滤 vLLM 的 /health、/metrics 访问日志。
        # 该配置也会过滤对应接口的 4xx/5xx 请求日志，如需 Debug 请调整或移除该参数（--disable-access-log-for-endpoints）。


      decode:
        replicas: 1
        # 以下为部署拓扑结构化字段：参与 NPU 资源、LWS Worker 数量、DP Rank 与
        # KV Transfer 等拓扑计算，由 chart 统一管理，禁止在 extraArgs 中重复配置。
        tensorParallelSize: 1
        pipelineParallelSize: 1
        dataParallelSize: 1
        dataParallelSizeLocal: 1
        dataParallelRpcPort: 12777
        env:
          - name: UB_SHARE_MEMORY
            value: "true"
        volumeMounts: [] # decode 节点特定的 volumeMounts
        volumes: [] # decode 节点特定的 volumes
        # extraArgs 是推理引擎 vLLM 自身的启动参数，语义与 prefill.extraArgs 相同；
        extraArgs:
          - --max-model-len 10000
          - --max-num-batched-tokens 40960
          - --gpu-memory-utilization 0.8
          - --block-size 128
          - --no-enable-prefix-caching # 默认显式关闭 decode 节点前缀缓存；如需开启，请替换为 --enable-prefix-caching
          - --trust-remote-code # 默认开启，允许加载远端仓库中的自定义模型代码
          - --disable-access-log-for-endpoints=/health,/metrics
        # 默认过滤 vLLM 的 /health、/metrics 访问日志。
        # 该配置也会过滤对应接口的 4xx/5xx 请求日志，如需 Debug 请调整或移除该参数（--disable-access-log-for-endpoints）。
      
      proxyServer:
        enabled: true
        discoveryInterval: 10
        accessLog:
          # 默认开启 HTTP 访问日志，并过滤 /health、/metrics 接口的成功请求。
          enabled: true # false 时关闭全部 HTTP 访问日志；true 时，开启访问日志，可通过配置 excludedEndpoints 来过滤对应端点的成功请求，4xx/5xx 仍会记录
          excludedEndpoints:
            - /health
            - /metrics
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

    resources: # p/d 节点资源配置
      requests:
        cpu: "4"
        memory: "32Gi"
      limits:
        cpu: "8"
        memory: "64Gi"

  - name: qwen3-8b-aggregated-01
    enabled: false
    mode: aggregated
    service:
      port: 8000
    kvTransferConfig: # KV Cache transfer 配置（aggregated 模式使用 store类型的 connector）
      connectorConfig:
        kv_connector: "AscendStoreConnector"
        kv_connector_extra_config:
          lookup_rpc_port: "1"
          backend: "mooncake"
      mooncake: # mooncake store提供的内存挂载配置
        configPath: "/app/mooncake.json"
        use_store: true
        metadataServer:
          # Set false to use an existing Redis metadata server. Update config.metadata_server below to its address.
          create: true
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
        master:
          # Set false to use an existing Mooncake Master. Update config.master_server_address below to its address.
          create: true
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003 # cache-indexer L3 依赖该 admin HTTP 端口（/get_all_keys、/query_key、/get_all_segments）
          extraArgs: # mooncake_master 启动参数
            - "--eviction_high_watermark_ratio 0.9"
            - "--eviction_ratio 0.1"
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "8"
              memory: "8Gi"
        # mooncake 配置文件内容（YAML 格式，initContainer 会自动替换 $POD_IP 并转换为 JSON）
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true

    aggregated:
      replicas: 1
      # 以下为部署拓扑结构化字段：参与 NPU 资源、LWS Worker 数量、DP Rank 与
      # KV Transfer 等拓扑计算，由 chart 统一管理，禁止在 extraArgs 中重复配置。
      tensorParallelSize: 1
      pipelineParallelSize: 1
      dataParallelSize: 1
      dataParallelSizeLocal: 1
      dataParallelRpcPort: 12890
      env:
        - name: UB_SHARE_MEMORY
          value: "true"
      volumeMounts: [] # aggregated 节点特定的 volumeMounts
      volumes: [] # aggregated 节点特定的 volumes
      # extraArgs 是推理引擎 vLLM 自身的启动参数，语义与 prefill.extraArgs 相同；
      # aggregated 会自动生成 --kv-events-config，禁止在 extraArgs 中重复配置。
      # 默认保留 --disable-access-log-for-endpoints=/health,/metrics，过滤 vLLM 的
      # /health、/metrics 访问日志。
      extraArgs:
        - --max-model-len 10000
        - --max-num-batched-tokens 40960
        - --gpu-memory-utilization 0.8
        - --block-size 128
        - --enable-prefix-caching # 默认开启 aggregated 节点前缀缓存；如需关闭，请将本参数替换为 --no-enable-prefix-caching
        - --trust-remote-code # 默认开启，允许加载远端仓库中的自定义模型代码
        - --disable-access-log-for-endpoints=/health,/metrics
      # 默认过滤 vLLM 的 /health、/metrics 访问日志。
      # 该配置也会过滤对应接口的 4xx/5xx 请求日志，如需 Debug 请调整或移除该参数（--disable-access-log-for-endpoints）。

    resources: # aggregated 节点资源配置
      requests:
        cpu: "4"
        memory: "32Gi"
      limits:
        cpu: "8"
        memory: "64Gi"
