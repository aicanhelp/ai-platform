{{- if and (include "vllm.hasMooncake" .) (include "vllm.mooncake.metadataServer.create" .) }}
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server-deployment
  namespace: {{ $.Release.Namespace }}
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- $.Values.global.imagePullSecrets | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: redis-server
        image: {{ include "vllm.redis.image" $ | quote }}
        imagePullPolicy: {{ include "vllm.image.pullPolicy" $ }}
        ports:
        - containerPort: 6379
        command: ["/bin/bash", "-c"]
        args:
        - |
          redis-server
        {{- with (include "vllm.mooncake.metadataServer.resources" .) }}
        resources:
          {{- . | nindent 10 }}
        {{- end }}
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
{{- end }}
