servicePort: 8222
template:
  spec:
    serviceAccountName: network-performance-exporter
    initContainers:
      - name: wait-for-nats
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            until nc -z nats.nats 4222; do
              echo "Wait NATS service...";
              sleep 3;
            done;
            echo "NATS service is ready!";
    containers:
      - name: eagle-eye-network-performance-exporter
        image: cr.openfuyao.cn/openfuyao/eagle-eye-network-performance-exporter:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MODULE_NAME
            value: "network-performance-exporter"
        args:
          - "--web-listen-port"
          - "8222"
          - "--collector-interval"
          - "15"
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
        ports:
          - name: metrics
            containerPort: 8222
        volumeMounts:
          - name: log-network-performance-exporter
            mountPath: /var/log/network-performance-exporter
          - name: localtime
            mountPath: /etc/localtime
            readOnly: true
          - name: ascend-driver
            mountPath: /usr/local/Ascend/driver
            readOnly: true
          - name: ascend-dcmi
            mountPath: /usr/local/dcmi
            readOnly: true
          - name: sys
            mountPath: /sys
            readOnly: true
          - name: proc
            mountPath: /proc
          - name: tmp
            mountPath: /tmp
    volumes:
      - name: log-network-performance-exporter
        hostPath:
          path: /var/log/network-performance-exporter
          type: DirectoryOrCreate
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: ascend-driver
        hostPath:
          path: /usr/local/Ascend/driver
      - name: ascend-dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      - name: tmp
        hostPath:
          path: /tmp
