template:
  spec:
    serviceAccountName: hardware-monitor-serviceaccount
    initContainers:
      - name: wait-for-nats
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            until nc -z nats.nats 4222; do
              echo "Wait NATS service...";
              sleep 3;
            done;
            echo "NATS service is ready!";
      - name: monitor-container
        image: hub.oepkgs.net/openfuyao/alpine/kubectl:1.34.2
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            kubectl wait --for=condition=Ready --namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)" pod -l infernex.io/component=eagle-eye-hardware-diagnosis --timeout=120s || true
            echo "Diagnosis pods checked. Starting monitor setup."
    containers:
      - name: eagle-eye-hardware-monitor
        image: cr.openfuyao.cn/openfuyao/eagle-eye-hardware-monitor:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MODULE_NAME
            value: "hardware-monitor"
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
          runAsGroup: 0
        ports:
          - name: http
            containerPort: 8537
        volumeMounts:
          - name: log-hardware-monitor
            mountPath: /var/log/hardware-monitor
          - name: localtime
            mountPath: /etc/localtime
            readOnly: true
          - name: ascend-driver
            mountPath: /usr/local/Ascend/driver
            readOnly: true
          - name: ascend-dcmi
            mountPath: /usr/local/dcmi
            readOnly: true
          - name: containerd
            mountPath: /run/containerd
            readOnly: true
          - name: tmp
            mountPath: /tmp
    volumes:
      - name: log-hardware-monitor
        hostPath:
          path: /var/log/hardware-monitor
          type: DirectoryOrCreate
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: ascend-driver
        hostPath:
          path: /usr/local/Ascend/driver
      - name: ascend-dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: containerd
        hostPath:
          path: /run/containerd
      - name: tmp
        hostPath:
          path: /tmp
