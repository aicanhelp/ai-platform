servicePort: 8000
template:
  spec:
    containers:
      - name: proxy-server
        image: cr.openfuyao.cn/openfuyao/proxy-server:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            python3 k8s_proxy_server_example.py \
              --host 0.0.0.0 \
              --prefiller-label "${INFERNEX_PROXY_PREFILLER_LABEL}" \
              --decoder-label "${INFERNEX_PROXY_DECODER_LABEL}" \
              --prefiller-container prefill-engine \
              --decoder-container decode-engine \
              --prefiller-port-name prefill-port \
              --decoder-port-name decode-port \
              --namespace "${INFERNEX_PROXY_WORKLOAD_NAMESPACE}" \
              --port 8000 \
              --discovery-interval "${INFERNEX_PROXY_DISCOVERY_INTERVAL_SEC}" \
              --disable-access-log-for-endpoints=/health,/metrics
        ports:
          - name: proxy-port
            containerPort: 8000
