apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infernex-bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "infernex-bridge.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "infernex-bridge.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "infernex-bridge.name" . }}
    spec:
      serviceAccountName: {{ include "infernex-bridge.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: '{{ list . "infernex-bridge" | include "helpers.image.name" }}'
          imagePullPolicy: {{ include "infernex-bridge.image.pullPolicy" . }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            {{- if .Values.webhooks.enabled }}
            - --webhook-cert-path={{ .Values.webhooks.tls.certPath }}
            {{- end }}
          env:
            - name: ENABLE_WEBHOOKS
              value: {{ ternary "true" "false" .Values.webhooks.enabled | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFERNEX_TEMPLATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.webhooks.enabled }}
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- if .Values.webhooks.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.webhooks.tls.certPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.webhooks.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ if .Values.certManager.enabled }}{{ .Values.certManager.secretName }}{{ else }}{{ .Values.webhooks.tls.secretName }}{{ end }}
      {{- end }}
