{{- if .Values.templates.installDefaultConfigs }}
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexServiceConfig
metadata:
  name: {{ .Values.templates.pd.name }}
  namespace: {{ .Release.Namespace }}
spec:
  intelligentGatewayRouting:
    router:
      enabled: false
  components:
    cacheIndexer:
      enabled: true
    mooncake:
      enabled: true
      master:
        replicas: 1
        servicePort: 30089
        template:
          metadata:
            labels:
              openfuyao.com/kvmanager: mooncake
          spec:
            containers:
              - name: mooncake-master
                image: quay.io/ascend/vllm-ascend:v0.23.0
                imagePullPolicy: IfNotPresent
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
                    if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then
                      echo 'export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/Ascend/ascend-toolkit/latest/$(uname -i)-linux/devlib' >> /usr/local/Ascend/ascend-toolkit/set_env.sh
                      source /usr/local/Ascend/ascend-toolkit/set_env.sh
                    fi
                    mooncake_master \
                      --port 50051 \
                      --metrics_port 9003 \
                      --eviction_high_watermark_ratio 0.9 \
                      --eviction_ratio 0.1
                ports:
                  - name: rpc
                    containerPort: 50051
                  - name: http
                    containerPort: 9003
    pdOrchestrator:
      elasticScaler:
        enabled: true
      tidal:
        enabled: true
      resourceScalingGroup:
        enabled: true
    eagleEye:
      hardwareMonitor:
        enabled: true
      hardwareDiagnosis:
        enabled: true
      networkPerformanceExporter:
        enabled: true
{{- end }}
