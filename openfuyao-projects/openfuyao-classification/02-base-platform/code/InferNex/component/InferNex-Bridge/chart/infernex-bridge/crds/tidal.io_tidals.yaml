---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tidals.tidal.io
spec:
  group: tidal.io
  names:
    kind: Tidal
    listKind: TidalList
    plural: tidals
    singular: tidal
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Target workload kind
          jsonPath: .spec.targetRef.kind
          name: Target
          type: string
        - description: Target workload name
          jsonPath: .spec.targetRef.name
          name: Target Name
          type: string
        - description: Current desired replicas
          jsonPath: .status.desiredReplicas
          name: Desired Replicas
          type: integer
        - description: Currently active rule
          jsonPath: .status.activeRule
          name: Active Rule
          type: string
        - description: Ready status
          jsonPath: .status.conditions[?(@.type=='Ready')].status
          name: Ready
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: Tidal is the Schema for the tidals API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of Tidal
              properties:
                targetRef:
                  description: targetRef specifies the target workload resource to scale.
                  properties:
                    apiVersion:
                      description: apiVersion is the API version of the target resource.
                      minLength: 1
                      type: string
                    kind:
                      description: kind is the kind of the target resource (e.g., Deployment,
                        StatefulSet, DaemonSet).
                      minLength: 1
                      type: string
                    name:
                      description: name is the name of the target resource.
                      minLength: 1
                      type: string
                    namespace:
                      description: namespace is the namespace of the target resource.
                      minLength: 1
                      type: string
                  required:
                    - apiVersion
                    - kind
                    - name
                    - namespace
                  type: object
                triggers:
                  description: triggers defines the scheduling trigger configuration.
                  properties:
                    times:
                      description: times defines time-based trigger rules.
                      properties:
                        rules:
                          description: |-
                            rules is an array of time-based scheduling rules.
                            At least one rule must be specified.
                          items:
                            description: TimeRule defines a time-based scheduling rule.
                            properties:
                              cron:
                                description: cron is a CRON expression with timezone
                                  support (e.g., "CRON_TZ=Asia/Shanghai 0 9 * * 1-5").
                                maxLength: 512
                                pattern: ^CRON_TZ=.*
                                type: string
                              description:
                                description: description is an optional description
                                  of the rule.
                                type: string
                              name:
                                description: name is a unique identifier for the rule,
                                  used for status tracking.
                                minLength: 1
                                type: string
                              replicas:
                                description: replicas is the desired number of replicas
                                  when this rule is triggered.
                                format: int32
                                minimum: 0
                                type: integer
                            required:
                              - cron
                              - name
                              - replicas
                            type: object
                          maxItems: 100
                          minItems: 1
                          type: array
                      required:
                        - rules
                      type: object
                  required:
                    - times
                  type: object
              required:
                - targetRef
                - triggers
              type: object
            status:
              description: status defines the observed state of Tidal
              properties:
                activeRule:
                  description: activeRule is the name of the currently active rule.
                  type: string
                activeRuleEffectiveTime:
                  description: activeRuleEffectiveTime is the time when the current
                    active rule took effect.
                  format: date-time
                  type: string
                conditions:
                  description: |-
                    conditions represent the current state of the Tidal resource.
                    Each condition has a unique type and reflects the status of a specific aspect of the resource.
                    
                    Standard condition types include:
                    - "Ready": the resource is fully functional
                    - "Progressing": the resource is being created or updated
                    - "Degraded": the resource failed to reach or maintain its desired state
                    
                    The status of each condition is one of True, False, or Unknown.
                  items:
                    description: Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                desiredReplicas:
                  description: desiredReplicas is the current effective number of replicas.
                  format: int32
                  type: integer
                lastTriggerRule:
                  description: lastTriggerRule is the name of the rule that was last
                    triggered (the previous active rule).
                  type: string
                lastTriggerTime:
                  description: lastTriggerTime is the time when the previous (last triggered)
                    rule was triggered.
                  format: date-time
                  type: string
                nextTriggerRule:
                  description: nextTriggerRule is the name of the next rule to be triggered.
                  type: string
                nextTriggerTime:
                  description: nextTriggerTime is the time when the next rule will be
                    triggered.
                  format: date-time
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
