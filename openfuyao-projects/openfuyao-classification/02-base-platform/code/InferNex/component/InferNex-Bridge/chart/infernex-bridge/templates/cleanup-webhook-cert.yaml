{{- if and .Values.webhooks.enabled .Values.webhooks.certGenerator.enabled (not .Values.certManager.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "infernex-bridge.fullname" . }}-cleanup-webhook-cert
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  backoffLimit: 1
  parallelism: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "infernex-bridge.fullname" . }}-webhook-cert-cleanup
      containers:
        - name: kubectl-delete
          image: '{{ list . "kubectl-openfuyao" | include "helpers.image.name.pinned" }}'
          imagePullPolicy: {{ include "infernex-bridge.image.pullPolicy" . }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              NAMESPACE={{ .Release.Namespace | quote }}
              SECRET_NAME={{ .Values.webhooks.tls.secretName | quote }}
              MWC_NAME={{ printf "%s-mutating" (include "infernex-bridge.fullname" .) | quote }}
              VWC_NAME={{ printf "%s-validating" (include "infernex-bridge.fullname" .) | quote }}
              kubectl delete mutatingwebhookconfiguration "${MWC_NAME}" --ignore-not-found=true
              kubectl delete validatingwebhookconfiguration "${VWC_NAME}" --ignore-not-found=true
              kubectl delete secret "${SECRET_NAME}" -n "${NAMESPACE}" --ignore-not-found=true
{{- end }}
