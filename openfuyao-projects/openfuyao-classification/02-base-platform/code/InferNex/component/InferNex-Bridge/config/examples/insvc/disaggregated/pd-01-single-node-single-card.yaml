# =============================================================================
# PD-1 单机每角色单卡 tp1dp1
# =============================================================================
# Spec ID   : pd-01-single-node-single-card
# Mode      : Disaggregated / PD（Prefill / Decode 分离）
#
# 【场景】单机 PD 分离：Prefill 与 Decode 各 1 Pod、各 1 张 NPU（tp1dp1），同节点部署。
#
# 【模型来源】在线：huggingface-download initContainer 从 Hub 下载模型
#
# 【并行参数】
#   TP × DP                       : 1 × 1
#   PP                            : 1
#   EP (expert-parallel)          : 否
#   每 Pod NPU 数                  : 1
#   每角色合计 NPU（tp×dp）        : 1
#   集群总 NPU（Prefill+Decode）   : 2
#
# 【Prefill】1 套 Prefill（1 Pod）
#   Pod 形态                      : 1 Pod × 1 NPU
#
# 【Decode】1 套 Decode（1 Pod）
#   Pod 形态                      : 1 Pod × 1 NPU
#
# 【节点分布】
#   Prefill  1 Pod × 1 NPU  →  m1
#   Decode   1 Pod × 1 NPU  →  m1
#
# 【编排】
#   方式                          : Deployment（无 LWS）
#   LWS                           : 否
#   spec.parallelism              : 否
#   推理引擎 Pod 总数              : 2（Prefill 1 + Decode 1）
#
# 【模型】
#   model                         : Qwen/Qwen2.5-0.5B
#   InferNexService                       : ex-pd-01-sn-sc
#   namespace                     : infernex-bridge-system
# =============================================================================
#
# insvc: engine 模板来自同 Spec ID 的 llmisvc；拓扑字段见 dataParallelSize / worker
# InferNexService.spec.model + baseRefs → InferNexServiceConfig; Hermes EPP/tokenizer in intelligentGatewayRouting.router
---
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexServiceConfig
metadata:
  name: ex-pd-01-sn-sc-engine
  namespace: infernex-bridge-system
spec:
  engine:
    template:
      spec:
        securityContext:
          supplementalGroups:
          - 1000
        initContainers:
        - name: mooncake-config-init
          image: hub.oepkgs.net/openfuyao/mikefarah/yq:4.50.1
          command:
          - /bin/sh
          - -c
          args:
          - |
            set -e
            CONFIG_PATH="/app/mooncake.json"
            mkdir -p "$(dirname "$CONFIG_PATH")"
            cat > /tmp/mooncake_config.tpl << 'EOF'
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true
            EOF
            POD_IP_VALUE="${POD_IP:-0.0.0.0}"
            sed "s/\$POD_IP/${POD_IP_VALUE}/g" /tmp/mooncake_config.tpl | yq eval - -o=json > "$CONFIG_PATH"
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          volumeMounts:
          - name: mooncake-config
            mountPath: /app
        - name: huggingface-download
          image: cr.openfuyao.cn/openfuyao/huggingface-download:latest
          imagePullPolicy: IfNotPresent
          command:
          - hf
          - download
          - Qwen/Qwen2.5-0.5B
          env:
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: PYTHONHASHSEED
            value: '0'
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_USE_V1
            value: '1'
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TP_SOCKET_IFNAME
            value: eth0
          - name: HCCL_SOCKET_IFNAME
            value: eth0
          - name: MOONCAKE_CONFIG_PATH
            value: /app/mooncake.json
          volumeMounts:
          - name: rootcache
            mountPath: /root/.cache
        containers:
        - name: main
          image: quay.io/ascend/vllm-ascend:v0.23.0
          imagePullPolicy: IfNotPresent
          ports:
          - name: decode-port
            containerPort: 8000
          command:
          - /bin/bash
          - -c
          args:
          - |
            set -euo pipefail
            export PHYSICAL_DEVICES=$(ls /dev/davinci* 2>/dev/null | grep -o '[0-9]\+' | sort -n | paste -sd',' - || true)
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
            exec vllm serve Qwen/Qwen2.5-0.5B \
              --served-model-name Qwen/Qwen2.5-0.5B \
              --trust-remote-code \
              --no-enable-prefix-caching \
              --prefix-caching-hash-algo sha256_cbor \
              --enable-prompt-tokens-details \
              --port 8000 \
              --tensor-parallel-size 1 \
              --pipeline-parallel-size 1 \
              --max-model-len 10000 \
              --max-num-batched-tokens 40960 \
              --gpu-memory-utilization 0.8 \
              --block-size 128 \
              --hf-overrides '{"head_dim": 64}' \
              --kv-transfer-config '{"engine_id":"$(POD_NAME)","kv_connector":"MultiConnector","kv_connector_extra_config":{"connectors":[{"kv_buffer_device":"npu","kv_connector":"MooncakeConnectorV1","kv_connector_extra_config":{"decode":{"dp_size":1,"tp_size":1},"prefill":{"dp_size":1,"tp_size":1},"use_ascend_direct":true},"kv_parallel_size":1,"kv_port":"28001","kv_role":"kv_consumer"},{"kv_buffer_device":"npu","kv_connector":"AscendStoreConnector","kv_connector_extra_config":{"backend":"mooncake","decode":{"dp_size":1,"tp_size":1},"lookup_rpc_port":"0","prefill":{"dp_size":1,"tp_size":1}},"kv_parallel_size":1,"kv_port":"28001","kv_role":"kv_consumer"}],"decode":{"dp_size":1,"tp_size":1},"prefill":{"dp_size":1,"tp_size":1}},"kv_port":"28001","kv_rank":1,"kv_role":"kv_consumer"}'
          env:
          - name: HOME
            value: /home
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: PYTHONHASHSEED
            value: '0'
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_USE_V1
            value: '1'
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TP_SOCKET_IFNAME
            value: eth0
          - name: HCCL_SOCKET_IFNAME
            value: eth0
          - name: HCCL_WHITELIST_DISABLE
            value: '1'
          - name: HCCL_COMM_ID
            value: 127.0.0.1:5555
          - name: MOONCAKE_CONFIG_PATH
            value: /app/mooncake.json
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          resources:
            limits:
              cpu: '8'
              memory: 64Gi
              huawei.com/Ascend910: '1'
            requests:
              cpu: '4'
              memory: 32Gi
              huawei.com/Ascend910: '1'
          securityContext:
            privileged: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          startupProbe:
            httpGet:
              path: /v1/models
              port: decode-port
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: decode-port
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: decode-port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
          - name: mooncake-config
            mountPath: /app
            readOnly: true
          - mountPath: /dev/shm
            name: shm
          - mountPath: /usr/local/dcmi
            name: dcmi
          - mountPath: /usr/local/bin/npu-smi
            name: npusmi
          - mountPath: /usr/local/Ascend/driver/lib64
            name: lib64
          - mountPath: /usr/local/Ascend/driver/version.info
            name: version
          - mountPath: /etc/ascend_install.info
            name: installinfo
          - mountPath: /usr/bin/hccn_tool
            name: hccntool
          - mountPath: /etc/hccn.conf
            name: hccnconf
          - mountPath: /root/.cache
            name: rootcache
        volumes:
        - name: mooncake-config
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
        - name: dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npusmi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64
            type: Directory
        - name: version
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: installinfo
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: hccntool
          hostPath:
            path: /usr/bin/hccn_tool
            type: File
        - name: hccnconf
          hostPath:
            path: /etc/hccn.conf
            type: File
        - name: rootcache
          hostPath:
            path: /home/llm_cache
            type: Directory
    prefill:
      template:
        spec:
          securityContext:
            supplementalGroups:
            - 1000
          initContainers:
          - name: mooncake-config-init
            image: hub.oepkgs.net/openfuyao/mikefarah/yq:4.50.1
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -e
              CONFIG_PATH="/app/mooncake.json"
              mkdir -p "$(dirname "$CONFIG_PATH")"
              cat > /tmp/mooncake_config.tpl << 'EOF'
              local_hostname: "$POD_IP"
              metadata_server: "redis://redis-service:6379"
              master_server_address: "mooncake-master-service:30089"
              device_name: ""
              protocol: "ascend"
              global_segment_size: 42949672960
              use_ascend_direct: true
              EOF
              POD_IP_VALUE="${POD_IP:-0.0.0.0}"
              sed "s/\$POD_IP/${POD_IP_VALUE}/g" /tmp/mooncake_config.tpl | yq eval - -o=json > "$CONFIG_PATH"
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            volumeMounts:
            - name: mooncake-config
              mountPath: /app
          - name: huggingface-download
            image: cr.openfuyao.cn/openfuyao/huggingface-download:latest
            imagePullPolicy: IfNotPresent
            command:
            - hf
            - download
            - Qwen/Qwen2.5-0.5B
            env:
            - name: HF_HUB_OFFLINE
              value: '0'
            - name: PYTHONHASHSEED
              value: '0'
            - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
              value: '1'
            - name: VLLM_USE_V1
              value: '1'
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: TP_SOCKET_IFNAME
              value: eth0
            - name: HCCL_SOCKET_IFNAME
              value: eth0
            - name: MOONCAKE_CONFIG_PATH
              value: /app/mooncake.json
            volumeMounts:
            - name: rootcache
              mountPath: /root/.cache
          containers:
          - name: main
            image: quay.io/ascend/vllm-ascend:v0.23.0
            imagePullPolicy: IfNotPresent
            ports:
            - name: prefill-port
              containerPort: 8000
            - name: zmq-pub
              containerPort: 5557
            command:
            - /bin/bash
            - -c
            args:
            - |
              set -euo pipefail
              export PHYSICAL_DEVICES=$(ls /dev/davinci* 2>/dev/null | grep -o '[0-9]\+' | sort -n | paste -sd',' - || true)
              export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
              exec vllm serve Qwen/Qwen2.5-0.5B \
                --served-model-name Qwen/Qwen2.5-0.5B \
                --trust-remote-code \
                --enable-prefix-caching \
                --prefix-caching-hash-algo sha256_cbor \
                --enable-prompt-tokens-details \
                --port 8000 \
                --tensor-parallel-size 1 \
                --pipeline-parallel-size 1 \
                --max-model-len 10000 \
                --max-num-batched-tokens 40960 \
                --gpu-memory-utilization 0.8 \
                --block-size 128 \
                --hf-overrides '{"head_dim": 64}' \
                --kv-events-config '{"enable_kv_cache_events": true, "publisher":"zmq", "topic":"kv-events"}' \
                --kv-transfer-config '{"engine_id":"$(POD_NAME)","kv_connector":"MultiConnector","kv_connector_extra_config":{"connectors":[{"kv_buffer_device":"npu","kv_connector":"MooncakeConnectorV1","kv_connector_extra_config":{"decode":{"dp_size":1,"tp_size":1},"prefill":{"dp_size":1,"tp_size":1},"use_ascend_direct":true},"kv_parallel_size":1,"kv_port":"28000","kv_role":"kv_producer"},{"kv_buffer_device":"npu","kv_connector":"AscendStoreConnector","kv_connector_extra_config":{"backend":"mooncake","decode":{"dp_size":1,"tp_size":1},"lookup_rpc_port":"0","prefill":{"dp_size":1,"tp_size":1}},"kv_parallel_size":1,"kv_port":"28000","kv_role":"kv_producer"}],"decode":{"dp_size":1,"tp_size":1},"prefill":{"dp_size":1,"tp_size":1}},"kv_port":"28000","kv_rank":0,"kv_role":"kv_producer"}'
            env:
            - name: HOME
              value: /home
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            - name: HF_HUB_OFFLINE
              value: '0'
            - name: PYTHONHASHSEED
              value: '0'
            - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
              value: '1'
            - name: VLLM_USE_V1
              value: '1'
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: TP_SOCKET_IFNAME
              value: eth0
            - name: HCCL_SOCKET_IFNAME
              value: eth0
            - name: HCCL_WHITELIST_DISABLE
              value: '1'
            - name: HCCL_COMM_ID
              value: 127.0.0.1:5555
            - name: MOONCAKE_CONFIG_PATH
              value: /app/mooncake.json
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            resources:
              limits:
                cpu: '8'
                memory: 64Gi
                huawei.com/Ascend910: '1'
              requests:
                cpu: '4'
                memory: 32Gi
                huawei.com/Ascend910: '1'
            securityContext:
              privileged: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
            startupProbe:
              httpGet:
                path: /v1/models
                port: prefill-port
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 60
