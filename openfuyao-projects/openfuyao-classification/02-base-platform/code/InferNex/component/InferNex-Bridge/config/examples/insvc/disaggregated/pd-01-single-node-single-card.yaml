apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexService
metadata:
  name: ex-pd-01-sn-sc
  namespace: infernex-bridge-system
spec:
  baseRefs:
  - name: ex-pd-01-sn-sc-engine
  model:
    uri: hf://Qwen/Qwen2.5-0.5B
    name: Qwen/Qwen2.5-0.5B
  intelligentGatewayRouting:
    router:
      enabled: true
      servicePort: 9002
      template:
        spec:
          securityContext:
            fsGroup: 65532
          containers:
          - name: tokenizer
            image: cr.openfuyao.cn/openfuyao/hermes-router-tokenizer:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: TOKENIZER_PROVIDER
              value: huggingface
            - name: TOKENIZER_CACHE_DIR
              value: /.cache/huggingface/hub
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                memory: 16Gi
            volumeMounts:
            - name: tokenizer-uds
              mountPath: /tmp/tokenizer
            - name: tokenizer-cache
              mountPath: /.cache/huggingface/hub
          - name: main
            image: cr.openfuyao.cn/openfuyao/hermes-router:latest
            imagePullPolicy: IfNotPresent
            ports:
            - containerPort: 9002
              name: grpc
              protocol: TCP
            - containerPort: 9003
              name: grpc-health
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
            args:
            - --pool-name
            - ex-pd-01-sn-sc-inference-pool
            - --pool-namespace
            - infernex-bridge-system
            - --pool-group
            - inference.networking.k8s.io
            - --zap-encoder
            - json
            - --config-text
            - |
              apiVersion: inference.networking.x-k8s.io/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: metrics-data-source
                parameters:
                  scheme: http
                  path: /metrics
                  insecureSkipVerify: true
              - type: core-metrics-extractor
              - type: tokenizer
                parameters:
                  model: Qwen/Qwen2.5-0.5B
                  socketPath: /tmp/tokenizer/tokenizer-uds.socket
              - type: request-lifecycle-tracker
                parameters:
                  storeName: hermes-inflight
                  persistence:
                    enabled: false
              - type: inflight-data-producer
                parameters:
                  storeName: hermes-inflight
              - type: prefix-cache-producer
                parameters:
                  cacheIndexerAddress: http://ex-pd-01-sn-sc-cache-indexer:8080
              - type: kvcache-aware-scorer
                parameters:
                  kvCacheNotHitRateWeight: 1
                  xpuCacheUsageWeight: 1
                  waitingRequestWeight: 1
                  inflightWeight: 1
              - type: maximum-score-picker
              schedulingProfiles:
              - name: default
                plugins:
                - pluginRef: tokenizer
                - pluginRef: request-lifecycle-tracker
                - pluginRef: inflight-data-producer
                - pluginRef: prefix-cache-producer
                - pluginRef: kvcache-aware-scorer
                - pluginRef: maximum-score-picker
            - --v
            - "1"
            - --tracing
            - "false"
            - --metrics-endpoint-auth
            - "false"
            volumeMounts:
            - name: tokenizer-uds
              mountPath: /tmp/tokenizer
            startupProbe:
              grpc:
                port: 9003
                service: liveness
              failureThreshold: 30
              periodSeconds: 10
              timeoutSeconds: 5
            livenessProbe:
              grpc:
                port: 9003
                service: liveness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              grpc:
                port: 9003
                service: readiness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              requests:
                cpu: "4"
                memory: 8Gi
              limits:
                memory: 16Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
          volumes:
          - name: tokenizer-uds
            emptyDir: {}
          - name: tokenizer-cache
            hostPath:
              path: /home/llm_cache/huggingface/hub
              type: Directory
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
