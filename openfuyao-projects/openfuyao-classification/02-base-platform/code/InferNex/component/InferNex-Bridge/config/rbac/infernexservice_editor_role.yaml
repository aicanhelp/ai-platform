# This rule is not used by the project infernex-bridge itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the infernex.infernex.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infernex-bridge
    app.kubernetes.io/managed-by: kustomize
  name: infernexservice-editor-role
rules:
- apiGroups:
  - infernex.infernex.io
  resources:
  - infernexservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infernex.infernex.io
  resources:
  - infernexservices/status
  verbs:
  - get
