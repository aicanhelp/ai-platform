              type: Directory

---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: ex-pd-03-cn-sc
  namespace: kserve
  labels:
    infernex.io/runtime: "true"
spec:
  model:
    uri: hf://Qwen/Qwen3-8B
    name: Qwen/Qwen3-8B
  router:
    gateway: {}
    route: {}
    scheduler:
      pool:
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: ex-pd-03-cn-sc
              app.kubernetes.io/part-of: llminferenceservice
          targetPorts:
            - number: 8000
          endpointPickerRef:
            failureMode: FailOpen
            kind: Service
            name: ex-pd-03-cn-sc-epp-service
            port:
              number: 9002
      template:
        serviceAccountName: ex-pd-03-cn-sc-epp-sa
        securityContext:
          fsGroup: 65532
        containers:
          - name: tokenizer
            image: cr.openfuyao.cn/openfuyao/hermes-router-tokenizer:latest
            imagePullPolicy: IfNotPresent
            env:
              - name: TOKENIZER_PROVIDER
                value: huggingface
              - name: TOKENIZER_CACHE_DIR
                value: /.cache/huggingface/hub
              - name: VLLM_CACHE_ROOT
                value: /tmp/vllm-cache
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                memory: 16Gi
            volumeMounts:
              - name: tokenizer-model-cache
                mountPath: /.cache/huggingface/hub
          - name: main
            image: cr.openfuyao.cn/openfuyao/hermes-router:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: "4"
                memory: 8Gi
              limits:
                memory: 16Gi
        volumes:
          - name: tokenizer-model-cache
            hostPath:
              path: /home/llm_cache/huggingface/hub
              type: Directory
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: metrics-data-source
            parameters:
              scheme: http
              path: /metrics
              insecureSkipVerify: true
          - type: core-metrics-extractor
          - type: tokenizer
            parameters:
              model: Qwen/Qwen3-8B
              socketPath: /tmp/tokenizer/tokenizer-uds.socket
          - type: pd-group-producer
            parameters:
              pdLabelName: app.kubernetes.io/component
              pdGroupLabelName: app.kubernetes.io/name
              prefillValue: llminferenceservice-workload-prefill
              decodeValue: llminferenceservice-workload
              leaderValue: pd-proxy
          - type: request-lifecycle-tracker
            parameters:
              storeName: hermes-inflight
              persistence:
                enabled: false
          - type: inflight-data-producer
            parameters:
              storeName: hermes-inflight
          - type: prefix-cache-producer
            parameters:
              cacheIndexerAddress: http://ex-pd-03-cn-sc-cache-indexer:8080
          - type: pd-group-filter
          - type: pd-kvcache-aware-scorer
            parameters:
              prefillKVUsageWeight: 1
              prefillPrefixWeight: 1
              prefillQueueWeight: 1
              prefillInflightWeight: 1
              decodeKVUsageWeight: 1
              decodeQueueWeight: 1
              decodeInflightWeight: 1
              prefillScoreWeight: 1
              decodeScoreWeight: 1
          - type: maximum-score-picker
          - type: pd-header-handler
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: tokenizer
            - pluginRef: pd-group-producer
            - pluginRef: request-lifecycle-tracker
            - pluginRef: inflight-data-producer
            - pluginRef: prefix-cache-producer
            - pluginRef: pd-group-filter
            - pluginRef: pd-kvcache-aware-scorer
            - pluginRef: maximum-score-picker
            - pluginRef: pd-header-handler
  baseRefs:
    - name: ex-pd-03-cn-sc-config
  storageInitializer:
    enabled: false
