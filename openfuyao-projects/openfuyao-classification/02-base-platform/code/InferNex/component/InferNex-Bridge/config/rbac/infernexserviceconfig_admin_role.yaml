# This rule is not used by the project infernex-bridge itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over infernex.infernex.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: infernex-bridge
    app.kubernetes.io/managed-by: kustomize
  name: infernexserviceconfig-admin-role
rules:
- apiGroups:
  - infernex.infernex.io
  resources:
  - infernexserviceconfigs
  verbs:
  - '*'
- apiGroups:
  - infernex.infernex.io
  resources:
  - infernexserviceconfigs/status
  verbs:
  - get
