---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: ex-ag-03-cn-lws
  namespace: kserve
  labels:
    infernex.io/runtime: "true"
spec:
  model:
    uri: hf://Qwen/Qwen3-Coder-30B-A3B-Instruct
    name: Qwen/Qwen3-Coder-30B-A3B-Instruct
  parallelism:
    data: 2
    dataLocal: 1
  worker: {}
  router:
    gateway: {}
    route: {}
    scheduler:
      pool:
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/name: ex-ag-03-cn-lws
              app.kubernetes.io/part-of: llminferenceservice
          targetPorts:
            - number: 8000
          endpointPickerRef:
            failureMode: FailOpen
            kind: Service
            name: ex-ag-03-cn-lws-epp-service
            port:
              number: 9002
      template:
        serviceAccountName: ex-ag-03-cn-lws-epp-sa
        securityContext:
          fsGroup: 65532
        containers:
          - name: tokenizer
            image: cr.openfuyao.cn/openfuyao/hermes-router-tokenizer:latest
            imagePullPolicy: IfNotPresent
            env:
              - name: TOKENIZER_PROVIDER
                value: huggingface
              - name: TOKENIZER_CACHE_DIR
                value: /.cache/huggingface/hub
              - name: VLLM_CACHE_ROOT
                value: /tmp/vllm-cache
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                memory: 16Gi
            volumeMounts:
              - name: tokenizer-model-cache
                mountPath: /.cache/huggingface/hub
          - name: main
            image: cr.openfuyao.cn/openfuyao/hermes-router:latest
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                cpu: "4"
                memory: 8Gi
              limits:
                memory: 16Gi
        volumes:
          - name: tokenizer-model-cache
            hostPath:
              path: /home/llm_cache/huggingface/hub
              type: Directory
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
          - type: metrics-data-source
            parameters:
              scheme: http
              path: /metrics
              insecureSkipVerify: true
          - type: core-metrics-extractor
          - type: tokenizer
            parameters:
              model: Qwen/Qwen3-Coder-30B-A3B-Instruct
              socketPath: /tmp/tokenizer/tokenizer-uds.socket
          - type: request-lifecycle-tracker
            parameters:
              storeName: hermes-inflight
              persistence:
                enabled: false
          - type: inflight-data-producer
            parameters:
              storeName: hermes-inflight
          - type: prefix-cache-producer
            parameters:
              cacheIndexerAddress: http://ex-ag-03-cn-lws-cache-indexer:8080
          - type: kvcache-aware-scorer
            parameters:
              kvCacheNotHitRateWeight: 1
              xpuCacheUsageWeight: 1
              waitingRequestWeight: 1
              inflightWeight: 1
          - type: maximum-score-picker
          schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: tokenizer
            - pluginRef: request-lifecycle-tracker
            - pluginRef: inflight-data-producer
            - pluginRef: prefix-cache-producer
            - pluginRef: kvcache-aware-scorer
            - pluginRef: maximum-score-picker
  baseRefs:
    - name: ex-ag-03-cn-lws-config
  storageInitializer:
    enabled: false
