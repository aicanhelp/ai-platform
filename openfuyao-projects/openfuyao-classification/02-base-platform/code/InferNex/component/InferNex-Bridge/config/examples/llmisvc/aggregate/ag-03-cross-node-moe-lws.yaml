# =============================================================================
# AG-3 跨机 MoE LWS tp2dp2 local=1
# =============================================================================
# Spec ID   : ag-03-cross-node-moe-lws
# Mode      : Aggregate（聚合推理，Prefill/Decode 不分离）
#
# 【场景】跨机 MoE 聚合推理：Prefill/Decode 不分离，单逻辑模型经 LWS 切到 2 个 Pod（tp2dp2，dataLocal=1）。
#
# 【模型来源】在线：huggingface-download initContainer 从 Hub 下载模型
#
# 【并行参数】
#   TP × DP                       : 2 × 2
#   PP                            : 1
#   EP (expert-parallel)          : 是（--enable-expert-parallel）
#   每 Pod NPU 数                  : 2
#   集群总 NPU                     : 4
#
# 【引擎】1 套聚合推理（LWS：leader + worker）
#   Pod 形态                      : 2 Pod × 2 NPU
#
# 【节点分布】
#   leader 2 NPU  →  m1
#   worker 2 NPU  →  n1
#
# 【编排】
#   方式                          : LeaderWorkerSet
#   LWS                           : 是
#   spec.parallelism              : data=2, dataLocal=1 + worker
#   推理引擎 Pod 总数              : 2（leader + worker）
#
# 【模型】
#   model                         : Qwen/Qwen3-Coder-30B-A3B-Instruct
#   LLMISVC                       : ex-ag-03-cn-lws
#   namespace                     : kserve
# =============================================================================

---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: ex-ag-03-cn-lws-config
  namespace: kserve
spec:
  template:
    securityContext:
      supplementalGroups:
      - 1000
    initContainers:
      - name: mooncake-config-init
        image: hub.oepkgs.net/openfuyao/mikefarah/yq:4.50.1
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            CONFIG_PATH="/app/mooncake.json"
            mkdir -p "$(dirname "$CONFIG_PATH")"
            cat > /tmp/mooncake_config.tpl << 'EOF'
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true
            EOF
            POD_IP_VALUE="${POD_IP:-0.0.0.0}"
            sed "s/\$POD_IP/${POD_IP_VALUE}/g" /tmp/mooncake_config.tpl | yq eval - -o=json > "$CONFIG_PATH"
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        volumeMounts:
          - name: mooncake-config
            mountPath: /app
      - name: huggingface-download
        image: cr.openfuyao.cn/openfuyao/huggingface-download:latest
        imagePullPolicy: IfNotPresent
        command:
          - hf
          - download
          - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
        env:
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: PYTHONHASHSEED
            value: "0"
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: "1"
          - name: VLLM_USE_V1
            value: "1"
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TP_SOCKET_IFNAME
            value: eth0
          - name: HCCL_SOCKET_IFNAME
            value: eth0
          - name: MOONCAKE_CONFIG_PATH
            value: /app/mooncake.json
        volumeMounts:
          - name: rootcache
            mountPath: /root/.cache
    containers:
    - name: main
      image: quay.io/ascend/vllm-ascend:v0.23.0
      imagePullPolicy: IfNotPresent
      ports:
      - name: aggregated-port
        containerPort: 8000
      - name: zmq-pub
        containerPort: 5557
      command:
      - /bin/bash
      - -c
      args:
      - |
        set -euo pipefail
        export PHYSICAL_DEVICES=$(ls /dev/davinci* 2>/dev/null | grep -o '[0-9]\+' | sort -n | paste -sd',' - || true)
        export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
        START_RANK=$(( ${LWS_WORKER_INDEX:-0} * 1 ))
        exec vllm serve Qwen/Qwen3-Coder-30B-A3B-Instruct \
          --served-model-name Qwen/Qwen3-Coder-30B-A3B-Instruct \
          --trust-remote-code \
          --enable-prefix-caching \
          --prefix-caching-hash-algo sha256_cbor \
          --enable-prompt-tokens-details \
          --port 8000 \
          --tensor-parallel-size 2 \
          --pipeline-parallel-size 1 \
          --data-parallel-size 2 \
          --data-parallel-size-local 1 \
          --data-parallel-start-rank ${START_RANK} \
          --data-parallel-address ${LWS_LEADER_ADDRESS} \
          --data-parallel-rpc-port 5434 \
          --data-parallel-hybrid-lb \
          --enable-expert-parallel \
          --enforce-eager \
          --max-model-len 65536 \
          --max-num-batched-tokens 16384 \
          --gpu-memory-utilization 0.95 \
          --block-size 128 \
          --kv-events-config '{"enable_kv_cache_events": true, "publisher":"zmq", "endpoint":"tcp://*:5557", "topic":"kv-events"}' \
          --kv-transfer-config '{"engine_id":"$(POD_NAME)","kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_port":"28000","kv_connector_extra_config":{"backend":"mooncake","decode":{"dp_size":2,"tp_size":2},"prefill":{"dp_size":2,"tp_size":2},"lookup_rpc_port":"1"}}'
      env:
        - name: HOME
          value: /home
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: PYTHONHASHSEED
          value: "0"
        - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
          value: "1"
        - name: VLLM_USE_V1
          value: "1"
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: TP_SOCKET_IFNAME
          value: eth0
        - name: HCCL_SOCKET_IFNAME
          value: eth0
        - name: HCCL_WHITELIST_DISABLE
          value: "1"
        - name: HCCL_COMM_ID
          value: "127.0.0.1:5555"
        - name: MOONCAKE_CONFIG_PATH
          value: /app/mooncake.json
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_CACHE_ROOT
          value: /vllm-workspace
        - name: HCCL_OP_EXPANSION_MODE
          value: AIV
        - name: OMP_PROC_BIND
          value: "false"
        - name: OMP_NUM_THREADS
          value: "10"
        - name: ASCEND_TRANSPORT_PRINT
          value: "1"
        - name: ACL_OP_INIT_MODE
          value: "1"
        - name: VLLM_NIXL_ABORT_REQUEST_TIMEOUT
          value: "300000"
        - name: HCCL_INTRA_ROCE_ENABLE
          value: "1"
        - name: HCCL_IF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_ASCEND_ENABLE_FLASHCOMM1
          value: "1"
      resources:
        limits:
          cpu: "8"
          memory: 128Gi
          huawei.com/Ascend910: "2"
        requests:
          cpu: "4"
          memory: 64Gi
          huawei.com/Ascend910: "2"
      securityContext:
        privileged: false
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsNonRoot: false
      startupProbe:
        httpGet:
          path: /v1/models
          port: aggregated-port
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /health
          port: aggregated-port
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /v1/models
          port: aggregated-port
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      volumeMounts:
        - name: mooncake-config
          mountPath: /app
          readOnly: true
        - mountPath: /dev/shm
          name: shm
        - mountPath: /usr/local/dcmi
          name: dcmi
        - mountPath: /usr/local/bin/npu-smi
          name: npusmi
        - mountPath: /usr/local/Ascend/driver/lib64
          name: lib64
        - mountPath: /usr/local/Ascend/driver/version.info
          name: version
        - mountPath: /etc/ascend_install.info
          name: installinfo
        - mountPath: /usr/bin/hccn_tool
          name: hccntool
        - mountPath: /etc/hccn.conf
          name: hccnconf
        - mountPath: /root/.cache
          name: rootcache
    volumes:
        - name: mooncake-config
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
        - name: dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npusmi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64
            type: Directory
        - name: version
