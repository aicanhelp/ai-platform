---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-serving-kserve-io-v1alpha1-llminferenceservice
  failurePolicy: Fail
  name: mllminferenceservice.kb.io
  rules:
  - apiGroups:
    - serving.kserve.io
    apiVersions:
    - v1alpha1
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - llminferenceservices
  sideEffects: NoneOnDryRun
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-infernex-infernex-io-v1alpha1-infernexservice
  failurePolicy: Fail
  name: vinfernexservice-v1alpha1.kb.io
  rules:
  - apiGroups:
    - infernex.infernex.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - infernexservices
  sideEffects: None
