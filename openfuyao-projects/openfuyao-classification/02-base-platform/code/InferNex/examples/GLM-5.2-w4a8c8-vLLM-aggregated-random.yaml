# GLM-5.2-w4a8c8 聚合（tp8×dp4，32 卡）+ Mooncake store。
# 部署前请按实际权重修改 modelPath / cachePath。
inferenceGateway:
  enabled: true
  name: "inference-gateway"
  className: "istio"
  listeners:
    - name: http
      port: 80
      protocol: HTTP

  # 多套部署时 nodePort 须唯一。
  service:
    type: NodePort
    nodePorts:
      http: 30088

  istio:
    enabled: true

global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  env:
    - name: HF_HUB_OFFLINE
      value: "0"
    - name: PYTHONHASHSEED
      value: "0"
    - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
      value: "1"

  modelName: "zai-org/GLM-5.2"
  # Chart 将宿主机 cachePath 挂载到容器 /root/.cache。
  # 容器内 modelPath 对应宿主机 <cachePath>/<权重目录名>，请改成你的权重位置。
  modelPath: "/root/.cache/GLM-5.2-w4a8c8"
  autoDownloadModel: false
  cachePath: "/home/models" # 宿主机权重根目录，挂载为容器 /root/.cache

hermes-router:
  enabled: true

  inferenceExtension:
    replicas: 1
    pluginsConfigFile: "default-plugins.yaml"
    routing:
      deploymentMode: aggregate
      profile: random
    tokenizer:
      enabled: false
    prediction:
      enabled: false

  inferencePool:
    targetPorts:
      - number: 8000
    modelServerType: vllm

  httpRoute:
    inferenceGatewayName: "inference-gateway"
    requestTimeout: "3600s"

  provider:
    name: istio
    istio:
      destinationRule:
        trafficPolicy:
          tls:
            mode: SIMPLE
            insecureSkipVerify: true
      retryConfig:
        enabled: true
        retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,5xx,reset"
        numRetries: 3

inference-backend:
  images:
    inferenceEngine:
      repository: "quay.io/ascend/vllm-ascend"
      tag: "v0.23.0"
  inferenceDevice: "huawei.com/Ascend910"

  env:
    - name: HCCL_OP_EXPANSION_MODE
      value: "AIV"
    - name: GLOO_SOCKET_IFNAME
      value: "eth0"
    - name: TP_SOCKET_IFNAME
      value: "eth0"
    - name: HCCL_SOCKET_IFNAME
      value: "eth0"
    - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
      value: "30000"
    - name: HCCL_EXEC_TIMEOUT
      value: "200"
    - name: HCCL_CONNECT_TIMEOUT
      value: "120"
    - name: OMP_PROC_BIND
      value: "false"
    - name: OMP_NUM_THREADS
      value: "10"
    - name: PYTORCH_NPU_ALLOC_CONF
      value: "expandable_segments:True"
    - name: ACL_OP_INIT_MODE
      value: "1"
    - name: HCCL_INTRA_ROCE_ENABLE
      value: "1"
    # 置 1 时并发请求会 EngineDeadError，必须保持 0。
    - name: TASK_QUEUE_ENABLE
      value: "0"
    - name: CPU_AFFINITY_CONF
      value: "1"
    - name: VLLM_ENGINE_READY_TIMEOUT_S
      value: "1200"
    - name: VLLM_VERSION
      value: "0.23.0"

  volumeMounts:
    ascend:
      enable: true

  volumes:
    ascend:
      enable: true

  services:
  - name: glm52-w4a8c8-aggregated-01
    enabled: true
    mode: aggregated
    service:
      port: 8000
    pdGroupID: "glm52-w4a8c8-aggregated-01"
    kvTransferConfig:
      connectorConfig:
        kv_connector: "AscendStoreConnector"
        kv_connector_extra_config:
          lookup_rpc_port: "1"
          backend: "mooncake"
      mooncake:
        configPath: "/app/mooncake.json"
        use_store: true
        master:
          rpcPort: 50051
          servicePort: 30089
          httpPort: 9003
          extraArgs:
            - --eviction_high_watermark_ratio 0.9
            - --eviction_ratio 0.1
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: "40GB"
          use_ascend_direct: true

    aggregated:
      replicas: 1
      tensorParallelSize: 8
      pipelineParallelSize: 1
      dataParallelSize: 4
      dataParallelSizeLocal: 1
      dataParallelRpcPort: 13389
      env:
        - name: HCCL_IF_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      volumeMounts: []
      volumes: []
      extraArgs:
        - --max-model-len 68096
        - --max-num-batched-tokens 4096
        - --max-num-seqs 16
        - --gpu-memory-utilization 0.90
        - --block-size 128
        - --trust-remote-code
        - --enable-expert-parallel
        - --quantization ascend
        - --safetensors-load-strategy prefetch
        - --enable-auto-tool-choice
        - --tool-call-parser glm47
        - --reasoning-parser glm45
        - --seed 1024
        - --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[8,16,32,48,64],"max_cudagraph_capture_size":64}'
        - --additional-config '{"multistream_overlap_shared_expert":true}'
        # TP8 下 speculative token 数 +1 必须能被 8 整除，使用 MTP3。
        - --speculative-config '{"num_speculative_tokens":3,"method":"deepseek_mtp"}'
        - --disable-access-log-for-endpoints=/health,/metrics

    resources:
      requests:
        cpu: "16"
        memory: "300Gi"
      limits:
        cpu: "16"
        memory: "300Gi"

cache-indexer:
  enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 2Gi
  blockKey:
    pythonHashSeed: "0"
    prefixCachingHashAlgo: sha256_cbor
    useIntBlockHashes: true
  discovery:
    refreshInterval: 10s
    vllm:
      zmqPortName: zmq-pub
    mooncakeMaster:
      httpPortName: http
      httpPort: 9003
  service:
    name: cache-indexer-service
    port: 8080

eagle-eye:
  enabled: false

  network-performance-exporter:
    networkPerformanceExporter:
      metricsPort: 8222
      collectInterval: 15

pd-orchestrator:
  elastic-scaler:
    enabled: false

    elasticScaler:
      enabled: false

    name: elastic-scaler
    minReplicas: 1
    maxReplicas: 10

    targetRef:
      kind: resourcescalinggroup
      name: rsg
      apiVersion: autoscaling.openfuyao.com/v1alpha1

    trigger:
      scalingAlgorithm: apa
      resource:
        metricsName: cpu
        targetType: Utilization
        targetValue: 70

  resourcescalinggroup:
    enabled: false

    instanceConfig:
      enabled: false
      name: rsg
      targetResources:
      - name: aggregated
        resourceRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: glm52-w4a8c8-aggregated-01-aggregated
      scalingStrategy:
        type: GroupReplication
        groupConfig:
          groupName: aggregated
          scaleDown:
            metric:
              expr: "vllm:num_requests_running"
              type: "Gauge"
              window: "2m"
              aggregator: "avg"
            order: ascending

  tidal:
    enabled: false
