apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: colocation-management
    app.kubernetes.io/managed-by: kustomize
  name: colocation-management-account
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: colocation-management
  name: colocation-manager-cert-cleanup
  {{- if .Values.namespace }}
  namespace: {{ .Values.namespace }}
  {{- else }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
