apiVersion: v1
kind: Namespace
metadata:
  name: ub-network-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ub-network-bandwidth-operator
  namespace: ub-network-system
spec:
  selector:
    matchLabels:
      name: ub-network-bandwidth-operator
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        name: ub-network-bandwidth-operator
    spec:
      containers:
        - name: ub-network-bandwidth-operator
          image: cr.openfuyao.cn/openfuyao/ub-network-bandwidth-operator:latest
          args:
            - --config-path=/etc/ub-network-bandwidth/config.yaml
            - --health-port=8089
          volumeMounts:
            - name: config
              mountPath: /etc/ub-network-bandwidth
            - name: ubse-sock
              mountPath: /var/run/ubse
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: ubs-bandwidth-config
            optional: true
        - name: ubse-sock
          hostPath:
            path: /run/ubse
            type: Directory
