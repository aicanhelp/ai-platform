apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name }}
  namespace: {{ include "ub-network-bandwidth-operator.namespace" . }}
  labels:
    {{- include "ub-network-bandwidth-operator.labels" . | nindent 4 }}
data:
  {{ .Values.config.fileName }}: |
    bandwidths:
    {{- range .Values.config.bandwidths }}
      - priority: {{ .priority }}
        bandwidth: {{ .bandwidth }}
    {{- end }}
