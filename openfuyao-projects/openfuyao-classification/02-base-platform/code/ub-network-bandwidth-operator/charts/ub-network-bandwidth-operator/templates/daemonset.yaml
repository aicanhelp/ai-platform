apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ub-network-bandwidth-operator.fullname" . }}
  namespace: {{ include "ub-network-bandwidth-operator.namespace" . }}
  labels:
    {{- include "ub-network-bandwidth-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ub-network-bandwidth-operator.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "ub-network-bandwidth-operator.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "ub-network-bandwidth-operator.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config-path={{ .Values.operator.configPath }}
            - --health-port={{ .Values.operator.healthPort }}
          ports:
            - name: health
              containerPort: {{ .Values.operator.healthPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.operator.configMountPath }}
              readOnly: true
            - name: ubse-sock
              mountPath: {{ .Values.hostPaths.ubseSock.mountPath }}
              readOnly: {{ .Values.hostPaths.ubseSock.readOnly }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.name }}
            optional: {{ .Values.config.optional }}
        - name: ubse-sock
          hostPath:
            path: {{ .Values.hostPaths.ubseSock.path }}
            type: {{ .Values.hostPaths.ubseSock.type }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
