kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: volcano-config-service-webhook-auth			# 组件的serviceaccount名称 + webhook-auth后缀
subjects:
  - kind: ServiceAccount
    name: volcano-config-website					# 组件的serviceaccount名称
    namespace: volcano-system
roleRef:
  kind: ClusterRole
  name: webhook-auth
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volcano-config-website						# 与a中的subjects.name保持一致
  namespace: volcano-system
