{{- if .Values.openFuyao}}
apiVersion: console.openfuyao.com/v1beta1
kind: ConsolePlugin
metadata:
  name: scheduling
spec:
  pluginName: scheduling
  displayName: "NUMA亲和调度"
  entrypoint: /container_platform
  subPages:
    - pageName: NumaOverview
      displayName: 概览
    - pageName: AffinityPolicyConfiguration
      displayName: 亲和策略配置
    - pageName: numaMonitor
      displayName: 集群NUMA监控
  backend:
    type: Service
    service:
      name: volcano-config-website
      namespace: {{ .Values.namespace }}
      port: {{ .Values.service.port }}
  enabled: true
{{- end}}