apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-config-nginx
  namespace: {{ .Values.namespace }}
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;


    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
      
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

        server {
            listen 8080 default_server;
            root /usr/share/nginx/html/;
            index index.html index.htm;

            location / {
                try_files $uri /index.html;
            }

            location ~* ^/scheduling/.*\.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/scheduling.mjs break; 
            }

            location ~* \.(js|cjs|mjs)$ {
                default_type text/javascript;
                rewrite ^ /dist/scheduling.mjs break; 
            }

            {{ if .Values.backend.scheduler }}
            location /rest/scheduling {
                proxy_pass {{ .Values.backend.scheduler }};
            }
            location /rest/scheduling/apis/scheduling.k8s.io/v1 {
                rewrite ^/rest/scheduling(.*)$ $1 break;
                proxy_pass {{ .Values.backend.scheduler }};
            }
            {{ end }}

            {{ if .Values.backend.query }}
            location /rest/scheduling/api/v1/query {
                rewrite ^/rest/scheduling(.*)$ $1 break;
                proxy_pass {{ .Values.backend.query }};
            }
            {{ end }}
            
        }
    }