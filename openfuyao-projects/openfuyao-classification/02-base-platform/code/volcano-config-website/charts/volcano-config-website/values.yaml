images:
  core:
    repository: cr.openfuyao.cn/openfuyao/volcano-config-website
    pullPolicy: Always
  oauthProxy:
    repository: cr.openfuyao.cn/openfuyao/oauth-proxy
    tag: latest
    pullPolicy: Always

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace: volcano-system

service:
  type: NodePort
  port: 8080
  nodePort: 30881
  containerPort: 8080

enableOAuth: true

oauthProxy:
  containerPort: 9093
  client:
    id: "oauth-proxy"
    secret: "SECRETTS"
  urls:
    host: "/"
    loginURI: "/oauth2/oauth/authorize"
    redeemURI: "/oauth2/oauth/token"
    rootPrefix: "/volcano-config"	# 如果是核心组件后端，直接填"/"即可，如果是扩展组件前端，填写扩展组件consolePlugin CR 的 .spec.pluginName

# specify backend only when the backend is available
backend:
  scheduler: "http://scheduler-config-service.volcano-system.svc:9202"
  # 启用监控时填写完整集群域名：http://prometheus-k8s.monitoring.svc.cluster.local:9090
  # 独立部署时请按实际 Prometheus Service 地址填写，或置空禁用监控图表
  query: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

# set the field to mount the plugin to openFuyao web portal
openFuyao: true 
