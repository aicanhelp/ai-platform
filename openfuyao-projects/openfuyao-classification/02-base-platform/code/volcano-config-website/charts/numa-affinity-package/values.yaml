# =============================
# volcano-config-package
# =============================
volcano-config-package:
  numa-exporter:
    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/volcano-config-service
        pullPolicy: Always
    # 平台集成 Prometheus Operator 时保持 true；
    # 独立部署且未安装 ServiceMonitor CRD 时请改为 false。
    serviceMonitor:
      enabled: true

  volcano:
    components:
      enabled: true
      volcano:
        enabled: true
      resourceExporter:
        enabled: true
    images:
      resourceExporter:
        repository: cr.openfuyao.cn/openfuyao/volcano/resource-exporter
        tag: 0.1.0
        pullPolicy: Always
      vcWebhookManager:
        repository: hub.oepkgs.net/openfuyao/volcanosh/vc-webhook-manager
        tag: v1.9.0
        pullPolicy: Always
      vcControllerManager:
        repository: hub.oepkgs.net/openfuyao/volcanosh/vc-controller-manager
        tag: v1.9.0
        pullPolicy: Always
      vcScheduler:
        repository: hub.oepkgs.net/openfuyao/volcanosh/vc-scheduler
        tag: v1.9.0
        pullPolicy: Always

  scheduler-config:
    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/volcano-config-service
        pullPolicy: Always
      webhook:
        repository: cr.openfuyao.cn/openfuyao/numa-affinity-webhook
        pullPolicy: Always
      kubectl:
        repository: cr.openfuyao.cn/openfuyao/kubectl-openfuyao
        pullPolicy: IfNotPresent
    thirdPartyImages:
      alpine:
        repository: "hub.oepkgs.net/openfuyao/alpine/openssl"
        tag: "3.5.0"
        pullPolicy: IfNotPresent
    apiDisabled: false
    # numaadj DaemonSet controller-runtime 监听端口
    daemonset:
      metricsPort: 9180
      healthProbePort: 9181

# =============================
# volcano-config-website
# =============================
volcano-config-website:
  images:
    core:
      repository: cr.openfuyao.cn/openfuyao/volcano-config-website
      pullPolicy: Always
    oauthProxy:
      repository: cr.openfuyao.cn/openfuyao/oauth-proxy
      pullPolicy: Always

  enableOAuth: true
  openFuyao: true
  # Prometheus 查询地址，用于前端 NUMA 监控图表
  # 启用监控时填写完整集群域名：http://prometheus-k8s.monitoring.svc.cluster.local:9090
  # 独立部署时请按实际 Prometheus Service 地址填写，或置空禁用监控图表
  backend:
    scheduler: "http://scheduler-config-service.volcano-system.svc:9202"
    query: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
