{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cache-indexer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-indexer.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cache-indexer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-indexer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cache-indexer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cache-indexer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cache-indexer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "cache-indexer.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
