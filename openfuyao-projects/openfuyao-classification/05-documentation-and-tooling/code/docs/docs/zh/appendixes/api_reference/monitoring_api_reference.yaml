openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: 监控相关API接口参考。

paths:
  /cluster-metrics:
    get:
      tags: [集群监控]
      summary: 集群级别指标查询。
      description: 支持瞬时向量和范围向量两种查询模式。
      parameters:
        - in: query
          name: metrics_filter
          schema:
            type: string
            example: "cpu_usage|memory_total"
          description: 指标名称过滤器（竖线分隔多个指标）。
        - in: query
          name: time
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
            example: "2024-05-01 10:13:30"
          description: 瞬时查询时间点（格式：YYYY-MM-DD HH:MM:SS）。
        - in: query
          name: start
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
            example: "2024-05-01 10:00:30"
          description: 范围查询开始时间。
        - in: query
          name: end
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
            example: "2024-05-01 10:13:30"
          description: 范围查询结束时间。
        - in: query
          name: step
          schema:
            type: string
            pattern: "^(\\d+)(ms|s|m|h)$"
            example: "15s"
          description: 采样间隔（支持单位：ms/s/m/h）。
      responses:
        200:
          description: 成功返回指标数据。
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [metricName, data]
                      properties:
                        metricName:
                          type: string
                          example: cluster_cpu_usage
                        data:
                          oneOf:
                            - type: object
                              required: [resultType, result]
                              properties:
                                resultType:
                                  type: string
                                  enum: [vector]
                                result:
                                  type: array
                                  items:
                                    type: object
                                    required: [labels, sample]
                                    properties:
                                      labels:
                                        type: object
                                        additionalProperties:
                                          type: string
                                      sample:
                                        type: object
                                        required: [timestamp, value]
                                        properties:
                                          timestamp:
                                            type: integer
                                            format: int64
                                          value:
                                            type: number
                                            format: double
                            - type: object
                              required: [resultType, result]
                              properties:
                                resultType:
                                  type: string
                                  enum: [matrix]
                                result:
                                  type: array
                                  items:
                                    type: object
                                    required: [labels, series]
                                    properties:
                                      labels:
                                        type: object
                                        additionalProperties:
                                          type: string
                                      series:
                                        type: array
                                        items:
                                          type: object
                                          required: [timestamp, value]
                                          properties:
                                            timestamp:
                                              type: integer
                                              format: int64
                                            value:
                                              type: number
                                              format: double
              examples:
                instantVector:
                  value:
                    results:
                      - metricName: cluster_cpu_usage
                        data:
                          resultType: vector
                          result:
                            - labels:
                                namespace: monitoring
                              sample:
                                timestamp: 1714529610
                                value: 0.785
                rangeVector:
                  value:
                    results:
                      - metricName: cluster_memory_total
                        data:
                          resultType: matrix
                          result:
                            - labels: {}
                              series:
                                - timestamp: 1714529590
                                  value: 66894458880
                                - timestamp: 1714529605
                                  value: 66894458880
        400:
          description: 客户端请求参数错误。
          content:
            application/json:
              schema:
                type: object
                required: [ code, message ]
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 400
                    description: HTTP状态码。
                  message:
                    type: string
                    example: "Invalid parameters"
                    description: 错误描述信息。
              examples:
                invalidParam:
                  value:
                    code: 400
                    message: "无效的时间参数格式"
        503:
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                type: object
                required: [ code, message ]
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 503
                    description: HTTP状态码。
                  message:
                    type: string
                    example: "Service unavailable"
                    description: 错误描述信息。
              examples:
                maintenance:
                  value:
                    code: 503
                    message: "系统维护中，请稍后重试"