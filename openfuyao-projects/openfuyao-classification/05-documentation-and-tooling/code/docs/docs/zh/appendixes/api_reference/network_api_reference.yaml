      operationId: deleteRole
      parameters:
        - name: name
          in: path
          description: 角色名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
