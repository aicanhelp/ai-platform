openapi: 3.0.0
info:
  title: 
  description: Kubernetes 应用路由(Ingress)、角色(Role)和服务账户(ServiceAccount)相关API。
  version: v1.24
servers:
  - url: /

paths:
  #
  # Ingress 资源相关API
  #
  /api/kubernetes/apis/networking.k8s.io/v1/namespaces/{namespace}/ingresses/{name}:
    get:
      tags:
        - Ingresses
      summary: 读取指定的应用路由。
      description: 获取应用路由具体内容。
      operationId: readIngress
      parameters:
        - name: name
          in: path
          description: 应用路由名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                  - spec
                properties:
                  apiVersion:
                    type: string
                    default: networking.k8s.io/v1
                    description: API版本。
                  kind:
                    type: string
                    default: Ingress
                    description: 资源类型。
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 对象名称。
                      namespace:
                        type: string
                        description: 命名空间名称。
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: 对象标签。
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                        description: 对象注释。
                      resourceVersion:
                        type: string
                        description: 资源版本。
                      uid:
                        type: string
                        description: 对象唯一标识符。
                      creationTimestamp:
                        type: string
                        format: date-time
                        description: 创建时间戳。
                  spec:
                    type: object
                    description: 应用路由规范。
                    properties:
                      ingressClassName:
                        type: string
                        description: Ingress类名称。
                      defaultBackend:
                        type: object
                        properties:
                          service:
                            type: object
                            properties:
                              name:
                                type: string
                                description: 服务名称。
                              port:
                                type: object
                                properties:
                                  number:
                                    type: integer
                                    format: int32
                                    description: 端口号。
                                  name:
                                    type: string
                                    description: 端口名称。
                          resource:
                            type: object
                            properties:
                              apiGroup:
                                type: string
                                description: API组。
                              kind:
                                type: string
                                description: 资源类型。
                              name:
                                type: string
                                description: 资源名称。
                      tls:
                        type: array
                        description: TLS配置列表。
                        items:
                          type: object
                          properties:
                            hosts:
                              type: array
                              description: 主机名列表。
                              items:
                                type: string
                            secretName:
                              type: string
                              description: 保密字典名称。
                      rules:
                        type: array
                        description: 规则列表。
                        items:
                          type: object
                          properties:
                            host:
                              type: string
                              description: 主机名。
                            http:
                              type: object
                              properties:
                                paths:
                                  type: array
                                  description: 路径列表。
                                  items:
                                    type: object
                                    properties:
                                      path:
                                        type: string
                                        description: 路径。
                                      pathType:
                                        type: string
                                        description: 路径类型。
                                        enum: [Exact, Prefix, ImplementationSpecific]
                                      backend:
                                        type: object
                                        properties:
                                          service:
                                            type: object
                                            properties:
                                              name:
                                                type: string
                                                description: 服务名称。
                                              port:
                                                type: object
                                                properties:
                                                  number:
                                                    type: integer
                                                    format: int32
                                                    description: 端口号。
                                                  name:
                                                    type: string
                                                    description: 端口名称。
                                          resource:
                                            type: object
                                            properties:
                                              apiGroup:
                                                type: string
                                                description: API组。
                                              kind:
                                                type: string
                                                description: 资源类型。
                                              name:
                                                type: string
                                                description: 资源名称。
                  status:
                    type: object
                    description: 应用路由状态。
                    properties:
                      loadBalancer:
                        type: object
                        description: 负载均衡器状态。
                        properties:
                          ingress:
                            type: array
                            description: 入口列表。
                            items:
                              type: object
                              properties:
                                hostname:
                                  type: string
                                  description: 主机名。
                                ip:
                                  type: string
                                  description: IP地址。
                                ports:
                                  type: array
                                  description: 端口列表。
                                  items:
                                    type: object
                                    properties:
                                      port:
                                        type: integer
                                        format: int32
                                        description: 端口号。
                                      protocol:
                                        type: string
                                        description: 协议。
                                        enum: [TCP, UDP, SCTP]
        '401':
          description: 未鉴权。
    put:
      tags:
        - Ingresses
      summary: 更新指定的应用路由。
      description: 更新指定的应用路由。
      operationId: updateIngress
      parameters:
        - name: name
          in: path
          description: 应用路由名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: 限制所返回对象的字段的选择器。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
                - spec
              properties:
                apiVersion:
                  type: string
                  default: networking.k8s.io/v1
                  description: API版本。
                kind:
                  type: string
                  default: Ingress
                  description: 资源类型。
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 对象名称。
                    namespace:
                      type: string
                      description: 命名空间名称。
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      description: 对象标签。
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                      description: 对象注释。
                spec:
                  type: object
                  description: 应用路由规范。
                  properties:
                    ingressClassName:
                      type: string
                      description: Ingress类名称。
                    rules:
                      type: array
                      description: 规则列表。
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                            description: 主机名。
                          http:
                            type: object
                            properties:
                              paths:
                                type: array
                                description: 路径列表。
                                items:
                                  type: object
                                  properties:
                                    path:
                                      type: string
                                      description: 路径。
                                    pathType:
                                      type: string
                                      description: 路径类型。
                                      enum: [Exact, Prefix, ImplementationSpecific]
                                    backend:
                                      type: object
                                      properties:
                                        service:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              description: 服务名称。
                                            port:
                                              type: object
                                              properties:
                                                number:
                                                  type: integer
                                                  format: int32
                                                  description: 端口号。
            example:
              metadata:
                name: example-ingress
                namespace: default
              spec:
                rules:
                  - host: example.com
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: example-service
                              port:
                                number: 80
        required: true
      responses:
        '200':
          description: 成功。
        '201':
          description: 已创建。
        '401':
          description: 未鉴权。
    delete:
      tags:
        - Ingresses
      summary: 删除指定的应用路由。
      description: 删除一个应用路由。
      operationId: deleteIngress
      parameters:
        - name: name
          in: path
          description: 应用路由名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: 删除对象前的持续时间（秒数）。
          required: false
          schema:
            type: integer
            format: int32
        - name: propagationPolicy
          in: query
          description: 该字段决定是否以及如何执行垃圾收集。
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功。
        '202':
          description: 已接收。
        '401':
          description: 未鉴权。
    patch:
      tags:
        - Ingresses
      summary: 部分更新指定的应用路由。
      description: 部分更新指定的应用路由。
      operationId: patchIngress
      parameters:
        - name: name
          in: path
          description: 应用路由名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: 强制应用该请求。
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: 操作类型，如add、replace、remove。
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: 要操作的JSON路径。
                  value:
                    type: object
                    description: 新值（对于add和replace操作是必需的）。
            examples:
              添加标签:
                value:
                  - op: add
                    path: /metadata/labels
                    value:
                      data: value
              替换标签属性:
                value:
                  - op: replace
                    path: /metadata/labels/env
                    value: value1
              删除标签属性:
                value:
                  - op: remove
                    path: /metadata/labels/env
        required: true
      responses:
        '200':
          description: 成功。
        '201':
          description: 已更新。
        '401':
          description: 未鉴权。
  
  /api/kubernetes/apis/networking.k8s.io/v1/namespaces/{namespace}/ingresses:
    get:
      tags:
        - Ingresses
      summary: 获取应用路由列表。
      description: 获取应用路由列表。
      operationId: listIngresses
      parameters:
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
        - name: watch
          in: query
          description: 监视对所述资源的更改。
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: IngressList
                  apiVersion:
                    type: string
                    example: networking.k8s.io/v1
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - apiVersion
                        - kind
                        - metadata
                        - spec
                      properties:
                        apiVersion:
                          type: string
                          default: networking.k8s.io/v1
                          description: API版本。
                        kind:
                          type: string
                          default: Ingress
                          description: 资源类型。
                        metadata:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 对象名称。
                            namespace:
                              type: string
                              description: 命名空间名称。
                        spec:
                          type: object
                          description: 应用路由规范。
                          properties:
                            rules:
                              type: array
                              description: 规则列表。
                              items:
                                type: object
                                properties:
                                  host:
                                    type: string
                                    description: 主机名。
        '401':
          description: 未鉴权。
    post:
      tags:
        - Ingresses
      summary: 创建一个应用路由。
      description: 创建一个应用路由。
      operationId: createIngress
      parameters:
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
                - spec
              properties:
                apiVersion:
                  type: string
                  default: networking.k8s.io/v1
                  description: API版本。
                kind:
                  type: string
                  default: Ingress
                  description: 资源类型。
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 对象名称。
                    namespace:
                      type: string
                      description: 命名空间名称。
                spec:
                  type: object
                  description: 应用路由规范。
                  properties:
                    rules:
                      type: array
                      description: 规则列表。
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                            description: 主机名。
                          http:
                            type: object
                            properties:
                              paths:
                                type: array
                                description: 路径列表。
                                items:
                                  type: object
                                  properties:
                                    path:
                                      type: string
                                      description: 路径。
                                    pathType:
                                      type: string
                                      description: 路径类型。
                                      enum: [Exact, Prefix, ImplementationSpecific]
                                    backend:
                                      type: object
                                      properties:
                                        service:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              description: 服务名称。
                                            port:
                                              type: object
                                              properties:
                                                number:
                                                  type: integer
                                                  format: int32
                                                  description: 端口号。
            example:
              metadata:
                name: example-ingress
                namespace: default
              spec:
                rules:
                  - host: example.com
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: example-service
                              port:
                                number: 80
        required: true
      responses:
        '200':
          description: 成功。
        '201':
          description: 已创建。
        '202':
          description: 已接收。
        '401':
          description: 未鉴权。

  #
  # Role 资源相关API
  #
  /api/kubernetes/apis/rbac.authorization.k8s.io/v1/namespaces/{namespace}/roles/{name}:
    get:
      tags:
        - Roles
      summary: 读取指定的角色。
      description: 获取角色具体内容。
      operationId: readRole
      parameters:
        - name: name
          in: path
          description: 角色名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                  - rules
                properties:
                  apiVersion:
                    type: string
                    default: rbac.authorization.k8s.io/v1
                    description: API版本。
                  kind:
                    type: string
                    default: Role
                    description: 资源类型。
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 对象名称。
