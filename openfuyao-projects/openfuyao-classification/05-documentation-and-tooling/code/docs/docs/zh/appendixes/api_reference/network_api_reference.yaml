          schema:
            type: string
      responses:
        '200':
          description: 成功。
        '202':
          description: 已接收。
        '401':
          description: 未鉴权。
    patch:
      tags:
        - Roles
      summary: 部分更新指定的角色。
      description: 部分更新指定的角色。
      operationId: patchRole
      parameters:
        - name: name
          in: path
          description: 角色名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
