                  rules:
                    type: array
                    description: 规则列表。
                    items:
                      type: object
                      required:
                        - verbs
                      properties:
                        apiGroups:
                          type: array
                          description: API组列表。
                          items:
                            type: string
                        resources:
                          type: array
                          description: 资源列表。
                          items:
                            type: string
                        resourceNames:
                          type: array
                          description: 资源名称列表。
                          items:
                            type: string
                        verbs:
                          type: array
                          description: 动词列表。
                          items:
                            type: string
        '401':
          description: 未鉴权。
    put:
      tags:
        - Roles
      summary: 更新指定的角色。
      description: 更新指定的角色。
      operationId: updateRole
      parameters:
        - name: name
          in: path
          description: 角色名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
                - rules
              properties:
                apiVersion:
                  type: string
                  default: rbac.authorization.k8s.io/v1
                  description: API版本。
                kind:
                  type: string
                  default: Role
                  description: 资源类型。
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 对象名称。
                    namespace:
                      type: string
                      description: 命名空间名称。
                rules:
                  type: array
                  description: 规则列表。
                  items:
                    type: object
                    required:
                      - verbs
                    properties:
                      apiGroups:
                        type: array
                        description: API组列表。
                        items:
                          type: string
                      resources:
                        type: array
                        description: 资源列表。
                        items:
                          type: string
                      resourceNames:
                        type: array
                        description: 资源名称列表。
                        items:
                          type: string
                      verbs:
                        type: array
                        description: 动词列表。
                        items:
                          type: string
            example:
              metadata:
                namespace: default
                name: example-role
              rules:
                - apiGroups: [""]
                  resources: ["pods"]
                  verbs: ["get", "list", "watch"]
                - apiGroups: [""]
                  resources: ["pods/log"]
                  verbs: ["get"]
        required: true
      responses:
        '200':
          description: 成功。
        '201':
          description: 已创建。
        '401':
          description: 未鉴权。
    delete:
