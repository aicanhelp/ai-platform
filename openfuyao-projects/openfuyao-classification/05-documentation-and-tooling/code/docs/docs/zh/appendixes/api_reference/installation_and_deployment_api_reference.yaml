openapi: 3.0.0
info:
  title: 
  description: 提供集群创建和管理的接口。
  version: 1.0.0
servers:
  - url: http://api.example.com/v1
paths:
  /rest/cluster/v1/create:
    post:
      summary: 创建集群。
      description: 在openFuyao管理面创建业务集群。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml:
                  type: string
                  example: 
                    apiVersion: bke.bocloud.com/v1beta1
                    kind: BKECluster
                    metadata:
                      creationTimestamp: null
                      name: '1'
                      namespace: bke-cluster
                    spec:
                      clusterConfig:
                        addons:
                          - name: kubeproxy
                            param:
                              clusterNetworkMode: calico
                            version: v1.28.8
                          - name: calico
                            param:
                              calicoMode: vxlan
                              ipAutoDetectionMethod: skip-interface=nerdctl*
                            version: v3.25.0
                          - name: coredns
                            version: v1.10.1
                          - name: openfuyao-system-controller
                            param:
                              helmRepo: https://harbor.openfuyao.com/chartrepo/openfuyao
                            version: latest
                          - block: true
                            name: cluster-api
                            param:
                              manage: 'true'
                            version: v1.4.3
                        cluster:
                          apiServer:
                            extraArgs:
                              max-mutating-requests-inflight: '3000'
                              max-requests-inflight: '1000'
                              watch-cache-sizes: node#1000,pod#5000
                          certificatesDir: /etc/kubernetes/pki
                          containerRuntime:
                            cri: containerd
                            param:
                              data-root: /var/lib/containerd
                            runtime: runc
                          controllerManager:
                            extraArgs:
                              kube-api-burst: '1000'
                              kube-api-qps: '1000'
                          etcd:
                            dataDir: /var/lib/etcd
                          httpRepo:
                            domain: http.bocloud.k8s
                            ip: 192.168.201.85
                            port: '40080'
                            prefix: ''
                          imageRepo:
                            domain: harbor.openfuyao.com
                            ip: 199.91.74.185
                            port: '443'
                            prefix: openfuyao
                          kubelet:
                            extraArgs:
                              kube-api-burst: '2000'
                              kube-api-qps: '1000'
                            extraVolumes:
                              - hostPath: /var/lib/kubelet
                                name: kubelet-root-dir
                          kubernetesVersion: v1.28.8
                          networking:
                            dnsDomain: cluster.local
                            podSubnet: 10.250.0.0/16
                            serviceSubnet: 10.96.0.0/16
                          ntpServer: cn.pool.ntp.org:123
                          scheduler:
                            extraArgs:
                              kube-api-qps: '1000'
                        customExtra:
                          chart_password: chart
                          chart_username: chart
                          chartRepoPort: '38080'
                          clusterapi: latest
                          containerd: containerd-1.6.16-linux-{.arch}.tar.gz
                          domain: deploy.bocloud.k8s
                          host: 192.168.201.85
                          imageRepoPort: '40443'
                          nfsserverpath: /
                          otherRepo: harbor.openfuyao.com/openfuyao/
                          otherRepoIp: 199.91.74.185
                          otherSource: ''
                          yumRepoPort: '40080'
                        nodes:
                          - hostname: '1'
                            ip: '1'
                            port: '1'
                            role:
                              - master/node
                              - etcd
                            username: '1'
                            password: '1'
                          - hostname: '1'
                            ip: '1'
                            port: '1'
                            role:
                              - node
                            username: '1'
                            password: '1'
                      controlPlaneEndpoint: {}
                      pause: false
                    status:
                      agentStatus: {}
                      kubernetesVersion: ''
                      ready: false
      responses:
        '200':
          description: 成功部署集群。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success deploy
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: 请求数据异常。
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: 服务请求异常。



  /rest/cluster/v1/nodejudge:
    post:
      summary: 节点校验。
      description: 校验集群操作的节点信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NameSpace:
                  type: string
                  example: test
                Nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: master-1
                      ip:
                        type: string
                        example: 192.168.100.150
                      port:
                        type: string
                        example: '22'
                      username:
                        type: string
                        example: root
                      password:
                        type: string
                        example: '123456'
                BalanceIp:
                  type: string
                  example: 192.168.100.20
            examples:
              Example 1:
                value:
                  NameSpace: test
                  Nodes:
                    - name: master-1
                      ip: 192.168.100.150
                      port: '22'
                      username: root
                      password: '123456'
                  BalanceIp: 192.168.100.20
      responses:
        '200':
          description: 节点校验成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: 节点校验失败。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: 192.168.100.150 ip is not ok
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: Internal server error



  /rest/cluster/v1/list:
    post:
      summary: 获取集群列表。
      description: 展示集群中创建的业务集群列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  type: string
                  description: 集群名称。
                  example: ""
                Status:
                  type: string
                  description: 集群状态。
                  example: ""
                CurrentPage:
                  type: integer
                  description: 当前页码。
                  example: 1
                PageSize:
                  type: integer
                  description: 每页大小。
                  example: 10
      responses:
        '200':
          description: 查询集群列表成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 集群名称。
                              example: isntaller-bke
                            version:
                              type: string
                              description: 集群K8s版本。
                              example: v1.28.8
                            status:
                              type: string
                              description: 集群健康状态。
                              example: Healthy
                            create_time:
                              type: string
                              description: 集群创建时间。
                              example: "2025-03-07 03:53:10"
                            node_sum:
                              type: integer
                              description: 集群中节点个数。
                              example: 2
                            is_amd:
                              type: boolean
                              description: CPU架构是否为AMD
                              example: true
                            is_arm:
                              type: boolean
                              description: CPU架构是否为ARM。
                              example: false
                            os_list:
                              type: array
                              items:
                                type: string
                              description: 集群OS版本。
                              example: ["openEuler 22.03 LTS"]
                            container_runtime:
                              type: string
                              description: 集群运行时种类。
                              example: containerd
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: 请求数据异常。
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: 服务请求异常。



  /ws/cluster/v1/log/{clusterName}:
    get:
      summary: 获取集群日志。
      description: 用于创建中的日志实时展示。
      parameters:
        - name: clusterName
          in: path
          required: true
          description: 集群的名称。
          schema:
            type: string
      responses:
        '200':
          description: 查询日志成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Msg:
                    type: string
                    example: get the log of cluster.
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Msg:
                    type: string
                    example: 请求数据异常。
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Msg:
                    type: string
                    example: 服务请求异常。



  /rest/cluster/v1/delete/{clusterName}:
    delete:
      summary: 删除集群。
      description: 删除所选择的集群。
      parameters:
        - name: clusterName
          in: path
          required: true
          description: 集群名称。
          schema:
            type: string
      responses:
        '200':
          description: 删除集群成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Msg:
                    type: string
                    example: delete the cluster successfully.
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Msg:
                    type: string
                    example: 请求数据异常。
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Msg:
                    type: string
                    example: 服务请求异常。



  /rest/cluster/v1/config:
    get:
      summary: 获取集群配置信息。
      description: 获取集群的配置信息。
      parameters: []
      responses:
        '200':
          description: 成功获取集群配置信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageRepo:
                    type: string
                    description: 镜像仓库地址。
                    example: deploy.bocloud.k8s
                  httpRepo:
                    type: string
                    description: http仓库地址。
                    example: http://192.168.100.20:38080
                  ip:
                    type: string
                    description: 初始化节点IP。
                    example: 192.168.100.20




  /rest/cluster/v1/node/list:
    post:
      summary: 获取集群节点列表。
      description: 集群中所含节点列表的信息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ClusterName:
                  type: string
                  description: 集群名称。
                  example: my_cluster
                NodeName:
                  type: string
                  description: 节点名称。
                  example: ""
      responses:
        '200':
          description: 查询节点列表成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 节点名称。
                              example: master1
                            ip:
                              type: string
                              description: 节点IP地址。
                              example: 192.168.100.150
                            role:
                              type: string
                              description: 节点类型。
                              example: master,node
                            cpu:
                              type: integer
                              description: CPU的个数。
                              example: 8
                            memory:
                              type: integer
                              description: 内存大小。
                              example: 14
                            architecture:
                              type: string
                              description: CPU架构。
                              example: arm64
                            status:
                              type: string
                              description: 节点状态。
                              example: Ready
                            os:
                              type: string
                              description: 节点OS版本。
                              example: openEuler 22.03 LTS
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: 请求数据异常。
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: 服务请求异常。





  /rest/cluster/v1/clusterBC:
    post:
      summary: 获取集群配置文件。
      operationId: getClusterConfigFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clusterName:
                  type: string
                  description: 要获取配置文件的集群名称。
                  example: my-cluster
      responses:
        '200':
          description: 返回集群配置文件。
          content:
            application/json:
              schema:
                type: object
                properties:
                  configFile:
                    type: string
                    description: 集群的配置文件内容。
                    example: 配置文件内容字符串。
        '400':
          description: 请求错误，集群名称无效或缺失。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid cluster name"
        '404':
          description: 集群未找到。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Cluster not found"



  /rest/cluster/v1/scaleUp:
    post:
      summary: 扩容集群。
      operationId: scaleUpCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: 修改的集群配置yaml文件内容。
                  example: |
                    replicas: 5
                    resources:
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
                    ...
      responses:
        '200':
          description: 集群扩容成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"



  /rest/cluster/v1/scaleDown:
    post:
      summary: 缩容集群。
      operationId: scaleDownCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: 修改的集群配置yaml文件内容。
                  example: |
                    replicas: 2
                    resources:
                      limits:
                        cpu: "200m"
                        memory: "256Mi"
                    ...
      responses:
        '200':
          description: 集群缩容成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"





  /rest/cluster/v1/upgrade:
    post:
      summary: 升级K8s集群。
      operationId: upgradeK8sCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: 修改的集群配置yaml文件内容。
                  example: |
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: my-deployment
                    spec:
                      replicas: 3
                      template:
                        spec:
                          containers:
                          - name: my-container
                            image: my-image:latest
                    ...
      responses:
        '200':
          description: 集群升级成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: 请求数据异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: 服务请求异常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"














