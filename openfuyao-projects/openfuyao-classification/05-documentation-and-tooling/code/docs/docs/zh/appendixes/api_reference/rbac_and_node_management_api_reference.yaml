          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 格式化输出。
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: 返回结果的最大数量。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: 返回的页码。
          required: false
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          description: 指示修改操作不应持久化，仅进行验证。
          required: false
          schema:
            type: string
            enum: [All]
        - name: fieldSelector
          in: query
          description: 按字段选择器过滤返回的对象。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 按标签选择器过滤返回的对象。
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: 强制执行请求。
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              description: JSON Patch操作列表。
              items:
                type: object
                description: 单个补丁操作。
      responses:
        '200':
          description: 更新成功。
        '201':
          description: 已更新。
        '401':
          description: 未授权访问。

