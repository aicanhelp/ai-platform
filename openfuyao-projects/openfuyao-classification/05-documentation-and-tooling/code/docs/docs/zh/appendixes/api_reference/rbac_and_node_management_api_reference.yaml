openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: 用于Kubernetes RBAC权限控制和节点操作的API规范。
  contact:
    name: Kubernetes API技术支持
    email: support@kubernetes.io

servers:
  - url: /api/kubernetes
    description: Kubernetes API基础端点。

tags:
  - name: 角色绑定
    description: 角色绑定相关操作。
  - name: 集群角色
    description: 集群角色相关操作。
  - name: 集群角色绑定
    description: 集群角色绑定相关操作。
  - name: 事件
    description: 集群事件相关操作。
  - name: 节点
    description: 集群节点相关操作。

paths:
  # RoleBinding APIs - 角色绑定API
  /apis/rbac.authorization.k8s.io/v1/namespaces/{namespace}/rolebindings/{name}:
    get:
      summary: 读取指定的角色绑定。
      description: 获取指定角色绑定的详细信息。
      tags:
        - 角色绑定
      parameters:
        - name: name
          in: path
          description: 资源名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 格式化输出。
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: 返回结果的最大数量。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: 返回的页码。
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 操作成功。
          content:
            application/json:
              schema:
                type: object
                description: 角色绑定对象。
        '401':
          description: 未授权访问。
        '404':
          description: 资源未找到。
    put:
      summary: 更新指定的角色绑定。
      description: 更新指定的角色绑定配置。
      tags:
        - 角色绑定
      parameters:
        - name: name
          in: path
          description: 资源名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 格式化输出。
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: 返回结果的最大数量。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: 返回的页码。
          required: false
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          description: 指示修改操作不应持久化，仅进行验证。
          required: false
          schema:
            type: string
            enum: [All]
        - name: fieldSelector
          in: query
          description: 按字段选择器过滤返回的对象。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 按标签选择器过滤返回的对象。
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 角色绑定配置对象。
      responses:
        '200':
          description: 更新成功。
        '201':
          description: 创建成功。
        '401':
          description: 未授权访问。
    delete:
      summary: 删除指定的角色绑定。
      description: 删除指定的角色绑定。
      tags:
        - 角色绑定
      parameters:
        - name: name
          in: path
          description: 资源名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 格式化输出。
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: 返回结果的最大数量。
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: 返回的页码。
          required: false
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          description: 指示修改操作不应持久化，仅进行验证。
          required: false
          schema:
            type: string
            enum: [All]
        - name: gracePeriodSeconds
          in: query
          description: 删除前的宽限期时长（秒）。
          required: false
          schema:
            type: integer
            minimum: 0
        - name: propagationPolicy
          in: query
          description: 垃圾回收策略。
          required: false
          schema:
            type: string
            enum: [Orphan, Background, Foreground]
      responses:
        '200':
          description: 删除成功。
        '202':
          description: 删除请求已接受。
        '401':
          description: 未授权访问。
    patch:
      summary: 部分更新指定的角色绑定。
      description: 部分更新指定角色绑定的配置。
      tags:
        - 角色绑定
