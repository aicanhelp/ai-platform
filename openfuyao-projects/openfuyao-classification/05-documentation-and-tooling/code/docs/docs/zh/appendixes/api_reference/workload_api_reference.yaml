              type: array
              description: JSON Patch操作列表。
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: 操作类型。
                    enum:
                      - add
                      - remove
                      - replace
                      - move
                      - copy
                      - test
                  path:
                    type: string
                    description: 要操作的JSON指针路径。
                  value:
                    description: 用于add、replace或test操作的值。
                  from:
                    type: string
                    description: 用于move或copy操作的源JSON指针路径。
            examples:
              addLabelNew:
                summary: 新增标签（无label时）。
                value:
                  - op: add
                    path: /metadata/labels
                    value:
                      data: value
              addLabelExisting:
                summary: 新增标签（有label时）。
                value:
                  - op: add
                    path: /metadata/labels/env
                    value: value
              replaceLabel:
                summary: 修改标签。
                value:
                  - op: replace
                    path: /metadata/labels/env
                    value: value1
              removeLabel:
                summary: 删除标签。
                value:
                  - op: remove
                    path: /metadata/labels/env
