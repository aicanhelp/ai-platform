openapi: 3.0.0
info:
  title: 
  description: 提供全链路日志采集、查询、分析能力。
  version: 1.0.0
servers:
  - url: https://openfuyao.example.com:port/logging
    description: 生产环境日志服务端点

paths:
  /rest/logging/v1/namespaces/{namespace}/logs:
    get:
      summary: 查询命名空间下的日志
      description: 筛选一个时间段内某个命名空间的日志。
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: 命名空间名称
        - name: startTime
          in: query
          schema:
            type: string
          description: 开始时间戳
        - name: timePeriod
          in: query
          schema:
            type: string
          description: 时间范围
        - name: endTime
          in: query
          schema:
            type: string
          description: 结束时间戳
        - name: level
          in: query
          schema:
            type: string
            enum: [error, warning, info, debug, critical]
          description: 日志级别
        - name: keyword
          in: query
          schema:
            type: string
          description: 关键字
        - name: size
          in: query
          schema:
            type: string
          description: 返回最大日志条数
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              example:
