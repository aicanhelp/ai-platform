  /rest/logging/v1/update-config:
    patch:
      summary: 更新采集工作列表
      description: |
        这里的更新采集工作的采集路径信息包括添加新采集工作和修改已有的采集工作。其中：
        - 添加新采集工作：如果原采集工作列表中没有该接口中传入该采集工作的名称,则会在配置文件中添加这一对应采集工作,并将路径添加为该采集工作的采集路径。
        - 修改已有的采集工作：如果原采集工作列表中存在该接口中传入该采集工作的名称,则会在配置文件中对于这一采集工作的采集路径进行更新,更新值为当前传入的结构体中对应的数值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobName:
                  type: string
                path:
                  type: string
            example:
              {
                "jobName": "my-application-job",
                "path": "/var/log/random/new-job/*.log",
              }
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              example:
                { "code": 200, "msg": "Operation successful", "data": null }
        "400":
          description: 请求体参数错误
        "500":
          description: 服务器内部错误,更新采集工作列表失败

  /rest/logging/v1/delete-job/{job_name}:
    delete:
      summary: 删除采集工作
      description: 根据键值对的索引方式删除在配置文件中的某项采集工作。
      parameters:
        - name: job_name
          in: path
          required: true
          schema:
            type: string
          description: 将要删除的采集工作名称
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              example:
                { "code": 200, "msg": "Operation successful", "data": null }
        "400":
          description: 请求体参数错误
        "500":
          description: 服务器内部错误,删除采集工作失败

