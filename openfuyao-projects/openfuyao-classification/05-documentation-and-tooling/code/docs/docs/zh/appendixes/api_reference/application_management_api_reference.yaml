openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: 用于在Kubernetes环境中管理Helm发布的API接口。
  contact:
    name: OpenFuyao API技术支持
    email: support@openfuyao.io

servers:
  - url: /rest/application-management/v1beta1
    description: API基础端点。

tags:
  - name: Helm发布
    description: 管理Helm发布的相关操作。

paths:
  /helm-releases:
    get:
      summary: 获取Helm发布基础信息。
      operationId: listHelmReleases
      tags:
        - Helm发布
      parameters:
        - name: extension
          in: query
          schema:
            type: boolean
            default: false
          description: 显示扩展信息。
      responses:
        '200':
          description: 成功获取Helm发布列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                            - info
                            - chart
                          properties:
                            name:
                              type: string
                              description: Helm发布名称。
                              example: atune-log-watcher
                            info:
                              type: object
                              description: 发布部署信息。
                              properties:
                                firstDeployed:
                                  type: string
                                  format: date-time
                                  description: 首次部署时间戳。
                                lastDeployed:
                                  type: string
                                  format: date-time
                                  description: 最后部署时间戳。
                                deleted:
                                  type: string
                                  description: 删除时间戳（如果适用）。
                                description:
                                  type: string
                                  description: 发布描述。
                                  example: 安装完成
                                status:
                                  type: string
                                  description: 当前发布状态。
                                  enum:
                                    - deployed
                                    - failed
                                    - pending
                                    - superseded
                            chart:
                              type: object
                              description: Chart元数据和配置。
                              properties:
                                metadata:
                                  type: object
                                  description: Chart元数据。
                                  properties:
                                    name:
                                      type: string
                                      description: Chart名称。
                                      example: atune-log-watcher
                                    version:
                                      type: string
                                      description: Chart版本。
                                      example: 0.5.0
                                    description:
                                      type: string
                                      description: Chart描述。
                                      example: 用于Kubernetes的Helm Chart
                                    apiVersion:
                                      type: string
                                      description: API版本。
                                      example: v2
                                    appVersion:
                                      type: string
                                      description: 应用程序版本。
                                      example: 1.16.0
                                    type:
                                      type: string
                                      description: Chart类型。
                                      example: application
                                values:
                                  type: object
                                  description: Chart配置值。
                            version:
                              type: integer
                              description: 发布版本号。
                              example: 1
                            namespace:
                              type: string
                              description: Kubernetes命名空间。
                              example: default
                            labels:
                              type: object
                              description: 发布标签。
                              additionalProperties:
                                type: string
                              example:
                                modifiedAt: "1703725925"
                                name: atune-log-watcher
                                owner: helm
                                status: deployed
                      totalItems:
                        type: integer
                        description: 总条目数。
                      currentPage:
                        type: integer
                        description: 当前页码。
                      totalPage:
                        type: integer
                        description: 总页数。

  /helm-releases/namespace/{namespace}/release/{release}:
    get:
      summary: 获取Helm发布详细信息。
      operationId: getHelmReleaseDetails
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: 成功获取Helm发布详细信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    required:
                      - name
                      - info
                      - chart
                      - resources
                    properties:
                      name:
                        type: string
                        description: Helm发布名称。
                        example: my-nginx
                      info:
                        type: object
                        description: 发布部署信息。
                        properties:
                          firstDeployed:
                            type: string
                            format: date-time
                            description: 首次部署时间。
                          lastDeployed:
                            type: string
                            format: date-time
                            description: 最后部署时间。
                          deleted:
                            type: string
                            description: 删除时间。
                          description:
                            type: string
                            description: 发布描述。
                          status:
                            type: string
                            description: 发布状态。
                            enum:
                              - deployed
                              - failed
                              - pending
                      chart:
                        type: object
                        description: Chart元数据和配置。
                        properties:
                          metadata:
                            type: object
                            description: Chart元数据详情。
                          values:
                            type: object
                            description: Chart配置值。
                      resources:
                        type: array
                        description: 与发布关联的Kubernetes资源。
                        items:
                          type: object
                          properties:
                            apiVersion:
                              type: string
                              description: Kubernetes API版本。
                              example: apps/v1
                            kind:
                              type: string
                              description: Kubernetes资源类型。
                              example: Deployment
                            name:
                              type: string
                              description: 资源名称。
                              example: my-nginx
                            namespace:
                              type: string
                              description: 资源所在命名空间。
                              example: default
                      version:
                        type: integer
                        description: 发布版本号。
                      namespace:
                        type: string
                        description: Kubernetes命名空间。
                      labels:
                        type: object
                        description: 发布标签。
                        additionalProperties:
                          type: string

    put:
      summary: 升级Helm发布。
      operationId: upgradeHelmRelease
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: string
                  description: 升级时的可选配置值YAML。
                  example: |
                    image:
                      tag: new-version
                    replicaCount: 2
      responses:
        '200':
          description: Helm发布升级已启动。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    properties:
                      readme:
                        type: string
                        description: Chart说明文档。
                      values:
                        type: string
                        description: 配置值。

    delete:
      summary: 删除Helm发布。
      operationId: deleteHelmRelease
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: Helm发布删除成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功

    post:
      summary: 安装Helm发布。
      operationId: installHelmRelease
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chartName
                - repoName
                - version
                - values
              properties:
                chartName:
                  type: string
                  description: 要安装的Chart名称。
                  example: contour
                repoName:
                  type: string
                  description: Chart所在的仓库名称。
                  example: bitnami
                version:
                  type: string
                  description: 要安装的Chart版本。
                  example: 14.0.2
                values:
                  type: string
                  description: Chart配置的Values YAML。
                  example: |
                    global:
                      imageRegistry: ''
                      imagePullSecrets: []
                    nameOverride: ''
                    fullnameOverride: ''
      responses:
        '200':
          description: Helm发布安装已启动。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Helm Chart正在安装

  /helm-releases/namespace/{namespace}/release/{release}/history:
    get:
      summary: 获取Helm发布版本历史。
      operationId: getHelmReleaseHistory
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: 成功获取发布历史。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - namespace
                        - status
                      properties:
                        name:
                          type: string
                          description: 发布名称。
                          example: my-nginx
                        version:
                          type: integer
                          description: 发布版本号。
                          example: 5
                        namespace:
                          type: string
                          description: Kubernetes命名空间。
                          example: default
                        firstDeployed:
                          type: string
                          format: date-time
                          description: 首次部署时间戳。
                        lastDeployed:
                          type: string
                          format: date-time
                          description: 最后部署时间戳。
                        labels:
                          type: object
                          description: 发布标签。
                          additionalProperties:
                            type: string
                        status:
                          type: string
                          description: 发布状态。
                          enum:
                            - deployed
                            - superseded
                            - failed
                        chartName:
                          type: string
                          description: Chart名称。
                          example: nginx
                        chartVersion:
                          type: string
                          description: Chart版本。
                          example: 16.0.3
                        apiVersion:
                          type: string
                          description: Chart API版本。
                          example: v2
                        appVersion:
                          type: string
                          description: 应用程序版本。
                          example: 1.25.4

  /helm-releases/namespace/{namespace}/release/{release}/rollback:
    post:
      summary: 回滚Helm发布。
      operationId: rollbackHelmRelease
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: 要回滚到的版本号（可选）。
      responses:
        '200':
          description: Helm发布回滚成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功

  /helm-releases/namespace/{namespace}/release/{release}/getmanifest:
    get:
      summary: 获取Helm发布清单。
      operationId: getHelmReleaseManifest
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: 成功获取发布清单。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: string
                    description: 发布的YAML清单文件。

  /helm-releases/namespace/{namespace}/release/{release}/getvalues:
    get:
      summary: 获取Helm发布配置值。
      operationId: getHelmReleaseValues
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: 成功获取发布配置值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    description: Helm发布的配置值。

  /helm-releases/namespace/{namespace}/release/{release}/pods:
    get:
      summary: 获取Helm发布的Pod和容器信息。
      operationId: getHelmReleasePods
      tags:
        - Helm发布
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes命名空间。
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm发布名称。
      responses:
        '200':
          description: 成功获取发布的Pod信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: object
                    description: Pod名称和对应的容器列表。
                    additionalProperties:
                      type: array
                      items:
                        type: string

  /helm-releases/releasestatus/{chart}:
    get:
      summary: 获取Helm发布状态。
      operationId: getHelmReleaseStatus
      tags:
        - Helm发布
      parameters:
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
      responses:
        '200':
          description: 成功获取发布状态。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: 成功
                  data:
                    type: string
                    description: 发布状态（例如："running"或"not ready"）。