openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: 用于管理Kubernetes集群中ConsolePlugin资源的API接口。
  contact:
    name: OpenFuyao API技术支持
    email: support@openfuyao.io

servers:
  - url: /rest/plugin-management/v1beta1
    description: API基础端点。

tags:
  - name: ConsolePlugin管理
    description: 管理ConsolePlugin资源的相关操作。

paths:
  /consoleplugins:
    get:
      summary: 获取ConsolePlugin列表。
      operationId: listConsolePlugins
      tags:
        - ConsolePlugin管理
      description: 返回当前集群内的所有ConsolePlugin资源。
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 返回消息。
                  data:
                    type: array
                    description: 返回数据。
                    items:
                      type: object
                      properties:
                        release:
                          type: string
                          description: 扩展组所属helm release名称。
                          example: logging
                        displayName:
                          type: string
                          description: 展示在菜单上的扩展组件名称。
                          example: 日志
                        pluginName:
                          type: string
                          description: 扩展组件的唯一名称。
                          example: logging
                        order:
                          type: string
                          description: 扩展组件在菜单上的顺位。
                          example: "6"
                        subPages:
                          type: array
                          description: 展示在菜单上该扩展组件的二级菜单。
                          items:
                            type: object
                            properties:
                              pageName:
                                type: string
                                description: 扩展子页面的名称。
                                example: logSearch
                              displayName:
                                type: string
                                description: 展示在菜单上的扩展子页面名称。
                                example: 日志查询
                        entrypoint:
                          type: string
                          description: 导航按钮在页面上挂载的位置。
                          example: /container_platform
                          enum:
                            - "/"
                            - "/container_platform"
                        url:
                          type: string
                          description: 扩展组件的资源URL。
                          example: /dist/logging.mjs
                        enabled:
                          type: boolean
                          description: 该扩展是否启用。
                          example: true
        '404':
          description: CRD资源不存在。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: CRD资源不存在

  /consoleplugins/{pluginName}:
    get:
      summary: 获取单个ConsolePlugin资源。
      operationId: getConsolePlugin
      tags:
        - ConsolePlugin管理
      description: 根据资源名称返回当前集群内的特定ConsolePlugin资源。
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: 需要获取的ConsolePlugin名称。
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 返回消息。
                  data:
                    type: object
                    description: 返回数据。
                    properties:
                      release:
                        type: string
                        description: 扩展组所属helm release名称。
                        example: testing
                      displayName:
                        type: string
                        description: 展示在菜单上的扩展组件名称。
                        example: Console Plugin 案例
                      pluginName:
                        type: string
                        description: 扩展组件的唯一名称。
                        example: test-plugin
                      order:
                        type: string
                        description: 扩展组件在菜单上的顺位。
                      subPages:
                        type: array
                        description: 展示在菜单上该扩展组件的二级菜单。
                        items:
                          type: object
                          properties:
                            pageName:
                              type: string
                              description: 扩展子页面的名称。
                            displayName:
                              type: string
                              description: 展示在菜单上的扩展子页面名称。
                      entrypoint:
                        type: string
                        description: 导航按钮在页面上挂载的位置。
                        example: "/"
                        enum:
                          - "/"
                          - "/container_platform"
                      url:
                        type: string
                        description: 扩展组件的资源URL。
                        example: /dist/index.js
                      enabled:
                        type: boolean
                        description: 该扩展是否启用。
                        example: false
        '404':
          description: CRD或该CR资源不存在。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting consoleplugins.console.openfuyao.com "test" not found

  /consoleplugins/{pluginName}/enabled:
    get:
      summary: 获取扩展界面启用状态。
      operationId: getConsolePluginEnabledStatus
      tags:
        - ConsolePlugin管理
      description: 获取当前ConsolePlugin对应扩展界面的启用状态。
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: 需要获取其界面启用状态的ConsolePlugin名称。
      responses:
        '200':
          description: 查询成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 返回消息。
                  data:
                    type: object
                    description: 返回数据。
                    properties:
                      pluginName:
                        type: string
                        description: 扩展组件名称。
                        example: logging
                      enabled:
                        type: boolean
                        description: 扩展界面启用状态。
                        example: true
        '400':
          description: 请求参数错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Missing path parameter pluginName
        '404':
          description: CRD或该CR资源不存在。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting ConsolePlugin consoleplugins.console.openfuyao.com "test" not found

    post:
      summary: 更改扩展界面启用状态。
      operationId: updateConsolePluginEnabledStatus
      tags:
        - ConsolePlugin管理
      description: 更改当前ConsolePlugin对应扩展界面的启用状态。
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: 需要更改其界面启用状态的ConsolePlugin名称。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pluginName
                - enabled
              properties:
                pluginName:
                  type: string
                  description: 扩展组件名称。
                  example: name
                enabled:
                  type: string
                  description: 该扩展界面的期望启用状态。
                  example: "true"
      responses:
        '200':
          description: 更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 返回消息。
                  data:
                    type: object
                    description: 返回数据。
                    properties:
                      pluginName:
                        type: string
                        description: 扩展组件名称。
                        example: logging
                      enabled:
                        type: boolean
                        description: 扩展界面启用状态。
                        example: true
        '400':
          description: 请求参数错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Error parsing request body
        '404':
          description: CRD或该CR资源不存在。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting ConsolePlugin consoleplugins.console.openfuyao.com "test" not found
        '500':
          description: 服务器内部错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: 服务器内部错误