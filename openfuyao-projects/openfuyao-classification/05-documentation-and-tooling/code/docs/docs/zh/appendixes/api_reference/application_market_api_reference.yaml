openapi: 3.0.0
info:
  title: 
  description: 基于Helm的应用市场全功能API接口。
  version: 2.0.0
tags:
  - name: Helm Charts
    description: Helm Chart全生命周期管理。
  - name: Helm Repos
    description: Helm仓库配置管理。
  - name: Chart Files
    description: Chart文件操作接口。

paths:
  /helm-charts:
    get:
      tags: [Helm Charts]
      summary: 查询最新Chart列表。
      description: 获取符合过滤条件的所有Helm Chart列表，支持分页和多条件筛选。
      operationId: getLatestCharts
      parameters:
        - $ref: '#/components/parameters/RepositoryFilter'
        - $ref: '#/components/parameters/ChartFilter'
        - $ref: '#/components/parameters/SceneFilter'
        - $ref: '#/components/parameters/AppTypeFilter'
        - $ref: '#/components/parameters/SortType'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 成功获取Chart列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: nginx
                              description: Chart名称。
                            latestVersion:
                              type: string
                              example: 1.2.3
                              description: 最新版本。
                            description:
                              type: string
                              example: NGINX Ingress Controller
                              description: 描述信息。
                            repoName:
                              type: string
                              example: bitnami
                              description: 所属仓库。
                            updatedAt:
                              type: string
                              format: date-time
                              description: 最后更新时间。
                          required: [name, latestVersion]
                      total:
                        type: integer
                        example: 100
                        description: 总数。
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Helm Charts]
      summary: 上传Helm Chart包。
      description: 上传新的Helm Chart包到仓库，支持tgz格式压缩包。
      operationId: uploadChart
      requestBody:
        description: Helm Chart包文件。
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chart:
                  type: string
                  format: binary
                  description: Helm Chart包文件(tgz格式)。
              required: [chart]
      responses:
        '200':
          description: 上传成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]
        '400':
          $ref: '#/components/responses/InvalidFile'

  /helm-charts/official-tags:
    get:
      tags: [Helm Charts]
      summary: 按官方标签过滤Chart。
      description: 获取带有官方认证标签的Chart列表。
      operationId: getChartsWithOfficialTags
      parameters:
        - name: tag
          in: query
          required: true
          schema:
            type: string
            enum: [verified, recommended, security]
          description: 官方认证标签。
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 成功获取带标签Chart列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: nginx
                              description: Chart名称。
                            latestVersion:
                              type: string
                              example: 1.2.3
                              description: 最新版本。
                            description:
                              type: string
                              example: NGINX Ingress Controller
                              description: 描述信息。
                            repoName:
                              type: string
                              example: bitnami
                              description: 所属仓库。
                            updatedAt:
                              type: string
                              format: date-time
                              description: 最后更新时间。
                          required: [name, latestVersion]
                      total:
                        type: integer
                        example: 100
                        description: 总数。

  /helm-charts/count:
    get:
      tags: [Helm Charts]
      summary: 获取本地Chart总数。
      description: 统计本地仓库中所有Chart的总数量。
      operationId: countChart
      responses:
        '200':
          description: 统计成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: integer
                    example: 42
                    description: Chart总数。

  /helm-charts/{chart}:
    delete:
      tags: [Helm Charts]
      summary: 删除Chart所有版本。
      description: 从仓库中删除指定名称Chart的所有版本。
      operationId: deleteChart
      parameters:
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
          example: nginx
      responses:
        '200':
          description: 删除成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]

  /helm-charts/{chart}/versions/{version}:
    delete:
      tags: [Helm Charts]
      summary: 删除指定Chart版本。
      description: 从仓库中删除指定Chart的特定版本。
      operationId: deleteChartVersions
      parameters:
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
          example: nginx
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: 版本号。
          example: 1.2.3
      responses:
        '200':
          description: 版本删除成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]

  /helm-repos:
    get:
      tags: [Helm Repos]
      summary: 列出所有仓库。
      description: 获取所有已配置的Helm仓库列表。
      operationId: listHelmRepo
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 仓库列表获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: bitnami
                              description: 仓库名称。
                            url:
                              type: string
                              example: https://charts.bitnami.com/bitnami
                              description: 仓库地址。
                            chartCount:
                              type: integer
                              example: 150
                              description: Chart数量。
                            lastSyncStatus:
                              type: string
                              enum: [success, failed, syncing]
                              description: 最后同步状态。
                          required: [name, url]
                      total:
                        type: integer
                        description: 总数。

    post:
      tags: [Helm Repos]
      summary: 创建新仓库。
      description: 添加新的Helm仓库配置。
      operationId: createHelmRepo
      requestBody:
        description: 仓库配置信息。
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: my-repo
                  description: 仓库名称。
                url:
                  type: string
                  example: https://my-repo.com/charts
                  description: 仓库URL。
                authType:
                  type: string
                  enum: [none, basic, token]
                  description: 认证类型。
                username:
                  type: string
                  description: 用户名(Basic认证)。
                password:
                  type: string
                  description: 密码(Basic认证)。
                token:
                  type: string
                  description: 访问令牌(Token认证)。
              required: [name, url]
      responses:
        '200':
          description: 仓库创建成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]

  /helm-repos/{repo}:
    get:
      tags: [Helm Repos]
      summary: 获取仓库详情。
      description: 获取指定仓库的详细配置信息。
      operationId: getHelmRepo
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 仓库详情获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: bitnami
                        description: 仓库名称。
                      url:
                        type: string
                        example: https://charts.bitnami.com/bitnami
                        description: 仓库地址。
                      chartCount:
                        type: integer
                        example: 150
                        description: Chart数量。
                      lastSyncStatus:
                        type: string
                        enum: [success, failed, syncing]
                        description: 最后同步状态。
                    required: [name, url]

    put:
      tags: [Helm Repos]
      summary: 更新仓库配置。
      description: 修改指定仓库的配置信息。
      operationId: updateHelmRepo
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
      requestBody:
        description: 更新后的仓库配置。
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: https://new-repo-url.com
                  description: 新仓库URL。
                authType:
                  type: string
                  enum: [none, basic, token]
                  description: 认证类型。
                username:
                  type: string
                  description: 用户名(Basic认证)。
                password:
                  type: string
                  description: 密码(Basic认证)。
                token:
                  type: string
                  description: 访问令牌(Token认证)。
      responses:
        '200':
          description: 配置更新成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]

    delete:
      tags: [Helm Repos]
      summary: 删除仓库。
      description: 从系统中移除指定的Helm仓库。
      operationId: deleteHelmRepo
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
      responses:
        '200':
          description: 仓库删除成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                required: [code, msg]

  /helm-repos/{repo}/sync:
    get:
      tags: [Helm Repos]
      summary: 获取仓库同步状态。
      description: 查询指定仓库的最后同步状态和时间。
      operationId: getRepoSyncStatus
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
      responses:
        '200':
          description: 状态获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [syncing, success, failed]
                        description: 同步状态。
                      lastSyncTime:
                        type: string
                        format: date-time
                        description: 最后同步时间。

  /helm-repos/{repo}/charts/{chart}:
    get:
      tags: [Chart Files]
      summary: 获取Chart所有版本。
      description: 获取指定仓库中某个Chart的所有可用版本。
      operationId: getChartVersions
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
          example: nginx
      responses:
        '200':
          description: 版本列表获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: string
                          example: 1.2.3
                          description: 版本号。
                        appVersion:
                          type: string
                          example: 1.25.0
                          description: 应用版本。
                        created:
                          type: string
                          format: date-time
                          description: 创建时间。
                      required: [version]

  /helm-repos/{repo}/charts/{chart}/versions/{version}:
    get:
      tags: [Chart Files]
      summary: 获取指定版本详情。
      description: 获取Chart特定版本的详细信息。
      operationId: getChartVersion
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
          example: nginx
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: 版本号。
          example: 1.2.3
      responses:
        '200':
          description: 版本详情获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Chart名称。
                          version:
                            type: string
                            description: 版本号。
                          description:
                            type: string
                            description: 描述信息。
                        required: [name, version]
                      dependencies:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 依赖名称。
                            version:
                              type: string
                              description: 依赖版本。
                        description: 依赖列表。
                      files:
                        type: array
                        items:
                          type: string
                          example: README.md
                        description: 包含文件列表。

  /helm-repos/{repo}/charts/{chart}/versions/{version}/files:
    get:
      tags: [Chart Files]
      summary: 获取Chart文件内容。
      description: 获取Chart包中特定文件的内容。
      operationId: getChartFiles
      parameters:
        - name: repo
          in: path
          required: true
          schema:
            type: string
          description: 仓库名称。
          example: bitnami
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart名称。
          example: nginx
        - name: version
          in: path
          required: true
          schema:
            type: string
          description: 版本号。
          example: 1.2.3
        - name: fileType
          in: query
          schema:
            type: string
            enum: [values, readme, chart]
          description: 文件类型过滤。
      responses:
        '200':
          description: 文件内容获取成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: 状态码。
                  msg:
                    type: string
                    example: success
                    description: 状态消息。
                  data:
                    type: string
                    description: 文件原始内容。

components:
  parameters:
    RepositoryFilter:
      name: repository
      in: query
      schema:
        type: string
      description: 按仓库名称过滤。
      required: false
    ChartFilter:
      name: chart
      in: query
      schema:
        type: string
      description: 按Chart名称过滤。
      required: false
    SceneFilter:
      name: scene
      in: query
      schema:
        type: string
        enum: [AI, BigData, Database]
      description: 按使用场景过滤。
      required: false
    AppTypeFilter:
      name: appType
      in: query
      schema:
        type: string
        enum: [stateless, stateful, operator]
      description: 按应用类型过滤。
      required: false
    SortType:
      name: sortType
      in: query
      schema:
        type: string
        enum: [updateTime, name, downloads]
        default: updateTime
      description: 排序方式。
      required: false
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 分页页码。
      required: false
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页数量。
      required: false

  responses:
    BasicSuccess:
      description: 通用成功响应。
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 200
                description: 状态码。
              msg:
                type: string
                example: success
                description: 状态消息。
            required: [code, msg]

    InvalidFile:
      description: 无效文件格式。
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
                description: 错误码。
              msg:
                type: string
                example: invalid chart package
                description: 错误信息。
            required: [code, msg]

    InternalError:
      description: 服务器内部错误。
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
                description: 错误码。
              msg:
                type: string
                example: internal server error
                description: 错误信息。
            required: [code, msg]

security:
  - bearerAuth: []