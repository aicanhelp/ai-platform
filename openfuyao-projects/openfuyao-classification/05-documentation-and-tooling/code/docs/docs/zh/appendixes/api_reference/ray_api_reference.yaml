openapi: 3.0.0
info:
  title: 
  description: Ray相关的API接口。
  version: 1.0.0
tags:
  - name: Overview
    description: Ray概览信息。
  - name: RayCluster
    description: Ray集群。
  - name: RayJob
    description: Ray作业。
  - name: RayService
    description: Ray服务。


paths:
  /rest/v1/overview/all:
    get:
      summary: 获取Ray概览信息。
      description: 获取Ray集群、作业、服务的统计数据。
      operationId: getOverview
      tags:
        - Overview
      responses:
        "200":
          description: 成功获取Ray概览信息。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 自定义状态码。
                    example: 200
                  msg:
                    type: string
                    description: 消息，返回状态信息。
                    example: success
                  data:
                    type: object
                    properties:
                      rayclusters:
                        type: integer
                        description: 活跃的RayClusters数量。
                        example: 1
                      rayjobs:
                        type: integer
                        description: 活跃的RayJobs数量。
                        example: 0
                      rayservices:
                        type: integer
                        description: 活跃的RayServices数量。
                        example: 0
                      total:
                        type: integer
                        description: 活跃的Ray集群总数。
                        example: 1
        "500":
          description: 服务器内部错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误状态码。
                    example: 500
                  msg:
                    type: string
                    description: 错误信息。
                    example: "Internal server error"
                  data:
                    type: object
                    description: 附加信息。
                    example: ""

  /rest/v1/raycluster/create:
    post:
      summary: 创建RayCluster。
      description: 根据配置文件创建RayCluster。
      operationId: createRayCluster
      tags:
        - RayCluster
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件路径。
                createBy:
                  type: string
                  description: 创建人信息。
                isStart:
                  type: boolean
                  description: 是否启动，`true`为创建并启动，`false`为仅创建。
                config:
                  type: string
                  description: 配置信息（以文本形式传递）。
              required:
                - createBy
                - config
      responses:
        "200":
          description: 创建RayCluster成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success

        "400":
          description: 客户端请求错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                    description: 错误状态码。
                  msg:
                    type: string
                    example: "bad request"
                    description: 错误信息。
                  data:
                    type: object
                    example: ""
                    description: 附加信息。

  /rest/v1/raycluster/list:
    post:
      summary: 查询RayCluster列表。
      description: 查询所有RayCluster列表。
      operationId: listRayClusters
      tags:
        - RayCluster
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                createBy:
                  type: string
                  description: 创建人名称。
                  example: ZhangSan
                rayVersion:
                  type: string
                  description: Ray版本。
                  example: "2.9.0"
                name:
                  type: string
                  description: RayCluster名称（支持模糊匹配）。
                  example: autoscaler
                status:
                  type: integer
                  description: "RayCluster状态（0: all, 1: running, 2: stopped, 3: failed）"
                  example: 1
      responses:
        "200":
          description: 成功获取RayCluster列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: raycluster-autoscaler-1
                            namespace:
                              type: string
                              example: vcjob
                            ray_version:
                              type: string
                              example: "2.9.0"
                            create_by:
                              type: string
                              example: ZhangSan
                            cluster_status:
                              type: string
                              example: running
                            create_time:
                              type: string
                              format: date-time
                              example: "2025-02-06 14:36:36"
                            update_time:
                              type: string
                              format: date-time
                              example: "2025-02-06 14:36:36"
                      total:
                        type: integer
                        example: 1

        "500":
          description: 服务器内部错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误状态码。
                    example: 500
                  msg:
                    type: string
                    description: 错误信息。
                    example: "remote server busy"
                  data:
                    type: object
                    description: 附加信息。
                    example: ""

  /rest/v1/raycluster/get/{namespace}/{raycluster_name}:
    get:
      summary: 获取RayCluster详情。
      description: 根据命名空间和名称获取RayCluster详情。
      operationId: getRayCluster
      tags:
        - RayCluster
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: RayCluster所在的命名空间。
        - name: raycluster_name
          in: path
          required: true
          schema:
            type: string
          description: RayCluster名称。
      responses:
        "200":
          description: 成功获取RayCluster详情。
