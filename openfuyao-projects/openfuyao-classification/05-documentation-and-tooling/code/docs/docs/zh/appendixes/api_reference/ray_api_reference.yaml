                      ray_version:
                        type: string
                        example: "2.9.0"
                      create_by:
                        type: string
                        example: ZhangSan
                      cluster_status:
                        type: string
                        example: running
                      gcs_port:
                        type: string
                        example: "32312"
                      cluster_ip:
                        type: string
                        example: "172.17.70.175"
                      dashboard_port:
                        type: string
                        example: "31484"
                      create_time:
                        type: string
                        format: date-time
                        example: "2025-02-06 14:36:36"
                      update_time:
                        type: string
                        format: date-time
                        example: "2025-02-06 14:36:36"

        "400":
          description: 客户端请求错误。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                    description: 错误状态码。
                  msg:
                    type: string
                    example: "bad request"
                    description: 错误信息。
                  data:
                    type: object
                    example: {}
                    description: 附加信息。


        "404":
          description: 资源未找到。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                    description: 错误状态码。
                  msg:
                    type: string
                    example: "Not Found"
                    description: 错误信息。
                  data:
                    type: object
                    example: {}
                    description: 附加信息。

