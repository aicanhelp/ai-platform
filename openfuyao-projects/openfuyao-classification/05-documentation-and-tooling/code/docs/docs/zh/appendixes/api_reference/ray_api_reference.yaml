                            name:
                              type: string
                              example: rayjob-sample
                            namespace:
                              type: string
                              example: default
                            create_by:
                              type: string
                              example: ZhangSan
                            error_info:
                              type: string
                              example: ""
                            config_detail:
                              type: string
