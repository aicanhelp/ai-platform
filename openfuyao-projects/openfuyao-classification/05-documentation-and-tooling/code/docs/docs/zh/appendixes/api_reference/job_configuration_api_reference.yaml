          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: 限制所返回对象的字段的选择器。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 任务配置对象。
            example:
              metadata:
                name: example-job
                namespace: default
              spec:
                template:
                  spec:
                    containers:
                      - name: example-job
                        image: busybox
                        command: ["sh", "-c", "echo Hello! && sleep 3600"]
                    restartPolicy: Never
        required: true
