          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: 强制应用该请求。
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: JSON Patch操作列表。
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: 操作类型，如add、replace、remove。
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: 要操作的JSON路径。
                  value:
                    type: object
                    description: 新值（对于add和replace操作是必需的）。
            examples:
              添加标签:
                value:
                  - op: add
                    path: /metadata/labels
                    value:
                      data: value
              添加标签属性:
                value:
                  - op: add
                    path: /metadata/labels/env
                    value: value
              替换标签属性:
                value:
                  - op: replace
                    path: /metadata/labels/env
                    value: value1
              删除标签属性:
                value:
                  - op: remove
