          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 任务对象。
        '401':
          description: 未鉴权。
    put:
      tags:
        - Jobs
