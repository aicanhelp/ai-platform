        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 任务对象。
        '201':
          description: 已创建。
          content:
            application/json:
              schema:
                type: object
                description: 任务对象。
        '401':
          description: 未鉴权。
    delete:
