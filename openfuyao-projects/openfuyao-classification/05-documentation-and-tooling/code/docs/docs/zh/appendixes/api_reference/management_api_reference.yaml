  #
  # LimitRange 资源相关API
  #
  /api/kubernetes/api/v1/namespaces/{namespace}/limitranges/{name}:
    get:
      tags:
        - LimitRanges
      summary: 读取指定的限制范围。
      description: 获取限制范围具体内容。
      operationId: readLimitRange
      parameters:
        - name: name
          in: path
          description: 限制范围名称。
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: 命名空间名称。
          required: true
          schema:
