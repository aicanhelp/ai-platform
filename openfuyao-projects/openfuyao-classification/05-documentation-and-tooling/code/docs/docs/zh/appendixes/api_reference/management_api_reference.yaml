                    description: 资源类型。
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 对象名称。
                      namespace:
                        type: string
                        description: 命名空间名称。
                  spec:
                    type: object
                    description: 限制范围规范。
                    properties:
