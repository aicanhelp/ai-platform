                            labels:
                              type: object
                              additionalProperties:
                                type: string
                              description: 对象标签。
        '401':
          description: 未鉴权。
    post:
      tags:
        - Namespaces
      summary: 创建一个命名空间。
      description: 创建一个命名空间。
      operationId: createNamespace
      parameters:
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
