          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: NamespaceList
                  apiVersion:
                    type: string
                    example: v1
                  items:
                    type: array
