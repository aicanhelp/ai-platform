                            type:
                              type: string
                              description: 限制类型。
                              enum: [Container, Pod, PersistentVolumeClaim]
                            max:
                              type: object
                              additionalProperties:
                                type: string
                              description: 最大限制。
                            min:
                              type: object
                              additionalProperties:
                                type: string
                              description: 最小限制。
                            default:
                              type: object
                              additionalProperties:
                                type: string
                              description: 默认限制。
                            defaultRequest:
                              type: object
                              additionalProperties:
                                type: string
                              description: 默认请求。
        '401':
          description: 未鉴权。
    put:
      tags:
        - LimitRanges
