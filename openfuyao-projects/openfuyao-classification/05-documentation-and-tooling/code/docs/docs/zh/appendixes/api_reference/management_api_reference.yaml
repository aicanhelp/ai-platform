openapi: 3.0.0
info:
  title: 
  description: Kubernetes 管理类API接口文档，包括Namespace、ResourceQuota和LimitRange。
  version: v1.24
servers:
  - url: /

paths:
  #
  # Namespace 资源相关API
  #
  /api/kubernetes/api/v1/namespaces/{name}:
    get:
      tags:
        - Namespaces
      summary: 读取指定的命名空间。
      description: 获取命名空间具体内容。
      operationId: readNamespace
      parameters:
        - name: name
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                properties:
                  apiVersion:
                    type: string
                    default: v1
                    description: API版本。
                  kind:
                    type: string
                    default: Namespace
                    description: 资源类型。
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 对象名称。
                      namespace:
                        type: string
                        description: 命名空间名称。
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: 对象标签。
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                        description: 对象注释。
                      resourceVersion:
                        type: string
                        description: 资源版本。
                      uid:
                        type: string
                        description: 对象唯一标识符。
                      creationTimestamp:
                        type: string
                        format: date-time
                        description: 创建时间戳。
                  spec:
                    type: object
                    description: 命名空间规范。
                    properties:
                      finalizers:
                        type: array
                        description: 终结器列表。
                        items:
                          type: string
                  status:
                    type: object
                    description: 命名空间状态。
                    properties:
                      phase:
                        type: string
                        description: 命名空间状态阶段。
                        enum: [Active, Terminating]
        '401':
          description: 未鉴权。
    put:
      tags:
        - Namespaces
      summary: 更新指定的命名空间。
      description: 更新指定的命名空间。
      operationId: updateNamespace
      parameters:
        - name: name
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: 限制所返回对象的字段的选择器。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
              properties:
                apiVersion:
                  type: string
                  default: v1
                  description: API版本。
                kind:
                  type: string
                  default: Namespace
                  description: 资源类型。
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 对象名称。
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      description: 对象标签。
            example:
              metadata:
                name: example-namespace
        required: true
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                properties:
                  apiVersion:
                    type: string
                    default: v1
                    description: API版本。
                  kind:
                    type: string
                    default: Namespace
                    description: 资源类型。
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 对象名称。
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: 对象标签。
                  spec:
                    type: object
                    description: 命名空间规范。
                    properties:
                      finalizers:
                        type: array
                        description: 终结器列表。
                        items:
                          type: string
                  status:
                    type: object
                    description: 命名空间状态。
                    properties:
                      phase:
                        type: string
                        description: 命名空间状态阶段。
                        enum: [Active, Terminating]
        '201':
          description: 已创建。
        '401':
          description: 未鉴权。
    delete:
      tags:
        - Namespaces
      summary: 删除指定的命名空间。
      description: 删除一个命名空间。
      operationId: deleteNamespace
      parameters:
        - name: name
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: 删除对象前的持续时间（秒数）。
          required: false
          schema:
            type: integer
            format: int32
        - name: propagationPolicy
          in: query
          description: 该字段决定是否以及如何执行垃圾收集。
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功。
        '202':
          description: 已接收。
        '401':
          description: 未鉴权。
    patch:
      tags:
        - Namespaces
      summary: 部分更新指定的命名空间。
      description: 部分更新指定的命名空间。
      operationId: patchNamespace
      parameters:
        - name: name
          in: path
          description: 命名空间名称。
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: 表示不应该持久化所请求的修改。
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: 强制应用该请求。
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: 操作类型，如add、replace、remove。
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: 要操作的JSON路径。
                  value:
                    type: object
                    description: 新值（对于add和replace操作是必需的）。
        required: true
      responses:
        '200':
          description: 成功。
        '201':
          description: 已更新。
        '401':
          description: 未鉴权。
  
  /api/kubernetes/api/v1/namespaces:
