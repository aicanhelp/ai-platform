openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: APIs used to manage Helm releases in the Kubernetes environment.
  contact:
    name: OpenFuyao API technical support
    email: support@openfuyao.io

servers:
  - url: /rest/application-management/v1beta1
    description: Basic API endpoint.

tags:
  - name: Helm release
    description: Operations managing Helm releases.

paths:
  /helm-releases:
    get:
      summary: Obtaining basic information about Helm releases.
      operationId: listHelmReleases
      tags:
        - Helm release
      parameters:
        - name: extension
          in: query
          schema:
            type: boolean
            default: false
          description: Displaying extension information.
      responses:
        '200':
          description: Helm release list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                            - info
                            - chart
                          properties:
                            name:
                              type: string
                              description: Helm release name.
                              example: atune-log-watcher
                            info:
                              type: object
                              description: Release deployment information.
                              properties:
                                firstDeployed:
                                  type: string
                                  format: date-time
                                  description: Timestamp of the first deployment.
                                lastDeployed:
                                  type: string
                                  format: date-time
                                  description: Timestamp of the last deployment.
                                deleted:
                                  type: string
                                  description: Deletion timestamp (if applicable).
                                description:
                                  type: string
                                  description: Release description.
                                  example: Installation completed
                                status:
                                  type: string
                                  description: Current release status.
                                  enum:
                                    - deployed
                                    - failed
                                    - pending
                                    - superseded
                            chart:
                              type: object
                              description: Chart metadata and configuration.
                              properties:
                                metadata:
                                  type: object
                                  description: Chart metadata.
                                  properties:
                                    name:
                                      type: string
                                      description: Chart name.
                                      example: atune-log-watcher
                                    version:
                                      type: string
                                      description: Chart version.
                                      example: 0.5.0
                                    description:
                                      type: string
                                      description: Chart description.
                                      example: Helm chart for Kubernetes
                                    apiVersion:
                                      type: string
                                      description: API version.
                                      example: v2
                                    appVersion:
                                      type: string
                                      description: Application version.
                                      example: 1.16.0
                                    type:
                                      type: string
                                      description: Chart type.
                                      example: application
                                values:
                                  type: object
                                  description: Chart configuration value.
                            version:
                              type: integer
                              description: Release version.
                              example: 1
                            namespace:
                              type: string
                              description: Kubernetes namespace.
                              example: default
                            labels:
                              type: object
                              description: Release label.
                              additionalProperties:
                                type: string
                              example:
                                modifiedAt: "1703725925"
                                name: atune-log-watcher
                                owner: helm
                                status: deployed
                      totalItems:
                        type: integer
                        description: Number of total items.
                      currentPage:
                        type: integer
                        description: Current page number.
                      totalPage:
                        type: integer
                        description: Total number of pages.

  /helm-releases/namespace/{namespace}/release/{release}:
    get:
      summary: Getting Helm release details.
      operationId: getHelmReleaseDetails
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Helm release details obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: object
                    required:
                      - name
                      - info
                      - chart
                      - resources
                    properties:
                      name:
                        type: string
                        description: Helm release name.
                        example: my-nginx
                      info:
                        type: object
                        description: Release deployment information.
                        properties:
                          firstDeployed:
                            type: string
                            format: date-time
                            description: Time of the first deployment.
                          lastDeployed:
                            type: string
                            format: date-time
                            description: Time of the last deployment.
                          deleted:
                            type: string
                            description: Deletion time.
                          description:
                            type: string
                            description: Release description.
                          status:
                            type: string
                            description: Release status.
                            enum:
                              - deployed
                              - failed
                              - pending
                      chart:
                        type: object
                        description: Chart metadata and configuration.
                        properties:
                          metadata:
                            type: object
                            description: Chart metadata details.
                          values:
                            type: object
                            description: Chart configuration value.
                      resources:
                        type: array
                        description: Kubernetes resources associated with the release.
                        items:
                          type: object
                          properties:
                            apiVersion:
                              type: string
                              description: Kubernetes API version.
                              example: apps/v1
                            kind:
                              type: string
                              description: Kubernetes resource type.
                              example: Deployment
                            name:
                              type: string
                              description: Resource name.
                              example: my-nginx
                            namespace:
                              type: string
                              description: Namespace of the resource.
                              example: default
                      version:
                        type: integer
                        description: Release version.
                      namespace:
                        type: string
                        description: Kubernetes namespace.
                      labels:
                        type: object
                        description: Release label.
                        additionalProperties:
                          type: string

    put:
      summary: Upgrading a Helm release.
      operationId: upgradeHelmRelease
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: string
                  description: Configurable YAML values for upgrades.
                  example: |
                    image:
                      tag: new-version
                    replicaCount: 2
      responses:
        '200':
          description: Helm release upgrade started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      readme:
                        type: string
                        description: Chart description document.
                      values:
                        type: string
                        description: Configuration value.

    delete:
      summary: Deleting a Helm release.
      operationId: deleteHelmRelease
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Helm release deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success

    post:
      summary: Installing a Helm release.
      operationId: installHelmRelease
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chartName
                - repoName
                - version
                - values
              properties:
                chartName:
                  type: string
                  description: Name of the chart to be installed.
                  example: contour
                repoName:
                  type: string
                  description: Name of the repository where the chart is located.
                  example: bitnami
                version:
                  type: string
                  description: Version of the chart to be installed.
                  example: 14.0.2
                values:
                  type: string
                  description: Values file (YAML) configured for the chart.
                  example: |
                    global:
                      imageRegistry: ''
                      imagePullSecrets: []
                    nameOverride: ''
                    fullnameOverride: ''
      responses:
        '200':
          description: Helm release installation started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: The Helm chart is being installed

  /helm-releases/namespace/{namespace}/release/{release}/history:
    get:
      summary: Getting the Helm release history.
      operationId: getHelmReleaseHistory
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Release history obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - namespace
                        - status
                      properties:
                        name:
                          type: string
                          description: Release name.
                          example: my-nginx
                        version:
                          type: integer
                          description: Release version.
                          example: 5
                        namespace:
                          type: string
                          description: Kubernetes namespace.
                          example: default
                        firstDeployed:
                          type: string
                          format: date-time
                          description: Timestamp of the first deployment.
                        lastDeployed:
                          type: string
                          format: date-time
                          description: Timestamp of the last deployment.
                        labels:
                          type: object
                          description: Release label.
                          additionalProperties:
                            type: string
                        status:
                          type: string
                          description: Release status.
                          enum:
                            - deployed
                            - superseded
                            - failed
                        chartName:
                          type: string
                          description: Chart name.
                          example: nginx
                        chartVersion:
                          type: string
                          description: Chart version.
                          example: 16.0.3
                        apiVersion:
                          type: string
                          description: Chart API version.
                          example: v2
                        appVersion:
                          type: string
                          description: Application version.
                          example: 1.25.4

  /helm-releases/namespace/{namespace}/release/{release}/rollback:
    post:
      summary: Rolling back a Helm release.
      operationId: rollbackHelmRelease
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
        - name: version
          in: query
          required: false
          schema:
            type: integer
          description: (Optional) Version number to be rolled back to.
      responses:
        '200':
          description: Helm release rolled back successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success

  /helm-releases/namespace/{namespace}/release/{release}/getmanifest:
    get:
      summary: Getting the Helm release list.
      operationId: getHelmReleaseManifest
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Release list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: string
                    description: Released YAML list file.

  /helm-releases/namespace/{namespace}/release/{release}/getvalues:
    get:
      summary: Getting Helm release configuration values.
      operationId: getHelmReleaseValues
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Configuration value of the release obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: object
                    description: Configuration value of the Helm release.

  /helm-releases/namespace/{namespace}/release/{release}/pods:
    get:
      summary: Retrieving pod and container details for a Helm release.
      operationId: getHelmReleasePods
      tags:
        - Helm release
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Kubernetes namespace.
        - name: release
          in: path
          required: true
          schema:
            type: string
          description: Helm release name.
      responses:
        '200':
          description: Pod information of the release obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: object
                    description: Pod name and the corresponding container list.
                    additionalProperties:
                      type: array
                      items:
                        type: string

  /helm-releases/releasestatus/{chart}:
    get:
      summary: Getting the status of a Helm release.
      operationId: getHelmReleaseStatus
      tags:
        - Helm release
      parameters:
        - name: chart
          in: path
          required: true
          schema:
            type: string
          description: Chart name.
      responses:
        '200':
          description: Release status obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: Success
                  data:
                    type: string
                    description: Release status (for example, "running" or "not ready").
