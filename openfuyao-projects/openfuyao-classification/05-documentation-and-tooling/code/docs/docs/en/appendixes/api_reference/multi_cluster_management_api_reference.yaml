openapi: 3.0.0
info:
  title: 
  version: v1beta1
  description: Multi-cluster management APIs.

paths:
  /rest/multicluster/v1beta1/resources/clusters:
    get:
      summary: Obtaining a cluster list.
      description: Returning a list of all current clusters and related resource information.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        clustername:
                          type: string
                        clusterlabels:
                          type: array
                          items:
                            type: string
                        clusterresources:
                          type: object
                          properties:
                            allocatablecpu:
                              type: string
                            allocatablemem:
                              type: string
                            allocatedcpu:
                              type: string
                            allocatedmem:
                              type: string
        '400':
          description: Request data error.
        '500':
          description: Service request error.

  /rest/multicluster/v1beta1/clusters:
    post:
      summary: Bringing a cluster under management.
      description: Bringing a new cluster under management.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kubeconfig]
              properties:
                name:
                  type: string
                kubeconfig:
                  type: object
                  description: Kubeconfig object.
                clusterlabels:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Cluster managed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
        '400':
          description: Request data error.
        '500':
          description: Service request error.

  /rest/multicluster/v1beta1/clusters/{clustername}:
    patch:
      summary: Modifying a cluster label.
      description: Updating the label information of a managed cluster.
      parameters:
        - in: path
          name: clustername
          required: true
          schema:
            type: string
          description: Cluster name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clusterlabels:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Label modified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
        '400':
          description: Request data error.
        '500':
          description: Service request error.

    delete:
      summary: Deleting a cluster from management.
      description: Deleting a specified cluster from the control plane.
      parameters:
        - in: path
          name: clustername
          required: true
          schema:
            type: string
          description: Cluster name.
      responses:
        '200':
          description: Cluster deleted successfully from management.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Message:
                    type: string
        '400':
          description: Request data error.
        '500':
          description: Service request error.

  /rest/multicluster/v1beta1/clusters/{clustername}/kubeconfig:
    get:
      summary: Viewing a cluster certificate.
      description: Viewing kubeconfig information of a specified cluster.
      parameters:
        - in: path
          name: clustername
          required: true
          schema:
            type: string
          description: Cluster name.
      responses:
        '200':
          description: Permission verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  preferences:
                    type: object
                  clusters:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        cluster:
                          type: object
                          properties:
                            certificate-authority-data:
                              type: string
                            server:
                              type: string
                  contexts:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        context:
                          type: object
                          properties:
                            cluster:
                              type: string
                            user:
                              type: string
                  current-context:
                    type: string
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        user:
                          type: object
                          properties:
                            client-certificate-data:
                              type: string
                            client-key-data:
                              type: string
        '400':
          description: Request data error.
        '403':
          description: No permission.
