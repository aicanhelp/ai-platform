openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: APIs used to manage ConsolePlugin resources in a Kubernetes cluster.
  contact:
    name: OpenFuyao API technical support
    email: support@openfuyao.io

servers:
  - url: /rest/plugin-management/v1beta1
    description: Basic API endpoint.

tags:
  - name: ConsolePlugin management
    description: Operations related to ConsolePlugin resource management.

paths:
  /consoleplugins:
    get:
      summary: Obtaining the ConsolePlugin list.
      operationId: listConsolePlugins
      tags:
        - ConsolePlugin management
      description: Returning all ConsolePlugin resources in the current cluster.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: success
                    description: Response message.
                  data:
                    type: array
                    description: Returned data.
                    items:
                      type: object
                      properties:
                        release:
                          type: string
                          description: Name of the Helm release to which the extension group belongs.
                          example: logging
                        displayName:
                          type: string
                          description: Name of the extension displayed on the menu.
                          example: Log
                        pluginName:
                          type: string
                          description: Unique name of the extension.
                          example: logging
                        order:
                          type: string
                          description: Sequence of the extension on the menu.
                          example: "6"
                        subPages:
                          type: array
                          description: Submenu of the extension displayed on the menu.
                          items:
                            type: object
                            properties:
                              pageName:
                                type: string
                                description: Name of the extension subpage.
                                example: logSearch
                              displayName:
                                type: string
                                description: Name of the extension subpage displayed on the menu.
                                example: Log query
                        entrypoint:
                          type: string
                          description: Position of the navigation button on the page.
                          example: /container_platform
                          enum:
                            - "/"
                            - "/container_platform"
                        url:
                          type: string
                          description: Resource URL of the extension.
                          example: /dist/logging.mjs
                        enabled:
                          type: boolean
                          description: Whether the extension is enabled.
                          example: true
        '404':
          description: The CRD resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: The CRD resource does not exist.

  /consoleplugins/{pluginName}:
    get:
      summary: Obtaining a single ConsolePlugin resource.
      operationId: getConsolePlugin
      tags:
        - ConsolePlugin management
      description: Returning a specified ConsolePlugin resource in the current cluster by resource name.
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: Name of the ConsolePlugin resource to be obtained.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: success
                    description: Response message.
                  data:
                    type: object
                    description: Returned data.
                    properties:
                      release:
                        type: string
                        description: Name of the Helm release to which the extension group belongs.
                        example: testing
                      displayName:
                        type: string
                        description: Name of the extension displayed on the menu.
                        example: ConsolePlugin case
                      pluginName:
                        type: string
                        description: Unique name of the extension.
                        example: test-plugin
                      order:
                        type: string
                        description: Sequence of the extension on the menu.
                      subPages:
                        type: array
                        description: Submenu of the extension displayed on the menu.
                        items:
                          type: object
                          properties:
                            pageName:
                              type: string
                              description: Name of the extension subpage.
                            displayName:
                              type: string
                              description: Name of the extension subpage displayed on the menu.
                      entrypoint:
                        type: string
                        description: Position of the navigation button on the page.
                        example: "/"
                        enum:
                          - "/"
                          - "/container_platform"
                      url:
                        type: string
                        description: Resource URL of the extension.
                        example: /dist/index.js
                      enabled:
                        type: boolean
                        description: Whether the extension is enabled.
                        example: false
        '404':
          description: The CRD or CR resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting consoleplugins.console.openfuyao.com "test" not found

  /consoleplugins/{pluginName}/enabled:
    get:
      summary: Obtaining the enabling status of the extension interface.
      operationId: getConsolePluginEnabledStatus
      tags:
        - ConsolePlugin management
      description: Obtaining the enabling status of the extension interface corresponding to the current ConsolePlugin.
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: Name of the ConsolePlugin resource whose interface enabling status needs to be obtained.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: success
                    description: Response message.
                  data:
                    type: object
                    description: Returned data.
                    properties:
                      pluginName:
                        type: string
                        description: Extension name.
                        example: logging
                      enabled:
                        type: boolean
                        description: Enabling status of the extension interface.
                        example: true
        '400':
          description: Request parameter error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Missing path parameter pluginName
        '404':
          description: The CRD or CR resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting ConsolePlugin consoleplugins.console.openfuyao.com "test" not found

    post:
      summary: Changing the enabling status of the extension interface.
      operationId: updateConsolePluginEnabledStatus
      tags:
        - ConsolePlugin management
      description: Changing the enabling status of the extension interface corresponding to the current ConsolePlugin.
      parameters:
        - name: pluginName
          in: path
          required: true
          schema:
            type: string
          description: Name of the ConsolePlugin resource whose interface enabling status needs to be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pluginName
                - enabled
              properties:
                pluginName:
                  type: string
                  description: Extension name.
                  example: name
                enabled:
                  type: string
                  description: Expected enabling status of the extension interface.
                  example: "true"
      responses:
        '200':
          description: Updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: success
                    description: Response message.
                  data:
                    type: object
                    description: Returned data.
                    properties:
                      pluginName:
                        type: string
                        description: Extension name.
                        example: logging
                      enabled:
                        type: boolean
                        description: Enabling status of the extension interface.
                        example: true
        '400':
          description: Request parameter error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Error parsing request body
        '404':
          description: The CRD or CR resource does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                  msg:
                    type: string
                    example: Error getting ConsolePlugin consoleplugins.console.openfuyao.com "test" not found
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: Internal server error.
