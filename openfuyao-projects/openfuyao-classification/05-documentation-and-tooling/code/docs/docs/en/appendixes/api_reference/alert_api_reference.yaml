openapi: 3.0.0
info:
  title: 
  description: Alert-related APIs.
  version: 1.0.0
tags:
  - name: Alert management
    description: Alert management APIs.
  - name: Silence rule management
    description: APIs related to silence rule management.

paths:
  /rest/alert/api/v2/alerts:
    get:
      tags: [Alert management]
      summary: Obtaining the alert list.
      description: Returning all current real-time alerts in the system.
      operationId: getAlerts
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    annotations:
                      type: object
                      properties:
                        description:
                          type: string
                        runbook_url:
                          type: string
                          format: uri
                        summary:
                          type: string
                    endsAt:
                      type: string
                      format: date-time
                    fingerprint:
                      type: string
                    receivers:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                    startsAt:
                      type: string
                      format: date-time
                    status:
                      type: object
                      properties:
                        inhibitedBy:
                          type: array
                          items:
                            type: string
                        silencedBy:
                          type: array
                          items:
                            type: string
                        state:
                          type: string
                    updatedAt:
                      type: string
                      format: date-time
                    generatorURL:
                      type: string
                      format: uri
                    labels:
                      type: object
                      additionalProperties:
                        type: string
              example:
                - annotations:
                    description: "Pod default/my-release-harbor-core-66ffbd9bbf-whtlb (core) is in waiting state (reason: \"CrashLoopBackOff\")."
                    runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodcrashlooping"
                    summary: "Pod is crash looping."
                  endsAt: "2024-04-03T01:09:18.626Z"
                  fingerprint: "0340e712d51c10d1"
                  receivers:
                    - name: "Default"
                  startsAt: "2024-03-29T06:41:18.626Z"
                  status:
                    inhibitedBy: []
                    silencedBy: []
                    state: "active"
                  updatedAt: "2024-04-03T01:05:18.629Z"
                  generatorURL: "http://prometheus-k8s-0:9090/graph?g0.expr=max_over_time%28kube_pod_container_status_waiting_reason%7Bjob%3D%22kube-state-metrics%22%2Creason%3D%22CrashLoopBackOff%22%7D%5B5m%5D%29+%3E%3D+1&g0.tab=1"
                  labels:
                    alertname: "KubePodCrashLooping"
                    container: "core"
                    instance: "172.17.177.78:8443"
                    job: "kube-state-metrics"
                    namespace: "default"
                    pod: "my-release-harbor-core-66ffbd9bbf-whtlb"
                    prometheus: "monitoring/k8s"
                    reason: "CrashLoopBackOff"
                    severity: "warning"
                    uid: "5fe94734-c163-4436-bf5d-f114b962e274"
        '400':
          description: Incorrect or missing parameter.
        '404':
          description: No related information found.
        '500':
          description: Network error.

  /rest/alert/api/v2/alerts?filter={filter}:
    get:
      tags: [Alert management]
      summary: Obtaining the list of queried alerts.
      description: Returning all alerts that match the query parameter.
      operationId: queryAlerts
      parameters:
        - name: filter
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          examples:
            example1:
              value: ["namespace=olm"]
            example2:
              value: ["namespace=default", "severity=critical"]
          description: Filter criteria list.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    annotations:
                      type: object
                      properties:
                        description:
                          type: string
                        runbook_url:
                          type: string
                          format: uri
                        summary:
                          type: string
                    endsAt:
                      type: string
                      format: date-time
                    fingerprint:
                      type: string
                    receivers:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                    startsAt:
                      type: string
                      format: date-time
                    status:
                      type: object
                      properties:
                        inhibitedBy:
                          type: array
                          items:
                            type: string
                        silencedBy:
                          type: array
                          items:
                            type: string
                        state:
                          type: string
                    updatedAt:
                      type: string
                      format: date-time
                    generatorURL:
                      type: string
                      format: uri
                    labels:
                      type: object
                      additionalProperties:
                        type: string
              example:
                - annotations:
                    description: "Deployment olm/catalog-operator has not matched the expected number of replicas for longer than 15 minutes."
                    runbook_url: "https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentreplicasmismatch"
                    summary: "Deployment has not matched the expected number of replicas."
                  endsAt: "2024-04-24T02:30:18.626Z"
                  fingerprint: "12b05a0a43e58fe7"
                  receivers:
                    - name: "Default"
                  startsAt: "2024-03-29T06:41:18.626Z"
                  status:
                    inhibitedBy: []
                    silencedBy: []
                    state: "active"
                  updatedAt: "2024-04-24T02:26:18.632Z"
                  generatorURL: "http://prometheus-k8s-1:9090/graph?g0.expr=%28kube_deployment_spec_replicas%7Bjob%3D%22kube-state-metrics%22%7D+%3E+kube_deployment_status_replicas_available%7Bjob%3D%22kube-state-metrics%22%7D%29+and+%28changes%28kube_deployment_status_replicas_updated%7Bjob%3D%22kube-state-metrics%22%7D%5B10m%5D%29+%3D%3D+0%29&g0.tab=1"
                  labels:
                    alertname: "KubeDeploymentReplicasMismatch"
                    container: "kube-rbac-proxy-main"
                    deployment: "catalog-operator"
                    instance: "172.17.177.78:8443"
                    job: "kube-state-metrics"
                    namespace: "olm"
                    prometheus: "monitoring/k8s"
                    severity: "warning"
        '400':
          description: Incorrect or missing parameter.
        '404':
          description: No related information found.
        '500':
          description: Network error.

  /rest/alert/api/v2/silences:
    get:
      tags: [Silence rule management]
      summary: Obtaining the silence list.
      description: Returning all the current silence rules of the alert system.
      operationId: getSilences
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: object
                      properties:
                        state:
                          type: string
                    updatedAt:
                      type: string
                      format: date-time
                    comment:
                      type: string
                    createdBy:
                      type: string
                    endsAt:
                      type: string
                      format: date-time
                    matchers:
                      type: array
                      items:
                        type: object
                        properties:
                          isEqual:
                            type: boolean
                          isRegex:
                            type: boolean
                          name:
                            type: string
                          value:
                            type: string
                    startsAt:
                      type: string
                      format: date-time
              example:
                - id: "d9dc7377-3fbd-43b9-ba28-c2d370206920"
                  status:
                    state: "active"
                  updatedAt: "2024-04-16T09:30:15.119Z"
                  comment: "demo"
                  createdBy: "admin"
                  endsAt: "2024-04-16T13:29:38.130Z"
                  matchers:
                    - isEqual: true
                      isRegex: false
                      name: "alertname"
                      value: "Watchdog"
                    - isEqual: true
                      isRegex: false
                      name: "prometheus"
                      value: "monitoring/k8s"
                    - isEqual: true
                      isRegex: false
                      name: "severity"
                      value: "none"
                  startsAt: "2024-04-16T09:29:38.130Z"
        '400':
          description: Incorrect or missing parameter.
        '404':
          description: No related information found.
        '500':
          description: Network error.

    post:
      tags: [Silence rule management]
      summary: Creating a silence rule.
      description: Creating a silence rule.
      operationId: createSilence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - matchers
                - startsAt
                - endsAt
                - createdBy
                - comment
              properties:
                matchers:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - value
                      - isRegex
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      isRegex:
                        type: boolean
                      isEqual:
                        type: boolean
                        default: true
                startsAt:
                  type: string
                  format: date-time
                endsAt:
                  type: string
                  format: date-time
                createdBy:
                  type: string
                comment:
                  type: string
            example:
              matchers:
                - name: "alertname"
                  value: "InfoInhibitor"
                  isRegex: false
                  isEqual: true
              startsAt: "2024-04-18T06:59:31.286Z"
              endsAt: "2024-04-18T09:59:31.286Z"
              createdBy: "admin"
              comment: "demo"
      responses:
        '200':
          description: Created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  silenceID:
                    type: string
                    example: "0ae3e006-5bf1-4713-abcc-97ad63af09f9"
        '400':
          description: Incorrect or missing parameter.
        '404':
          description: No related information found.

  /rest/alert/api/v2/silence/{silenceID}:
    get:
      tags: [Silence rule management]
      summary: Displaying a silence rule by ID.
      description: Displaying a silence rule with a specified ID.
      operationId: getSilenceById
      parameters:
        - name: silenceID
          in: path
          required: true
          schema:
            type: string
          example: "1993e938-1bfa-4eb1-a65e-94268de1ac77"
          description: Silence rule ID.
      responses:
        '200':
          description: Queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: object
                    properties:
                      state:
                        type: string
                  updatedAt:
                    type: string
                    format: date-time
                  comment:
                    type: string
                  createdBy:
                    type: string
                  endsAt:
                    type: string
                    format: date-time
                  matchers:
                    type: array
                    items:
                      type: object
                      properties:
                        isEqual:
                          type: boolean
                        isRegex:
                          type: boolean
                        name:
                          type: string
                        value:
                          type: string
                  startsAt:
                    type: string
                    format: date-time
              example:
                id: "1993e938-1bfa-4eb1-a65e-94268de1ac77"
                status:
                  state: "active"
                updatedAt: "2024-04-18T06:54:37.084Z"
                comment: "demo"
                createdBy: "admin"
                endsAt: "2024-04-18T08:54:31.286Z"
                matchers:
                  - isEqual: true
                    isRegex: false
                    name: "alertname"
                    value: "InfoInhibitor"
                  - isEqual: true
                    isRegex: false
                    name: "alertstate"
                    value: "firing"
                  - isEqual: true
                    isRegex: false
                    name: "container"
                    value: "config-reloader"
                  - isEqual: true
                    isRegex: false
                    name: "namespace"
                    value: "monitoring"
                  - isEqual: true
                    isRegex: false
                    name: "pod"
                    value: "alertmanager-main-0"
                  - isEqual: true
                    isRegex: false
                    name: "prometheus"
                    value: "monitoring/k8s"
                  - isEqual: true
                    isRegex: false
                    name: "severity"
                    value: "none"
                startsAt: "2024-04-18T06:54:37.084Z"
        '404':
          description: No related information found.
        '500':
          description: Network error.

    delete:
      tags: [Silence rule management]
      summary: Deleting a silence rule by ID.
      description: Deleting a silence rule with a specified ID.
      operationId: deleteSilence
      parameters:
        - name: silenceID
          in: path
          required: true
          schema:
            type: string
          example: "1993e938-1bfa-4eb1-a65e-94268de1ac77"
          description: Silence rule ID.
      responses:
        '200':
          description: Deleted successfully.
        '404':
          description: No related information found.
        '500':
          description: Network error.
