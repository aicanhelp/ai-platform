paths:
  #
  # Job-related APIs
  #
  /api/kubernetes/apis/batch/v1/namespaces/{namespace}/jobs/{name}:
    get:
      tags:
        - Jobs
      summary: Reading a specified job.
      description: Obtaining the content of a specified job.
      operationId: readJob
      parameters:
        - name: name
          in: path
          description: Job name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Job object.
        '401':
          description: Unauthorized.
    put:
      tags:
        - Jobs
      summary: Updating a specified job.
      description: Updating a specified job.
      operationId: updateJob
      parameters:
        - name: name
          in: path
          description: Job name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Job configuration object.
            example:
              metadata:
                name: example-job
                namespace: default
              spec:
                template:
                  spec:
                    containers:
                      - name: example-job
                        image: busybox
                        command: ["sh", "-c", "echo Hello! && sleep 3600"]
                    restartPolicy: Never
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Job object.
        '201':
          description: Already created.
          content:
            application/json:
              schema:
                type: object
                description: Job object.
        '401':
          description: Unauthorized.
    delete:
