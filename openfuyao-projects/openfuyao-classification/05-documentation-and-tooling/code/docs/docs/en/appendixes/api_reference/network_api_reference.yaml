          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
                - rules
              properties:
                apiVersion:
                  type: string
                  default: rbac.authorization.k8s.io/v1
                  description: API version.
                kind:
                  type: string
                  default: Role
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
                    namespace:
                      type: string
                      description: Namespace name.
                rules:
                  type: array
                  description: Rule list.
                  items:
                    type: object
                    required:
                      - verbs
                    properties:
                      apiGroups:
                        type: array
                        description: API group list.
                        items:
                          type: string
                      resources:
                        type: array
                        description: Resource list.
                        items:
                          type: string
                      resourceNames:
                        type: array
                        description: Resource name list.
                        items:
                          type: string
                      verbs:
                        type: array
                        description: Verb list.
                        items:
                          type: string
            example:
              metadata:
                namespace: default
                name: example-role
              rules:
                - apiGroups: [""]
                  resources: ["pods"]
                  verbs: ["get", "list", "watch"]
                - apiGroups: [""]
                  resources: ["pods/log"]
                  verbs: ["get"]
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '401':
          description: Unauthorized.
    delete:
