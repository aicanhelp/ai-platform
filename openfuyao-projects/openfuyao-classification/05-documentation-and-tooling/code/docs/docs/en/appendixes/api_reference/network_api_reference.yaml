                  description: API version.
                kind:
                  type: string
                  default: Ingress
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
                    namespace:
                      type: string
                      description: Namespace name.
                spec:
                  type: object
                  description: Ingress specifications.
                  properties:
                    rules:
                      type: array
                      description: Rule list.
                      items:
                        type: object
                        properties:
                          host:
