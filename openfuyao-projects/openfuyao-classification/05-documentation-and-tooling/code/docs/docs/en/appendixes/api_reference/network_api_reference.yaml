                        description: Creation timestamp.
                  rules:
                    type: array
                    description: Rule list.
                    items:
                      type: object
                      required:
                        - verbs
                      properties:
                        apiGroups:
                          type: array
                          description: API group list.
                          items:
                            type: string
                        resources:
                          type: array
                          description: Resource list.
                          items:
                            type: string
                        resourceNames:
                          type: array
                          description: Resource name list.
                          items:
                            type: string
                        verbs:
                          type: array
                          description: Verb list.
                          items:
                            type: string
        '401':
          description: Unauthorized.
    put:
      tags:
        - Roles
