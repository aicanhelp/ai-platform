      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: IngressList
                  apiVersion:
                    type: string
                    example: networking.k8s.io/v1
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - apiVersion
                        - kind
                        - metadata
                        - spec
