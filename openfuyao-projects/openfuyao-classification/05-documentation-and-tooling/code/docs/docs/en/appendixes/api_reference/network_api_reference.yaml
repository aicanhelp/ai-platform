                          http:
                            type: object
                            properties:
                              paths:
                                type: array
                                description: Path list.
                                items:
                                  type: object
                                  properties:
                                    path:
                                      type: string
                                      description: Path.
                                    pathType:
                                      type: string
                                      description: Path type.
                                      enum: [Exact, Prefix, ImplementationSpecific]
                                    backend:
                                      type: object
                                      properties:
                                        service:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              description: Service name.
                                            port:
                                              type: object
                                              properties:
                                                number:
