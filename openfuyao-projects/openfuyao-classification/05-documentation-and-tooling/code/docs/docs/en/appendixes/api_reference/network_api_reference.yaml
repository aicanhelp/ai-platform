        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                  - rules
                properties:
                  apiVersion:
                    type: string
                    default: rbac.authorization.k8s.io/v1
                    description: API version.
                  kind:
                    type: string
                    default: Role
                    description: Resource type.
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Object name.
                      namespace:
                        type: string
