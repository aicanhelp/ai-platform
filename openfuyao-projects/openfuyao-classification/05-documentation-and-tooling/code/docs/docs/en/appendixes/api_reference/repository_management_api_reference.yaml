openapi: 3.0.0
info:
  title: 
  description: Helm repository management APIs of the openFuyao platform.
  version: v1beta1

paths:
  /helm-repos:
    get:
      summary: Querying the Helm repository list.
      description: Obtaining information about all Helm repositories (pagination and fuzzy search supported).
      parameters:
        - name: repo
          in: query
          schema: { type: string }
          description: Fuzzy match of the repository name.
        - name: page
          in: query
          schema: { type: integer, example: 1 }
          description: Page number.
        - name: limit
          in: query
          schema: { type: integer, example: 20 }
          description: Number of items on each page.
      responses:
        '200':
          description: Response success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "bitnami"
                              description: Repository name.
                            url:
                              type: string
                              example: "https://charts.bitnami.com/bitnami"
                              description: Repository address.
                      totalItems:
                        type: integer
                        example: 3
                        description: Total number of records.
                      currentPage:
                        type: integer
                        example: 1
                        description: Current page number.
                      totalPage:
                        type: integer
                        example: 1
                        description: Total number of pages.
    post:
      summary: Creating a Helm repository.
      description: Creating a Helm repository configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  example: "test"
                  description: Repository name.
                url:
                  type: string
                  example: "https://charts.jetstack.io"
                  description: Repository address.
                username:
                  type: array
                  items: { type: integer }
                  description: Username byte array.
                  example: [116, 101, 115, 116] # "test"
                password:
                  type: array
                  items: { type: integer }
                  description: Password byte array.
                  example: [112, 97, 115, 115] # "pass"
                certFile:
                  type: string
                  description: Certificate file.
                keyFile:
                  type: string
                  description: Private key file.
                caFile:
                  type: string
                  description: CA certificate file.
                insecure_skip_tls_verify:
                  type: boolean
                  default: false
                  description: Whether to skip TLS verification.
                pass_credentials_all:
                  type: boolean
                  default: false
                  description: Whether to transfer all credentials.
      responses:
        '200':
          description: Created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
                  data:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                        example: "openfuyao.com/v1beta1"
                        description: API version.
                      kind:
                        type: string
                        example: "HelmChartRepository"
                        description: Resource type.
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Name.
                          creationTimestamp:
                            type: string
                            format: date-time
                            description: Creation time.
                      spec:
                        type: object
                        properties:
                          displayName:
                            type: string
                            description: Display name.
                          url:
                            type: string
                            description: Repository address.
                          basicAuth:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Basic authentication name.
                          tls:
                            type: object
                            properties:
                              name:
                                type: string
                                description: TLS configuration name.
                          ca:
                            type: object
                            properties:
                              name:
                                type: string
                                description: CA certificate name.
                          insecureSkipTLSVerify:
                            type: boolean
                            description: Whether to skip TLS verification.
                          passCredentialsAll:
                            type: boolean
                            description: Whether to transfer all credentials.

  /helm-repos/{repo}:
    get:
      summary: Querying the details of a repository.
      description: Obtaining the detailed configuration information about the Helm repository with a specified name.
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
          description: Repository name.
      responses:
        '200':
          description: Repository details returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
                  data:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                        example: "openfuyao.com/v1beta1"
                        description: API version.
                      kind:
                        type: string
                        example: "HelmChartRepository"
                        description: Resource type.
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Name.
                          creationTimestamp:
                            type: string
                            format: date-time
                            description: Creation time.
                      spec:
                        type: object
                        properties:
                          displayName:
                            type: string
                            description: Display name.
                          url:
                            type: string
                            description: Repository address.
                          basicAuth:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Basic authentication name.
                          tls:
                            type: object
                            properties:
                              name:
                                type: string
                                description: TLS configuration name.
                          ca:
                            type: object
                            properties:
                              name:
                                type: string
                                description: CA certificate name.
                          insecureSkipTLSVerify:
                            type: boolean
                            description: Whether to skip TLS verification.
                          passCredentialsAll:
                            type: boolean
                            description: Whether to transfer all credentials.
    put:
      summary: Updating the configuration of a repository.
      description: Updating the configuration of an existing Helm repository.
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
          description: Repository name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  example: "test"
                  description: Repository name.
                url:
                  type: string
                  example: "https://charts.jetstack.io"
                  description: Repository address.
                username:
                  type: array
                  items: { type: integer }
                  description: Username byte array.
                  example: [116, 101, 115, 116] # "test"
                password:
                  type: array
                  items: { type: integer }
                  description: Password byte array.
                  example: [112, 97, 115, 115] # "pass"
                certFile:
                  type: string
                  description: Certificate file.
                keyFile:
                  type: string
                  description: Private key file.
                caFile:
                  type: string
                  description: CA certificate file.
                insecure_skip_tls_verify:
                  type: boolean
                  default: false
                  description: Whether to skip TLS verification.
                pass_credentials_all:
                  type: boolean
                  default: false
                  description: Whether to transfer all credentials.
      responses:
        '200':
          description: Repository updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
                  data:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                        example: "openfuyao.com/v1beta1"
                        description: API version.
                      kind:
                        type: string
                        example: "HelmChartRepository"
                        description: Resource type.
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Name.
                          creationTimestamp:
                            type: string
                            format: date-time
                            description: Creation time.
                      spec:
                        type: object
                        properties:
                          displayName:
                            type: string
                            description: Display name.
                          url:
                            type: string
                            description: Repository address.
                          basicAuth:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Basic authentication name.
                          tls:
                            type: object
                            properties:
                              name:
                                type: string
                                description: TLS configuration name.
                          ca:
                            type: object
                            properties:
                              name:
                                type: string
                                description: CA certificate name.
                          insecureSkipTLSVerify:
                            type: boolean
                            description: Whether to skip TLS verification.
                          passCredentialsAll:
                            type: boolean
                            description: Whether to transfer all credentials.
    delete:
      summary: Deleting a repository.
      description: Deleting the Helm repository with a specified name.
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
          description: Repository name.
      responses:
        '200':
          description: Repository deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.

  /helm-repos/sync:
    post:
      summary: Synchronizing all repositories.
      description: Triggering the synchronization of all Helm repositories.
      responses:
        '200':
          description: Synchronization operation triggered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.

  /helm-repos/{repo}/sync:
    post:
      summary: Synchronizing a specified repository.
      description: Triggering the synchronization of a specified Helm repository.
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
          description: Repository name.
      responses:
        '200':
          description: Synchronization operation triggered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
    get:
      summary: Obtaining the synchronization status.
      description: Querying the current synchronization status of a specified repository.
      parameters:
        - name: repo
          in: path
          required: true
          schema: { type: string }
          description: Repository name.
      responses:
        '200':
          description: Synchronization status returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    enum: [in_progress, complete, failed]
                    example: "complete"
                    description: Synchronization status.

  /helm-charts:
    get:
      summary: Querying the chart list.
      description: Obtaining all available Helm charts (filtering supported).
      parameters:
        - name: repo
          in: query
          schema: { type: string }
          description: Filtering by repository name.
        - name: chart
          in: query
          schema: { type: string }
          description: Filtering by chart name.
        - name: scene
          in: query
          schema:
            type: string
            enum:
              - compute-power-engine-plugin
              - artificial-intelligence
              - computing
              - database
              - developer-tool
              - CI/CD
              - monitor
              - log
              - network
              - observability
              - security
              - storage
          description: Filtering by scene.
        - name: appType
          in: query
          schema: { type: string }
          description: Filtering by application type.
        - name: page
          in: query
          schema: { type: integer }
          description: Page number.
        - name: limit
          in: query
          schema: { type: integer }
          description: Number of items on each page.
      responses:
        '200':
          description: Chart list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Chart name.
                            version:
                              type: string
                              description: Version number.
                            description:
                              type: string
                              description: Description.
                            apiVersion:
                              type: string
                              description: API version.
                            appVersion:
                              type: string
                              description: Application version.
                            type:
                              type: string
                              description: Type.
                            urls:
                              type: array
                              items: { type: string }
                              description: Download URL list.
                            created:
                              type: string
                              format: date-time
                              description: Creation time.
                            digest:
                              type: string
                              description: Digest information.
                        repo:
                          type: string
                          description: Repository name.
                        repoUrl:
                          type: string
                          description: Repository address.
    post:
      summary: Uploading a chart.
      description: Uploading a chart package to the local repository.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                chart:
                  type: string
                  format: binary
                  description: Helm chart file (in .tgz format).
      responses:
        '201':
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.

  /helm-charts/{chart}:
    delete:
      summary: Deleting all versions of a chart.
      description: Deleting all versions of a specified chart.
      parameters:
        - name: chart
          in: path
          required: true
          schema: { type: string }
          description: Chart name.
      responses:
        '200':
          description: Deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.

  /helm-charts/{chart}/versions/{version}:
    delete:
      summary: Deleting a specified chart version.
      description: Deleting a chart with a specified name and version.
      parameters:
        - name: chart
          in: path
          required: true
          schema: { type: string }
          description: Chart name.
        - name: version
          in: path
          required: true
          schema: { type: string }
          description: Version number.
      responses:
        '200':
          description: Deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                    description: Status code.
                  msg:
                    type: string
                    example: "success"
                    description: Status message.

security:
  - BearerAuth: []
