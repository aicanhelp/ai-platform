openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: Background APIs for authentication and authorization, including OAuth 2.0 process APIs.

servers:
  - url: https://console-service.example.com
    description: Example server.

paths:
  /rest/auth/login:
    get:
      summary: Triggering login.
      description: Triggering the login sequence for the openFuyao management plane.
      responses:
        '302':
          description: Redirection response.
          headers:
            Location:
              schema:
                type: string
              examples:
                withCookie:
                  value: https://console-service.example.com
                withoutCookie:
                  value: https://oauth-server.example.com/oauth2/oauth/authorize?client_id=console&identity_provider=fuyaoPasswordProvider&redirect_uri=https%3A%2F%2F192.168.100.81%3A31616%2Frest%2Fauth%2Fcallback&response_type=code&state=4ee93eef
            Set-Cookie:
              schema:
                type: string
              example: state=4ee93eef; Path=/; HttpOnly; Secure; Max-Age=3600
          content:
            text/html:
              schema:
                type: string

  /rest/auth/callback:
    get:
      summary: Processing authorization callback.
      description: Callback API to process the authorization code returned by the authentication server according to the OAuth 2.0 standard.
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code, which is a temporary credential for a user to confirm authorization.
        - name: state
          in: query
          schema:
            type: string
          description: Login state. The callback function verifies whether the value has changed.
        - name: error
          in: query
          schema:
            type: string
          description: Brief error information.
        - name: error_description
          in: query
          schema:
            type: string
          description: Readable error description.
      responses:
        '302':
          description: Token obtained successfully, and homepage redirected.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: sessionID=e001a66f9136d9f4111d0b6068a00b82; Path=/; Expires=Thu, 06 Jun 2024 12:02:50 GMT; HttpOnly; Secure
            Location:
              schema:
                type: string
              example: https://console-service.example.com/
        '401':
          description: Response error or state parameter verification failure when the OAuth server is invoked.
          content:
            text/html:
              schema:
                type: string
              example: invalid_client
        '500':
          description: Internal server parse error.
          content:
            text/html:
              schema:
                type: string
              example: Fail to create session store for cookie

  /password/modify:
    post:
      summary: Changing the user password.
      description: API for password change on the response interface, which forwards the request to the OAuth server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                original_password:
                  type: string
                  example: test@123
                new_password:
                  type: string
                  example: test@1234
              required:
                - username
                - original_password
                - new_password
      responses:
        '302':
          description: Token obtained successfully, and homepage redirected.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: sessionID=e001a66f9136d9f4111d0b6068a00b82; Path=/; Expires=Thu, 06 Jun 2024 12:02:50 GMT; HttpOnly; Secure
            Location:
              schema:
                type: string
              example: https://console-service.com/
        '401':
          description: Response error or state parameter verification failure when the OAuth server is invoked.
          content:
            text/html:
              schema:
                type: string
              example: invalid_client
        '500':
          description: Internal server parse error.
          content:
            text/html:
              schema:
                type: string
              example: Fail to create session store for cookie

  /rest/auth/logout:
    post:
      summary: User logout.
      description: API for password change on the response interface, which forwards the request to the OAuth server.
      responses:
        '307':
          description: Session deleted from the console service and redirected to the OAuth server for single sign-out.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: sessionID=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; HttpOnly; Secure
            Location:
              schema:
                type: string
              example: https://oauth-server.example.com/oauth2/auth/logout/fuyaoPasswordProvider?redirect_uri=https%3A%2F%2F192.168.100.81%3A31616%2Frest%2Fauth%2Flogin
  /oauth2/oauth/authorize:
    get:
      summary: Generating a user authorization code.
      description: Generating an authorization code for user authorization on the authentication server according to the OAuth 2.0 standard.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Authorization mode. The value is fixed to code.
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Client ID.
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Status parameter used to prevent CSRF attacks.
        - name: identity_provider
          in: query
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
          description: Identity provider name.
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          description: Authorization callback redirection URI.
      responses:
        '302':
          description: Redirection response.
          headers:
            Location:
              schema:
                type: string
              examples:
                notLoggedIn:
                  value: /oauth2/auth/login/fuyaoPasswordProvider?then=%2Foauth2%2Foauth%2Fauthorize%3Fclient_id%3Dconsole%26identity_provider%3DfuyaoPasswordProvider%26redirect_uri%3Dhttps%253A%252F%252Fconsole-service.example.com%252Frest%252Fauth%252Fcallback%26response_type%3Dcode%26state%3D4ee93eef
                firstLogin:
                  value: /oauth2/auth/password/confirm/fuyaoPasswordProvider?then=%2Foauth2%2Foauth%2Fauthorize%3Fclient_id%3Dconsole%26identity_provider%3DfuyaoPasswordProvider%26redirect_uri%3Dhttps%253A%252F%252Fconsole-service.example.com%252Frest%252Fauth%252Fcallback%26response_type%3Dcode%26state%3D4ee93eef
                success:
                  value: https://console-service.example.com/rest/auth/callback?code=mznmztlizgetntmxns0zzgy0ltgyytitmgq4zdk0odgzmzc4&state=4ee93eef
                failure:
                  value: https://console-service.example.com/rest/auth/callback?error=invalid_client&error_description=Client%20authentication%20failed&state=4ee93eef
            Set-Cookie:
              schema:
                type: string
              example: idpLogin=<idpLogin_value>; Path=/; Expires=Thu, 06 Jun 2024 11:50:24 GMT; Max-Age=7200; HttpOnly; Secure

  /oauth2/oauth/token:
    post:
      summary: Generating an access token.
      description: Generating an access token on the authentication server according to the OAuth 2.0 standard.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                redirect_uri:
                  type: string
                  format: uri
                code:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
                session_id:
                  type: string
                logout_endpoint:
                  type: string
              required:
                - grant_type
                - redirect_uri
                - code
                - client_id
                - client_secret
      responses:
        '200':
          description: Access token obtained successfully.
          headers:
            Pragma:
              schema:
                type: string
              example: no-cache
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  user_id:
                    type: string
        '401':
          description: Client authentication failed.
          headers:
            Pragma:
              schema:
                type: string
              example: no-cache
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  error_code:
                    type: integer

  /oauth2/auth/login/{identity_provider}:
    get:
      summary: Obtaining the user login page.
      description: Obtaining the user login page from the OAuth server.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
        - name: then
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Login page obtained successfully.
          content:
            text/html:
              schema:
                type: string

    post:
      summary: Submitting a user login credential.
      description: Verifying a user login credential on the OAuth server.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                then:
                  type: string
                username:
                  type: string
                password:
                  type: string
                gorilla.csrf.Token:
                  type: string
              required:
                - then
                - username
                - password
                - gorilla.csrf.Token
      responses:
        '302':
          description: Redirection response.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string

  /oauth2/auth/password/modify/{identity_provider}:
    post:
      summary: Changing the user password.
      description: Backend for processing user password change, including verifying the correctness of the old password and the complexity of the new password.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                original_password:
                  type: string
                new_password:
                  type: string
              required:
                - username
                - original_password
                - new_password
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Msg:
                    type: string
        '400':
          description: Missing mandatory parameters in the request or weak password settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Msg:
                    type: string
        '401':
          description: Unauthorized access.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Msg:
                    type: string

  /oauth2/auth/password/confirm/{identity_provider}:
    get:
      summary: Obtaining the password change page upon the first login.
      description: OAuth server redirects to password change page after first login.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
        - name: then
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page obtained successfully.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Internal server error.
    post:
      summary: Changing the user password upon the first login.
      description: Changing the user password on the OAuth server after the first login.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                then:
                  type: string
                new_password:
                  type: string
              required:
                - then
                - new_password
      responses:
        '302':
          description: Redirection response.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string

    delete:
      summary: Canceling first password change.
      description: Deleting the cookie on the OAuth server, canceling the first password change, and returning to the login page.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
      responses:
        '302':
          description: Canceled successfully and login page displayed.
          headers:
            Set-Cookie:
              schema:
                type: string
            Location:
              schema:
                type: string

  /oauth2/auth/logout/{identity_provider}:
    post:
      summary: Single sign-out.
      description: API for OAuth server single sign-out, which is used to log out of all registered OAuth proxy components.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '204':
          description: Logged out successfully.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Incorrect session ID for single sign-out.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                  Msg:
                    type: string

  /oauth/tokenauth/{identity_provider}:
    post:
      summary: Verifying the access token.
      description: API for the OAuth webhook to verify the access token, called by the Kubernetes API server.
      parameters:
        - name: identity_provider
          in: path
          required: true
          schema:
            type: string
            enum: [fuyaoPasswordProvider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiVersion:
                  type: string
                  example: authentication.k8s.io/v1
                kind:
                  type: string
                  example: TokenReview
                spec:
                  type: object
                  properties:
                    token:
                      type: string
              required:
                - apiVersion
                - kind
                - spec
      responses:
        '200':
          description: Verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  status:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
                      user:
                        type: object
                        properties:
                          username:
                            type: string
                          uid:
                            type: string
                          groups:
                            type: array
                            items:
                              type: string
                          extra:
                            type: object
        '401':
          description: Verification failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  status:
                    type: object
                    properties:
                      authenticated:
                        type: boolean
