  /rest/scheduling/v1/nodeList:
    get:
      tags:
        - SchedulingPolicies
      summary: Getting the node list.
      description: Getting the node list.
      operationId: getNodeList
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Data response object.
              example:
                code: 200
                msg: ok
                data: "..."
        '500':
          description: Execution failed.

  /rest/scheduling/v1/cr/{name}:
    get:
      tags:
        - SchedulingPolicies
      summary: Getting numatopologies information.
      description: Getting numatopologies information.
      operationId: getNumatopologies
      parameters:
        - name: name
          in: path
          description: CR instance name.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Data response object.
              example:
                code: 200
                msg: ok
                data: "..."
        '500':
          description: Execution failed.

  /rest/scheduling/v1/uuidToName/{uuid}:
    get:
      tags:
        - SchedulingPolicies
      summary: Obtaining the pod name by UUID.
      description: Obtaining the pod name by UUID.
      operationId: getPodNameByUUID
      parameters:
        - name: uuid
          in: path
          description: UUID of the pod.
          required: true
