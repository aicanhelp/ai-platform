openapi: 3.0.0
info:
  title: 
  description: Ray-related APIs.
  version: 1.0.0
tags:
  - name: Overview
    description: Overview of Ray.
  - name: RayCluster
    description: Ray cluster.
  - name: RayJob
    description: Ray job.
  - name: RayService
    description: Ray service.


paths:
  /rest/v1/overview/all:
    get:
      summary: Getting the Ray overview information.
      description: Getting statistics of Ray clusters, jobs, and services.
      operationId: getOverview
      tags:
        - Overview
      responses:
        "200":
          description: Ray overview information obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Custom status code.
                    example: 200
                  msg:
                    type: string
                    description: Message, which returns the status information.
                    example: success
                  data:
                    type: object
                    properties:
                      rayclusters:
                        type: integer
                        description: Number of active Ray clusters.
                        example: 1
                      rayjobs:
                        type: integer
                        description: Number of active Ray jobs.
                        example: 0
                      rayservices:
                        type: integer
                        description: Number of active Ray services.
                        example: 0
                      total:
                        type: integer
                        description: Total number of active Ray clusters.
                        example: 1
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Error status code.
                    example: 500
                  msg:
                    type: string
                    description: Error message.
                    example: "Internal server error"
                  data:
                    type: object
                    description: Additional information.
                    example: ""

  /rest/v1/raycluster/create:
    post:
      summary: Creating a Ray cluster.
      description: Creating a Ray cluster by configuration file.
      operationId: createRayCluster
      tags:
        - RayCluster
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File path.
                createBy:
                  type: string
                  description: Information about the creator.
                isStart:
                  type: boolean
                  description: "Whether to start the Ray cluster: Value 'true' indicates creating and starting the Ray cluster while value 'false' indicates only creating the Ray cluster."
                config:
                  type: string
                  description: Configuration information (transferred in text format).
              required:
                - createBy
                - config
      responses:
        "200":
          description: Ray cluster created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success

        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                    description: Error status code.
                  msg:
                    type: string
                    example: "bad request"
                    description: Error message.
                  data:
                    type: object
                    example: ""
                    description: Additional information.

  /rest/v1/raycluster/list:
    post:
      summary: Querying the Ray cluster list.
      description: Querying the list of all Ray clusters.
      operationId: listRayClusters
      tags:
        - RayCluster
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                createBy:
                  type: string
                  description: Creator name.
                  example: ZhangSan
                rayVersion:
                  type: string
                  description: Ray version.
                  example: "2.9.0"
                name:
                  type: string
                  description: Ray cluster name (fuzzy match supported).
                  example: autoscaler
                status:
                  type: integer
                  description: "Ray cluster status (0: all, 1: running, 2: stopped, 3: failed)"
                  example: 1
      responses:
        "200":
          description: Ray cluster list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: raycluster-autoscaler-1
                            namespace:
                              type: string
                              example: vcjob
                            ray_version:
                              type: string
                              example: "2.9.0"
                            create_by:
                              type: string
                              example: ZhangSan
                            cluster_status:
                              type: string
                              example: running
                            create_time:
                              type: string
                              format: date-time
                              example: "2025-02-06 14:36:36"
                            update_time:
                              type: string
                              format: date-time
                              example: "2025-02-06 14:36:36"
                      total:
                        type: integer
                        example: 1

        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Error status code.
                    example: 500
                  msg:
                    type: string
                    description: Error message.
                    example: "remote server busy"
                  data:
                    type: object
                    description: Additional information.
                    example: ""

  /rest/v1/raycluster/get/{namespace}/{raycluster_name}:
    get:
      summary: Obtaining the details of the Ray cluster.
      description: Obtaining the details of the Ray cluster by namespace and name.
      operationId: getRayCluster
      tags:
        - RayCluster
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: Namespace of the Ray cluster.
        - name: raycluster_name
          in: path
          required: true
          schema:
            type: string
          description: Name of the Ray cluster.
      responses:
        "200":
          description: Ray cluster details obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        example: raycluster-autoscaler-1
                      namespace:
                        type: string
                        example: vcjob
                      ray_version:
                        type: string
                        example: "2.9.0"
                      create_by:
                        type: string
                        example: ZhangSan
                      cluster_status:
                        type: string
                        example: running
                      gcs_port:
                        type: string
                        example: "32312"
                      cluster_ip:
                        type: string
                        example: "172.17.70.175"
                      dashboard_port:
                        type: string
                        example: "31484"
                      create_time:
                        type: string
                        format: date-time
                        example: "2025-02-06 14:36:36"
                      update_time:
                        type: string
                        format: date-time
                        example: "2025-02-06 14:36:36"

        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                    description: Error status code.
                  msg:
                    type: string
                    example: "bad request"
                    description: Error message.
                  data:
                    type: object
                    example: {}
                    description: Additional information.


        "404":
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 404
                    description: Error status code.
                  msg:
                    type: string
                    example: "Not Found"
                    description: Error message.
                  data:
                    type: object
                    example: {}
                    description: Additional information.

