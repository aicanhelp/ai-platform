openapi: 3.0.0
info:
  title: 
  description: Providing APIs for opening interfaces for interacting with a container or a cluster.
  version: 1.0.0
paths:
  /rest/webterminal/v1/namespace/{namespace}/pod/{podname}/container/{containername}/terminal:
    get:
      summary: Opening the interface for interacting with a container.
      description: Calling a backend API to open the command-line interface for interacting with a container.
      parameters:
        - name: namespace
          in: path
          description: Container namespace.
          required: true
          schema:
            type: string
        - name: podname
          in: path
          description: Name of the pod containing the container.
          required: true
          schema:
            type: string
        - name: containername
          in: path
          description: Container name.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accessed successfully.
        '403':
          description: No permission.
        '500':
          description: Service request error.
  /rest/webterminal/v1/user/{username}/terminal:
    get:
      summary: Opening the interface for interacting with a cluster.
      description: Calling a backend API to open the command-line interface for interacting with a cluster.
      parameters:
        - name: username
          in: path
          description: Username.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accessed successfully.
        '403':
          description: No permission.
        '500':
          description: Service request error.
