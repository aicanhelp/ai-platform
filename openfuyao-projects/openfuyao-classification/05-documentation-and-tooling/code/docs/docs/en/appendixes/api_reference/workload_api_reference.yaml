            type: integer
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Pod list object.
        '401':
          description: Unauthorized.
    post:
      tags:
        - Workload
        - Pod
      summary: Creating a pod.
      description: Creating a pod.
      operationId: createPod
      parameters:
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
      requestBody:
        description: Content of the pod to be created.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Pod configuration object.
            example:
              metadata:
                name: example-pod
                labels:
                  app: example-pod
              spec:
                containers:
                  - name: example-containers
                    image: nginx:1.19.3
                    ports:
                      - containerPort: 8090
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.

