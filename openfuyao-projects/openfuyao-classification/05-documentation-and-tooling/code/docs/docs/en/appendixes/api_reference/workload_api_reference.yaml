openapi: 3.0.0
info:
  title: 
  description: Providing APIs related to Kubernetes workload resource management.
  version: 1.0.0
servers:
  - url: /
    description: Default server.
paths:
  /api/kubernetes/api/v1/namespaces/{namespace}/pods/{name}:
    get:
      tags:
        - Workload 
        - Pod
      summary: Reading a specified pod.
      description: Obtaining the content of a pod.
      operationId: getPod
      parameters:
        - name: name
          in: path
          description: Pod name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Pod object.
        '401':
          description: Unauthorized.
    put:
      tags:
        - Workload
        - Pod
      summary: Updating a specified pod.
      description: Updating a specified pod.
      operationId: updatePod
      parameters:
        - name: name
          in: path
          description: Pod name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
      requestBody:
        description: Content of the pod to be updated.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Pod configuration object.
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '401':
          description: Unauthorized.
    delete:
      tags:
        - Workload
        - Pod
      summary: Deleting a specified pod.
      description: Deleting a pod.
      operationId: deletePod
      parameters:
        - name: name
          in: path
          description: Pod name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: Duration before the object is deleted, in seconds.
          required: false
          schema:
            type: integer
        - name: propagationPolicy
          in: query
          description: Determining whether and how to perform garbage collection.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.
    patch:
      tags:
        - Workload
        - Pod
      summary: Partially updating a specified pod.
      description: Partially updating a specified pod.
      operationId: patchPod
      parameters:
        - name: name
          in: path
          description: Pod name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: Forcibly applying the request.
          required: false
          schema:
            type: boolean
      requestBody:
        description: Patch operation to be applied.
        required: true
        content:
          application/json-patch+json:
            schema:
              type: array
              description: JSON patch operation list.
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: Operation type.
                    enum:
                      - add
                      - remove
                      - replace
                      - move
                      - copy
                      - test
                  path:
                    type: string
                    description: JSON pointer path to be operated.
                  value:
                    description: Value used for the add, replace, or test operation.
                  from:
                    type: string
                    description: Path of the source JSON pointer used for the move or copy operation.
            examples:
              addLabelNew:
                summary: Adding a label (when no labels exist).
                value:
                  - op: add
                    path: /metadata/labels
                    value:
                      data: value
              addLabelExisting:
                summary: Adding a label (when labels exist).
                value:
                  - op: add
                    path: /metadata/labels/env
                    value: value
              replaceLabel:
                summary: Modifying a label.
                value:
                  - op: replace
                    path: /metadata/labels/env
                    value: value1
              removeLabel:
                summary: Removing a label.
                value:
                  - op: remove
                    path: /metadata/labels/env
      responses:
        '200':
          description: Success.
        '201':
          description: Already updated.
        '401':
          description: Unauthorized.

  /api/kubernetes/api/v1/namespaces/{namespace}/pods:
    get:
