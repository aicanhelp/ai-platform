            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
        - name: resourceVersion
          in: query
          description: Constraining the target resource version of the request.
          required: false
          schema:
            type: string
        - name: resourceVersionMatch
          in: query
          description: Determining the application of resourceVersion to the list call.
          required: false
          schema:
            type: string
        - name: watch
          in: query
          description: Watching changes to the specified resource.
          required: false
          schema:
            type: boolean
        - name: sendInitialEvents
          in: query
          description: The watch stream begins with synthetic events to produce the current state of objects in the collection.
          required: false
          schema:
            type: boolean
        - name: timeoutSeconds
          in: query
          description: Timeout for listing or watching calls, in seconds.
          required: false
