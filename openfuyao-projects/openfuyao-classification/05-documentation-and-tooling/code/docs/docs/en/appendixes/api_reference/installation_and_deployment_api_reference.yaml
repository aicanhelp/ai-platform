openapi: 3.0.0
info:
  title: 
  description: Providing APIs for creating and managing clusters.
  version: 1.0.0
servers:
  - url: http://api.example.com/v1
paths:
  /rest/cluster/v1/create:
    post:
      summary: Creating a cluster.
      description: Creating a service cluster on the openFuyao management plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                yaml:
                  type: string
                  example: 
                    apiVersion: bke.bocloud.com/v1beta1
                    kind: BKECluster
                    metadata:
                      creationTimestamp: null
                      name: '1'
                      namespace: bke-cluster
                    spec:
                      clusterConfig:
                        addons:
                          - name: kubeproxy
                            param:
                              clusterNetworkMode: calico
                            version: v1.28.8
                          - name: calico
                            param:
                              calicoMode: vxlan
                              ipAutoDetectionMethod: skip-interface=nerdctl*
                            version: v3.25.0
                          - name: coredns
                            version: v1.10.1
                          - name: openfuyao-system-controller
                            param:
                              helmRepo: https://harbor.openfuyao.com/chartrepo/openfuyao
                            version: latest
                          - block: true
                            name: cluster-api
                            param:
                              manage: 'true'
                            version: v1.4.3
                        cluster:
                          apiServer:
                            extraArgs:
                              max-mutating-requests-inflight: '3000'
                              max-requests-inflight: '1000'
                              watch-cache-sizes: node#1000,pod#5000
                          certificatesDir: /etc/kubernetes/pki
                          containerRuntime:
                            cri: containerd
                            param:
                              data-root: /var/lib/containerd
                            runtime: runc
                          controllerManager:
                            extraArgs:
                              kube-api-burst: '1000'
                              kube-api-qps: '1000'
                          etcd:
                            dataDir: /var/lib/etcd
                          httpRepo:
                            domain: http.bocloud.k8s
                            ip: 192.168.201.85
                            port: '40080'
                            prefix: ''
                          imageRepo:
                            domain: harbor.openfuyao.com
                            ip: 199.91.74.185
                            port: '443'
                            prefix: openfuyao
                          kubelet:
                            extraArgs:
                              kube-api-burst: '2000'
                              kube-api-qps: '1000'
                            extraVolumes:
                              - hostPath: /var/lib/kubelet
                                name: kubelet-root-dir
                          kubernetesVersion: v1.28.8
                          networking:
                            dnsDomain: cluster.local
                            podSubnet: 10.250.0.0/16
                            serviceSubnet: 10.96.0.0/16
                          ntpServer: cn.pool.ntp.org:123
                          scheduler:
                            extraArgs:
                              kube-api-qps: '1000'
                        customExtra:
                          chart_password: chart
                          chart_username: chart
                          chartRepoPort: '38080'
                          clusterapi: latest
                          containerd: containerd-1.6.16-linux-{.arch}.tar.gz
                          domain: deploy.bocloud.k8s
                          host: 192.168.201.85
                          imageRepoPort: '40443'
                          nfsserverpath: /
                          otherRepo: harbor.openfuyao.com/openfuyao/
                          otherRepoIp: 199.91.74.185
                          otherSource: ''
                          yumRepoPort: '40080'
                        nodes:
                          - hostname: '1'
                            ip: '1'
                            port: '1'
                            role:
                              - master/node
                              - etcd
                            username: '1'
                            password: '1'
                          - hostname: '1'
                            ip: '1'
                            port: '1'
                            role:
                              - node
                            username: '1'
                            password: '1'
                      controlPlaneEndpoint: {}
                      pause: false
                    status:
                      agentStatus: {}
                      kubernetesVersion: ''
                      ready: false
      responses:
        '200':
          description: Cluster deployed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success deploy
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: Request data error.
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: Service request error.



  /rest/cluster/v1/nodejudge:
    post:
      summary: Node verification.
      description: Verifying the information about the node where the cluster operation is performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NameSpace:
                  type: string
                  example: test
                Nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: master-1
                      ip:
                        type: string
                        example: 192.168.100.150
                      port:
                        type: string
                        example: '22'
                      username:
                        type: string
                        example: root
                      password:
                        type: string
                        example: '123456'
                BalanceIp:
                  type: string
                  example: 192.168.100.20
            examples:
              Example 1:
                value:
                  NameSpace: test
                  Nodes:
                    - name: master-1
                      ip: 192.168.100.150
                      port: '22'
                      username: root
                      password: '123456'
                  BalanceIp: 192.168.100.20
      responses:
        '200':
          description: Node verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: Node verification failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: 192.168.100.150 ip is not ok
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: Internal server error



  /rest/cluster/v1/list:
    post:
      summary: Obtaining a cluster list.
      description: Displaying the list of created service clusters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  type: string
                  description: Cluster name.
                  example: ""
                Status:
                  type: string
                  description: Cluster status.
                  example: ""
                CurrentPage:
                  type: integer
                  description: Current page number.
                  example: 1
                PageSize:
                  type: integer
                  description: Page size.
                  example: 10
      responses:
        '200':
          description: Cluster list queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Cluster name.
                              example: installer-bke
                            version:
                              type: string
                              description: Cluster Kubernetes version.
                              example: v1.28.8
                            status:
                              type: string
                              description: Cluster health status.
                              example: Healthy
                            create_time:
                              type: string
                              description: Cluster creation time.
                              example: "2025-03-07 03:53:10"
                            node_sum:
                              type: integer
                              description: Number of nodes in the cluster.
                              example: 2
                            is_amd:
                              type: boolean
                              description: Whether the CPU is AMD-based.
                              example: true
                            is_arm:
                              type: boolean
                              description: Whether the CPU is ARM-based.
                              example: false
                            os_list:
                              type: array
                              items:
                                type: string
                              description: Cluster OS version.
                              example: ["openEuler 22.03 LTS"]
                            container_runtime:
                              type: string
                              description: Cluster runtime type.
                              example: containerd
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Request data error.
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: Service request error.



  /ws/cluster/v1/log/{clusterName}:
    get:
      summary: Obtaining cluster logs.
      description: Displaying logs that are being created in real time.
      parameters:
        - name: clusterName
          in: path
          required: true
          description: Cluster name.
          schema:
            type: string
      responses:
        '200':
          description: Logs queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Msg:
                    type: string
                    example: get the log of cluster.
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Msg:
                    type: string
                    example: Request data error.
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Msg:
                    type: string
                    example: Service request error.



  /rest/cluster/v1/delete/{clusterName}:
    delete:
      summary: Deleting a cluster.
      description: Deleting the selected cluster.
      parameters:
        - name: clusterName
          in: path
          required: true
          description: Cluster name.
          schema:
            type: string
      responses:
        '200':
          description: Cluster deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Msg:
                    type: string
                    example: delete the cluster successfully.
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Msg:
                    type: string
                    example: Request data error.
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Msg:
                    type: string
                    example: Service request error.



  /rest/cluster/v1/config:
    get:
      summary: Obtaining clutter configuration information.
      description: Obtaining clutter configuration information.
      parameters: []
      responses:
        '200':
          description: Clutter configuration information obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageRepo:
                    type: string
                    description: Image repository address.
                    example: deploy.bocloud.k8s
                  httpRepo:
                    type: string
                    description: HTTP repository address.
                    example: http://192.168.100.20:38080
                  ip:
                    type: string
                    description: Initializing the IP address of the node.
                    example: 192.168.100.20




  /rest/cluster/v1/node/list:
    post:
      summary: Obtaining a cluster node list.
      description: Obtaining information about nodes in a cluster.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ClusterName:
                  type: string
                  description: Cluster name.
                  example: my_cluster
                NodeName:
                  type: string
                  description: Node name.
                  example: ""
      responses:
        '200':
          description: Node list queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Node name.
                              example: master1
                            ip:
                              type: string
                              description: Node IP address.
                              example: 192.168.100.150
                            role:
                              type: string
                              description: Node type.
                              example: master,node
                            cpu:
                              type: integer
                              description: Number of CPUs.
                              example: 8
                            memory:
                              type: integer
                              description: Memory size.
                              example: 14
                            architecture:
                              type: string
                              description: CPU architecture.
                              example: arm64
                            status:
                              type: string
                              description: Node status.
                              example: Ready
                            os:
                              type: string
                              description: Node OS version.
                              example: openEuler 22.03 LTS
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  msg:
                    type: string
                    example: Request data error.
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  msg:
                    type: string
                    example: Service request error.





  /rest/cluster/v1/clusterBC:
    post:
      summary: Obtaining the cluster configuration file.
      operationId: getClusterConfigFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clusterName:
                  type: string
                  description: Name of the cluster whose configuration file is to be obtained.
                  example: my-cluster
      responses:
        '200':
          description: Cluster configuration file returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configFile:
                    type: string
                    description: Content of the cluster configuration file.
                    example: Character string of the configuration file content.
        '400':
          description: Request error, invalid or missing cluster name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid cluster name"
        '404':
          description: Cluster not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Cluster not found"



  /rest/cluster/v1/scaleUp:
    post:
      summary: Scaling up a cluster.
      operationId: scaleUpCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: Content of the modified cluster configuration YAML file.
                  example: |
                    replicas: 5
                    resources:
                      limits:
                        cpu: "500m"
                        memory: "512Mi"
                    ...
      responses:
        '200':
          description: Cluster scaled up successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"



  /rest/cluster/v1/scaleDown:
    post:
      summary: Scaling down a cluster.
      operationId: scaleDownCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: Content of the modified cluster configuration YAML file.
                  example: |
                    replicas: 2
                    resources:
                      limits:
                        cpu: "200m"
                        memory: "256Mi"
                    ...
      responses:
        '200':
          description: Cluster scaled down successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"





  /rest/cluster/v1/upgrade:
    post:
      summary: Upgrading the Kubernetes cluster.
      operationId: upgradeK8sCluster
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema:
              type: object
              properties:
                config:
                  type: string
                  description: Content of the modified cluster configuration YAML file.
                  example: |
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      name: my-deployment
                    spec:
                      replicas: 3
                      template:
                        spec:
                          containers:
                          - name: my-container
                            image: my-image:latest
                    ...
      responses:
        '200':
          description: Cluster upgraded successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 200
                  Message:
                    type: string
                    example: success
        '400':
          description: Request data error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 400
                  Message:
                    type: string
                    example: "Invalid request data"
        '500':
          description: Service request error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Code:
                    type: integer
                    example: 500
                  Message:
                    type: string
                    example: "Internal server error"














