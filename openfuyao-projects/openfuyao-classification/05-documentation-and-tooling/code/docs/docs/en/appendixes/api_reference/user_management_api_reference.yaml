openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: OpenAPI 3.0-compliant APIs for user management module.
paths:
  /rest/user/v1/users:
    post:
      summary: Creating a user.
      description: Creating a user instance on the openFuyao platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, unEncryptedPassword]
              properties:
                username:
                  type: string
                unEncryptedPassword:
                  type: string
                description:
                  type: string
                platformRole:
                  type: string
      responses:
        '200':
          description: User created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      platformRole:
                        type: string
        '400':
          description: The username already exists, or the username or password format is invalid.
        '500':
          description: Internal server error.

    get:
      summary: Obtaining the user list on the platform.
      description: Obtaining all users of the openFuyao platform.
      responses:
        '200':
          description: User list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        platformRole:
                          type: string
        '500':
          description: Internal server error.

  /rest/user/v1/users/{username}:
    get:
      summary: Obtaining user details.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      platformRole:
                        type: string
                      invitedByClustersMap:
                        type: object
        '400':
          description: The user does not exist, or the username format is invalid.
        '500':
          description: Internal server error.

    patch:
      summary: Modifying user information.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, platformRole]
              properties:
                username:
                  type: string
                description:
                  type: string
                platformRole:
                  type: string
      responses:
        '200':
          description: User modified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      platformRole:
                        type: string
        '400':
          description: The user does not exist, or the role name format is invalid.
        '500':
          description: Internal server error.

    delete:
      summary: Deleting a user.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      platformRole:
                        type: string
        '400':
          description: The user does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/cluster-members:
    get:
      summary: Obtaining the member list of a cluster.
      parameters:
        - name: cluster-name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cluster member list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        clusterRole:
                          type: string
        '400':
          description: The cluster does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/platform-roles:
    get:
      summary: Listing roles at the openFuyao platform level.
      description: Listing roles at the openFuyao platform level.
      operationId: listPlatformRoles
      responses:
        '200':
          description: Role list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Platform-Roles fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "platform-admin"
                            uid:
                              type: string
                              example: "6af0cd8a-86ac-4287-b4c9-5ec930484042"
                            resourceVersion:
                              type: string
                              example: "1845"
                            creationTimestamp:
                              type: string
                              format: date-time
                              example: "2024-10-16T03:12:34Z"
                            labels:
                              type: object
                              properties:
                                app.kubernetes.io/managed-by:
                                  type: string
                                  example: "Helm"
                                role-type:
                                  type: string
                                  example: "platform-role"
                            annotations:
                              type: object
                              properties:
                                author:
                                  type: string
                                  example: "Platform Installer"
                                description:
                                  type: string
                                  example: "The platform administrator has all permissions on platform resources."
                        rules:
                          type: array
                          items:
                            type: object
                            properties:
                              verbs:
                                type: array
                                items:
                                  type: string
                              apiGroups:
                                type: array
                                items:
                                  type: string
                              resources:
                                type: array
                                items:
                                  type: string
        '404':
          description: The role does not exist.
        '500':
          description: Internal server error.
  /rest/user/v1/cluster-roles:
    get:
      summary: Listing roles at the cluster level.
      description: Listing roles at the cluster level.
      operationId: listClusterRoles
      responses:
        '200':
          description: Cluster role list returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                    example: "Cluster-Roles fetched successfully"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "cluster-admin"
                            uid:
                              type: string
                              example: "791e73eb-d615-4018-a9de-7b0989589be8"
                            resourceVersion:
                              type: string
                              example: "1803"
                            creationTimestamp:
                              type: string
                              format: date-time
                              example: "2024-10-26T02:13:14Z"
                            labels:
                              type: object
                              properties:
                                app.kubernetes.io/managed-by:
                                  type: string
                                  example: "Helm"
                                role-type:
                                  type: string
                                  example: "cluster-role"
                            annotations:
                              type: object
                              properties:
                                author:
                                  type: string
                                  example: "Platform Installer"
                                description:
                                  type: string
                                  example: "The cluster administrator has permissions on all resources in the cluster."
                        rules:
                          type: array
                          items:
                            type: object
                            properties:
                              verbs:
                                type: array
                                items:
                                  type: string
                              apiGroups:
                                type: array
                                items:
                                  type: string
                              resources:
                                type: array
                                items:
                                  type: string
        '404':
          description: The role does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/invite-users:
    get:
      summary: Obtaining the list of users who can be invited to a cluster.
      parameters:
        - in: query
          name: cluster-name
          required: true
          schema:
            type: string
          description: Name of the target cluster.
      responses:
        '200':
          description: User list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        description:
                          type: string
        '400':
          description: The cluster name does not exist, or the format is invalid.
        '500':
          description: Internal server error.

  /rest/user/v1/cluster-rolebindings/{user-name}/{cluster-role}:
    patch:
      summary: Modifying a ClusterRoleBinding resource.
      parameters:
        - in: path
          name: user-name
          required: true
          schema:
            type: string
        - in: path
          name: cluster-role
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The ClusterRoleBinding edited successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                          creationTimestamp:
                            type: string
                            nullable: true
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            name:
                              type: string
                      roleRef:
                        type: object
                        properties:
                          apiGroup:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
        '400':
          description: The user or cluster is not found, or a role has been assigned to the user.
        '500':
          description: Internal server error.

  /rest/user/v1/invite-users/{user-name}/{cluster-name}/{cluster-role}:
    put:
      summary: Inviting a user to a cluster.
      parameters:
        - in: path
          name: user-name
          required: true
          schema:
            type: string
        - in: path
          name: cluster-name
          required: true
          schema:
            type: string
        - in: path
          name: cluster-role
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invited successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      InvitedByClustersList:
                        type: array
                        items:
                          type: string
                      platformRole:
                        type: string
        '400':
          description: The user, cluster, or role does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/remove-users/{user-name}/{cluster-name}:
    delete:
      summary: Removing a user from a cluster.
      parameters:
        - in: path
          name: user-name
          required: true
          schema:
            type: string
        - in: path
          name: cluster-name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User removed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      description:
                        type: string
                      platformRole:
                        type: string
        '400':
          description: The user is not invited to the cluster or the cluster does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/invite-user-crb/{user-name}/{cluster-role}:
    post:
      summary: Creating a ClusterRoleBinding resource.
      parameters:
        - in: path
          name: user-name
          required: true
          schema:
            type: string
        - in: path
          name: cluster-role
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                          creationTimestamp:
                            type: string
                            nullable: true
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            name:
                              type: string
                      roleRef:
                        type: object
                        properties:
                          apiGroup:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
        '400':
          description: The ClusterRoleBinding already exists.
        '500':
          description: Internal server error.

  /rest/user/v1/remove-user-crb/{user-name}:
    delete:
      summary: Deleting a ClusterRoleBinding resource.
      parameters:
        - in: path
          name: user-name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
        '400':
          description: The user is not found.
        '500':
          description: Internal server error.

  /rest/user/v1/cluster-rolebindings:
    get:
      summary: Obtaining the ClusterRoleBinding of a cluster by username.
      description: Obtaining the ClusterRoleBinding resource of a cluster by username.
      parameters:
        - name: user
          in: query
          required: true
          schema:
            type: string
          description: Username, which uniquely identifies a user.
      responses:
        '200':
          description: The ClusterRoleBinding obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          name:
                            type: string
                          uid:
                            type: string
                          resourceVersion:
                            type: string
                          creationTimestamp:
                            type: string
                          labels:
                            type: object
                            additionalProperties:
                              type: string
                          managedFields:
                            type: array
                            items:
                              type: object
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                            apiGroup:
                              type: string
                            name:
                              type: string
                      roleRef:
                        type: object
                        properties:
                          apiGroup:
                            type: string
                          kind:
                            type: string
                          name:
                            type: string
        '400':
          description: The username does not exist.
        '500':
          description: Internal server error.

  /rest/user/v1/request-userList:
    post:
      summary: Sending user list information to the multi-cluster service.
      description: Sending the user list information on the openFuyao platform to the multi-cluster component through the POST API.
      responses:
        '200':
          description: User list obtained successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      userInfo:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            identityName:
                              type: string
                            apiGroup:
                              type: string
                            platformAdmin:
                              type: boolean
                            memberClusters:
                              type: array
                              items:
                                type: string
        '500':
          description: Internal server error.
