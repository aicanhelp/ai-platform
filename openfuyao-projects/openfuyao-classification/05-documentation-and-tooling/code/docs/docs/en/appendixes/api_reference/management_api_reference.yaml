            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: Operation type, such as add, replace, and remove.
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: JSON path to be operated.
                  value:
                    type: object
                    description: New value (mandatory for the add and replace operations).
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already updated.
        '401':
          description: Unauthorized.
  
