        '202':
          description: Accepted.
        '401':
          description: Unauthorized.
    patch:
      tags:
        - LimitRanges
      summary: Partially updating a specified limit range.
      description: Partially updating a specified limit range.
      operationId: patchLimitRange
      parameters:
        - name: name
          in: path
          description: Name of the limit range.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
