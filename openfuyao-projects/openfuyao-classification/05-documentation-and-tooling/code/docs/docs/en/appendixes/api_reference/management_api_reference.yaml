  /api/kubernetes/api/v1/namespaces/{namespace}/resourcequotas/{name}:
    get:
      tags:
        - ResourceQuotas
      summary: Reading a specified resource quota.
      description: Obtaining the content of a resource quota.
      operationId: readResourceQuota
      parameters:
        - name: name
          in: path
          description: Resource quota name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
