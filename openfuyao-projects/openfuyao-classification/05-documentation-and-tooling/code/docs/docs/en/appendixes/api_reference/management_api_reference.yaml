                  description: API version.
                kind:
                  type: string
                  default: ResourceQuota
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
                    namespace:
                      type: string
                      description: Namespace name.
                spec:
                  type: object
                  description: Resource quota specifications.
                  properties:
                    hard:
                      type: object
                      additionalProperties:
                        type: string
                      description: Upper limit of resources.
            example:
              metadata:
                name: example-quota
                namespace: example-namespace
              spec:
                hard:
                  pods: "10"
                  requests.cpu: "4"
                  requests.memory: "16Gi"
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '401':
          description: Unauthorized.
    delete:
      tags:
        - ResourceQuotas
      summary: Deleting a specified resource quota.
      description: Deleting a resource quota.
      operationId: deleteResourceQuota
      parameters:
        - name: name
          in: path
          description: Resource quota name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: Duration before the object is deleted, in seconds.
          required: false
          schema:
            type: integer
            format: int32
        - name: propagationPolicy
          in: query
          description: Determining whether and how to perform garbage collection.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.
    patch:
      tags:
        - ResourceQuotas
      summary: Partially updating a specified resource quota.
      description: Partially updating a specified resource quota.
      operationId: patchResourceQuota
      parameters:
        - name: name
