  #
  # Limit range-related APIs
  #
  /api/kubernetes/api/v1/namespaces/{namespace}/limitranges/{name}:
    get:
      tags:
        - LimitRanges
      summary: Reading a specified limit range.
      description: Obtaining the content of a limit range.
      operationId: readLimitRange
      parameters:
        - name: name
          in: path
          description: Name of the limit range.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                  - spec
                properties:
                  apiVersion:
                    type: string
                    default: v1
                    description: API version.
                  kind:
                    type: string
                    default: LimitRange
                    description: Resource type.
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Object name.
                      namespace:
                        type: string
                        description: Namespace name.
                  spec:
                    type: object
                    description: Limit range specifications.
                    properties:
                      limits:
                        type: array
                        description: Limit list.
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: Limit type.
                              enum: [Container, Pod, PersistentVolumeClaim]
                            max:
                              type: object
                              additionalProperties:
                                type: string
                              description: Maximum limit.
                            min:
                              type: object
                              additionalProperties:
                                type: string
                              description: Minimum limit.
                            default:
                              type: object
                              additionalProperties:
                                type: string
                              description: Default limit.
                            defaultRequest:
                              type: object
                              additionalProperties:
                                type: string
                              description: Default request.
        '401':
          description: Unauthorized.
    put:
      tags:
        - LimitRanges
      summary: Updating a specified limit range.
      description: Updating a specified limit range.
      operationId: updateLimitRange
      parameters:
        - name: name
          in: path
          description: Name of the limit range.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
                - spec
              properties:
                apiVersion:
                  type: string
                  default: v1
                  description: API version.
                kind:
                  type: string
                  default: LimitRange
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
                    namespace:
                      type: string
                      description: Namespace name.
                spec:
                  type: object
                  description: Limit range specifications.
                  properties:
                    limits:
                      type: array
                      description: Limit list.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Limit type.
                            enum: [Container, Pod, PersistentVolumeClaim]
                          default:
                            type: object
                            additionalProperties:
                              type: string
                            description: Default limit.
                          defaultRequest:
                            type: object
                            additionalProperties:
                              type: string
                            description: Default request.
            example:
              metadata:
                name: example-limitrange
                namespace: example-namespace
              spec:
                limits:
                  - default:
                      cpu: "500m"
                      memory: "512Mi"
                    defaultRequest:
                      cpu: "200m"
                      memory: "256Mi"
                    type: Container
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '401':
          description: Unauthorized.
    delete:
      tags:
        - LimitRanges
      summary: Deleting a specified limit range.
      description: Deleting a limit range.
      operationId: deleteLimitRange
      parameters:
        - name: name
          in: path
          description: Name of the limit range.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
