                    description: API version.
                  kind:
                    type: string
                    default: ResourceQuota
                    description: Resource type.
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Object name.
                      namespace:
                        type: string
                        description: Namespace name.
                  spec:
                    type: object
                    description: Resource quota specifications.
                    properties:
                      hard:
                        type: object
                        additionalProperties:
                          type: string
                        description: Upper limit of resources.
                  status:
                    type: object
                    description: Resource quota status.
                    properties:
                      hard:
                        type: object
                        additionalProperties:
                          type: string
                        description: Upper limit of resources.
                      used:
                        type: object
                        additionalProperties:
                          type: string
                        description: Number of used resources.
        '401':
          description: Unauthorized.
    put:
      tags:
        - ResourceQuotas
      summary: Updating a specified resource quota.
      description: Updating a specified resource quota.
      operationId: updateResourceQuota
      parameters:
        - name: name
          in: path
          description: Resource quota name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
      requestBody:
