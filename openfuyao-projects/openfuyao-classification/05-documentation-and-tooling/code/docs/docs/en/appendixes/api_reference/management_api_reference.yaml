openapi: 3.0.0
info:
  title: 
  description: Kubernetes management APIs, including APIs related to Namespace, ResourceQuota, and LimitRange resources.
  version: v1.24
servers:
  - url: /

paths:
  #
  # Namespace-related APIs
  #
  /api/kubernetes/api/v1/namespaces/{name}:
    get:
      tags:
        - Namespaces
      summary: Reading a specified namespace.
      description: Obtaining the content of a namespace.
      operationId: readNamespace
      parameters:
        - name: name
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                properties:
                  apiVersion:
                    type: string
                    default: v1
                    description: API version.
                  kind:
                    type: string
                    default: Namespace
                    description: Resource type.
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Object name.
                      namespace:
                        type: string
                        description: Namespace name.
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: Object label.
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                        description: Object annotation.
                      resourceVersion:
                        type: string
                        description: Resource version.
                      uid:
                        type: string
                        description: Unique identifier of the object.
                      creationTimestamp:
                        type: string
                        format: date-time
                        description: Creation timestamp.
                  spec:
                    type: object
                    description: Namespace specifications.
                    properties:
                      finalizers:
                        type: array
                        description: Finalizer list.
                        items:
                          type: string
                  status:
                    type: object
                    description: Namespace status.
                    properties:
                      phase:
                        type: string
                        description: Namespace status phase.
                        enum: [Active, Terminating]
        '401':
          description: Unauthorized.
    put:
      tags:
        - Namespaces
      summary: Updating a specified namespace.
      description: Updating a specified namespace.
      operationId: updateNamespace
      parameters:
        - name: name
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
              properties:
                apiVersion:
                  type: string
                  default: v1
                  description: API version.
                kind:
                  type: string
                  default: Namespace
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                      description: Object label.
            example:
              metadata:
                name: example-namespace
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - apiVersion
                  - kind
                  - metadata
                properties:
                  apiVersion:
                    type: string
                    default: v1
                    description: API version.
                  kind:
                    type: string
                    default: Namespace
                    description: Resource type.
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Object name.
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        description: Object label.
                  spec:
                    type: object
                    description: Namespace specifications.
                    properties:
                      finalizers:
                        type: array
                        description: Finalizer list.
                        items:
                          type: string
                  status:
                    type: object
                    description: Namespace status.
                    properties:
                      phase:
                        type: string
                        description: Namespace status phase.
                        enum: [Active, Terminating]
        '201':
          description: Already created.
        '401':
          description: Unauthorized.
    delete:
      tags:
        - Namespaces
      summary: Deleting a specified namespace.
      description: Deleting a namespace.
      operationId: deleteNamespace
      parameters:
        - name: name
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: Duration before the object is deleted, in seconds.
          required: false
          schema:
            type: integer
            format: int32
        - name: propagationPolicy
          in: query
          description: Determining whether and how to perform garbage collection.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.
    patch:
      tags:
        - Namespaces
      summary: Partially updating a specified namespace.
      description: Partially updating a specified namespace.
      operationId: patchNamespace
      parameters:
        - name: name
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: Forcibly applying the request.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: Operation type, such as add, replace, and remove.
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: JSON path to be operated.
                  value:
                    type: object
                    description: New value (mandatory for the add and replace operations).
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already updated.
        '401':
          description: Unauthorized.
  
  /api/kubernetes/api/v1/namespaces:
    get:
      tags:
        - Namespaces
      summary: Obtaining the namespace list.
      description: Obtaining the namespace list.
      operationId: listNamespaces
      parameters:
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
        - name: watch
          in: query
          description: Watching changes to the specified resource.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    example: NamespaceList
                  apiVersion:
                    type: string
                    example: v1
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - apiVersion
                        - kind
                        - metadata
                      properties:
                        apiVersion:
                          type: string
                          default: v1
                          description: API version.
                        kind:
                          type: string
                          default: Namespace
                          description: Resource type.
                        metadata:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Object name.
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                              description: Object label.
        '401':
          description: Unauthorized.
    post:
      tags:
        - Namespaces
      summary: Creating a namespace.
      description: Creating a namespace.
      operationId: createNamespace
      parameters:
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - apiVersion
                - kind
                - metadata
              properties:
                apiVersion:
                  type: string
                  default: v1
                  description: API version.
                kind:
                  type: string
                  default: Namespace
                  description: Resource type.
                metadata:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Object name.
            example:
              metadata:
                name: example-namespace
        required: true
      responses:
        '200':
          description: Success.
        '201':
          description: Already created.
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.

  #
  # Resource quota-related APIs
