          required: false
          schema:
            type: string
        - name: gracePeriodSeconds
          in: query
          description: Duration before the object is deleted, in seconds.
          required: false
          schema:
            type: integer
            format: int32
        - name: propagationPolicy
          in: query
          description: Determining whether and how to perform garbage collection.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '202':
          description: Accepted.
        '401':
          description: Unauthorized.
    patch:
      tags:
        - CustomResourceDefinitions
      summary: Partially updating a specified custom resource definition.
      description: Partially updating a specified custom resource definition.
      operationId: patchCustomResourceDefinition
