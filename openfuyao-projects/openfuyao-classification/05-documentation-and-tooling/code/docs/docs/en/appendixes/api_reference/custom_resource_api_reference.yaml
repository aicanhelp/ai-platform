      description: Obtaining the content of a custom resource definition.
      operationId: readCustomResourceDefinition
      parameters:
        - name: name
          in: path
          description: Custom resource definition name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized.
    put:
      tags:
        - CustomResourceDefinitions
      summary: Updating a specified custom resource definition.
      description: Updating a specified custom resource definition.
      operationId: updateCustomResourceDefinition
      parameters:
        - name: name
          in: path
          description: Custom resource definition name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: Maximum number of responses returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              metadata:
                name: examples.example.com
              spec:
                group: example.com
                versions:
                  - name: v1
                    served: true
                    storage: true
                    schema:
                      openAPIV3Schema:
                        type: object
                        properties:
                          spec:
                            type: object
                            properties:
                              foo:
                                type: string
                              bar:
                                type: integer
                scope: Namespaced
                names:
                  plural: examples
                  singular: example
                  kind: Example
                  shortNames:
                    - ex
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '201':
          description: Already created.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized.
