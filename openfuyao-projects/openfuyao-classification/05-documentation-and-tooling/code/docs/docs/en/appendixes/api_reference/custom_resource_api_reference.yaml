          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: Specified page number returned to the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: dryRun
          in: query
          description: The requested update should not be persisted.
          required: false
          schema:
            type: string
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned object list by label.
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: Forcibly applying the request.
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - op
                  - path
                properties:
                  op:
                    type: string
                    description: Operation type, such as add, replace, and remove.
                    enum: [add, replace, remove]
                  path:
                    type: string
                    description: JSON path to be operated.
                  value:
                    type: object
                    description: New value (mandatory for the add and replace operations).
            examples:
              Adding a label:
                value:
                  - op: add
                    path: /metadata/labels
                    value:
                      data: value
              Adding a label attribute:
                value:
                  - op: add
                    path: /metadata/labels/env
                    value: value
              Replacing a label attribute:
                value:
                  - op: replace
                    path: /metadata/labels/env
                    value: value1
              Deleting a label attribute:
                value:
                  - op: remove
                    path: /metadata/labels/env
        required: true
      responses:
        '200':
          description: Success.
          content:
