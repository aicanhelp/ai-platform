          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned objects by label.
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: Forcibly executing the request.
          required: false
          schema:
            type: boolean
            default: false
