            type: string
        - name: pretty
          in: query
          description: Formatted output.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of returned results.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: Number of the returned page.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          description: Indicating that the update operation should not be persisted and only performs validation.
          required: false
          schema:
            type: string
            enum: [All]
        - name: fieldSelector
          in: query
          description: Selector that restricts the returned objects by field.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: Selector that restricts the returned objects by label.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Role binding configuration object.
      responses:
        '200':
          description: Updated successfully.
        '201':
          description: Created successfully.
        '401':
          description: Unauthorized access.
    delete:
      summary: Deleting a specified role binding.
      description: Deleting a specified role binding.
      tags:
        - Role binding
      parameters:
        - name: name
          in: path
          description: Resource name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Formatted output.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of returned results.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: Number of the returned page.
          required: false
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          description: Indicating that the update operation should not be persisted and only performs validation.
          required: false
          schema:
            type: string
            enum: [All]
        - name: gracePeriodSeconds
          in: query
          description: Grace period before deletion, in seconds.
          required: false
          schema:
            type: integer
            minimum: 0
        - name: propagationPolicy
          in: query
          description: Garbage collection policy.
          required: false
          schema:
            type: string
            enum: [Orphan, Background, Foreground]
      responses:
        '200':
          description: Deleted successfully.
        '202':
          description: Deletion request accepted.
        '401':
          description: Unauthorized access.
    patch:
      summary: Partially updating the binding of a specified role.
      description: Partially updating the binding configuration of a specified role.
      tags:
        - Role binding
