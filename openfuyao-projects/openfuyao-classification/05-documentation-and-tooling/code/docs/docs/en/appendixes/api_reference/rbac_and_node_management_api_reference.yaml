openapi: 3.0.0
info:
  title: 
  version: 1.0.0
  description: API specifications for Kubernetes RBAC permission control and node operations.
  contact:
    name: Kubernetes API technical support
    email: support@kubernetes.io

servers:
  - url: /api/kubernetes
    description: Basic endpoint of the Kubernetes API.

tags:
  - name: Role binding
    description: Operations related to role binding.
  - name: Cluster role
    description: Operations related to cluster roles.
  - name: Cluster role binding
    description: Operations related to cluster role binding.
  - name: Event
    description: Operations related to cluster events.
  - name: Node
    description: Operations related to cluster nodes.

paths:
  # RoleBinding APIs - Role binding APIs
  /apis/rbac.authorization.k8s.io/v1/namespaces/{namespace}/rolebindings/{name}:
    get:
      summary: Reading a specified role binding.
      description: Obtaining the details about the binding of a specified role.
      tags:
        - Role binding
      parameters:
        - name: name
          in: path
          description: Resource name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
          description: Namespace name.
          required: true
          schema:
            type: string
        - name: pretty
          in: query
          description: Formatted output.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of returned results.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
          description: Number of the returned page.
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Operation succeeded.
          content:
            application/json:
              schema:
                type: object
                description: Object to which the role is bound.
        '401':
          description: Unauthorized access.
        '404':
          description: Resource not found.
    put:
      summary: Updating the binding of a specified role.
      description: Updating the binding configuration of a specified role.
      tags:
        - Role binding
      parameters:
        - name: name
          in: path
          description: Resource name.
          required: true
          schema:
            type: string
        - name: namespace
          in: path
