          in: query
          description: Formatted output.
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of returned results.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: page
          in: query
