registry:
  imageAddress: cr.openfuyao.cn/openfuyao/registry:2.8.1
  architecture:
    - amd64
    - arm64
repos:
  - architecture: # openfuyao many-core-orchestrator 自编译镜像
      - amd64
      - arm64
    needDownload: true # many-core-orchestrator 扩展组件所需镜像是否下载开关，false-关闭不下载，true-开启下载
    subImages:
      - sourceRepo: cr.openfuyao.cn/openfuyao
        targetRepo: openfuyao
        images:
          - name: mco-analyzer
            tag:
              - 26.6.0-rc.3
          - name: mco-collector
            tag:
              - 26.6.0-rc.3
          - name: mco-volcano-scheduler
            tag:
              - 26.6.0-rc.3
          - name: kubectl-openfuyao
            tag:
              - 26.6.0-rc.3
      - sourceRepo: hub.oepkgs.net/openfuyao
        targetRepo: openfuyao
        images:
          - name: volcanosh/vc-webhook-manager
            tag:
              - v1.9.0
          - name: volcanosh/vc-controller-manager
            tag:
              - v1.9.0
          - name: kata-containers/kata-deploy
            tag:
              - 3.30.0
rpms:
debs: []
files: []
charts:
  - address: https://openfuyao.obs.cn-north-4.myhuaweicloud.com/charts/releases/download/
    files:
      - fileName: many-core-orchestrator-26.6.0-rc.3.tgz
