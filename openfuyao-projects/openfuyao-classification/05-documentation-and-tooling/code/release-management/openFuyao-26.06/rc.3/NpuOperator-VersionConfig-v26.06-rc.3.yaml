          - name: npu-driver-installer
            tag:
              - 1.2.1
          - name: npu-container-toolkit
            tag:
              - 1.2.1
          - name: npu-node-provision
            tag:
              - 1.2.1
          - name: npu-feature-discovery
            tag:
              - 1.2.1
          - name: npu-dra-plugin
            tag:
              - 1.0.1
          - name: ub-network-device-plugin
            tag:
              - 1.0.1
