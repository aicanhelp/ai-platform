registry:
  imageAddress: cr.openfuyao.cn/openfuyao/registry:2.8.1
  architecture:
    - amd64
    - arm64
repos:
  - architecture: # openfuyao numa亲和 扩展组件
      - amd64
      - arm64
    needDownload: true # numa亲和 扩展组件所需镜像是否下载开关，false-关闭不下载，true-开启下载
    subImages:
      - sourceRepo: cr.openfuyao.cn/openfuyao
        targetRepo: openfuyao
        images:
          - name: volcano-config-website
            tag:
              - 1.1.2
          - name: volcano-config-service
            tag:
              - 1.1.2
          - name: numa-affinity-webhook
            tag:
              - 1.1.2
          - name: volcano/resource-exporter
            tag:
              - 0.1.0
          - name: oauth-proxy
            tag:
              - 1.0.2
          - name: vc-scheduler
            tag:
              - 1.0.2
          - name: kubectl-openfuyao
            tag:
              - 1.0.3
      - sourceRepo: hub.oepkgs.net/openfuyao
        targetRepo: openfuyao
        images:
          - name: volcanosh/vc-webhook-manager
            tag:
              - v1.9.0
          - name: volcanosh/vc-controller-manager
            tag:
              - v1.9.0
          - name: alpine/openssl
            tag:
              - 3.5.0
rpms:
debs: []
files: []
charts:
  - address: https://openfuyao.obs.cn-north-4.myhuaweicloud.com/charts/releases/download/
    files:
      - fileName: numa-affinity-package-1.1.2.tgz