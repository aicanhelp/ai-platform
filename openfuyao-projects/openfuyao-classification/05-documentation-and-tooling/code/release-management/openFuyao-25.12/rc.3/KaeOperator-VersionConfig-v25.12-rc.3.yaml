registry:
  imageAddress: cr.openfuyao.cn/openfuyao/registry:2.8.1
  architecture:
    - amd64
    - arm64
repos:
  - architecture: # openfuyao kae-operator 扩展组件
      - amd64
      - arm64
    needDownload: true # kae-operator 扩展组件所需镜像是否下载开关，false-关闭不下载，true-开启下载
    subImages:
      - sourceRepo: cr.openfuyao.cn/openfuyao
        targetRepo: openfuyao
        images:
          - name: kae-operator
            tag:
              - 1.0.0
          - name: kae-driver-installer
            tag:
              - 1.0.0
          - name: kae-device-plugin
            tag:
              - 1.0.0
      - sourceRepo: hub.oepkgs.net/openfuyao/nfd
        targetRepo: nfd # 离线安装时的镜像路径
        images:
          - name: node-feature-discovery
            tag:
              - v0.16.4
rpms:
debs: []
files: []
charts:
  - address: https://openfuyao.obs.cn-north-4.myhuaweicloud.com/charts/releases/download/
    files:
      - fileName: kae-operator-1.0.0.tgz