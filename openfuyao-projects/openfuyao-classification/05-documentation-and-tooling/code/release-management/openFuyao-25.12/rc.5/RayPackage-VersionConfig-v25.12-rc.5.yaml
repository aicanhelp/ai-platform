        targetRepo: /
        images:
          - name: kuberay/operator
            tag:
              - v1.2.1
          - name: kiwigrid/k8s-sidecar
            tag:
              - 1.30.0
          - name: brancz/kube-rbac-proxy
            tag:
              - v0.18.2
