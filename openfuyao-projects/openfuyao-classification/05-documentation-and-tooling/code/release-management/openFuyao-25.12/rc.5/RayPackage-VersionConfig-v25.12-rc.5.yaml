registry:
  imageAddress: cr.openfuyao.cn/openfuyao/registry:2.8.1
  architecture:
    - amd64
    - arm64
repos:
  - architecture: # openfuyao ray 扩展组件
      - amd64
      - arm64
    needDownload: true # ray 扩展组件所需镜像是否下载开关，false-关闭不下载，true-开启下载
    subImages:
      - sourceRepo: cr.openfuyao.cn/openfuyao
        targetRepo: openfuyao
        images:
          - name: ray-service
            tag:
              - 0.20.0
          - name: ray-website
            tag:
              - 0.20.0
          - name: oauth-proxy
            tag:
              - 0.20.0
          - name: bitnami/kubectl
            tag:
              - 1.28
          - name: grafana/promtail
            tag:
              - 2.9.3
          - name: grafana/grafana
            tag:
              - 11.5.1
          - name: bats/bats
            tag:
              - v1.4.1
          - name: curlimages/curl
            tag:
              - 8.9.1
          - name: library/busybox
            tag:
              - 1.31.1
          - name: prometheus/alertmanager
            tag:
              - v0.28.0
          - name: prometheus-operator/prometheus-operator
            tag:
              - v0.80.0
          - name: prometheus-operator/admission-webhook
            tag:
              - v0.80.0
          - name: prometheus-operator/prometheus-config-reloader
            tag:
              - v0.80.0
          - name: ingress-nginx/kube-webhook-certgen
