registry:
  imageAddress: cr.openfuyao.cn/openfuyao/registry:2.8.1
  architecture:
    - amd64
    - arm64
repos:
  - architecture: # openfuyao eagle-eye 扩展组件
      - amd64
      - arm64
    needDownload: true # eagle-eye 扩展组件所需镜像是否下载开关，false-关闭不下载，true-开启下载
    subImages:
      - sourceRepo: cr.openfuyao.cn/openfuyao
        targetRepo: openfuyao
        images:
          - name: eagle-eye-hardware-monitor
            tag:
              - 0.20.0
          - name: eagle-eye-hardware-diagnosis
            tag:
              - 0.20.0
          - name: bitnami/kubectl
            tag:
              - 1.33
      - sourceRepo: docker.io
        targetRepo: /
        images:
          - name: library/nats
            tag:
              - 2.12.1-alpine
          - name: natsio/nats-server-config-reloader
            tag:
              - 0.20.1
          - name: library/busybox
            tag:
              - 1.36.1
rpms:
debs: []
files: []
charts:
  - address: https://openfuyao.obs.cn-north-4.myhuaweicloud.com/charts/releases/download/
    files:
      - fileName: eagle-eye-0.20.0.tgz