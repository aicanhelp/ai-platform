inferencepool:
  inferenceExtension:
    pluginsConfigFile: "epp-random-pd-bucket.yaml"
    pluginsCustomConfig:
      epp-random-pd-bucket.yaml: |
        apiVersion: inference.networking.x-k8s.io/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: filter-by-pd-label
          parameters:
            pdLabelName: openfuyao.com/pdRole
            pdGroupLabelName: openfuyao.com/pdGroupID
            prefillValue: prefill
            decodeValue: decode
            leaderValue: leader
        - type: picker-random-pd-bucket
        - type: pd-header-handler
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: filter-by-pd-label
          - pluginRef: picker-random-pd-bucket
          - pluginRef: pd-header-handler