image:
  repository: quay.io/ascend/vllm-ascend
  tag: v0.10.0rc1
  pullPolicy: IfNotPresent

modelServer:
  name: qwen-qwen3-8b
  model: Qwen/Qwen3-8B
  enablePrefixCaching: true
  gpuMemoryUtilization: 0.9
  blockSize: 128
  maxNumSeqs: 256
  kvEventsConfig:
    enable_kv_cache_events: true
    publisher: zmq
    topic: kv-events
  # extraArgs: ["--enforce-eager"]
  
service:
  port: 8000
  zmqPort: 5557
  
replicaCount: 1

hf:
  createSecret: true
  existingSecret: ""
  secretName: "hf-token"
  secretKey: "HF_TOKEN"
  token: ${HF_TOKEN}

