apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.modelServer.name | replace "/" "-" | lower }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    openfuyao.com/model: {{ .Values.modelServer.name | replace "/" "-" | lower }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http-api
    name: http
  - port: {{ .Values.service.zmqPort }}
    targetPort: zmq-pub
    name: zmq
  type: ClusterIP

