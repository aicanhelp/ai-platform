apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.modelServer.name | replace "/" "-" | lower }}
  namespace: {{ .Release.Namespace }}
  labels:
    inference-backend: "true"
    openfuyao.com/model: {{ .Values.modelServer.name | replace "/" "-" | lower }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      openfuyao.com/model: {{ .Values.modelServer.name | replace "/" "-" | lower }}
  template:
    metadata:
      labels:
        inference-backend: "true"
        openfuyao.com/model: {{ .Values.modelServer.name | replace "/" "-" | lower }}
        openfuyao.com/engine: vllm
        openfuyao.com/pdRole: aggregate
    spec:
      containers:
        - name: {{ .Values.modelServer.name | replace "/" "-" | lower }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["vllm", "serve", "{{ .Values.modelServer.model }}"]
          args:
            {{- if .Values.modelServer.enablePrefixCaching }}
            - "--enable-prefix-caching"
            {{- end }}
            - "--gpu-memory-utilization"
            - {{ (.Values.modelServer.gpuMemoryUtilization | default 0.8) | quote }}
            - "--block-size"
            - {{ (.Values.modelServer.blockSize | default 128) | quote }}
            - "--max-num-seqs"
            - {{ (.Values.modelServer.maxNumSeqs | default 256) | quote }}
            - "--kv-events-config"
            - {{ toJson .Values.modelServer.kvEventsConfig | quote }}
            {{- range .Values.modelServer.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: VLLM_USE_V1
              value: "1"
            - name: PYTHONHASHSEED
              value: "114514"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.hf.existingSecret }}{{ .Values.hf.existingSecret }}{{ else }}{{ .Values.hf.secretName | default "hf-token" }}{{ end }}
                  key: {{ default "HF_TOKEN" .Values.hf.secretKey }}
            - name: PORT
              value: "8000"
            - name: ZMQ_PORT
              value: "5557"
          resources:
            limits:
              cpu: 24
              memory: 64G
              huawei.com/Ascend910: "1"
            requests:
              cpu: 24
              memory: 64G
              huawei.com/Ascend910: "1"
          ports:
            - name: http-api
              containerPort: 8000
            - name: zmq-pub
              containerPort: 5557
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: dcmi
              mountPath: /usr/local/dcmi
            - name: npusmi
              mountPath: /usr/local/bin/npu-smi
            - name: lib64
              mountPath: /usr/local/Ascend/driver/lib64
            - name: version
              mountPath: /usr/local/Ascend/driver/version.info
            - name: installinfo
              mountPath: /etc/ascend_install.info
            - name: rootcache
              mountPath: /root/.cache
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "24Gi"
      - name: dcmi
        hostPath:
          path: /usr/local/dcmi
      - name: npusmi
        hostPath:
          path: /usr/local/bin/npu-smi
          type: File
      - name: lib64
        hostPath:
          path: /usr/local/Ascend/driver/lib64
      - name: version
        hostPath:
          path: /usr/local/Ascend/driver/version.info
          type: File
      - name: installinfo
        hostPath:
          path: /etc/ascend_install.info
          type: File
      - name: rootcache
        hostPath:
          path: {{ .Values.modelServer.rootCachePath | default "/home/llm_cache" }}
