{{- range .Values.httpRoutes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
  - group: {{ .parentRef.group | default "gateway.networking.k8s.io" }}
    kind: {{ .parentRef.kind | default "Gateway" }}
    name: {{ .parentRef.name | default "inference-gateway" }}
  rules:
  - backendRefs:
    - group: {{ .backend.group | default "inference.networking.k8s.io" }}
      kind: {{ .backend.kind | default "InferencePool" }}
      name: {{ .backend.name | default "vllm-qwen3-8b" }}
    matches:
    - path:
        type: PathPrefix
        value: {{ .pathPrefix | default "/" | quote }}
    timeouts:
      request: {{ .requestTimeout | default "300s" }}
---
{{- end }}
