{{- if and (not .Values.hf.existingSecret) .Values.hf.createSecret }}
  {{- if not .Values.hf.token }}
    {{- fail "hf.token must be set when hf.createSecret=true and hf.existingSecret is empty" -}}
  {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hf.secretName | default "hf-token" }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{ .Values.hf.secretKey | default "HF_TOKEN" }}: {{ .Values.hf.token | quote }}
{{- end }}


