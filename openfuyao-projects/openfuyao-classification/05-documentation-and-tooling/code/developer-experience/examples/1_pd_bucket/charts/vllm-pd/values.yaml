# inference-backend 配置
replicaCount: 1

modelServer:
  name: qwen-qwen3-8b
  model: "Qwen/Qwen3-8B"
  useOnlineHuggingFace: true
  cachePath: /home/llm_cache
  disaggregated:
    kvConnector: "MooncakeConnector"
    kvConnectorModulePath: "vllm_ascend.distributed.mooncake_connector"
    groupID: "qwen3-8b-pd-01"
    proxyServer:
      basePort: 8000
      discovery: # discovery service for vllm pods
        interval: 10
    prefill:
      replicaAmount: 4
      vllmBasePort: 8000
      connectorBasePort: 20001
      tensorParallelism: 1
      dataParallelism: 1
      batchRequest: true
    decode:
      replicaAmount: 4
      vllmBasePort: 8000
      connectorBasePort: 20002
      tensorParallelism: 1
      dataParallelism: 1
      
service:
  label: vllm

resources:
  disaggregated:
    prefill:
      limits:
        deviceName: "huawei.com/Ascend910"
      requests:
        deviceName: "huawei.com/Ascend910"
    decode:
      limits:
        deviceName: "huawei.com/Ascend910"
      requests:
        deviceName: "huawei.com/Ascend910"

image:
  disaggregated:
    repository: vllm-mooncake
    tag: v0.11.0
    pullPolicy: IfNotPresent
  proxy:
    repository: hermes-router/proxy
    tag: dev
    pullPolicy: IfNotPresent
