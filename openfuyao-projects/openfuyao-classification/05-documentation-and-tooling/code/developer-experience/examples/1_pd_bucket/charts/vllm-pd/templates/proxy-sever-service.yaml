apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-proxy
  namespace: {{ $.Release.Namespace }}
  labels:
    proxy-service: "true"
spec:
  type: ClusterIP  
  selector:
    proxy-service: "true"
  ports:
    # 1. export proxy server 8000 port
    - name: http-api
      protocol: TCP
      port: {{ $.Values.modelServer.disaggregated.proxyServer.basePort }}
      targetPort: proxy-port
      
    # 2. export vllm prefill 5557 port for zmq message publishment
    - name: zmq-pub
      protocol: TCP  
      port: 5557
      targetPort: kv-event-p