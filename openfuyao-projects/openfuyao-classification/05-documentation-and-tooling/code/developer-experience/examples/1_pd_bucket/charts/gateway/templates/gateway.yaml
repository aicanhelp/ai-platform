apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className | default "istio" }}
  listeners:
{{- range $i, $l := .Values.gateway.listeners }}
  - name: {{ $l.name | default (printf "http-%d" $i) }}
    port: {{ $l.port | default 80 }}
    protocol: {{ $l.protocol | default "HTTP" }}
{{- end }}


