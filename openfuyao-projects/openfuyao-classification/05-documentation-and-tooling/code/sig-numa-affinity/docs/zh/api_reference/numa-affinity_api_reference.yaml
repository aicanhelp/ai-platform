openapi: 3.0.0
info:
  title: 
  description: NUMA亲和调度相关的API接口。
  version: 1.0.0
tags:
  - name: CustomResources
    description: 自定义资源相关操作。
  - name: Monitoring
    description: 监控数据查询。
  - name: SchedulingPolicies
    description: 调度策略配置。

paths:
  /api/kubernetes/apis/{group}/{version}/{plural}/{name}:
    get:
      tags:
        - CustomResources
      summary: 读取指定的自定义资源实例。
      description: 获取NUMA资源相关实例。
      operationId: getCustomResource
      parameters:
        - name: group
          in: path
          description: CRD的API组。
          required: true
          schema:
            type: string
          example: nodeinfo.volcano.sh
        - name: version
          in: path
          description: 版本。
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: plural
          in: path
          description: 指定的资源复数名称。
          required: true
          schema:
            type: string
          example: numatopologies
        - name: name
          in: path
          description: 负载名称。
          required: true
          schema:
            type: string
          example: fuyao-master
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 自定义资源对象。
        '401':
          description: 未鉴权。

  /api/kubernetes/apis/{group}/{version}/{plural}:
    get:
      tags:
        - CustomResources
      summary: 自定义资源实例列表。
      description: 获取NUMA资源相关实例列表。
      operationId: listCustomResources
      parameters:
        - name: group
          in: path
          description: CRD的API组。
          required: true
          schema:
            type: string
          example: nodeinfo.volcano.sh
        - name: version
          in: path
          description: 版本。
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: plural
          in: path
          description: 指定的资源复数名称。
          required: true
          schema:
            type: string
          example: numatopologies
        - name: pretty
          in: query
          description: 整齐打印。
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: 列表调用返回的最大响应数。
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: 列表调用返回的指定页码。
          required: false
          schema:
            type: integer
            format: int32
        - name: fieldSelector
          in: query
          description: 限制所返回对象的字段的选择器。
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: 通过标签限制返回对象列表的选择器。
          required: false
          schema:
            type: string
        - name: resourceVersion
          in: query
          description: 对请求所针对的资源版本设置约束。
          required: false
          schema:
            type: string
        - name: resourceVersionMatch
          in: query
          description: 决定如何将resourceVersion应用于列表调用。
          required: false
          schema:
            type: string
        - name: watch
          in: query
          description: 监视对所述资源的更改。
          required: false
          schema:
            type: boolean
        - name: sendInitialEvents
          in: query
          description: 监视通知流将从合成事件开始，以生成集合中对象的当前状态。
          required: false
          schema:
            type: boolean
        - name: timeoutSeconds
          in: query
          description: list/watch调用的超时秒数。
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 自定义资源列表对象。
        '401':
          description: 未鉴权。

  /api/v1/query:
    get:
      tags:
        - Monitoring
      summary: 瞬间向量表达式查询。
      description: 获取相应的监控指标数据，每个时间序列只包含一个数据点。
      operationId: queryInstantVector
      parameters:
        - name: query
          in: query
          description: Prometheus表达式查询字符串。
          required: true
          schema:
            type: string
          example: online_numa_nodes_count
        - name: time
          in: query
          description: 评估时间戳。
          required: false
          schema:
            type: string
            format: date-time
        - name: timeout
          in: query
          description: 评估超时时间。
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 向量查询响应对象。
        '400':
          description: 未响应。
        '422':
          description: 无法访问。
        '503':
          description: 服务器尚未处于可以接收请求的状态。

  /api/v1/query_range:
    get:
      tags:
        - Monitoring
      summary: 范围向量表达式查询。
      description: 获取相应的监控指标数据，每个时间序列包含多个数据点。
      operationId: queryRangeVector
      parameters:
        - name: query
          in: query
          description: Prometheus表达式查询字符串。
          required: true
          schema:
            type: string
          example: online_numa_nodes_count
        - name: start
          in: query
          description: 开始时间戳（包含）。
          required: true
          schema:
            type: string
            format: date-time
          example: 2015-07-01T20:10:30.781Z
        - name: end
          in: query
          description: 结束时间戳（包含）。
          required: true
          schema:
            type: string
            format: date-time
          example: 2015-07-01T20:11:00.781Z
        - name: step
          in: query
          description: 查询分辨率步长，格式可以是持续时间或秒数浮点数。
          required: true
          schema:
            type: string
          example: 15s
        - name: timeout
          in: query
          description: 评估超时时间。
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 矩阵查询响应对象。
        '400':
          description: 未响应。
        '422':
          description: 无法访问。
        '503':
          description: 服务器尚未处于可以接收请求的状态。

  /rest/scheduling/v1/numaaware:
    get:
      tags:
        - SchedulingPolicies
      summary: 查询NUMA亲和性调度策略。
      description: 获取NUMA亲和性调度策略。
      operationId: getNUMAAwarePolicy
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 策略响应对象。
              example:
                code: 200
                msg: get NumaAware state success
                data: open
        '500':
          description: 执行失败。
    put:
      tags:
        - SchedulingPolicies
      summary: 修改NUMA亲和性调度策略。
      description: 修改NUMA亲和性调度策略。
      operationId: updateNUMAAwarePolicy
      requestBody:
        description: 调度策略配置。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: string
                  description: 开启或关闭策略。
                  enum: [open, close]
            example:
              policy: open
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 简单响应对象。
              example:
                code: 200
                msg: update NumaAware policy success
        '500':
          description: 执行失败。

  /rest/scheduling/v1/numaDistance:
    get:
      tags:
        - SchedulingPolicies
      summary: 查询NUMA Distance策略。
      description: 获取NUMA Distance策略。
      operationId: getNUMADistancePolicy
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 策略响应对象。
              example:
                code: 200
                msg: get numaDistance state success
                data: open
        '500':
          description: 执行失败。
    put:
      tags:
        - SchedulingPolicies
      summary: 修改NUMA Distance策略。
      description: 修改NUMA Distance策略。
      operationId: updateNUMADistancePolicy
      requestBody:
        description: 调度策略配置。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: string
                  description: 开启或关闭策略。
                  enum: [open, close]
            example:
              policy: open
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 简单响应对象。
              example:
                code: 200
                msg: update NUMA Distance policy success
        '406':
          description: kubelet版本不支持，请求不被接受。
        '500':
          description: 执行失败。

  /rest/scheduling/v1/numaFast:
    get:
      tags:
        - SchedulingPolicies
      summary: 查询运行时Pod亲和优化策略。
      description: 获取运行时Pod亲和优化策略。
      operationId: getNRIPolicy
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 策略响应对象。
              example:
                code: 200
                msg: get nri state success
                data: open
        '500':
          description: 执行失败。
    put:
      tags:
        - SchedulingPolicies
      summary: 修改运行时Pod亲和优化策略。
      description: 修改运行时Pod亲和优化策略。
      operationId: updateNRIPolicy
      requestBody:
        description: 调度策略配置。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: string
                  description: 开启或关闭策略。
                  enum: [open, close]
            example:
              policy: open
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 简单响应对象。
              example:
                code: 200
                msg: update nri policy success
        '500':
          description: 执行失败。

  /rest/scheduling/v1/balance:
    get:
      tags:
        - SchedulingPolicies
      summary: 查询均衡调度策略。
      description: 获取均衡调度策略。
      operationId: getBalancePolicy
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 策略响应对象。
              example:
                code: 200
                msg: get balance state success
                data: open
        '500':
          description: 执行失败。
    put:
      tags:
        - SchedulingPolicies
      summary: 修改均衡调度策略。
      description: 修改均衡调度策略。
      operationId: updateBalancePolicy
      requestBody:
        description: 调度策略配置。
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: string
                  description: 开启或关闭策略。
                  enum: [open, close]
            example:
              policy: open
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 简单响应对象。
              example:
                code: 200
                msg: update balance policy success
        '500':
          description: 执行失败。

  /rest/scheduling/v1/default:
    put:
      tags:
        - SchedulingPolicies
      summary: 恢复默认配置。
      description: 恢复默认配置。
      operationId: restoreDefaultPolicy
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 简单响应对象。
              example:
                code: 200
                msg: update default policy success
        '500':
          description: 执行失败。

  /rest/scheduling/v1/nodeList:
    get:
      tags:
        - SchedulingPolicies
      summary: 获取节点列表。
      description: 获取节点列表。
      operationId: getNodeList
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 数据响应对象。
              example:
                code: 200
                msg: ok
                data: "..."
        '500':
          description: 执行失败。

  /rest/scheduling/v1/cr/{name}:
    get:
      tags:
        - SchedulingPolicies
      summary: 获取numatopologies信息。
      description: 获取numatopologies信息。
      operationId: getNumatopologies
      parameters:
        - name: name
          in: path
          description: CR实例名称。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 数据响应对象。
              example:
                code: 200
                msg: ok
                data: "..."
        '500':
          description: 执行失败。

  /rest/scheduling/v1/uuidToName/{uuid}:
    get:
      tags:
        - SchedulingPolicies
      summary: 根据UUID获取Pod名称。
      description: 根据UUID获取Pod名称。
      operationId: getPodNameByUUID
      parameters:
        - name: uuid
          in: path
          description: Pod的uuid。
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功。
          content:
            application/json:
              schema:
                type: object
                description: 数据响应对象。
              example:
                code: 200
                msg: ok
                data: podName
        '500':
          description: 执行失败。