        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Simple response object.
              example:
                code: 200
                msg: update NUMA Distance policy success
        '406':
          description: Kubelet version not supported, request is not accepted.
        '500':
          description: Execution failed.

