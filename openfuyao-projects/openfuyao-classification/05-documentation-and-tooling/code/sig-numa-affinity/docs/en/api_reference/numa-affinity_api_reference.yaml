openapi: 3.0.0
info:
  title: 
  description: API interfaces related to NUMA-aware scheduling.
  version: 1.0.0
tags:
  - name: CustomResources
    description: Custom resource related operations.
  - name: Monitoring
    description: Monitoring data query.
  - name: SchedulingPolicies
    description: Scheduling policy configuration.

paths:
  /api/kubernetes/apis/{group}/{version}/{plural}/{name}:
    get:
      tags:
        - CustomResources
      summary: Read the specified custom resource instance.
      description: Get NUMA resource related instances.
      operationId: getCustomResource
      parameters:
        - name: group
          in: path
          description: The API group of the CRD.
          required: true
          schema:
            type: string
          example: nodeinfo.volcano.sh
        - name: version
          in: path
          description: Version.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: plural
          in: path
          description: The plural name of the specified resource.
          required: true
          schema:
            type: string
          example: numatopologies
        - name: name
          in: path
          description: Workload name.
          required: true
          schema:
            type: string
          example: fuyao-master
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: The maximum number of responses returned by the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: The specified page number returned by the list call.
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Custom resource object.
        '401':
          description: Unauthorized.

  /api/kubernetes/apis/{group}/{version}/{plural}:
    get:
      tags:
        - CustomResources
      summary: Custom resource instance list.
      description: Get NUMA resource related instance list.
      operationId: listCustomResources
      parameters:
        - name: group
          in: path
          description: The API group of the CRD.
          required: true
          schema:
            type: string
          example: nodeinfo.volcano.sh
        - name: version
          in: path
          description: Version.
          required: true
          schema:
            type: string
          example: v1alpha1
        - name: plural
          in: path
          description: The plural name of the specified resource.
          required: true
          schema:
            type: string
          example: numatopologies
        - name: pretty
          in: query
          description: Pretty print.
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: The maximum number of responses returned by the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: page
          in: query
          description: The specified page number returned by the list call.
          required: false
          schema:
            type: integer
            format: int32
        - name: fieldSelector
          in: query
          description: A selector to restrict the fields of the returned objects.
          required: false
          schema:
            type: string
        - name: labelSelector
          in: query
          description: A selector to restrict the list of returned objects by their labels.
          required: false
          schema:
            type: string
        - name: resourceVersion
          in: query
          description: Set constraints on the resource version to which the request is directed.
          required: false
          schema:
            type: string
        - name: resourceVersionMatch
          in: query
          description: Determines how resourceVersion is applied to list calls.
          required: false
          schema:
            type: string
        - name: watch
          in: query
          description: Watch for changes to the described resource.
          required: false
          schema:
            type: boolean
        - name: sendInitialEvents
          in: query
          description: The watch notification stream will begin with synthetic events to produce the current state of objects in the set.
          required: false
          schema:
            type: boolean
        - name: timeoutSeconds
          in: query
          description: The timeout seconds for list/watch call.
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Custom resource list object.
        '401':
          description: Unauthorized.

  /api/v1/query:
    get:
      tags:
        - Monitoring
      summary: Instant vector expression query.
      description: Get corresponding monitoring metric data, each time series contains only one data point.
      operationId: queryInstantVector
      parameters:
        - name: query
          in: query
          description: Prometheus expression query string.
          required: true
          schema:
            type: string
          example: online_numa_nodes_count
        - name: time
          in: query
          description: Evaluation timestamp.
          required: false
          schema:
            type: string
            format: date-time
        - name: timeout
          in: query
          description: Evaluation timeout.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Vector query response object.
        '400':
          description: No response.
        '422':
          description: Unreachable.
        '503':
          description: The server is not yet in a state ready to receive requests.

  /api/v1/query_range:
    get:
      tags:
        - Monitoring
      summary: Range vector expression query.
      description: Get corresponding monitoring metric data, each time series contains multiple data points.
      operationId: queryRangeVector
      parameters:
        - name: query
          in: query
          description: Prometheus expression query string.
          required: true
          schema:
            type: string
          example: online_numa_nodes_count
        - name: start
          in: query
          description: Start timestamp (inclusive).
          required: true
          schema:
            type: string
            format: date-time
          example: 2015-07-01T20:10:30.781Z
        - name: end
          in: query
          description: End timestamp (inclusive).
          required: true
          schema:
            type: string
            format: date-time
          example: 2015-07-01T20:11:00.781Z
        - name: step
          in: query
          description: Query resolution step, can be either a duration or a float number of seconds.
          required: true
          schema:
            type: string
          example: 15s
        - name: timeout
          in: query
          description: Evaluation timeout.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Matrix query response object.
        '400':
          description: No response.
        '422':
          description: Unreachable.
        '503':
          description: The server is not yet in a state ready to receive requests.

  /rest/scheduling/v1/numaaware:
    get:
      tags:
        - SchedulingPolicies
      summary: Query NUMA-aware scheduling policy.
      description: Get NUMA-aware scheduling policy.
      operationId: getNUMAAwarePolicy
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Policy response object.
              example:
                code: 200
                msg: get NumaAware state success
                data: open
        '500':
          description: Execution failed.
    put:
      tags:
        - SchedulingPolicies
      summary: Modify NUMA-aware scheduling policy.
      description: Modify NUMA-aware scheduling policy.
      operationId: updateNUMAAwarePolicy
      requestBody:
        description: Scheduling policy configuration.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policy
              properties:
                policy:
                  type: string
                  description: Open or close the policy.
                  enum: [open, close]
            example:
              policy: open
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                description: Simple response object.
              example:
                code: 200
                msg: update NumaAware policy success
        '500':
          description: Execution failed.

