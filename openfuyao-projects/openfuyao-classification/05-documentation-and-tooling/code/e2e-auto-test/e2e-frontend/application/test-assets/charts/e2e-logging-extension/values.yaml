replicaCount: 1
image:
  repository: busybox
  tag: "1.36"
service:
  httpPort: 80
  type: ClusterIP
logger:
  enabled: true
  intervalSeconds: 5
  message: "e2e test log from e2e-logging-extension"
pullPolicy: Always
plugin:
  pluginName: e2e-logging-extension
  displayName: "E2E 日志扩展"
  entrypoint: /container_platform
  subPages:
    - pageName: logSearch
      displayName: "日志查询"
    - pageName: logSet
      displayName: "日志配置"
  enabled: true
backend:
  serviceName: e2e-logging-extension
  namespace: default
  port: 80
