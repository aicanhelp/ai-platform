apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-monitor-extension
  labels:
    app: e2e-monitor-extension
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: e2e-monitor-extension
  template:
    metadata:
      labels:
        app: e2e-monitor-extension
    spec:
      containers:
        - name: e2e-monitor-extension
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "e2e monitor log from e2e-monitor-extension"
                sleep 5
              done
          ports:
            - containerPort: {{ .Values.service.httpPort }}
        - name: e2e-monitor-extension-sidecar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                sleep 3600
              done
