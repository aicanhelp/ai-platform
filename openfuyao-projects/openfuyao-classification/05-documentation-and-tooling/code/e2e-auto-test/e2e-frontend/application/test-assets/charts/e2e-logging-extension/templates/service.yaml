apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2e-logging-extension.fullname" . }}
  labels:
    app: {{ include "e2e-logging-extension.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "e2e-logging-extension.name" . }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpPort }}
