apiVersion: v1
kind: LimitRange
metadata:
  name: test-limitrange
  namespace: default
  labels:
    app: test-limitrange
  annotations:
    example.com/created-by: e2e
spec:
  limits:
    - type: Container
      max:
        memory: 1Gi
      min:
        memory: 128Mi
    - type: Pod
      max:
        memory: 1Gi
      min:
        memory: 128Mi