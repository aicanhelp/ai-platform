apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: default
  name: test-ingress
  labels:
    app: test-ingress
  annotations:
    example.com/created-by: e2e
spec:
  rules:
    - host: test-ingress.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-service
                port:
                  number: 80