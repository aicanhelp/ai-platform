apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-vm
  namespace: default
  annotations:
    e2e-test/created-by: e2e
  labels:
    app: test-vm
    e2e-test: e2e-created
spec:
  running: false
  template:
    metadata:
      labels:
        app: test-vm
        kubevirt.io/domain: test-vm
    spec:
      domain:
        devices:
          disks:
            - name: rootfs
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              bridge: {}
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 1Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootfs
          containerDisk:
            image: openeuler2203-sp3:v1
        - name: cloudinit
          cloudInitNoCloud:
            userData: |-
              password: pwd
              chpasswd: { expire: False }
              ssh_pwauth: True
