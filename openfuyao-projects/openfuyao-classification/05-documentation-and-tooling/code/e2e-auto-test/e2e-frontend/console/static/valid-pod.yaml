apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: default
  labels:
    app: test-pod
  annotations:
    example.com/created-by: e2e
spec:
  containers:
    - name: test-container
      image: busybox:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          trap "exit 0" TERM INT
          while true; do sleep 1; done
      ports:
        - containerPort: 80
