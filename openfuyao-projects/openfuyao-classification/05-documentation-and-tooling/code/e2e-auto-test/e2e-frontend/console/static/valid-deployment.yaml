apiVersion: apps/v1
kind: Deployment 
metadata:
  namespace: default
  name: test-deployment
  labels:
    app: test-deployment
  annotations:
    example.com/created-by: e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-deployment
  template:
    metadata:
      labels:
        app: test-deployment
    spec:
       containers:
         - name: test-container
           image: 'busybox:latest'
           imagePullPolicy: IfNotPresent
           command:
             - sh
             - -c
             - |
               trap "exit 0" TERM INT
               while true; do sleep 1; done
           ports:
             - containerPort: 8091