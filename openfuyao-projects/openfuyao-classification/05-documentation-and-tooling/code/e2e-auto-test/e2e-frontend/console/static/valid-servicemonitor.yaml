apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: test-servicemonitor
  namespace: default
  labels:
    app: test-servicemonitor
  annotations:
    example.com/created-by: e2e
spec:
  selector:
    matchLabels:
      app: test
  endpoints:
    - port: http
      interval: 30s
  namespaceSelector:
    matchNames:
      - default
