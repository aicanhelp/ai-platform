syntax = "proto3";

package fluxsandboxcontroller.sandbox.v1;

option go_package = "flux-sandbox/api/proto/v1;sandboxv1";
option java_multiple_files = true;
option java_package = "com.alibaba.opensandbox.sandbox.v1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// SandboxProviderService mirrors the OpenSandbox Server-side SandboxProvider
// methods that a custom runtime backend must implement.
//
// The service intentionally models the Python provider methods:
// - create_sandbox(...) -> Dict[str, Any]
// - get_sandbox(sandbox_id, namespace) -> Optional[Any]
// - delete_sandbox(sandbox_id, namespace) -> None
service SandboxProviderService {
  // Creates a backend sandbox for one OpenSandbox sandbox.
  //
  // This RPC corresponds to SandboxProvider.create_sandbox(...).
  // The backend should treat sandbox_id as the idempotency key. After this RPC
  // succeeds, GetSandbox should be able to find the sandbox.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // Looks up one backend sandbox by OpenSandbox sandbox id and namespace.
  //
  // This RPC corresponds to SandboxProvider.get_sandbox(...).
  // When the sandbox does not exist, return found=false instead of a gRPC
  // NOT_FOUND error so the OpenSandbox Server can preserve Optional[Any]
  // semantics.
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);

  // Deletes one backend sandbox by OpenSandbox sandbox id and namespace.
  //
  // This RPC corresponds to SandboxProvider.delete_sandbox(...).
  // The backend may complete deletion asynchronously, but returning success
  // means the deletion intent has been accepted.
  rpc DeleteSandbox(DeleteSandboxRequest) returns (DeleteSandboxResponse);

  // Returns the lightweight status (phase + reason/message) of one sandbox.
  //
  // This RPC corresponds to SandboxProvider.get_status(...). It reuses the
  // GetSandboxRequest/Response messages so callers can fall back to GetSandbox
  // for full detail when needed.
  rpc GetStatus(GetSandboxRequest) returns (GetSandboxResponse);

  // Lists backend sandboxes matching a label selector.
  //
  // This RPC corresponds to SandboxProvider.list_workloads(namespace,
  // label_selector). The OpenSandbox Server normally passes the bare key
  // "opensandbox.io/id" (key-existence selector); callers express that as an
  // entry in label_selector with an empty value.
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);

  // Patches metadata labels of one backend sandbox (JSON Merge Patch semantics).
  //
  // This RPC corresponds to SandboxProvider.patch_labels(name, namespace,
  // labels). A value of empty string means delete the label; a non-empty value
  // means add or replace. The backend must protect system labels prefixed with
  // "opensandbox.io/" from deletion.
  rpc PatchSandbox(PatchSandboxRequest) returns (PatchSandboxResponse);

  // Pauses a running sandbox, releasing CPU/memory resources while preserving
  // disk and memory snapshot. The sandbox can be resumed later via ResumeSandbox.
  // Corresponds to WorkloadProvider.pause_sandbox(...).
  rpc PauseSandbox(PauseSandboxRequest) returns (PauseSandboxResponse);

  // Resumes a previously paused sandbox. The backend restores the sandbox from
  // its last snapshot. Corresponds to WorkloadProvider.resume_sandbox(...).
  rpc ResumeSandbox(ResumeSandboxRequest) returns (ResumeSandboxResponse);

  // Creates a reusable snapshot template from a running sandbox (checkpoint).
  // The sandbox remains running after the snapshot is taken.
  // Corresponds to SnapshotRuntime.create_snapshot(...).
  rpc CreateSandboxSnapshot(CreateSandboxSnapshotRequest) returns (CreateSandboxSnapshotResponse);

  // Deletes a previously created snapshot template.
  // Corresponds to SnapshotRuntime.delete_snapshot(...).
  rpc DeleteSandboxSnapshot(DeleteSandboxSnapshotRequest) returns (DeleteSandboxSnapshotResponse);
}

// CreateSandboxRequest contains the same logical arguments as
// SandboxProvider.create_sandbox(...).
message CreateSandboxRequest {
  // Unique OpenSandbox sandbox identifier generated by the Server.
  // Backend implementations should use it as a stable idempotency key.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent tenant/isolation scope.
  // This comes from OpenSandbox [kubernetes].namespace.
  string namespace = 2;

  // Container image requested by the user.
  // This can be absent only for provider-specific modes such as poolRef.
  optional ImageSpec image_spec = 3;

  // Main process command for the sandbox container.
  // Equivalent to Python List[str] entrypoint.
  repeated string entrypoint = 4;

  // Environment variables injected into the sandbox runtime.
  // Equivalent to Python Dict[str, str] env.
  map<string, string> env = 5;

  // Runtime resource constraints, for example cpu=500m or memory=512Mi.
  // Equivalent to Python Dict[str, str] resource_limits.
  map<string, string> resource_limits = 6;

  // Labels that must be preserved on the backend sandbox.
  // Must include opensandbox.io/sandbox-id=<sandbox_id>.
  // User metadata is also passed through this map.
  map<string, string> labels = 7;

  // Absolute expiration time for automatic cleanup.
  // If absent, the sandbox is manual-cleanup and must not auto-expire.
  optional google.protobuf.Timestamp expires_at = 8;

  // Image for the OpenSandbox execd daemon.
  // Backends that inject execd should use this exact image.
  string execd_image = 9;

  // Provider-specific extension parameters.
  // For example, BatchSandbox uses extensions["poolRef"] for pool creation.
  map<string, string> extensions = 10;

  // Optional outbound network policy requested by the user.
  // If present, the backend must enforce it or reject creation.
  optional NetworkPolicy network_policy = 11;

  // Optional egress sidecar image.
  // Meaningful only when network_policy is present.
  optional string egress_image = 12;

  // Storage mounts requested for the sandbox.
  // Empty means no user-provided mounts.
  repeated Volume volumes = 13;

  // Optional runtime platform constraint, for example linux/amd64.
  // If present, the backend must satisfy it or fail explicitly.
  optional PlatformSpec platform = 14;

  // Annotations that must be preserved on the backend sandbox.
  // May include secure access token, egress auth token, and extension metadata.
  map<string, string> annotations = 15;

  // Optional token used by the egress sidecar or backend egress enforcement.
  // Meaningful only when network_policy is present.
  optional string egress_auth_token = 16;

  // Egress enforcement mode, for example "dns".
  // Empty means the backend may apply its default, but Server normally sends it.
  string egress_mode = 17;

  // Arguments appended after entrypoint for the sandbox container.
  // Equivalent to Python List[str] args. Distinct from entrypoint so callers
  // can pass a fixed command plus variable args.
  repeated string args = 18;
}

message CreateSandboxResponse {
  // Unique sandbox id accepted by flux-sandbox.
  string sandbox_id = 1;

  // The Sandbox-Agent-Pod that actually hosts the sandbox runtime.
  // Lets the Server/SDK address the agent directly without a follow-up GetSandbox.
  string assigned_agent_pod = 2;

  // The Sandbox-Agent-Pod endpoint (host:port) the SDK can reach.
  string agent_pod_endpoint = 3;

  // Current sandbox phase observed at create time, e.g. "Running".
  string phase = 4;

  // Human-readable message accompanying the phase.
  string message = 5;

  // Provider-specific extra metadata (e.g. scheduler endpoint, execd endpoint).
  map<string, string> extra = 6;
}

// GetSandboxRequest contains the same arguments as
// SandboxProvider.get_sandbox(sandbox_id, namespace).
message GetSandboxRequest {
  // Unique OpenSandbox sandbox identifier.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;
}

// GetSandboxResponse preserves Optional[Any] semantics.
message GetSandboxResponse {
  // Whether a sandbox was found.
  // When false, sandbox should be unset.
  bool found = 1;

  // Normalized backend sandbox object.
  // Required when found=true.
  optional Sandbox sandbox = 2;
}

// DeleteSandboxRequest contains the same arguments as
// SandboxProvider.delete_sandbox(sandbox_id, namespace).
message DeleteSandboxRequest {
  // Unique OpenSandbox sandbox identifier.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;
}

// DeleteSandboxResponse corresponds to a successful None return.
message DeleteSandboxResponse {
  // Whether the backend accepted or completed deletion.
  // true means OpenSandbox Server can treat delete_sandbox as successful.
  bool deleted = 1;

  // Optional human-readable detail, useful for logs.
  string message = 2;
}

// Sandbox is the normalized representation of the backend sandbox.
//
// It is designed to carry enough data for OpenSandbox Server to implement
// get_sandbox/list_sandboxes/get_status-style behavior without depending on a
// specific CRD shape.
message Sandbox {
  // Metadata equivalent to Kubernetes ObjectMeta.
  SandboxMetadata metadata = 1;

  // Desired sandbox configuration.
  SandboxSpec spec = 2;

  // Observed sandbox state.
  SandboxStatus status = 3;

  // Raw backend object for provider-specific fields.
  // This can contain the original CRD/RPC response if needed.
  google.protobuf.Struct raw = 4;
}

// SandboxMetadata contains identity, labels, annotations, and creation time.
message SandboxMetadata {
  // Backend sandbox resource name.
  // This may differ from sandbox_id.
  string name = 1;

  // Kubernetes namespace or backend isolation scope.
  string namespace = 2;

  // Backend sandbox resource uid.
  string uid = 3;

  // Sandbox creation timestamp.
  // Used by OpenSandbox as Sandbox.created_at.
  optional google.protobuf.Timestamp creation_timestamp = 4;

  // Labels attached to the sandbox.
  // Must include opensandbox.io/sandbox-id so Server can reconstruct Sandbox.id.
  map<string, string> labels = 5;

  // Annotations attached to the sandbox.
  // Used for secure access, egress auth headers, and extension metadata.
  map<string, string> annotations = 6;
}

// SandboxSpec contains the desired runtime configuration needed by Server.
message SandboxSpec {
  // Main sandbox container image URI.
  // Used by Server to populate Sandbox.image.
  string image = 1;

  // Main sandbox process command.
  // Used by Server to populate Sandbox.entrypoint.
  repeated string entrypoint = 2;

  // Arguments appended after entrypoint.
  repeated string args = 7;

  // Absolute expiration time.
  // If absent, the sandbox is manual-cleanup.
  optional google.protobuf.Timestamp expires_at = 3;

  // Runtime platform inferred or requested for the sandbox.
  optional PlatformSpec platform = 4;

  // Pod-template-like representation for Server compatibility.
  // If your Server adapter maps Sandbox to dict, this can become
  // spec.template.spec.
  optional PodTemplateSpec template = 5;

  // Provider-specific desired-state fields.
  google.protobuf.Struct extra = 6;
}

// SandboxStatus contains observed runtime information.
message SandboxStatus {
  // Backend-native lifecycle phase, for example CREATING, RUNNING, or FAILED.
  string phase = 1;

  // Backend-native machine-readable reason.
  string reason = 2;

  // Backend-native human-readable message.
  string message = 3;

  // Backend-native last transition timestamp.
  optional google.protobuf.Timestamp last_transition_at = 4;

  // Pod information, if the backend exposes a Pod-like runtime.
  optional PodInfo pod = 5;

  // Port-specific endpoints returned by the backend.
  repeated EndpointInfo endpoints = 6;

  // Optional Kubernetes Service FQDN or equivalent stable DNS name.
  string service_fqdn = 7;

  // Provider-specific observed-state fields.
  google.protobuf.Struct extra = 8;
}

// ImageSpec mirrors opensandbox_server.api.schema.ImageSpec.
message ImageSpec {
  // Container image URI, for example python:3.12 or registry/app:v1.
  string uri = 1;

  // Optional registry authentication credentials for private images.
  optional ImageAuth auth = 2;
}

// ImageAuth mirrors opensandbox_server.api.schema.ImageAuth.
message ImageAuth {
  // Registry username or service account.
  string username = 1;

  // Registry password or authentication token.
  // Backends must avoid logging or returning this value in status.
  string password = 2;
}

// PlatformSpec mirrors opensandbox_server.api.schema.PlatformSpec.
message PlatformSpec {
  // Target operating system, for example linux.
  string os = 1;

  // Target CPU architecture, for example amd64 or arm64.
  string arch = 2;
}

// NetworkPolicy mirrors opensandbox_server.api.schema.NetworkPolicy.
message NetworkPolicy {
  // Default action when no rule matches.
  // Expected values are allow or deny. Empty means backend/sidecar default.
  optional string default_action = 1;

  // Ordered outbound network rules.
  repeated NetworkRule egress = 2;
}

// NetworkRule mirrors opensandbox_server.api.schema.NetworkRule.
message NetworkRule {
  // Rule action, expected to be allow or deny.
  string action = 1;

  // FQDN or wildcard domain, for example example.com or *.example.com.
  string target = 2;
}

// Volume mirrors opensandbox_server.api.schema.Volume.
message Volume {
  // Unique volume name within the sandbox.
  string name = 1;

  // Host path backend. Exactly one backend should be set.
  optional HostVolume host = 2;

  // PersistentVolumeClaim backend. Exactly one backend should be set.
  optional PvcVolume pvc = 3;

  // OSSFS backend. Exactly one backend should be set.
  optional OssfsVolume ossfs = 4;

  // Absolute mount path inside the sandbox container.
  string mount_path = 5;

  // Whether the mount is read-only.
  bool read_only = 6;

  // Optional subdirectory under the backend path to mount.
  optional string sub_path = 7;
}

// HostVolume represents a host path bind mount backend.
message HostVolume {
  // Host filesystem path to mount.
  // Server-side validators may restrict this path by allowlist.
  string path = 1;
}

// PvcVolume represents a Kubernetes PersistentVolumeClaim backend.
message PvcVolume {
  // PVC claim name.
  string claim_name = 1;

  // Whether the Server/backend may create the PVC when it does not exist.
  bool create_if_not_exists = 2;

  // Requested storage size, for example 10Gi.
  optional string storage = 3;

  // Kubernetes storage class name.
  // Absence means use the cluster default.
  optional string storage_class = 4;

  // PVC access modes, for example ReadWriteOnce.
  repeated string access_modes = 5;
}

// OssfsVolume represents an OSSFS mount backend.
message OssfsVolume {
  // OSS bucket name.
  string bucket = 1;

  // OSS endpoint.
  string endpoint = 2;

  // Path/prefix inside the bucket.
  optional string path = 3;

  // OSSFS major version, for example "1.0" or "2.0".
  optional string version = 4;

  // Additional OSSFS options.
  repeated string options = 5;

  // OSS access key id.
  string access_key_id = 6;

  // OSS access key secret.
  // Backends must avoid logging or returning this value in status.
  string access_key_secret = 7;
}

// PodTemplateSpec is a small Pod-template-compatible shape used by adapters.
message PodTemplateSpec {
  // Labels applied to the Pod template.
  map<string, string> labels = 1;

  // Annotations applied to the Pod template.
  map<string, string> annotations = 2;

  // Pod spec fields needed by OpenSandbox Server.
  PodSpec spec = 3;
}

// PodSpec is a minimal Kubernetes PodSpec-like representation.
message PodSpec {
  // Main and sidecar containers.
  repeated Container containers = 1;

  // Init containers, such as execd bootstrap container.
  repeated Container init_containers = 2;

  // Node selector constraints, including kubernetes.io/os and kubernetes.io/arch.
  map<string, string> node_selector = 3;

  // RuntimeClass name, if a secure runtime is used.
  optional string runtime_class_name = 4;

  // ServiceAccount name attached to the sandbox Pod.
  optional string service_account_name = 5;

  // Provider-specific PodSpec fields.
  google.protobuf.Struct extra = 6;
}

// Container is a minimal Kubernetes container-like representation.
message Container {
  // Container name, for example sandbox or egress.
  string name = 1;

  // Container image URI.
  string image = 2;

  // Container command/entrypoint.
  repeated string command = 3;

  // Environment variables.
  map<string, string> env = 4;

  // Resource limits or requests encoded by resource name.
  map<string, string> resources = 5;

  // Provider-specific container fields.
  google.protobuf.Struct extra = 6;
}

// PodInfo describes the selected/running Pod, if any.
message PodInfo {
  // Pod name.
  string name = 1;

  // Pod namespace.
  string namespace = 2;

  // Pod IP address.
  string ip = 3;

  // Kubernetes Pod phase, for example Pending or Running.
  string phase = 4;

  // Node name where the Pod is scheduled.
  optional string node_name = 5;
}

// EndpointInfo describes one port-level access endpoint.
message EndpointInfo {
  // Sandbox service port.
  int32 port = 1;

  // Endpoint string, for example 10.244.0.10:8080.
  string endpoint = 2;

  // Protocol, for example tcp or udp.
  string protocol = 3;

  // Headers required to access this endpoint.
  map<string, string> headers = 4;
}

// ListSandboxesRequest contains the same arguments as
// SandboxProvider.list_workloads(namespace, label_selector).
message ListSandboxesRequest {
  // Kubernetes namespace or equivalent backend isolation scope.
  // Empty means the backend default namespace (flux-system).
  string namespace = 1;

  // Label selector expressed as key-value pairs.
  // An empty value means key-existence (the label must be present with any
  // value). A non-empty value means the label must equal that value.
  // The OpenSandbox Server passes {"opensandbox.io/id": ""} to list all
  // sandboxes it manages.
  map<string, string> label_selector = 2;
}

// ListSandboxesResponse returns all matching backend sandboxes.
message ListSandboxesResponse {
  // Matching sandbox objects, each convertible by the OpenSandbox Server.
  repeated Sandbox sandboxes = 1;
}

// PatchSandboxRequest patches metadata labels of one sandbox.
message PatchSandboxRequest {
  // Unique OpenSandbox sandbox identifier (also the backend CR name).
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;

  // JSON Merge Patch semantics on metadata.labels.
  // Empty string value means delete the key; non-empty means set/replace.
  // System labels prefixed with "opensandbox.io/" are protected from deletion.
  map<string, string> labels = 3;
}

// PatchSandboxResponse preserves Optional semantics for the updated sandbox.
message PatchSandboxResponse {
  // Whether a sandbox was found and patched.
  // When false, sandbox should be unset.
  bool found = 1;

  // The updated sandbox object after applying the patch.
  optional Sandbox sandbox = 2;
}

// --- Pause / Resume ---

// PauseSandboxRequest identifies the sandbox to pause.
message PauseSandboxRequest {
  // Unique OpenSandbox sandbox identifier.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;
}

// PauseSandboxResponse is empty on success.
message PauseSandboxResponse {}

// ResumeSandboxRequest identifies the sandbox to resume.
message ResumeSandboxRequest {
  // Unique OpenSandbox sandbox identifier.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;
}

// ResumeSandboxResponse is empty on success.
// The caller (OpenSandbox Server) re-queries via GetSandbox after resume
// to obtain the updated sandbox state (phase, endpoints, etc.).
message ResumeSandboxResponse {}

// --- Snapshot Create / Delete ---

// CreateSandboxSnapshotRequest identifies the sandbox to snapshot.
message CreateSandboxSnapshotRequest {
  // Unique OpenSandbox sandbox identifier.
  string sandbox_id = 1;

  // Kubernetes namespace or equivalent backend isolation scope.
  string namespace = 2;
}

// CreateSandboxSnapshotResponse returns the snapshot result.
message CreateSandboxSnapshotResponse {
  // Snapshot image URI (the Template Manager-generated snapshotID).
  // Used as the image field in OpenSandbox Server's SnapshotRecord.
  string image = 1;

  // Snapshot state: "ready", "creating", or "failed".
  string state = 2;

  // Machine-readable status reason, e.g. "snapshot_runtime_ready".
  string reason = 3;

  // Human-readable status description.
  string message = 4;

  // E2B team ID (from sandbox annotation e2b.dev/team-id). Stored by the
  // OpenSandbox Server and passed back in DeleteSandboxSnapshotRequest so the
  // controller can supply it as the team_id query parameter to the Template
  // Manager delete/resolve endpoints.
  string team_id = 5;
}

// DeleteSandboxSnapshotRequest identifies the snapshot to delete.
message DeleteSandboxSnapshotRequest {
  // Snapshot image URI, corresponding to CreateSandboxSnapshotResponse.image.
  string image = 1;

  // E2B team ID, corresponding to CreateSandboxSnapshotResponse.team_id.
  // Required by the Template Manager DELETE endpoint as a query parameter.
  string team_id = 2;
}

// DeleteSandboxSnapshotResponse is empty on success.
message DeleteSandboxSnapshotResponse {}
