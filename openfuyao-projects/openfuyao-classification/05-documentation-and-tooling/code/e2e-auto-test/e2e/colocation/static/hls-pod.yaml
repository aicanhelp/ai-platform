apiVersion: v1
kind: Pod
metadata:
  name: hls-pod
  labels:
    app: test-nginx
  annotations:
    openfuyao.com/qos-level: HLS
spec:
  containers:
  - name: test-nginx
    image: nginx
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 1
        memory: 100Mi
      requests:
        cpu: 1
        memory: 100Mi