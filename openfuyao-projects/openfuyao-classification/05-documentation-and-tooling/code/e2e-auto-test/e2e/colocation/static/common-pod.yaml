apiVersion: v1
kind: Pod
metadata:
  name: common-pod
  labels:
    app: test-nginx
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node.openfuyao.com/colocation
            operator: Exists
  containers:
  - name: test-nginx
    image: nginx
    imagePullPolicy: IfNotPresent
