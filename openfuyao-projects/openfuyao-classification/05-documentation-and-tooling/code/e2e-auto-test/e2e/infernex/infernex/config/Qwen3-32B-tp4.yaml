# Qwen3-32B 部署覆盖配置：tp=4
# 由于 helm --set 无法深度合并数组元素，必须通过 values 文件传入完整的 services 配置

global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: [] # 私有镜像仓库的 Secret，例如: [{"name": "registry-secret"}]

  env:
    - name: HF_HUB_OFFLINE # HuggingFace Hub 离线开关（1=离线；0=在线）
      value: "0"
    - name: PYTHONHASHSEED # cache-indexer 要求与所有目标 vLLM Pod 保持一致
      value: "0"
    - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES # 与 cache-indexer 的 BlockHash 归一化规则保持一致
      value: "1"

  modelName: "Qwen/Qwen3-32B" # 推理模型名称（用于 served-model-name 和标签）
  modelPath: "" # 推理模型本地路径（可选）。若配置，则 vLLM 使用该路径启动模型，否则使用 modelName。
  autoDownloadModel: true # 缺缓存时从 HuggingFace 拉取；已有权重则复用 hostPath 缓存
  cachePath: "/home/llm_cache" # 推理侧缓存目录（如 HuggingFace / vLLM 的下载与编译缓存）

hermes-router: 
  inferenceExtension:
    routing:
      tokenizer:
        model: Qwen/Qwen3-32B

inference-backend:
  services:
    - name: vllm-pd-2p1d-01
      enabled: true
      mode: pd
      service:
        port: 8000
      pdGroupID: "qwen3-8b-pd-01"

      kvTransferConfig:
        connectorConfig:
          kv_connector: "MultiConnector"
          kv_connector_extra_config:
            connectors:
              - kv_connector: "MooncakeConnectorV1"
                kv_buffer_device: "npu"
                kv_parallel_size: 1
                kv_connector_extra_config:
                  use_ascend_direct: true
              - kv_connector: "AscendStoreConnector"
                kv_buffer_device: "npu"
                kv_parallel_size: 1
                kv_connector_extra_config:
                  lookup_rpc_port: "0"
                  backend: "mooncake"
        mooncake:
          configPath: "/app/mooncake.json"
          use_store: true
          config: |
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true

      pd:
        prefill:
          replicas: 1
          cardCount: 4
          tensorParallelSize: 4
          dataParallelSize: 1
          pipelineParallelSize: 1
          env:
            - name: LOCAL_HOT_CACHE_SIZE
              value: "4294967296"
            - name: UB_SHARE_MEMORY
              value: "true"
          volumeMounts: []
          volumes: []
          extraArgs:
            - --enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8
            - --block-size 128

        decode:
          replicas: 1
          tensorParallelSize: 4
          dataParallelSize: 1
          pipelineParallelSize: 1
          env:
            - name: UB_SHARE_MEMORY
              value: "true"
          volumeMounts: []
          volumes: []
          extraArgs:
            - --no-enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8

        proxyServer:
          enabled: true
          discoveryInterval: 10

      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "64Gi"
