# Qwen3-8B PD 部署覆盖配置：单独使用 AscendStoreConnector

global:
  modelName: "Qwen/Qwen3-8B"

inference-backend:
  services:
    - name: vllm-pd-2p1d-01
      enabled: true
      mode: pd
      service:
        port: 8000
      pdGroupID: "qwen3-8b-pd-01"

      kvTransferConfig:
        connectorConfig:
          kv_connector: "AscendStoreConnector"
          kv_connector_extra_config:
            lookup_rpc_port: "0"
            backend: "mooncake"
        mooncake:
          configPath: "/app/mooncake.json"
          use_store: true
          config: |
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true

      pd:
        prefill:
          replicas: 1
          tensorParallelSize: 2
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8
            - --block-size 128

        decode:
          replicas: 1
          tensorParallelSize: 1
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --no-enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8

        proxyServer:
          enabled: true
          discoveryInterval: 10

      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "64Gi"