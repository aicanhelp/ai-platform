# vLLM v0.11.0 部署覆盖配置
# v0.11.0 不支持 AscendStoreConnector，需要改用 MooncakeConnectorV1

inference-backend:
  images:
    inferenceEngine:
      repository: quay.io/ascend/vllm-ascend
      tag: "v0.11.0"

  services:
    - name: vllm-pd-2p1d-01
      enabled: true
      mode: pd
      service:
        port: 8000
      pdGroupID: "qwen3-8b-pd-01"

      kvTransferConfig:
        connectorConfig:
          kv_connector: "MooncakeConnectorV1"
          kv_buffer_device: "npu"
          kv_parallel_size: 1
          kv_connector_extra_config:
            use_ascend_direct: true
        mooncake:
          configPath: "/app/mooncake.json"
          use_store: true
          config: |
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true

      pd:
        prefill:
          replicas: 1
          tensorParallelSize: 2
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8
            - --block-size 128

        decode:
          replicas: 1
          tensorParallelSize: 1
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --no-enable-prefix-caching
            - --max-model-len 10000
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8

        proxyServer:
          discoveryInterval: 10

      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "64Gi"
