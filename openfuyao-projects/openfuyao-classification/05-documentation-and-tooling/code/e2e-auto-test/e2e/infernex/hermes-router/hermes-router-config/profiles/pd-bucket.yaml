hermes-router:
  inferenceExtension:
    pluginsConfigFile: default-plugins.yaml
    prediction:
      enabled: false
    routing:
      deploymentMode: pd
      profile: bucket
      pd:
        pdLabelName: openfuyao.com/pdRole
        pdGroupLabelName: openfuyao.com/pdGroupID
        prefillValue: prefill
        decodeValue: decode
        leaderValue: leader
      bucket:
        alpha: 1.0
        beta: 2.0
        decayFactor: 0.99
        bucketSeparateLength: 200
        tpSizeLabelKey: openfuyao.com/tpSize