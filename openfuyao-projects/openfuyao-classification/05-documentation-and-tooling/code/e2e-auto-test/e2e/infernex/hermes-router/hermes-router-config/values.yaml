inferenceGateway:
  enabled: true
  name: "inference-gateway"
  className: "istio"
  listeners:
    - name: http
      port: 80
      protocol: HTTP

global:
  image:
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  env:
    - name: HF_HUB_OFFLINE
      value: "0"
    - name: PYTHONHASHSEED
      value: "0"
    - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
      value: "1"

  modelName: "Qwen/Qwen3-8B"
  modelPath: ""
  autoDownloadModel: true
  cachePath: "/home/llm_cache"

hermes-router:
  enabled: true

  inferenceExtension:
    replicas: 1
    image:
      repository: cr.openfuyao.cn/openfuyao/hermes-router
      tag: latest
    pluginsConfigFile: "default-plugins.yaml"
    # EPP 节点钉选不在此配置：-f 里的 affinity 会被 chart 的空 affinity:{} 默认值 coalesce 掉，
    # 改由 LoadHelmConfig 识别的 eppNode 经 --set 注入（见 eppNodeAffinitySetValues）。
    routing:
      deploymentMode: aggregated
      profile: ""
      tokenizer:
        model: Qwen/Qwen3-8B
        socketPath: /var/run/tokenizer/tokenizer.sock
      kvCacheAware:
        kvCacheNotHitRateWeight: 1.0
        xpuCacheUsageWeight: 1.0
        waitingRequestWeight: 1.0
        inflightWeight: 1.0
      requestTracking:
        storeName: hermes-inflight
        persistence:
          enabled: false
          flushThreshold: 100
          outputPath: /tmp/hermes-inflight/completed.jsonl
      cacheIndexer:
        address: http://cache-indexer-service:8080

    tokenizer:
      enabled: true
      image:
        repository: cr.openfuyao.cn/openfuyao/hermes-router-tokenizer
        tag: latest
      socketPath: /var/run/tokenizer/tokenizer.sock
      provider: huggingface
      extraArgs: []
      extraEnv: []
      volumeMounts:
        - name: tokenizer-cache
          mountPath: /workspace/.cache/huggingface/hub
      volumes:
        - name: tokenizer-cache
          hostPath:
            path: /home/llm_cache/huggingface/hub
            type: Directory
      resources: {}
    prediction:
      enabled: false
      image:
        repository: cr.openfuyao.cn/openfuyao/hermes-router-prediction
        tag: latest
      socketPath: /var/run/hermes/prediction.sock
      timeout: 1s
      maxBatchSize: 128
      artifactRoot: /models/hermes
      # targetModel + modelVersion + modelVolume 三者齐全，预测器才会从
      # <artifactRoot>/<targetModel>/<modelVersion>/ 加载 bundle 做 active 预测；
      # 缺 targetModel 时预测器无法加载，predictionMode 会落空。需与 bundle 目录布局一致。
      targetModel: "Qwen/Qwen3-8B"
      modelVersion: "baseline-conversation-data"
      # 预测模型卷：只声明 volume 源（hostPath/PVC/CSI），chart 共享 helper 会把它挂到
      # artifactRoot(/models/hermes)。留空为 no-op（配合 predictionMode: shadow）；实际 hostPath
      # 由 InjectPredictionModelVolume 依据 helm_config.yaml 的 predictionModelPath 注入。
      # chart 0.0.0-latest 父 values 仍残留旧 prediction-model 的 volumeMounts/volumes 默认值，
      # 会与模板原生渲染的 prediction-model 重复，故在此显式置空覆盖（helm 数组以 -f 值整体替换）。
      modelVolume: {}
      volumeMounts: []
      volumes: []
    affinity: {}

  inferencePool:
    targetPorts:
      - number: 8000
    modelServerType: vllm

  httpRoute:
    inferenceGatewayName: "inference-gateway"

  provider:
    name: istio
    istio:
      destinationRule:
        trafficPolicy:
          tls:
            mode: SIMPLE
            insecureSkipVerify: true
      retryConfig:
        enabled: true
        retryOn: "connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes,5xx,reset"
        numRetries: 3

inference-backend:
  images:
    inferenceEngine:
      repository: "quay.io/ascend/vllm-ascend"
      tag: "v0.18.0"
    proxyServer:
      repository: "cr.openfuyao.cn/openfuyao/proxy-server"
      tag: "latest"

  inferenceDevice: "huawei.com/Ascend910"

  volumeMounts:
    ascend:
      enable: true

  volumes:
    ascend:
      enable: true

  services:
  - name: qwen3-8b-aggregated-0
    enabled: true
    mode: aggregated
    service:
      port: 8000
    kvTransferConfig:
      connectorConfig:
        kv_connector: "AscendStoreConnector"
        kv_connector_extra_config:
          lookup_rpc_port: "1"
          backend: "mooncake"
      mooncake:
        configPath: "/app/mooncake.json"
        use_store: true
        config: |
          local_hostname: "$POD_IP"
          metadata_server: "redis://redis-service:6379"
          master_server_address: "mooncake-master-service:30089"
          device_name: ""
          protocol: "ascend"
          global_segment_size: 42949672960
          use_ascend_direct: true

    aggregated:
      replicas: 1
      tensorParallelSize: 2
      dataParallelSize: 1
      env:
        - name: UB_SHARE_MEMORY
          value: "true"
      volumeMounts: []
      volumes: []
      extraArgs: 
        - --enable-prefix-caching
        - --max-model-len 10000
        - --max-num-batched-tokens 40960
        - --gpu-memory-utilization 0.8
        - --block-size 128
        - --prefix-caching-hash-algo sha256_cbor
        - --enable-prompt-tokens-details
    resources:
      requests:
        cpu: "4"
        memory: "32Gi"
      limits:
        cpu: "8"
        memory: "64Gi"

cache-indexer:
  enabled: true
  image:
    repository: cr.openfuyao.cn/openfuyao/cache-indexer
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 2Gi
  blockKey:
    pythonHashSeed: "0"
    prefixCachingHashAlgo: sha256_cbor
    useIntBlockHashes: true
  discovery:
    refreshInterval: 10s
    vllm:
      zmqPortName: zmq-pub
    mooncakeMaster:
      httpPortName: http
      httpPort: 9003
  service:
    name: cache-indexer-service
    port: 8080

eagle-eye:
  enabled: false

  hardware-monitor:
    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/eagle-eye-hardware-monitor
        tag: "latest"

  hardware-diagnosis:
    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/eagle-eye-hardware-diagnosis
        tag: "latest"

  network-performance-exporter:
    images:
      core:
        repository: cr.openfuyao.cn/openfuyao/eagle-eye-network-performance-exporter
        tag: "latest"

    networkPerformanceExporter:
      metricsPort: 8222
      collectInterval: 15

pd-orchestrator:
  elastic-scaler:
    enabled: false # elastic-scaler 组件部署开关
    image:
      repository: cr.openfuyao.cn/openfuyao/elastic-scaler
      tag: latest

    elasticScaler:
      enabled: false # chart包中默认提供的 elastic-scaler CR 实例开关，开启后会默认安装 elastic-scaler CR

    name: elastic-scaler # 通过 HPA 扩缩的最大副本数和最小副本数
    minReplicas: 1
    maxReplicas: 10

    targetRef:
      kind: resourcescalinggroup
      name: rsg # 该 name 需要对应 resourcescalinggroup.instanceConfig.name
      apiVersion: autoscaling.openfuyao.com/v1alpha1

    trigger:
      scalingAlgorithm: apa
      # 设置 apa 扩缩资源指标
      resource:
        metricsName: cpu
        targetType: Utilization
        targetValue: 70

  resourcescalinggroup:
    enabled: false # resourcescalinggroup 组件的部署开关
    image:
      repository: cr.openfuyao.cn/openfuyao/resource-scaling-group
      tag: latest

    instanceConfig:
      enabled: false # chart包中默认提供的 resource scaling group CR 实例开关，开启后会默认安装 CR 实例
      name: rsg
      targetResources:
      - name: prefill
        resourceRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: qwen3-8b-2p2d-01-prefill
      - name: decode
        resourceRef:
          apiVersion: leaderworkerset.x-k8s.io/v1
          kind: LeaderWorkerSet
          name: qwen3-8b-2p2d-01-decode
      scalingStrategy:
        type: GroupReplication
        groupConfig: 
          groupName: pd 
          scaleDown: 
            metric: 
              expr: "vllm:num_requests_running" 
              type: "Gauge"
              window: "2m"
              aggregator: "avg"
            order: ascending

  tidal:
    enabled: false # tidal 组件的部署开关
    image:
      repository: cr.openfuyao.cn/openfuyao/tidal
      tag: latest