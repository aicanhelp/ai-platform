apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: metrics-data-source
  parameters:
    scheme: "http"
    path: "/metrics"
    insecureSkipVerify: true
- type: core-metrics-extractor

- type: tokenizer
  parameters:
    model: "Qwen/Qwen3-8B"
    socketPath: "/var/run/tokenizer/tokenizer.sock"
- type: request-lifecycle-tracker
  parameters:
    storeName: "hermes-inflight"
    persistence:
      enabled: true
      flushThreshold: 1
      outputPath: "/tmp/hermes-inflight/completed.jsonl"
- type: inflight-data-producer
  parameters:
    storeName: "hermes-inflight"
- type: prefix-cache-producer
  parameters:
    cacheIndexerAddress: "http://cache-indexer-service:8080"
- type: prediction-feature-extractor
- type: prefix-cache-filter
  parameters:
    threshold: 0.5
- type: prediction-scorer
  parameters:
    predictorAddress: "tcp://localhost:5000"
    predictionMode: "active"
    timeout: 1s
    maxBatchSize: 128
    ttftWeight: 0.8
    tpotWeight: 0.2
    kvWeight: 1
    queueWeight: 1
    prefixWeight: 1
    inflightWeight: 1
- type: softmax-potc-picker
- type: endpoint-notification-source
- type: npu-exporter-data-source
  parameters:
    exporterNamespace: "npu-exporter"
    exporterPodLabelSelector: "app=npu-exporter"
    exporterPort: 8082
    path: "/metrics"
    cacheTTL: "500ms"
    scrapeTimeout: "1s"
- type: npu-exporter-extractor
  parameters:
    staleAfter: "5s"
dataLayer:
    
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: request-lifecycle-tracker
  - pluginRef: npu-exporter-data-source
    extractors:
    - pluginRef: npu-exporter-extractor
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: tokenizer
  - pluginRef: request-lifecycle-tracker
  - pluginRef: inflight-data-producer
  - pluginRef: prefix-cache-producer
  - pluginRef: prediction-feature-extractor
  - pluginRef: prefix-cache-filter
  - pluginRef: prediction-scorer
  - pluginRef: softmax-potc-picker