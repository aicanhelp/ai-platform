inference-backend:
  services:
    - name: vllm-pd-1p1d-1
      enabled: true
      mode: pd
      service:
        port: 8000
      pdGroupID: "vllm-pd-1p1d-1"
      kvTransferConfig:
        connectorConfig:
          kv_connector: "MultiConnector"
          kv_connector_extra_config:
            connectors:
              - kv_connector: "MooncakeConnectorV1"
                kv_buffer_device: "npu"
                kv_parallel_size: 1
                kv_connector_extra_config:
                  use_ascend_direct: true
              - kv_connector: "AscendStoreConnector"
                kv_buffer_device: "npu"
                kv_parallel_size: 1
                kv_connector_extra_config:
                  lookup_rpc_port: "0"
                  backend: "mooncake"
        mooncake:
          configPath: "/app/mooncake.json"
          use_store: true
          master:
            rpcPort: 50051
            servicePort: 30089
            httpPort: 9003
          config: |
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true
            preferred_segment: true
            prefer_alloc_in_same_node: true
      pd:
        prefill:
          replicas: 1
          cardCount: 1
          tensorParallelSize: 1
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --enable-prefix-caching
            - --max-model-len 16384
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8
            - --block-size 128
            - --prefix-caching-hash-algo sha256_cbor
            - --enable-prompt-tokens-details
        decode:
          replicas: 1
          cardCount: 1
          tensorParallelSize: 1
          dataParallelSize: 1
          env: []
          volumeMounts: []
          volumes: []
          extraArgs:
            - --no-enable-prefix-caching
            - --max-model-len 16384
            - --max-num-batched-tokens 40960
            - --gpu-memory-utilization 0.8
            - --block-size 128
        proxyServer:
          discoveryInterval: 10
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "64Gi"

cache-indexer:
  enabled: true