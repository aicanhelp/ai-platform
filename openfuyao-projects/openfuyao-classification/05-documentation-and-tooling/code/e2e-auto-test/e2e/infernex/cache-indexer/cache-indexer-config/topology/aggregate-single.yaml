inference-backend:
  services:
    - name: vllm-aggregated-tp1-01
      enabled: true
      mode: aggregated
      service:
        port: 8000
      kvTransferConfig:
        connectorConfig:
          kv_connector: "AscendStoreConnector"
          kv_connector_extra_config:
            lookup_rpc_port: "1"
            backend: "mooncake"
        mooncake:
          configPath: "/app/mooncake.json"
          use_store: true
          master:
            rpcPort: 50051
            servicePort: 30089
            httpPort: 9003
          config: |
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true
            preferred_segment: true
            prefer_alloc_in_same_node: true
      aggregated:
        replicas: 1
        cardCount: 1
        tensorParallelSize: 1
        dataParallelSize: 1
        pipelineParallelSize: 1
        env:
          - name: UB_SHARE_MEMORY
            value: "true"
        volumeMounts: []
        volumes: []
        extraArgs:
          - --enable-prefix-caching
          - --max-model-len 16384
          - --max-num-batched-tokens 40960
          - --gpu-memory-utilization 0.8
          - --block-size 128
          - --prefix-caching-hash-algo sha256_cbor
          - --enable-prompt-tokens-details
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "64Gi"

cache-indexer:
  enabled: true