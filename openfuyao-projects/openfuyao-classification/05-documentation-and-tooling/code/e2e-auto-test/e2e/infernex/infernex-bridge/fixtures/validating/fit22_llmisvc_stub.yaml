# Minimal LLMISVC so InferNex-Bridge does not delete sourceRef InferNexService when LLM is missing.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: fit22-llmisvc
  namespace: __E2E_NS__
  labels:
    infernex.io/runtime: "true"
spec:
  model:
    uri: hf://Qwen/Qwen3-8B
    name: Qwen/Qwen3-8B
  replicas: 1
