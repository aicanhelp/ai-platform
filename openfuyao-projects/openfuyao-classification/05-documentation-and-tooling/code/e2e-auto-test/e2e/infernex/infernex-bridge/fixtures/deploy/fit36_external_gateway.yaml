# External Gateway for FIT 36/42 (gateway.ref): EnvoyProxy NodePort + Gateway infrastructure ref.
# Without infrastructure.parametersRef Envoy never assigns addresses → GatewayRoutingReady stays False.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: __EXTERNAL_GW__-infernex-nodeport
  namespace: __E2E_NS__
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __EXTERNAL_GW__
  namespace: __E2E_NS__
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: __EXTERNAL_GW__-infernex-nodeport
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
