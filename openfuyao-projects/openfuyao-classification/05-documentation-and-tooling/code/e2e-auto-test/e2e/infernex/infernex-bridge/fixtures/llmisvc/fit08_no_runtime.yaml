# Minimal LLMISVC without infernex.io/runtime — must not trigger mutating webhook on kserve configs.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceServiceConfig
metadata:
  name: __NAME__-config
  namespace: __E2E_NS__
spec:
  model:
    uri: "file:///tmp/placeholder-model"
  template:
    containers:
      - name: main
        image: cr.openfuyao.cn/openfuyao/test-engine:v1
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: __NAME__
  namespace: __E2E_NS__
spec:
  model:
    uri: "file:///tmp/placeholder-model"
  baseRefs:
    - name: __NAME__-config
