# Canonical E2E fixture — synced from InferNex-Bridge examples (ag-01 / pd-01).
# Placeholders: __NAME__, __E2E_NS__, __TEMPLATE_NS__

apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexServiceConfig
metadata:
  name: __NAME__-vllm-aggregate-engine-config
  namespace: __TEMPLATE_NS__
spec:
  engine:
    template:
      spec:
        securityContext:
          supplementalGroups:
          - 1000
        initContainers:
        - name: mooncake-config-init
          image: hub.oepkgs.net/openfuyao/mikefarah/yq:4.50.1
          command:
          - /bin/sh
          - -c
          args:
          - |
            set -e
            CONFIG_PATH="/app/mooncake.json"
            mkdir -p "$(dirname "$CONFIG_PATH")"
            cat > /tmp/mooncake_config.tpl << 'EOF'
            local_hostname: "$POD_IP"
            metadata_server: "redis://redis-service:6379"
            master_server_address: "mooncake-master-service:30089"
            device_name: ""
            protocol: "ascend"
            global_segment_size: 42949672960
            use_ascend_direct: true
            EOF
            POD_IP_VALUE="${POD_IP:-0.0.0.0}"
            sed "s/\$POD_IP/${POD_IP_VALUE}/g" /tmp/mooncake_config.tpl | yq eval - -o=json > "$CONFIG_PATH"
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          volumeMounts:
          - name: mooncake-config
            mountPath: /app
        - name: huggingface-download
          image: cr.openfuyao.cn/openfuyao/huggingface-download:latest
          imagePullPolicy: IfNotPresent
          command:
          - hf
          - download
          - Qwen/Qwen2.5-0.5B
          env:
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: PYTHONHASHSEED
            value: '0'
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_USE_V1
            value: '1'
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TP_SOCKET_IFNAME
            value: eth0
          - name: HCCL_SOCKET_IFNAME
            value: eth0
          - name: MOONCAKE_CONFIG_PATH
            value: /app/mooncake.json
          volumeMounts:
          - name: rootcache
            mountPath: /root/.cache
        containers:
        - name: main
          image: hub.oepkgs.net/openfuyao/ascend/vllm-ascend:v0.18.0
          imagePullPolicy: IfNotPresent
          ports:
          - name: aggregated-port
            containerPort: 8000
          - name: zmq-pub
            containerPort: 5557
          command:
          - /bin/bash
          - -c
          args:
          - |
            set -euo pipefail
            export PHYSICAL_DEVICES=$(ls /dev/davinci* 2>/dev/null | grep -o '[0-9]\+' | sort -n | paste -sd',' - || true)
            export LD_LIBRARY_PATH="/usr/local/lib:${LD_LIBRARY_PATH:-}"
            unset HCCL_COMM_ID
            _HCCL_PORT=$((5555 + $(echo -n "${POD_NAME:-$$}" | cksum | cut -d' ' -f1) % 1000))
            export HCCL_COMM_ID="${POD_IP:-127.0.0.1}:${_HCCL_PORT}"
            exec vllm serve Qwen/Qwen2.5-0.5B \
              --served-model-name Qwen/Qwen2.5-0.5B \
              --trust-remote-code \
              --enable-prefix-caching \
              --prefix-caching-hash-algo sha256_cbor \
              --enable-prompt-tokens-details \
              --port 8000 \
              --tensor-parallel-size 1 \
              --pipeline-parallel-size 1 \
              --max-model-len 10000 \
              --max-num-batched-tokens 40960 \
              --gpu-memory-utilization 0.35 \
              --block-size 128 \
              --hf-overrides '{"head_dim": 64}' \
              --kv-events-config '{"enable_kv_cache_events": true, "publisher":"zmq", "topic":"kv-events"}' \
              --kv-transfer-config '{"engine_id":"$(POD_NAME)","kv_connector":"AscendStoreConnector","kv_role":"kv_both","kv_port":"20000","kv_connector_extra_config":{"backend":"mooncake","decode":{"dp_size":1,"tp_size":1},"prefill":{"dp_size":1,"tp_size":1},"lookup_rpc_port":"1"}}'
          env:
          - name: HOME
            value: /home
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: PYTHONHASHSEED
            value: '0'
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_USE_V1
            value: '1'
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: TP_SOCKET_IFNAME
            value: eth0
          - name: HCCL_SOCKET_IFNAME
            value: eth0
          - name: HCCL_WHITELIST_DISABLE
            value: '1'
          - name: MOONCAKE_CONFIG_PATH
            value: /app/mooncake.json
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          resources:
            limits:
              cpu: '8'
              memory: 64Gi
              huawei.com/Ascend910: '1'
            requests:
              cpu: '4'
              memory: 32Gi
              huawei.com/Ascend910: '1'
          securityContext:
            privileged: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          startupProbe:
            httpGet:
              path: /v1/models
              port: aggregated-port
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: aggregated-port
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: aggregated-port
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
          - name: mooncake-config
            mountPath: /app
            readOnly: true
          - mountPath: /dev/shm
            name: shm
          - mountPath: /usr/local/dcmi
            name: dcmi
          - mountPath: /usr/local/bin/npu-smi
            name: npusmi
          - mountPath: /usr/local/Ascend/driver/lib64
            name: lib64
          - mountPath: /usr/local/Ascend/driver/version.info
            name: version
          - mountPath: /etc/ascend_install.info
            name: installinfo
          - mountPath: /usr/bin/hccn_tool
            name: hccntool
          - mountPath: /etc/hccn.conf
            name: hccnconf
          - mountPath: /root/.cache
            name: rootcache
        volumes:
        - name: mooncake-config
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 24Gi
        - name: dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: npusmi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64
            type: Directory
        - name: version
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: installinfo
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: hccntool
          hostPath:
            path: /usr/bin/hccn_tool
            type: File
        - name: hccnconf
          hostPath:
            path: /etc/hccn.conf
            type: File
        - name: rootcache
          hostPath:
            path: /home/llm_cache
            type: Directory
---
apiVersion: infernex.infernex.io/v1alpha1
kind: InferNexService
metadata:
  name: __NAME__
  namespace: __E2E_NS__
spec:
  baseRefs:
  - name: __NAME__-vllm-aggregate-engine-config
  model:
    uri: hf://Qwen/Qwen2.5-0.5B
    name: Qwen/Qwen2.5-0.5B
  intelligentGatewayRouting:
    router:
      enabled: true
      servicePort: 9002
      template:
        spec:
          securityContext:
            fsGroup: 65532
          containers:
          - name: tokenizer
            image: cr.openfuyao.cn/openfuyao/hermes-router-tokenizer:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: TOKENIZER_PROVIDER
              value: huggingface
            - name: TOKENIZER_CACHE_DIR
              value: /.cache/huggingface/hub
            resources:
              requests:
                cpu: "2"
                memory: 8Gi
              limits:
                memory: 16Gi
            volumeMounts:
            - name: tokenizer-uds
              mountPath: /tmp/tokenizer
            - name: tokenizer-cache
              mountPath: /.cache/huggingface/hub
          - name: main
            image: cr.openfuyao.cn/openfuyao/hermes-router:latest
            imagePullPolicy: IfNotPresent
            ports:
            - containerPort: 9002
              name: grpc
              protocol: TCP
            - containerPort: 9003
              name: grpc-health
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
            args:
            - --pool-name
            - __NAME__-inference-pool
            - --pool-namespace
            - __E2E_NS__
            - --pool-group
            - inference.networking.k8s.io
            - --zap-encoder
            - json
            - --config-text
            - |
              apiVersion: inference.networking.x-k8s.io/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: metrics-data-source
                parameters:
                  scheme: http
                  path: /metrics
                  insecureSkipVerify: true
              - type: core-metrics-extractor
              - type: tokenizer
                parameters:
                  model: Qwen/Qwen2.5-0.5B
                  socketPath: /tmp/tokenizer/tokenizer-uds.socket
              - type: request-lifecycle-tracker
                parameters:
                  storeName: hermes-inflight
                  persistence:
                    enabled: false
              - type: inflight-data-producer
                parameters:
                  storeName: hermes-inflight
              - type: prefix-cache-producer
                parameters:
                  cacheIndexerAddress: http://__NAME__-cache-indexer:8080
              - type: kvcache-aware-scorer
                parameters:
                  kvCacheNotHitRateWeight: 1
                  xpuCacheUsageWeight: 1
                  waitingRequestWeight: 1
                  inflightWeight: 1
              - type: maximum-score-picker
              schedulingProfiles:
              - name: default
                plugins:
                - pluginRef: tokenizer
                - pluginRef: request-lifecycle-tracker
                - pluginRef: inflight-data-producer
                - pluginRef: prefix-cache-producer
                - pluginRef: kvcache-aware-scorer
                - pluginRef: maximum-score-picker
            - --v
            - "1"
            - --tracing
            - "false"
            - --metrics-endpoint-auth
            - "false"
            volumeMounts:
            - name: tokenizer-uds
              mountPath: /tmp/tokenizer
            startupProbe:
              grpc:
                port: 9003
                service: liveness
              failureThreshold: 30
              periodSeconds: 10
              timeoutSeconds: 5
            livenessProbe:
              grpc:
                port: 9003
                service: liveness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              grpc:
                port: 9003
                service: readiness
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            resources:
              requests:
                cpu: "4"
                memory: 8Gi
              limits:
                memory: 16Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
          volumes:
          - name: tokenizer-uds
            emptyDir: {}
          - name: tokenizer-cache
            hostPath:
              path: /home/llm_cache/huggingface/hub
              type: Directory
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
