# RSG for FIT 28/29 PD scaling: binds prefill + decode Deployments for group replication.
apiVersion: autoscaling.openfuyao.com/v1alpha1
kind: ResourceScalingGroup
metadata:
  name: __NAME__-rsg
  namespace: __E2E_NS__
spec:
  targetResources:
    - name: pd-prefill
      resourceRef:
        apiVersion: apps/v1
        kind: Deployment
        name: __PREFILL_DEPLOY__
        namespace: __E2E_NS__
    - name: pd-decode
      resourceRef:
        apiVersion: apps/v1
        kind: Deployment
        name: __DECODE_DEPLOY__
        namespace: __E2E_NS__
  scalingStrategy:
    type: GroupReplication
    groupConfig:
      groupName: pd
      replicas: 1
      scaleDown:
        metric:
          expr: "vllm_waiting_queue"
          type: "Gauge"
          window: "2m"
          aggregator: "avg"
        order: ascending
