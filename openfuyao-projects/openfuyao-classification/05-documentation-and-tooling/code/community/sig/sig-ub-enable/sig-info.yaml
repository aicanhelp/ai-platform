name: sig-ub-enable
description: UB Enable SIG旨在构建一个开放、高效的面向UB超节点的AI云原生使能体系。本SIG聚焦UB超节点资源调度使能、应用场景加速、开发者使能三大领域，针对UB超节点的高速通信、资源池化等关键能力，探索资源利用率和业务性能提升方面新的技术范式，推动社区在该领域的技术演进。
