name: sig-agentic-ops
description: Agentic Ops SIG专注于面向智算中心的智能运维技术。聚焦智能体自主调查、观测工具增强、运维经验沉淀与共建共享三大方向，探索智能体闭环AI训推故障的范式，推动开源社区在该领域的技术演进。
descriptionEn: "Agentic Ops SIG focuses on intelligent operations for AI computing centers, with three core areas: autonomous agent-driven troubleshooting, enhanced observability tooling, and collaborative operations knowledge sharing. The SIG explores agent-based closed-loop approaches to resolving AI training and inference failures, advancing the state of the art in the open source community."
