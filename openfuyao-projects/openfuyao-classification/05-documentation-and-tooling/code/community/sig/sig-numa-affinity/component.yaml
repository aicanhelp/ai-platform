features:
  - name: NUMA亲和调度
    repos:
      - name: openFuyao/volcano-config-website
        components:
          - name: volcano-config-website
            description: 'NUMA亲和调度扩展组件前端'
            language: javascript
            type: extension
            release_type: independent
            version: 1.0.1
      - name: openFuyao/volcano-config-service
        components:
          - name: volcano-config-service
            description: 'NUMA亲和扩展组件后端，面向性能敏感型业务，提供基于硬件拓扑感知的集群级和节点级资源调度和资源分配能力增强，显著提升集群作业性能'
            language: go
            type: extension
            release_type: independent
            version: 1.0.1
          - name: numa-affinity-webhook
            description: 'NUMA亲和扩展组件mutatingwebhook'
            language: go
            type: extension
            release_type: independent
            version: 1.0.1
          - name: volcano/resource-exporter  # 实际在openFuyao/images构建
            description: 'NUMA拓扑信息采集器'
            language: go
            type: extension
            release_type: independent
            version: 1.9.0
