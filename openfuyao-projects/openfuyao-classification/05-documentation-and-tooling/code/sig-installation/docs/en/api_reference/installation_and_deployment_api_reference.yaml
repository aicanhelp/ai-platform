      summary: Get cluster logs.
      description: Used for real-time log display during creation.
      responses:
        '200':
          description: Logs queried successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: get the log of cluster.
        '400':
          description: Request data exception.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
