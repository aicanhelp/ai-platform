name: 缺陷
description: 缺陷通用模板
title: "[normal-issue]"
labels: ["normal-issue"]
assignees:
- tosuper
body:
  - type: textarea
    id: env-description
    attributes:
      label: 环境描述
      description: 描述问题的环境信息，如OS、架构、openFuyao版本、CPU/内存/磁盘大小、网络环境等任何有利于问题分析的环境信息。
    validations:
      required: true
  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      description: 描述具体的问题，并提供报错、日志等相关附件或截图
    validations:
      required: true
  - type: textarea
    id: reproduction procedure
    attributes:
      label: 复现步骤
      description: 提供问题复现的方式和步骤，方便问题定位与回归
  - type: textarea
    id: problem-solution
    attributes:
      label: 预期结果
      description: 描述期望的解决方案和结果
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: 是否需要闭环
      options:
        - label: 闭环需要向问题提出人进行确定后才能关闭
          required: true
