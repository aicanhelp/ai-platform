apiVersion: apps/v1
kind: Deployment
metadata:
  name: memleak-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memleak-demo
  template:
    metadata:
      labels:
        app: memleak-demo
    spec:
      containers:
      - name: leak
        image: python:3.11-slim
        env:
        - name: START_MiB
          value: "200"
        - name: END_MiB
          value: "800"
        - name: PYTHONUNBUFFERED
          value: "1"
        command: ["/bin/sh", "-c"]
        args:
        - |
          python3 - <<'EOF'
          import os, time, sys

          time.sleep(30) 
          start_mib = int(os.getenv("START_MiB"))
          end_mib   = int(os.getenv("END_MiB"))
          if end_mib <= start_mib:
              print("END_MiB 必须大于 START_MiB")
              sys.exit(1)

          total_leak_mib = end_mib - start_mib
          chunk_mib = 1
          times = total_leak_mib
          interval = 60 / times
          print(f"初始占用 {start_mib} MiB，目标 {end_mib} MiB，"
                f"每 {interval:.2f} s 泄漏 {chunk_mib} MiB")

          # 1. 先一次性占住初始内存
          buf = [b'x' * (1024*1024) for _ in range(start_mib)]
          print(f"已占用 {start_mib} MiB，开始持续泄漏……")

          # 2. 持续泄漏 60 s
          for i in range(times):
              buf.append(b'y' * (1024*1024))   # 再占 1 MiB
              time.sleep(interval)

          print(f"泄漏完成，当前共占用 {end_mib} MiB，保持 10 s 后退出")
          time.sleep(10)
          EOF
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "300Mi"   # 根据你需要的 END_MiB 适当调大