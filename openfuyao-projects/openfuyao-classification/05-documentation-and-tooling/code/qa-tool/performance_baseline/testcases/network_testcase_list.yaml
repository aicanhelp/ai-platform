- category: colocation
  testcases:
    dir: testcases/colocation/
    modules:
      - name: colocation_testcases.py
        functions:
          - name: get_colocation_config
            targetAPIs:
              - path: /rest/colocation/v1/colocation-configs
                method: get
          - name: update_node_colocation
            targetAPIs:
              - path: /rest/colocation/v1/colocation-nodes/{node}
                method: patch
          - name: update_colocation_config
            targetAPIs:
              - path: /rest/colocation/v1/colocation-configs
                method: post
          - name: get_colocation_monitor
            targetAPIs:
              - path: /rest/colocation/v1/colocation-status
                method: get
              - path: /rest/colocation/v1/colocation-metrics/cluster
                method: get
              - path: /rest/colocation/v1/colocation-metrics/nodes/{node}
                method: get
- category: numa
  testcases:
    dir: testcases/numa/
    modules:
      - name: numa_testcases.py
        functions:
          - name: get_and_update_numa_config
            targetAPIs:
              - path: /rest/scheduling/v1/numaaware
                method: get
              - path: /rest/scheduling/v1/numaaware
                method: put
              - path: /rest/scheduling/v1/numaDistance
                method: get
              - path: /rest/scheduling/v1/numaDistance
                method: put
              - path: /rest/scheduling/v1/numaFast
                method: get
              - path: /rest/scheduling/v1/numaFast
                method: put
          - name: view_numa_monitor
            targetAPIs:
              - path: /rest/scheduling/v1/nodeList
                method: get
              - path: /rest/scheduling/v1/cr/master/{node}
                method: get
              - path: /rest/scheduling/api/v1/query
                method: get